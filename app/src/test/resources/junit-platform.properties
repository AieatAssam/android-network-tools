# 10s was too tight on this shared, memory-constrained host: unrelated processes
# competing for CPU/heap made otherwise-fast, purely synchronous/mockk-based
# ViewModel tests (DnsViewModel, WifiScanViewModel, WakeOnLanViewModel,
# PortScanViewModel) occasionally exceed it and report a spurious
# TimeoutException, even though every one of them passes reliably in isolation.
# 60s still catches a genuine hang; it just stops flagging contention as one.
junit.jupiter.execution.timeout.default = 60s
