# Keep Detekt's versioned default rules active. Add project-specific overrides
# only after reviewing the generated reports and agreeing on the policy.
config:
  validation: true
  warningsAsErrors: false

# Compose requires PascalCase names for @Composable functions that emit UI, so
# the function naming rule does not apply to them.
naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
