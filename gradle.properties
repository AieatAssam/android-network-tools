org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configureondemand=false

# Cap the Kotlin compile daemon too -- default heap sizing left it competing
# with the Gradle daemon for RAM on memory-constrained hosts, causing GC
# thrashing that looks like a hang.
kotlin.daemon.jvmargs=-Xmx768m

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Override nonProxyHosts so Google Maven is reachable through the proxy
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1

# AGP 9.x built-in Kotlin: allow KSP to register generated sources
android.disallowKotlinSourceSets=false
