name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon --no-parallel

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn

      # Informational only. A registry hiccup or a newly-published bad version
      # must never block a merge, so this step reports without gating.
      - name: Report dependency updates
        continue-on-error: true
        run: ./gradlew dependencyUpdates --no-daemon --no-parallel

      - name: Upload dependency update report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-updates
          path: build/dependencyUpdates/
          if-no-files-found: warn

      - name: Run unit tests
        run: ./gradlew test --no-daemon --no-parallel

      - name: Verify coverage gate
        run: ./gradlew :app:koverVerify :core-domain:koverVerify :core-network:koverVerify --no-daemon --no-parallel

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --no-parallel

  instrumented-tests:
    runs-on: ubuntu-latest
    # The emulator occasionally hangs on boot (or mid-test-run) on GitHub-hosted runners
    # (KVM/nested-virtualization flakiness, transient emulator rendering errors) with no
    # output for hours since the step has no timeout of its own. Bound the job so a hang
    # fails fast instead of idling for the default 6-hour job limit.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # android-emulator-runner needs a writable /dev/kvm; GitHub-hosted Linux
      # runners expose the device but not the permissions.
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # A single native GitHub Actions timeout-minutes per step (not a third-party
      # wrapper) is what actually bounds a hung attempt: Wandalen/wretry.action's own
      # time_out caps the whole step across every retry, so one hung first attempt
      # burns the entire budget and no retry ever runs. Two independent steps, each
      # separately timed out, give a real "kill the hang, try once more" behavior.
      #
      # disable-animations: false — with it true, the action races a background
      # post-boot adb settings script (screen_off_timeout, accelerometer_rotation,
      # multidisplay) against emulator teardown. When the test run finishes quickly
      # the script is still retrying those adb commands against an already-killed
      # emulator ("adb: device 'emulator-5554' not found") in a loop with no
      # cancellation, hanging until the step timeout kills it. Our Compose tests
      # already drive their own test clock deterministically, so the system
      # animator scale this setting would have changed is irrelevant here.
      - name: Run Compose instrumentation tests
        id: instrumented_tests_1
        timeout-minutes: 14
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: false
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --no-parallel

      - name: Run Compose instrumentation tests (retry after hang/failure)
        id: instrumented_tests_2
        if: steps.instrumented_tests_1.outcome == 'failure'
        timeout-minutes: 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: false
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --no-parallel

      # Per-test failures live only in these reports; without them a red
      # emulator job says "there were failing tests" and nothing else.
      - name: Upload instrumentation test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-test-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      # build-mode: none analyses sources directly. Autobuild would try to build
      # the Android project without a JDK or the Android SDK in this job.
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@v4
