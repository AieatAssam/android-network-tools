name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Check coroutine tokens and raw resource inventory
        run: |
          python3 -B -m unittest discover -s tools/quality -p 'test_*.py' -v
          python3 -B tools/quality/check_resource_sites.py

      # These checks are initially non-blocking. Review their reports, generate
      # and review baselines, then remove continue-on-error after the two-week window.
      - name: Run ktlint
        continue-on-error: true
        run: ./gradlew ktlintCheck --continue --no-daemon --no-parallel

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-reports
          path: '**/build/reports/ktlint/**'
          if-no-files-found: warn
          retention-days: 7

      - name: Run detekt
        continue-on-error: true
        run: ./gradlew detekt --continue --no-daemon --no-parallel

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/**'
          if-no-files-found: warn
          retention-days: 7

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon --no-parallel

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn

      # Informational only. A registry hiccup or a newly-published bad version
      # must never block a merge, so this step reports without gating.
      - name: Report dependency updates
        continue-on-error: true
        run: ./gradlew dependencyUpdates --no-daemon --no-parallel

      - name: Upload dependency update report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-updates
          path: build/dependencyUpdates/
          if-no-files-found: warn

      - name: Run unit tests
        run: ./gradlew test --no-daemon --no-parallel

      - name: Verify coverage gate
        run: ./gradlew :app:koverVerify :core-domain:koverVerify :core-network:koverVerify --no-daemon --no-parallel

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --no-parallel

  instrumented-tests:
    # Firebase Test Lab is quota-limited on the free tier. Run on main pushes
    # or when a trusted same-repository PR opts in with the run-instrumented
    # label. Fork PRs cannot receive the service-account secret.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'run-instrumented'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: testlab-${{ github.ref }}
      cancel-in-progress: true
    # Runs on Firebase Test Lab instead of a GitHub-hosted emulator. The
    # reactivecircus/android-emulator-runner + local KVM/nested-virtualization
    # combination proved unreliable on GitHub-hosted runners (hangs at boot, mid-test,
    # and at emulator teardown — the latter matching the open, unresolved
    # ReactiveCircus/android-emulator-runner#385 — persisting across dozens of CI runs
    # and multiple api-level/target/profile combinations). Test Lab runs the APKs on
    # Google's own device infrastructure, sidestepping local emulator boot entirely.
    # No Firebase SDK is added to the app for this — the project exists purely for
    # Test Lab's CI access, nothing the app links against.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug and androidTest APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --no-parallel

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: net-swiss-knife

      # One virtual device, well within Test Lab's daily quota for normal CI usage.
      #
      # No --use-orchestrator: diagnosed via a raw-results dump (gsutil cat on the run's
      # own GCS logcat) that the orchestrator process itself was crashing mid-suite —
      # `FATAL EXCEPTION: AndroidTestOrchestrator ... ClientNotConnected` in
      # androidx.test.services.shellexecutor.ShellExecutorImpl, roughly 20 sequential
      # per-test instrumentation processes in. Once that shell-executor connection drops,
      # orchestrator can no longer relay the currently-running test's result, so it hangs
      # until the outer --timeout kills the whole run — a real instrumentation.results log
      # showed one test (`started:` with no matching `finished:`) sitting for 8+ minutes
      # before the crash. This is orchestrator infrastructure flakiness on long sequential
      # runs, not a bug in any test here. Running without it (single shared instrumentation
      # process, the original androidx.test.runner.AndroidJUnitRunner behavior) avoids the
      # crash entirely; per-test state isolation isn't load-bearing here since every test
      # mocks its own ViewModel fresh rather than relying on shared static state.
      - name: Run instrumented tests on Firebase Test Lab
        id: test_lab
        continue-on-error: true
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=MediumPhone.arm,version=34,locale=en,orientation=portrait \
            --timeout 15m \
            --no-record-video \
            --num-flaky-test-attempts=0 \
            --results-dir=run-${{ github.run_id }}

      - name: Fail job if Test Lab run failed
        if: steps.test_lab.outcome == 'failure'
        run: exit 1

  release-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Build without signing secrets: this checks the minified release variant
      # and keeps signing material out of the release-smoke job entirely.
      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease --no-daemon --no-parallel

      - name: Verify R8-retained classes and resources
        shell: bash
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apkanalyzer_bin="$(command -v apkanalyzer || true)"
          if [[ -z "$apkanalyzer_bin" && -n "$sdk_root" ]]; then
            apkanalyzer_bin="$(find "$sdk_root" -type f -name apkanalyzer -print -quit)"
          fi
          if [[ -z "$apkanalyzer_bin" ]]; then
            echo "apkanalyzer was not found on PATH or under the Android SDK"
            exit 1
          fi
          "$apkanalyzer_bin" dex packages --defined-only "$apk" > /tmp/release-packages.txt
          python3 tools/release/check_snmp_classes.py /tmp/release-packages.txt
          grep -q 'me\.impa\.icmpenguin' /tmp/release-packages.txt
          unzip -Z1 "$apk" > /tmp/release-apk-files.txt
          grep -q '^lib/arm64-v8a/libicmpenguin\.so$' /tmp/release-apk-files.txt
          grep -q '^oui/oui-prefixes\.tsv$' /tmp/release-apk-files.txt
          grep -q '^psl/public_suffix_list\.index$' /tmp/release-apk-files.txt

      - name: Upload unsigned APK and R8 mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-outputs
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 7

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-codeql-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-codeql-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # CodeQL 2.27.0 rejects Kotlin 2.4.20 before extraction. Use the last
      # supported compiler line only in this ephemeral analysis checkout;
      # production and the regular CI build continue using Kotlin 2.4.20.
      - name: Select CodeQL-compatible Kotlin compiler
        run: sed -i 's/^kotlin = "2\.4\.20"$/kotlin = "2.4.10"/' gradle/libs.versions.toml

      # Kotlin is excluded from CodeQL's build-mode none. A real Gradle build
      # lets the Java/Kotlin extractor observe both Kotlin and Java compilation.
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build Java and Kotlin for CodeQL
        # CodeQL's compiler tracer needs to observe javac/kotlinc. A cached
        # Gradle compilation produces a valid APK but no source extraction.
        run: ./gradlew :app:assembleDebug --no-daemon --no-parallel --rerun-tasks --no-build-cache

      - uses: github/codeql-action/analyze@v4
