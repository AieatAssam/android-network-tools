name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon --no-parallel

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn

      # Informational only. A registry hiccup or a newly-published bad version
      # must never block a merge, so this step reports without gating.
      - name: Report dependency updates
        continue-on-error: true
        run: ./gradlew dependencyUpdates --no-daemon --no-parallel

      - name: Upload dependency update report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-updates
          path: build/dependencyUpdates/
          if-no-files-found: warn

      - name: Run unit tests
        run: ./gradlew test --no-daemon --no-parallel

      - name: Verify coverage gate
        run: ./gradlew :app:koverVerify :core-domain:koverVerify :core-network:koverVerify --no-daemon --no-parallel

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --no-parallel

  instrumented-tests:
    runs-on: ubuntu-latest
    # The emulator occasionally hangs on boot (or mid-test-run) on GitHub-hosted runners
    # (KVM/nested-virtualization flakiness, transient emulator rendering errors) with no
    # output for hours since the step has no timeout of its own. Bound the job so a hang
    # fails fast instead of idling for the default 6-hour job limit.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # android-emulator-runner needs a writable /dev/kvm; GitHub-hosted Linux
      # runners expose the device but not the permissions.
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # reactivecircus/android-emulator-runner's own kill/teardown logic hung
      # indefinitely on this runner in every recent attempt — matches the open,
      # unresolved ReactiveCircus/android-emulator-runner#385 ("hangs after
      # killing emulator with stop: not implemented") — reproducing regardless
      # of API level, image, disable-animations, or wrapper-level retries.
      # Confirmed by repeated CI runs where the Gradle task itself finished
      # ("BUILD SUCCESSFUL") but the wrapping step never returned. Managing the
      # emulator's own lifecycle with plain SDK tools means teardown is a
      # `pkill -9`, which cannot hang no matter what state the emulator is in.
      - name: Cache Android emulator packages
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images
          key: android-emulator-34-google_apis-x86_64

      - name: Install emulator and system image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "emulator" "system-images;android-34;google_apis;x86_64" > /dev/null

      - name: Create AVD
        run: |
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force -n ci_test -k "system-images;android-34;google_apis;x86_64"

      - name: Boot emulator
        timeout-minutes: 8
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd ci_test -no-window \
            -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            sleep 3
          done

      - name: Run Compose instrumentation tests
        timeout-minutes: 14
        run: ./gradlew :app:connectedDebugAndroidTest --no-daemon --no-parallel

      - name: Force-stop emulator
        if: always()
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
          sleep 2
          pkill -9 -f "qemu-system" || true

      # Per-test failures live only in these reports; without them a red
      # emulator job says "there were failing tests" and nothing else.
      - name: Upload instrumentation test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-test-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      # build-mode: none analyses sources directly. Autobuild would try to build
      # the Android project without a JDK or the Android SDK in this job.
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@v4
