name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Android Lint
        run: ./gradlew lint --no-daemon --no-parallel

      - name: Report dependency updates
        run: ./gradlew dependencyUpdates --no-daemon --no-parallel

      - name: Upload dependency update report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-updates
          path: build/dependencyUpdates/
          if-no-files-found: warn

      - name: Run unit tests
        run: ./gradlew test --no-daemon --no-parallel

      - name: Verify coverage gate
        run: ./gradlew :app:koverVerify :core-domain:koverVerify :core-network:koverVerify --no-daemon --no-parallel

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --no-parallel

  instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Compose instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --no-parallel

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
      - uses: github/codeql-action/analyze@v4
