name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon --no-parallel

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn

      # Informational only. A registry hiccup or a newly-published bad version
      # must never block a merge, so this step reports without gating.
      - name: Report dependency updates
        continue-on-error: true
        run: ./gradlew dependencyUpdates --no-daemon --no-parallel

      - name: Upload dependency update report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-updates
          path: build/dependencyUpdates/
          if-no-files-found: warn

      - name: Run unit tests
        run: ./gradlew test --no-daemon --no-parallel

      - name: Verify coverage gate
        run: ./gradlew :app:koverVerify :core-domain:koverVerify :core-network:koverVerify --no-daemon --no-parallel

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --no-parallel

  instrumented-tests:
    runs-on: ubuntu-latest
    # The emulator occasionally hangs on boot on GitHub-hosted runners (KVM/nested-
    # virtualization flakiness) with no output for hours since the step has no timeout
    # of its own. Bound the whole job so a hang fails fast instead of idling for the
    # default 6-hour job limit; the retry below then gives it a couple of clean attempts.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # android-emulator-runner needs a writable /dev/kvm; GitHub-hosted Linux
      # runners expose the device but not the permissions.
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Compose instrumentation tests
        uses: Wandalen/wretry.action@v3
        with:
          action: reactivecircus/android-emulator-runner@v2
          attempt_limit: 2
          attempt_delay: 5000
          time_out: 1200000
          with: |
            api-level: 35
            arch: x86_64
            disable-animations: true
            script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --no-parallel

      # Per-test failures live only in these reports; without them a red
      # emulator job says "there were failing tests" and nothing else.
      - name: Upload instrumentation test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-test-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      # build-mode: none analyses sources directly. Autobuild would try to build
      # the Android project without a JDK or the Android SDK in this job.
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@v4
