name: Release – Package & Publish

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]*'   # e.g. v2026.03.21.1 (override)
  workflow_dispatch:
    inputs:
      create_github_release:
        description: 'Create a GitHub Release? False still reserves a version tag for the uploaded artifacts.'
        required: false
        default: 'true'
        type: boolean

# A version tag is created atomically before each generated build. This reserves
# its versionCode even for artifact-only runs or builds that later fail.
concurrency:
  group: ${{ github.workflow }}-release
  queue: max
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, Sign & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for creating GitHub Releases

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history for version tagging

      # ── 2. Java toolchain ─────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── 3. Gradle cache ───────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── 4. Determine version ──────────────────────────────────────────────
      # Version format: YYYY.MM.DD.N  (N = daily build number, starting at 1)
      # versionCode:    YYYYMMDD * 100 + N  (stays within Android Int limit through 2099)
      - name: Auto-generate version name
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.event.created }}" != "true" ]]; then
              echo "::error::Refusing to rebuild updated release tag '$GITHUB_REF_NAME'; release tags must be immutable"
              exit 1
            fi
            # Tag-based override: strip leading 'v'
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE_TAGS="$RUNNER_TEMP/release-tags.txt"
            if ! gh api --paginate --jq '.[].tag_name' \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RELEASE_TAGS"; then
              echo "::error::Could not read all published release tags; refusing to reuse a version"
              exit 1
            fi
            if ! VERSION_DATA=$(python3 tools/release/versioning.py validate \
              "$VERSION" --release-tags "$RELEASE_TAGS"); then
              echo "::error::Release tag '$GITHUB_REF_NAME' must be a valid YYYY.MM.DD.N version with N from 1 to 99 and must not reuse an existing GitHub Release tag"
              exit 1
            fi
            printf '%s\n' "$VERSION_DATA" >> "$GITHUB_OUTPUT"
          else
            # Auto-generate: YYYY.MM.DD.N
            DATE=$(date -u +%Y.%m.%d)
            RELEASE_REFS="$RUNNER_TEMP/release-version-tags.txt"
            RELEASE_TAGS="$RUNNER_TEMP/release-tags.txt"
            if ! gh api --paginate --jq '.[].ref' \
              "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v${DATE}." > "$RELEASE_REFS"; then
              echo "::error::Could not read all release tags for $DATE; refusing to reuse a version"
              exit 1
            fi
            if ! gh api --paginate --jq '.[].tag_name' \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RELEASE_TAGS"; then
              echo "::error::Could not read all published release tags; refusing to reuse a version"
              exit 1
            fi
            if ! VERSION_DATA=$(python3 tools/release/versioning.py allocate \
              --date "$DATE" --release-refs "$RELEASE_REFS" --release-tags "$RELEASE_TAGS"); then
              echo "::error::Could not allocate a safe release version for $DATE"
              exit 1
            fi
            VERSION=$(sed -n 's/^name=//p' <<< "$VERSION_DATA")

            # Creating the actual version tag is the atomic reservation. It
            # prevents a concurrently pushed override from claiming the same
            # version and pins the release tag to this build's SHA.
            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/v$VERSION" -f "sha=$GITHUB_SHA" >/dev/null; then
              echo "::error::Could not create version tag v$VERSION; it may have been claimed concurrently"
              exit 1
            fi
            printf '%s\n' "$VERSION_DATA" >> "$GITHUB_OUTPUT"
          fi
          VERSION_CODE=$(sed -n 's/^code=//p' <<< "$VERSION_DATA")
          echo "Generated version: ${VERSION} (code: ${VERSION_CODE})"

      # ── 5. Unit tests ─────────────────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/build/reports/tests/'

      # Lint gates the release before any signing key is decoded. It fails on
      # lint errors; warnings are reported but do not block (see the lint block
      # in app/build.gradle.kts).
      - name: Run Android Lint
        run: ./gradlew :app:lintRelease --no-daemon --no-parallel

      # ── 6. Check signing configuration ────────────────────────────────────
      - name: Check signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE_B64" ] || missing+=(RELEASE_KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(RELEASE_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(RELEASE_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(RELEASE_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Release signing is required; missing secret(s): ${missing[*]}"
            exit 1
          fi

      # ── 7. Decode keystore ────────────────────────────────────────────────
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          # GNU coreutils base64 has no --strict (that is a BSD/macOS flag), so
          # strip whitespace ourselves and validate the decoded result instead.
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' \
            | base64 --decode > "$RUNNER_TEMP/release.keystore"
          if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then
            echo "::error::Decoded keystore is empty; check RELEASE_KEYSTORE_BASE64."
            exit 1
          fi
          # Sanity-check readability, but do not gate on it: the signing step
          # right after this reports the real error, and a keytool quirk must
          # not become a new way for the release to die at the decode step.
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1 \
            || echo "::warning::keytool could not read the decoded keystore."

      # ── 8. Build release APK ──────────────────────────────────────────────
      - name: Build signed release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            -PstoreFile="$RUNNER_TEMP/release.keystore" \
            -PstorePassword="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -PkeyAlias="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -PkeyPassword="${{ secrets.RELEASE_KEY_PASSWORD }}" \
            --no-daemon

      # P02: fail the release if R8 removes SNMP4J's reflectively-loaded USM
      # and protocol implementations.
      - name: Verify SNMP4J classes survived R8
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APK_ANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APK_ANALYZER" ] && [ -n "$SDK_ROOT" ]; then
            APK_ANALYZER="$(find "$SDK_ROOT" -type f -name apkanalyzer -print -quit)"
          fi
          if [ -z "$APK_ANALYZER" ]; then
            echo "::error::apkanalyzer was not found on PATH or under the Android SDK"
            exit 1
          fi
          echo "Using apkanalyzer: $APK_ANALYZER"
          "$APK_ANALYZER" dex packages --defined-only "$APK" > "$RUNNER_TEMP/apk-packages.txt"
          python3 tools/release/check_snmp_classes.py "$RUNNER_TEMP/apk-packages.txt"

      # ── 9. Build release AAB ──────────────────────────────────────────────
      - name: Build signed release AAB
        run: |
          ./gradlew :app:bundleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            -PstoreFile="$RUNNER_TEMP/release.keystore" \
            -PstorePassword="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -PkeyAlias="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -PkeyPassword="${{ secrets.RELEASE_KEY_PASSWORD }}" \
            --no-daemon

      # ── 9. Locate artefacts ───────────────────────────────────────────────
      - name: Locate build artefacts
        id: artefacts
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "apk=${APK}" >> "$GITHUB_OUTPUT"
          echo "aab=${AAB}" >> "$GITHUB_OUTPUT"
          echo "Found APK: ${APK}"
          echo "Found AAB: ${AAB}"

      # ── 9b. Package native debug symbols ─────────────────────────────────
      # The three native deps (libicmpenguin, libandroidx.graphics.path,
      # libdatastore_shared_counter) ship pre-stripped AARs (.symtab removed;
      # only .dynsym survives). AGP's built-in symbol extraction finds nothing
      # and mergeReleaseNativeDebugMetadata runs NO-SOURCE, so no symbols are
      # embedded in the AAB automatically.
      #
      # This step packages the merged native libs (which retain .dynsym for
      # exported function names) into native-debug-symbols.zip. Upload this
      # zip to Play Console → App bundle explorer → Native debug symbols to
      # clear the "no debug symbols" advisory warning.
      - name: Package native debug symbols
        id: symbols
        run: |
          LIB_DIR=$(find app/build/intermediates/merged_native_libs/release \
                       -type d -name "lib" | head -1)
          if [ -n "$LIB_DIR" ] && [ -d "$LIB_DIR" ]; then
            cd "$LIB_DIR"
            zip -r "$RUNNER_TEMP/native-debug-symbols.zip" .
            echo "zip=$RUNNER_TEMP/native-debug-symbols.zip" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No merged native libs found; symbols zip skipped."
          fi

      # ── 10. Rename artefacts with version ─────────────────────────────────
      - name: Rename artefacts
        id: rename
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          APK="${{ steps.artefacts.outputs.apk }}"
          AAB="${{ steps.artefacts.outputs.aab }}"
          DIR=$(dirname "$APK")
          DIR_AAB=$(dirname "$AAB")
          cp "$APK" "${DIR}/NetSwissKnife-${VERSION}.apk"
          cp "$AAB" "${DIR_AAB}/NetSwissKnife-${VERSION}.aab"
          echo "apk_named=${DIR}/NetSwissKnife-${VERSION}.apk"    >> "$GITHUB_OUTPUT"
          echo "aab_named=${DIR_AAB}/NetSwissKnife-${VERSION}.aab" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.symbols.outputs.found }}" == "true" ]; then
            cp "${{ steps.symbols.outputs.zip }}" \
               "${DIR_AAB}/native-debug-symbols-${VERSION}.zip"
            echo "symbols_named=${DIR_AAB}/native-debug-symbols-${VERSION}.zip" \
              >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release tag before artifact upload
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
        run: |
          TAG_REF="refs/tags/v${RELEASE_VERSION}"
          if ! REMOTE_TAGS=$(git ls-remote origin "$TAG_REF" "${TAG_REF}^{}"); then
            echo "::error::Could not verify release tag $TAG_REF"
            exit 1
          fi
          TAG_SHA=$(printf '%s\n' "$REMOTE_TAGS" | awk \
            -v ref="$TAG_REF" -v peeled="${TAG_REF}^{}" \
            '$2 == peeled { print $1; found = 1; exit } \
             $2 == ref { candidate = $1 } \
             END { if (!found) print candidate }')
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag $TAG_REF no longer points to this build commit"
            exit 1
          fi

      # ── 11. Upload artefacts to workflow run ──────────────────────────────
      - name: Upload APK artefact
        uses: actions/upload-artifact@v7
        with:
          name: NetSwissKnife-${{ steps.version.outputs.name }}-apk
          path: ${{ steps.rename.outputs.apk_named }}
          if-no-files-found: error

      - name: Upload AAB artefact
        uses: actions/upload-artifact@v7
        with:
          name: NetSwissKnife-${{ steps.version.outputs.name }}-aab
          path: ${{ steps.rename.outputs.aab_named }}
          if-no-files-found: error

      - name: Upload native debug symbols artefact
        if: steps.symbols.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: NetSwissKnife-${{ steps.version.outputs.name }}-native-symbols
          path: ${{ steps.rename.outputs.symbols_named }}
          if-no-files-found: warn

      # ── 12. Build changelog since last release ────────────────────────────
      # GitHub's generate_release_notes only surfaces PR-merge commits, so it
      # silently drops direct pushes to main -- which is most of this repo's
      # history. Build the "what changed" section ourselves from git log
      # instead, grouped by conventional-commit prefix.
      - name: Build changelog since last release
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || echo "")
          RANGE=""
          [ -n "$PREV" ] && RANGE="${PREV}..HEAD"

          ALL=$(git log $RANGE --no-merges --pretty=format:'%s')

          section() {
            # $1 = heading, $2 = extended-regex prefix to include
            local commits
            commits=$(echo "$ALL" | grep -E "$2" \
              | sed -E 's/^[a-z]+(\([^)]*\))?!?: //' \
              | sed -E 's/ \(#[0-9]+\)$//' \
              | sed 's/^/- /')
            [ -n "$commits" ] && { echo "### $1"; echo "$commits"; echo; }
            # Never propagate a non-zero status: the step runs under `bash -e`,
            # so an empty section would abort the script mid-heredoc and leave
            # CHANGELOG_EOF unwritten ("Matching delimiter not found").
            return 0
          }

          {
            echo 'body<<CHANGELOG_EOF'
            section "Features"      '^feat(\(|!|:)'
            section "Fixes"         '^fix(\(|!|:)'
            # everything else, minus deps-bump noise and the two buckets above
            OTHER=$(echo "$ALL" \
              | grep -vE '^feat(\(|!|:)|^fix(\(|!|:)|^chore\(deps\)' \
              | sed -E 's/^[a-z]+(\([^)]*\))?!?: //' \
              | sed -E 's/ \(#[0-9]+\)$//' \
              | sed 's/^/- /')
            [ -n "$OTHER" ] && { echo "### Other changes"; echo "$OTHER"; echo; } || true
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      # ── 13. Create GitHub Release ──────────────────────────────────────────
      - name: Verify release tag still points to this build
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_REF="refs/tags/v${RELEASE_VERSION}"
          if ! REMOTE_TAGS=$(git ls-remote origin "$TAG_REF" "${TAG_REF}^{}"); then
            echo "::error::Could not verify release tag $TAG_REF"
            exit 1
          fi
          TAG_SHA=$(printf '%s\n' "$REMOTE_TAGS" | awk \
            -v ref="$TAG_REF" -v peeled="${TAG_REF}^{}" \
            '$2 == peeled { print $1; found = 1; exit } \
             $2 == ref { candidate = $1 } \
             END { if (!found) print candidate }')
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag $TAG_REF no longer points to this build commit"
            exit 1
          fi
          RELEASE_TAGS="$RUNNER_TEMP/pre-publication-release-tags.txt"
          if ! gh api --paginate --jq '.[].tag_name' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RELEASE_TAGS"; then
            echo "::error::Could not read published release tags before publication"
            exit 1
          fi
          if ! python3 tools/release/versioning.py validate \
            "$RELEASE_VERSION" --release-tags "$RELEASE_TAGS" >/dev/null; then
            echo "::error::A GitHub Release already uses tag v${RELEASE_VERSION}; refusing to update it"
            exit 1
          fi

      - name: Create GitHub Release
        if: >
          github.event_name == 'push' ||
          github.event.inputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          name: "Net Swiss Knife ${{ steps.version.outputs.name }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            ${{ steps.rename.outputs.apk_named }}
            ${{ steps.rename.outputs.aab_named }}
            ${{ steps.rename.outputs.symbols_named }}
          body: |
            ${{ steps.changelog.outputs.body }}

            ### Build info
            - Version code: `${{ steps.version.outputs.code }}`
            - Signed: Yes (release key)

            Install the signed `.apk` directly, or use the signed `.aab` for Play Store upload.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 13. Shred the decoded signing key ─────────────────────────────────
      # Runs even when an earlier step failed, so a decoded keystore never
      # survives a partial run.
      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
