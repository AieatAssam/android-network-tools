    second_pass_review:
      report: plan/reviews/2026-09-22-second-pass.yaml
      findings: [R2-001]
      rule: "Treat each linked finding as a required independently verified acceptance case; urgent regression slices do not wait for optional task breadth."
    title: "HTTP: OkHttp engine + timings + protocol; RedirectPolicy pure; explicit downgrade diagnostics; redirect hops"
    status: done
    progress:
      - "Completed the R2-001 security slice: cross-origin body redirects require per-hop approval; source connection closes before the prompt suspends; default behavior denies replay; same-origin semantics and cross-origin header stripping remain intact."
      - "Added typed evidence for HTTPS-to-HTTP downgrade blocks, retaining source, resolved destination, HTTP status, and Location while never opening the cleartext destination. The app shows a localized warning with credentials, paths, queries, and fragments redacted; malformed-Location and cross-origin replay errors also avoid echoing URL text."
      - "Added OkHttp 5.5.0 as the default manual-redirect transport. EventListener captures DNS/connect/TLS/TTFB/transfer timing, response protocol is preserved, per-hop timeouts use the remaining operation budget, and result timing fields aggregate across redirect calls. Accept-Encoding defaults to identity; body reads remain bounded and preserve charset and 4xx bodies. OkHttp is configured without ambient cookies, cache, or authenticators."
      - "Extracted pure RedirectPolicy and migrated repository transport tests to HttpEngine fakes. The internal LegacyHttpEngine remains as a non-default one-release fallback. RedirectHop records source URL, response status, and Location."
      - "OkHttp 5.5.0 MockWebServer coverage exercises HTTP/1.1, h2c protocol mapping and TLS+ALPN HTTP/2, bounded and error bodies, redirect evidence, bodyless POST/PUT/PATCH, source/destination URL-userinfo isolation, cache/cookie/authenticator isolation, operation cancellation, remaining-budget timeout aggregation, and an HTTPS-to-HTTP block with zero requests received by the HTTP destination."
      - "Successful-result UI/share URLs now use the same credential/path/query redaction; sensitive Cookie, Set-Cookie, Authorization, and Proxy-Authorization headers are omitted, and Location values are sanitized. JVM helper tests and Compose redaction tests cover the output."
