risks:
  - risk: "OkHttp changes body-size semantics (transparent gzip)."
    mitigation: "Send Accept-Encoding: identity by default; expose a toggle 'Accept compressed' later."
  - risk: "RDAP bootstrap fetch adds a network call on first WHOIS use."
    mitigation: "Cache in memory; fall back to rdap.org redirector; timeout 5 s."

