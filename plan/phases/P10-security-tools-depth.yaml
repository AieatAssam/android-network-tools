      - "Closed the R3-009 registry-failure evidence gap: ordinary TLD registry connect failures now preserve the IANA hop and add/emit one failed REGISTRY hop with error text, zero query time, empty raw response, and operation ID. Cancellation and operation deadlines remain terminal. The broader RDAP, public-suffix, and UI protocol-toggle work remains open."
