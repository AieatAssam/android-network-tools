  id: P10
  title: "TLS (hostname verification, validity windows, chain issues, protocol/ALPN probing, PEM export, pin check) · HTTP Probe (OkHttp engine with timing breakdown + HTTP/2, redirect hops with status, explicit downgrade diagnostics, deeper header grading, cookie check, cURL export, JSON pretty-print) · WHOIS (monotonic timing, RDAP with fallback, public suffix list)"
