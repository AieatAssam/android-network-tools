      - "Bundled the official Mozilla Public Suffix List (version 2026-09-24_13-26-36_UTC, upstream commit a179a48c465e818cfd8d626691cb317985da87fb; SHA-256 257b298daca42f6d8ec964e238c2a55518e14f09d3117917ec8acee6f188503e; MPL-2.0 header retained). The readable upstream snapshot is hash-verified in test resources; runtime loads a compact 165,002-byte index with section and rule kinds pre-encoded. API-26-compatible bounded loading enforces exact size and EOF; malformed and empty records fail closed. PublicSuffix handles ICANN/private, exact/wildcard/exception, Unicode/Punycode, root-dot, and unknown-suffix cases. General eTLD+1 uses both PSL sections; WHOIS query-domain selection uses ICANN rules only because PRIVATE rules describe tenant/site boundaries rather than registry-registered domains (for example, a.foo.github.io maps to github.io for WHOIS). Focused parser tests passed 7/7, and the serialized WHOIS/PublicSuffix suite passed 63/63 after the loader compatibility fix. A five-process fresh-JVM harness measured PSL lazy read+parse at 41.3–53.0 ms (median 46.3 ms); one sample exceeded the design's <50 ms target, so stable performance and device measurement remain open. `:app:assembleDebug` passed and its APK contains `psl/public_suffix_list.index` (165,002 bytes). No emulator was used."
      - "Added PublicSuffixColdStartBenchmarkTest to time the observable first ASCII lookup and print the test-worker PID. Five filtered `:core-network:test` invocations with `--no-daemon --rerun-tasks` produced 350.1, 428.0, 458.3, 475.8, and 498.4 ms (median 458.3 ms); a later PID-logged isolated sample was 542.8 ms. A 43.3 ms sample from the full suite was warm because earlier tests had initialized the singleton and is not cold-start evidence. Independent review identifies runtime hashing/insertion of 10,334 rules as the likely initialization cost. The <50 ms target is not met; optimization and Android/ART device measurement remain open."
      - "Evaluated a binary precomputed-table snapshot bound to the compact index digest. Ten generator parity/rejection tests, Kotlin fail-closed snapshot validation tests, `:core-network:test :core-network:koverVerify`, and `:app:assembleDebug` passed; APK inspection confirmed the 165,002-byte index and 315,101-byte snapshot. Five separate cache-disabled test workers measured observable first lookups at 574.6, 430.1, 490.7, 446.1, and 518.7 ms (median 490.7 ms, range 430.1–574.6), versus 458.3 ms for the text-table baseline and 432.8 ms after a capacity-threshold trial. Independent QA found no benefit to offset loading both resources and maintaining a custom binary format, so the snapshot experiment was discarded. The <50 ms first-call target and Android/ART measurement remain open; no emulator was used."
      - "Added a pure fixture-backed RDAP mapper for domain, IP-network, and ASN responses using kotlinx-serialization JsonElement parsing (version 1.11.0; no compiler plugin or generated serializer rules). Mapping validates object class and supplied IP family, decodes top-level registrar/registrant jCards according to RFC role scope, event dates, DNSSEC delegation state, nameservers including Unicode fallback, status, allocation range, and registry handles; raw JSON remains available in an RDAP hop. Registrar links are limited to hostful HTTP(S) URIs without user info. Synthetic fixtures cover domain/IP/ASN plus malformed optional fields and mismatched classes/families. The serialized WHOIS package suite passed 70/70 with zero failures/errors/skips, and `:app:assembleDebug` passed. QA/adversarial reviews found no blocker; nested role scope and malformed scalar handling were explicitly addressed. RDAP network client, IANA bootstrap, WHOIS fallback, protocol selection, and live registry checks remain open. No emulator or live RDAP endpoint was used."
      - "Added an injectable RDAP client with RFC 9224 DNS bootstrap parsing, label-wise longest-suffix selection, A-label normalization, HTTPS-preferred service URLs, and rdap.org IP/ASN redirector paths. Bootstrap responses use a monotonic, 24-hour-capped cache with HTTP freshness signals and concurrent fetch/failure sharing; OkHttp cancellation closes the active call, bodies are capped at 1 MiB, HTTPS downgrade is blocked, and every direct redirect destination is checked against local/private/special-use address ranges. The transport disables proxies so they cannot resolve around that destination check. A typed 404 result is available for later WHOIS fallback. Focused WHOIS/RDAP/PublicSuffix tests passed 84/84 with zero failures/errors/skips, and :app:assembleDebug passed. QA and adversarial reviews found no remaining blocker. No emulator or live RDAP service was used. Client-to-repository integration is recorded below; live registry checks remain open."
      - "Integrated RDAP-first lookup into the production WHOIS repository, with domain requests using the ICANN registrable domain and results retaining the normalized input. Successful mappings emit one operation-tagged RDAP hop; 404, malformed responses, and ordinary network failures fall back to WHOIS, while cancellation, deadlines, oversized responses, and aggregate response-budget overflow remain terminal. The shared byte budget accounts for bootstrap, success/error bodies, oversized responses, and bytes received before a truncated-body read failure. Focused WHOIS/RDAP/PublicSuffix tests passed 97/97 with zero failures/errors/skips; :app:assembleDebug passed. QA and adversarial reviews found no blocker. No emulator or live RDAP service was used. Protocol selection, UI, and live registry checks remain open."
      - "Added Auto/RDAP/WHOIS selection through the WHOIS screen, ViewModel, use case, and repository. Auto keeps RDAP-first fallback, RDAP-only reports unsupported/failure without a WHOIS request, and WHOIS-only skips RDAP; legacy repository defaults reject unsupported forced RDAP rather than silently querying WHOIS. The focused core-network WHOIS/RDAP/PublicSuffix suite passed 98/98 and core-domain WHOIS use-case tests passed 9/9; WHOIS ViewModel tests passed 20/20, instrumented screen tests compiled, and :app:assembleDebug passed. QA review found no remaining blocker. No emulator or live RDAP service was used. Live registry checks remain open."
