  - id: P09-T2
    title: "Tests for pure parts of untested classes (raises the floor)"
    status: todo
    depends_on: [P09-T1]
    tdd:
      red:
        tests:
          - "FormatUtilsTest: 0 B, 1023 B, 1 KB (1024), 1.5 MB, 2.00 GB; uses Locale.ROOT (assert '.' decimal separator regardless of default locale – set Locale.GERMANY in test)"
          - "LogRotationTest: shouldRotate(size=MAX+1) true; (MAX) false; backup name 'debug.log.bak'"
          - "TracerouteHopMapperTest: hop with ips=[] -> TIMEOUT; probes [Success(1500us)] -> rt 1 ms; multiple successes -> first (until P11 changes to stats)"
        run: "./gradlew :app:testDebugUnitTest --no-daemon"
        expect: "RED"
      green: { steps: ["Extract pure helpers; FormatUtils uses String.format(Locale.ROOT, …)."], run: "same", expect: "PASS" }
    acceptance_criteria: ["Kover floor can be raised by >= 3 points; do it in a separate commit."]

  - id: P09-T3
    title: "ktlint + detekt with baselines; CI steps (non-blocking first)"
    status: todo
    steps:
      - "Add plugins/versions; module config; generate baselines; commit."
      - "ci.yml: steps 'Run ktlint' and 'Run detekt' with continue-on-error: true and reports uploaded as artifacts."
      - "Follow-up commit (after 2 weeks or once baseline stable): remove continue-on-error."
      - "CLAUDE.md Build Commands: add `./gradlew ktlintCheck detekt`."
    acceptance_criteria: ["Both tasks run locally under the memory limits (< 1 GB heap): if detekt OOMs, set `detekt { jvmTarget… }` and run with --no-daemon; document."]

  - id: P09-T4
    title: "CI: release smoke job + Test Lab gating + concurrency"
    status: in_progress
    current_progress:
      date: "2026-09-25"
      implemented: "CI now runs an unsigned release-smoke build with exact SNMP4J class checks, traceroute package/native library checks, OUI/PSL resource checks, and seven-day APK/mapping artifacts. Test Lab is limited to main pushes or opted-in same-repository PRs carrying `run-instrumented`, with label events enabled, fork PRs excluded before Firebase authentication, and same-ref cancellation. README documents the gate and artifacts."
      validation: "The existing unsigned release APK passed the exact SNMP class helper, native library, and resource-path checks. `git diff --check` passed. QA and adversarial source review cleared event gating, fork exclusion, artifact configuration, and the exact-class check. No workflow run or Gradle build was executed; no YAML parser/actionlint was available."
      remaining: "Verify unlabeled/labeled PR event behavior, main-push Test Lab, Firebase auth, and uploaded artifact contents on a live workflow run."
    steps:
      - "Add `release-smoke` job per design; upload mapping.txt and the unsigned APK as artifacts (retention 7 days)."
      - "Gate instrumented-tests; add concurrency group; README CI docs."
    acceptance_criteria: ["A PR without the label runs build-and-test + codeql + release-smoke only; a push to main runs Test Lab."]

  - id: P09-T5
    title: "release.yml secrets via ORG_GRADLE_PROJECT_ env"
    status: in_progress
    current_progress:
      date: "2026-09-25"
      implemented: "Signing values now reach Gradle only through ORG_GRADLE_PROJECT_* environment variables. No configured signing secrets produces unsigned artifacts; all four secrets enables signing; a partial set fails before decoding or building. The release note reports signed or unsigned status."
      validation: "`git diff --check` and source checks confirmed no signing secret appears in a Gradle -P argument or run command line. Independent QA and adversarial source reviews found no blocker; local keytool accepted the environment-based store-password syntax. No GitHub workflow run or secret access was performed."
      remaining: "Verify unsigned, fully signed, and partial-secret failure paths through controlled workflow runs, including `apksigner verify --print-certs` for a signed artifact."
    steps: ["Edit steps 8/9; verify on a workflow_dispatch run with create_github_release=false that the APK is signed (`apksigner verify --print-certs`)."]
    acceptance_criteria: ["No password appears in any `run:` command line."]

  - id: P09-T6
    title: "Lint warnings + suppressions"
    status: todo
    steps: ["Apply design §6; run lintDebug; remaining warnings only GradleDependency/NewerVersionAvailable (handled by T7) and MissingTranslation (P07)."]
  - id: P09-T7
    title: "Dependency bumps"
    status: todo
    steps: ["Bump per design; ./gradlew test :app:assembleDebug :app:assembleRelease :app:lintDebug; if Kotlin bump breaks KSP/Hilt, pin and note in libs.versions.toml comment."]
  - id: P09-T8
    title: "Dependabot"
    status: todo
    steps: ["Add .github/dependabot.yml (gradle weekly grouped; github-actions weekly)."]
  - id: P09-T9
    title: "(Optional) Baseline profile"
    status: todo
    steps: ["Only if CI budget allows: :baselineprofile module + macrobenchmark; generate on a Gradle-managed device; commit baseline-prof.txt; README note."]

