context:
  problem: |
    - app/build.gradle.kts Kover `includes` lists 5 classes as of 2026-09-21; the 90% gate ignores ViewModel tests
      and every util/platform class -> the gate cannot catch regressions in the code that matters.
    - No ktlint/detekt although .editorconfig already carries ktlint settings; formatting drifts.
    - CI never runs an R8/minified build; release.yml is the first place minification happens.
    - ci.yml now gates Firebase Test Lab to main pushes. Concurrency control is still absent;
      busy push sequences can consume the quota. Any label-based PR opt-in remains optional work.
    - release.yml passes keystore/key passwords as `-P` CLI args (visible in `ps`, and in Gradle's
      failure output when `--info`/stack traces print the invocation).
    - Lint warnings: UnusedAttribute (enableOnBackInvokedCallback), ModifierParameter x2,
      PluralsCandidate x3 (P07), TrustAllX509TrustManager x2 (intentional, unsuppressed), newer
      versions available (compose-bom 2026.09.00, navigation 2.10.1, kotlin 2.4.20, junit 6.1.3).
    - Untested non-Compose classes: AppLogger (rotation), FormatUtils, ShareUtils (intent building),
      SystemDnsAddressProvider (mapping), CrashHandler, MdnsRepositoryImpl (state machine – P05-T4
      extracts it), WifiScanRepositoryImpl mappers (P03), IcmpEnginTracerouteRepositoryImpl mapping.
    - No Dependabot/Renovate; updates only surface via the informational dependencyUpdates task.
  evidence:
    - { file: "app/build.gradle.kts", lines: "kover { … includes { classes(5 entries) } minBound(90) }" }
    - { file: ".editorconfig", note: "ktlint_* keys present; no plugin" }
    - { file: ".github/workflows/ci.yml", note: "instrumented-tests gated to main pushes; no concurrency control; build-and-test builds debug only" }
    - { file: ".github/workflows/release.yml", lines: "steps 8-9 -PstorePassword=… -PkeyPassword=…" }
    - { file: "app/build/reports/lint-results-debug.txt", note: "warnings listed in plan.yaml F034" }

goals:
  - "Coverage gate reflects real logic: ViewModels, data, util, platform mappers, i18n included; floor set from a measured baseline and ratcheted."
  - "ktlint + detekt with committed baselines, run in CI (non-blocking for 2 weeks, then blocking)."
  - "CI job builds the unsigned release APK and checks R8 kept classes/resources."
  - "Test Lab job gated (main pushes + label); concurrency cancel-in-progress."
  - "Secrets via ORG_GRADLE_PROJECT_* env vars."
  - "Lint warnings reduced to intentional ones with documented suppressions."
  - "Dependency bumps applied and verified; Dependabot configured."
  - "Unit tests for the pure parts of the untested classes."

non_goals:
  - "Baseline profiles / macrobenchmark (optional T9, low priority)."
  - "Robolectric adoption."

assumptions:
  - id: A1
    statement: "Kover 0.9.9 `includes { classes(...) }` accepts wildcard patterns like 'net.aieat.netswissknife.app.ui.screens.*.*ViewModel'."
    verify_with: "Kover docs / try; else list classes explicitly."
  - id: A2
    statement: "Gradle 9 honours ORG_GRADLE_PROJECT_<prop> env vars for findProperty()."
    verify_with: "Gradle docs (project properties from environment)."
  - id: A3
    statement: "ktlint Gradle plugin (org.jlleitschuh.gradle.ktlint) and detekt (io.gitlab.arturbosch.detekt) latest stable support Kotlin 2.4.x."
    verify_with: "Check plugin release notes; pin versions in libs.versions.toml."
  - id: A4
    statement: "KSP version in libs.versions.toml ('2.3.10') is compatible with Kotlin 2.4.20 (KSP2 decouples from Kotlin versions)."
    verify_with: "Build after bump; consult https://github.com/google/ksp/releases."
  - id: A5
    statement: "apkanalyzer is available in cmdline-tools on CI via android-actions/setup-android or the preinstalled SDK on ubuntu-latest."
    verify_with: "`ls $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer` in a CI step."

constraints:
  - "Lowering any Kover floor must be its own commit with a stated reason (CLAUDE.md)."
  - "CI must stay green during migration: introduce new gates as continue-on-error first, flip to blocking in a follow-up commit once baselines are committed."
  - "Do not change signing behaviour semantics (unsigned when secrets absent; never debug key)."
  - "Memory-constrained local host: run gates one at a time."

design:
  overview: |
    1. Kover (app/build.gradle.kts):
         includes.classes(
           "net.aieat.netswissknife.app.ui.screens.*.*ViewModel*",   // includes UiState sealed classes
           "net.aieat.netswissknife.app.ui.navigation.AppNavigationViewModel",
           "net.aieat.netswissknife.app.data.*",
           "net.aieat.netswissknife.app.util.FormatUtils*",
           "net.aieat.netswissknife.app.util.LogRotation*",
           "net.aieat.netswissknife.app.platform.*Mapper*", "…NetworkSelection*", "…LinkInfoMapper*",
           "net.aieat.netswissknife.app.ui.i18n.*",
           "net.aieat.netswissknife.app.ui.screens.whois.RelayChainGeometry", "…ConnectorSegment")
         excludes: androidGeneratedClasses(), @Composable, classes ending in Screen/Kt for compose files, Hilt generated (*_Factory, *_HiltModules*).
         Measure: ./gradlew :app:koverHtmlReport -> read line coverage; set minBound to floor(measured) - 2 with a comment; ratchet +5 per release until 90.
    2. ktlint: plugin org.jlleitschuh.gradle.ktlint (version pinned); `ktlint { version.set("1.x"); android.set(true); baseline.set(file("config/ktlint/baseline.xml")) }` per module; generate baseline once (`./gradlew ktlintGenerateBaseline`); CI step `./gradlew ktlintCheck --no-daemon`.
       detekt: plugin io.gitlab.arturbosch.detekt; config/detekt/detekt.yml (start from default with `build-upon-default-config`), baseline config/detekt/baseline.xml via `detektBaseline`; CI step `./gradlew detekt --no-daemon`. Both continue-on-error: true initially (comment with the date to flip).
    3. CI release smoke job (`release-smoke`, ubuntu-latest, needs nothing):
         ./gradlew :app:assembleRelease --no-daemon --no-parallel   (unsigned)
         apkanalyzer dex packages app/build/outputs/apk/release/app-release-unsigned.apk > /tmp/pkgs.txt
         grep -E 'org.snmp4j.security.(USM|AuthSHA|PrivAES128)\\b' /tmp/pkgs.txt (>=3) ; grep 'me.impa.icmpenguin' /tmp/pkgs.txt
         unzip -l app-release-unsigned.apk | grep -E 'lib/arm64-v8a/libicmpenguin.so'   # add 'oui/oui-prefixes.tsv' and 'psl/public_suffix_list.dat' once P01 / P10 have landed
         NOTE: the apkanalyzer class grep only proves classes exist after R8; it does not prove SNMP4J's reflective property loading works – the manual v3 discovery on a release build (P02 qa_validation) remains the functional check.
         upload mapping file as artifact (app/build/outputs/mapping/release/mapping.txt) for symbolication.
    4. Test Lab gating: instrumented-tests job `if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-instrumented')`; `concurrency: { group: testlab-${{ github.ref }}, cancel-in-progress: true }`; README CI section documents the label.
    5. Secrets: release.yml steps 8/9 add `env: ORG_GRADLE_PROJECT_storeFile: ${{ runner.temp }}/release.keystore; ORG_GRADLE_PROJECT_storePassword: …; ORG_GRADLE_PROJECT_keyAlias: …; ORG_GRADLE_PROJECT_keyPassword: …` and remove the four -P args (keep -PversionName/-PversionCode). app/build.gradle.kts unchanged (findProperty reads env-provided project properties).
    6. Lint: manifest `tools:targetApi="33"` on <application> for enableOnBackInvokedCallback; reorder modifier params in ToolHeroHeader.kt:54 and TracerouteScreen.kt:980; app/lint.xml ignoring TrustAllX509TrustManager for path core-network with a justification comment (chain capture by design; trust evaluated separately + hostname verification from P10).
    7. Bumps in libs.versions.toml: composeBom 2026.09.00, navigationCompose 2.10.1, kotlin 2.4.20, junit5 6.1.3 (+ ksp if needed). One PR; full test + lint + assembleDebug + assembleRelease.
    8. Tests: FormatUtilsTest (bytes formatting boundaries, Locale.ROOT determinism), LogRotation extracted from AppLogger (pure: decide rotate when size > max; backup naming) + LogRotationTest, ShareUtils -> `buildShareIntent()` pure builder returning Intent? (Android class) -> keep as androidTest ShareUtilsTest, SystemDnsAddressProvider mapping helper (P04 introduces SystemDnsInfo) unit test, IcmpEnginTracerouteRepositoryImpl mapping extracted to `TracerouteHopMapper` (pure mirror like P04) + test, CrashHandler: androidTest verifying CrashActivity launched with extras (existing CrashActivity UI) – optional.
    9. .github/dependabot.yml: package-ecosystem gradle (weekly, grouped minor/patch) + github-actions (weekly).
    10. Optional T9: baseline profile module (:baselineprofile) with androidx.baselineprofile plugin generating startup profile on a managed device; skip if CI cost too high.

  files_to_create:
    - config/ktlint/baseline.xml (generated), config/detekt/detekt.yml, config/detekt/baseline.xml (generated)
    - app/lint.xml
    - .github/dependabot.yml
    - app/src/test/kotlin/net/aieat/netswissknife/app/util/FormatUtilsTest.kt
    - app/src/main/kotlin/net/aieat/netswissknife/app/util/LogRotation.kt + test
    - app/src/main/kotlin/net/aieat/netswissknife/app/traceroute/TracerouteHopMapper.kt + test
    - app/src/androidTest/kotlin/net/aieat/netswissknife/app/util/ShareUtilsTest.kt
  files_to_modify:
    - app/build.gradle.kts (kover includes/floor, lint, ktlint/detekt), core-network/build.gradle.kts, core-domain/build.gradle.kts, build.gradle.kts (plugins), gradle/libs.versions.toml
    - .github/workflows/ci.yml, .github/workflows/release.yml
    - app/src/main/AndroidManifest.xml, ToolHeroHeader.kt, TracerouteScreen.kt
    - "README.md (CI section: label, release smoke), CLAUDE.md (Build Commands: ktlintCheck/detekt; coverage scope text)"

tasks:
  - id: P09-T1
    title: "Kover scope widening + measured floor"
    status: todo
    steps:
      - "Change includes per design; run ./gradlew :app:koverHtmlReport --no-daemon; read app/build/reports/kover/html/index.html line %."
      - "Set minBound = floor(measured) - 2 in its own commit titled 'chore(kover): widen :app coverage scope to ViewModels/data/util; floor NN% (measured MM%)'."
