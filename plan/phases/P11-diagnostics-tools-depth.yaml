    verify_with: "curl -sI 'https://speed.cloudflare.com/__down?bytes=0' | grep -i server-timing ; curl -s https://speed.cloudflare.com/meta"
    if_false: "Drop server-timing correction; keep keep-alive RTT."
  - id: A2
    statement: "icmpenguin trace.HopStatus.probes exposes per-probe Response (Success(timeUsec)/Timeout/…) so per-probe RTTs are available."
    verify_with: "javap -p me.impa.icmpenguin.trace.HopStatus me.impa.icmpenguin.trace.Response (and nested classes) from the AAR."
  - id: A3
    statement: "icmpenguin SimpleTracer accepts an IPv6 host and uses ICMPv6."
    verify_with: "Device spike: SimpleTracer(host='2606:4700:4700::1111', …).trace().collect{}."
    if_false: "Validate IPv6 hosts as unsupported for traceroute with a typed error (TRACEROUTE_IPV6_UNSUPPORTED)."
  - id: A4
    statement: "GeoIP providers usable without keys: ipinfo.io/{ip}/json (rate-limited), ipwho.is/{ip} (HTTPS JSON), ipapi.co/{ip}/json/ (HTTPS). Terms permit non-commercial/low-volume app use; document in PRIVACY_POLICY."
    verify_with: "curl each once; check response schema; record in fixtures."

constraints:
  - "Speed test attribution to Cloudflare stays (Settings attribution, README)."
  - "Speed test must remain cancellable within 500 ms (ensureActive in loops)."
  - "Traceroute streaming UX: hop rows must not reorder; enrichment updates rows in place."
  - "Kover floors; typed errors (P07)."

design:
  speedtest: |
    core-network/speedtest:
      interface TransferEngine { suspend fun connectRtt(host, port): Long?; suspend fun httpRtt(url): HttpRtt(totalMs, serverMs?); fun download(url, streams, durationMs): Flow<ChunkEvent>; fun upload(url, streams, durationMs): Flow<ChunkEvent> }
      class OkHttpTransferEngine(client with connection pool, HTTP/2 allowed) – parallel streams via coroutines (Dispatchers.IO), each stream loops requests until duration; ChunkEvent(streamIndex, bytes, elapsedMs).
      SpeedTestConfig(latencyProbes=10, downloadStreams=4, uploadStreams=2, phaseDurationMs=10_000, sampleIntervalMs=200, loadedLatencyIntervalMs=250)
      SpeedTestEvent += ServerInfo(colo, clientIp, asn, country), LoadedLatencySample(phase, rttMs), LoadedLatencyFinished(phase, stats)
      LatencyStats gains `connectRttMs: Long?` (TCP connect) and samples are keep-alive HTTP RTTs minus server-timing (never below 0).
      SpeedTestResult += serverInfo, loadedLatencyDown: LatencyStats, loadedLatencyUp: LatencyStats, config
      Repository orchestrates: meta -> connectRtt -> warm-up 2 requests (discarded) -> latency -> download (with concurrent loaded-latency probes on a separate pooled connection) -> upload (same).
    UI: server chip "Cloudflare LHR · AS12345"; latency card shows 'idle' vs 'connect'; after download/upload, 'latency under load' rows with delta; streams setting in advanced (1-8 / 1-4) persisted (SPEEDTEST_DOWN_STREAMS/UP_STREAMS keys); share text includes new fields.
  traceroute: |
    HopResult += probes: List<Long?> (ms or null per probe), rttMinMs/rttAvgMs/rttMaxMs (computed), enrichment stage flags.
    TracerouteFlowResult += HopEnriched(hopNumber, hostname?, geo?) ; ViewModel merges by hopNumber.
    Repository (app) emits hops immediately (no rDNS inline); TracerouteUseCase runs enrichment in a channelFlow with Semaphore(4): rDNS via HostResolver.reverse(ip, timeoutMs=1500) (core interface; default InetAddress) and GeoIp lookups concurrently; emits HopEnriched as they finish.
    GeoIp: GeoIpProvider interface { name; suspend fun lookup(ip): HopGeoLocation? } ; providers [IpinfoProvider, IpwhoIsProvider, IpapiCoProvider] with kotlinx-serialization models; GeoIpRepositoryImpl(providers, cache LRU 512, breaker: after 3 consecutive failures skip provider for 60 s) ; ReservedRanges (pure): IPv4 list per RFC 6890 + IPv6 (::1, fe80::/10, fc00::/7, ::ffff:0:0/96 mapped -> check v4, 2001:db8::/32) ; countryName via Locale.Builder().setRegion(code).build().getDisplayCountry(Locale.ENGLISH) (the Locale(String,String) constructor is deprecated on JDK 19+; the builder works on JVM and Android; drop the hand map) ; flagEmoji(code) pure (regional indicator symbols).
    UI: hop row shows min/avg/max (labelSmall) when probesPerHop > 1, per-probe success/no-reply dots with localized values and accessible numbered outcomes, shimmer placeholder for hostname/geo until enriched; flag emoji before country; 'Geo path' summary card listing countries in order.
  portscan: |
    PortConnectResult += bannerTruncated: Boolean, tlsSubject: String?, probeKind: ProbeKind (PASSIVE/HTTP/SMTP/…)
    ServiceProbes (pure registry): port -> greeting bytes (80/8080/8000: 'HEAD / HTTP/1.0\r\nHost: <host>\r\n\r\n'; 25/587: read then 'EHLO netswissknife'; 21/22/110/143: passive read; 443/8443/993/995/465/636: TLS peek) ; buffer 1024, read until timeout 300 ms or buffer full; truncated = read == 1024.
    Option `aggressiveProbes: Boolean` (default true for OPEN ports only – one extra exchange per open port) in PortScanParams; UI toggle in advanced; TLS peek uses TlsInspector HandshakeEngine (P10) with 2 s timeout; shows subject CN in the row.

  files_to_create:
    - core-network/.../speedtest/{TransferEngine,OkHttpTransferEngine,SpeedTestConfig,ServerInfo}.kt + tests (MockWebServer)
    - core-network/.../traceroute/{GeoIpProvider,IpinfoProvider,IpwhoIsProvider,IpapiCoProvider,ReservedRanges,CountryFlags,GeoIpCache}.kt + tests + fixtures
    - core-network/.../portscan/{ServiceProbes,BannerRead}.kt + tests
    - core-network/src/main/kotlin/net/aieat/netswissknife/core/network/HostResolver.kt (reverse added if P04 created it)
  files_to_modify:
    - speedtest models/repo/usecase/VM/screen; traceroute models/repo(app)/usecase/VM/screen; portscan models/repo/usecase/VM/screen; strings.xml (+de); README.md; PRIVACY_POLICY.md (GeoIP providers, Cloudflare /meta)

