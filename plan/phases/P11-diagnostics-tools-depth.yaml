context:
  problem: |
    Speed Test
      - Each latency probe opens a NEW HTTPS connection to speed.cloudflare.com then disconnect()s
        -> measured value = DNS + TCP + TLS + HTTP round trip (typically 2-4x the true RTT).
      - Download/upload run ONE stream at a time; modern links (>200 Mbps) are underestimated
        because a single TCP flow rarely saturates them. Cloudflare's own test uses parallel flows.
      - No loaded latency (latency under load), which is the metric users actually feel.
      - No server metadata (colo/PoP) although /meta and /cdn-cgi/trace are public.
    Traceroute
      - IcmpEnginTracerouteRepositoryImpl keeps only the first successful probe's RTT even with
        probesPerHop up to 5; no min/avg/max per hop.
      - Reverse DNS runs inline in map{} per hop (blocking up to seconds); GeoIP lookups run
        sequentially in TracerouteUseCase -> hops appear slowly.
      - GeoIpRepositoryImpl: single unauthenticated ipinfo.io provider, regex extraction for
        most JSON fields (RNET007's root bogon check is now escape-aware), private
        range check misses CGNAT 100.64/10, 192.0.0/24, 192.0.2/24, 198.18/15, 198.51.100/24,
        203.0.113/24, 224/4; IPv6 hops never geolocated; COUNTRY_NAMES map hand-maintained (50).
    Port Scanner
      - Banner buffer 256 bytes, no truncation indicator; no protocol-aware probe (HTTP/TLS ports
        yield nothing because servers wait for a request); no TLS subject for 443/8443/993/…
  evidence:
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/speedtest/SpeedTestRepositoryImpl.kt", lines: "369-433" }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/traceroute/IcmpEnginTracerouteRepositoryImpl.kt", lines: "1885-1903" }
    - { file: "core-domain/src/main/kotlin/net/aieat/netswissknife/core/domain/TracerouteUseCase.kt", lines: "611-637" }
