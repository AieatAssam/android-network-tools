    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/portscan/PortScanRepositoryImpl.kt", lines: "47-70" }

goals:
  - "Speed test latency ≈ true RTT (keep-alive HTTP RTT minus Server-Timing, plus TCP connect RTT); parallel streams (default 4 down / 2 up, configurable); loaded-latency samples captured; server colo shown."
  - "Traceroute hops carry all probe RTTs + stats; enrichment (rDNS, GeoIP) is asynchronous and concurrent with bounded parallelism; provider chain with proper reserved-range handling and IPv6; flags via country code."
  - "Port scanner banners: truncation flag, larger bounded buffer, protocol-aware greeting for HTTP/SMTP/FTP/SSH/POP/IMAP, optional TLS peek for known TLS ports."

non_goals:
  - "Bufferbloat GRADE and dedicated tool (P14) – this phase produces the data."
  - "Map rendering of hops."
  - "UDP port scanning."

assumptions:
