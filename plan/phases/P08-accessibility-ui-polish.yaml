context:
  problem: |
    Baseline findings recorded on 2026-09-18; current implementation status is tracked per task below:
      - HttpProbeScreen.kt:387, :394, :876 IconButton size 32.dp; :1050 size 28.dp (< 48dp minimum).
      - `grep -rn liveRegion app/src/main` -> 0: loading/success/error transitions are not announced.
      - WifiScanScreen.kt had 5 `nativeCanvas.drawText` sites (spectrum + gauge) – bypassing Compose text
        layout (no font-scale, no RTL mirroring awareness); PingScreen uses TextMeasurer correctly.
      - PortsScreen RangeSlider has no thumb labels (values only visible in a separate label).
      - SubnetCalculatorScreen BinaryBitsRow: 32 cells with weight(1f), no min size/scroll -> unreadable < 360dp.
      - Charts (Ping RTT, Wi-Fi spectrum, Speed gauge/throughput, Whois relay chain) have no
        contentDescription summarising data for screen readers.
      - Animations ignore the system "Remove animations"/animator duration scale.
      - IME actions: not every single-line input triggers its primary action on keyboard Done/Go
        (audit needed).
      - Hero titles use displaySmall + maxLines=1 + ellipsis; at font scale >= 1.5 long titles
        ('Network Topology') truncate.
      - Colour contrast of hero text over gradients unverified.
  evidence:
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/httprobe/HttpProbeScreen.kt", lines: "387,394,876,1050" }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/WifiScanScreen.kt", grep: "baseline nativeCanvas.drawText (5); current source guard expects zero" }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/PortsScreen.kt", grep: "RangeSlider(" }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/subnet/SubnetCalculatorScreen.kt", grep: "BinaryBitsRow" }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/theme/Motion.kt", note: "AppMotion tokens; no reduced-motion handling" }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/components/ToolHeroHeader.kt", note: "HeroTitleText maxLines=1" }

