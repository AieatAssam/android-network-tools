  - "String changes go through strings.xml (P07 guard test)."
  - "Instrumented tests must remain deterministic (avoid timing-dependent assertions)."

design:
  overview: |
    1. Touch targets: replace explicit `.size(32.dp/28.dp)` on IconButtons with `Modifier.minimumInteractiveComponentSize()`
       (icon stays 20dp inside). Audit script (run in T1): grep -rnE 'IconButton\\([^)]*size\\((1[0-9]|2[0-9]|3[0-9]|4[0-7])\\.dp' app/src/main.
    2. Live regions: `@Composable fun ToolStateAnnouncer(phase: ToolPhase, summary: String)` renders an invisible (0dp, but semantically present)
       Text with `semantics { liveRegion = LiveRegionMode.Polite; contentDescription = summary }` and re-emits when phase changes. Each tool screen
       supplies: Loading -> "<tool> running", Success -> "<tool> finished: <n results/summary>", Error -> "Error: <text>". Strings a11y_state_running/finished/error.
    3. Wi-Fi charts: refactor drawText sites to `rememberTextMeasurer()` + `drawText(textLayoutResult, topLeft)`; mirror X positions under LocalLayoutDirection Rtl
       only for labels (chart axes stay LTR – document).
    4. Chart descriptions: PingRttChart -> "RTT chart: N samples, min/avg/max"; WifiSpectrum -> "Spectrum: N networks on band X, strongest SSID at RSSI";
       Speed gauge -> "Current speed X Mbps"; WhoisRelayChain -> "Relay chain: server1 done, server2 querying…"; via `Modifier.semantics(mergeDescendants=true){ contentDescription = … }`.
    5. RangeSlider labels; Binary grid: BoxWithConstraints -> if maxWidth < 32*11dp use horizontalScroll with fixed 11dp cells.
    6. Hero title: maxLines = if (LocalDensity.current.fontScale >= 1.3f) 2 else 1.
    7. Reduced motion: `LocalReducedMotion` CompositionLocal provided in MainActivity from animator scale; AppMotion.enter()/exit() return tween(0) when true.
    8. IME: every OutlinedTextField that is the last field before the primary button gets keyboardOptions(imeAction = Go/Done) + keyboardActions running the primary action when enabled.
    9. Contrast test: app/src/test/.../theme/ContrastTest.kt computes WCAG contrast (pure math, no Android) for (onPrimaryContainer over primaryContainer), (onSurface over surface), (onSecondaryContainer over secondaryContainer) in both LightColorScheme/DarkColorScheme colour constants from Color.kt; assert >= 4.5. Read the ARGB values via `Color.toArgb()` only if compose ui-graphics works in the JVM unit test classpath (it usually does for Color); otherwise keep the raw 0xAARRGGBB literals in a `ThemeArgb` object that Color.kt derives from, and test that object. Hero titles render over a Brush gradient, so also test the text colour against BOTH gradient end colours.

  files_to_create:
    - app/src/main/kotlin/net/aieat/netswissknife/app/ui/components/ToolStateAnnouncer.kt
    - app/src/main/kotlin/net/aieat/netswissknife/app/ui/theme/ReducedMotion.kt
    - app/src/test/kotlin/net/aieat/netswissknife/app/ui/theme/ContrastTest.kt
    - app/src/test/kotlin/net/aieat/netswissknife/app/ui/a11y/TouchTargetAuditTest.kt   # source scan like the i18n guard
    - app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/a11y/LiveRegionTest.kt
  files_to_modify:
    - app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/httprobe/HttpProbeScreen.kt
    - app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/WifiScanScreen.kt
    - app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/PortsScreen.kt
