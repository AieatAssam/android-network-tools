assumptions:
  - id: A1
    statement: "M3 1.4 RangeSlider supports `startThumb`/`endThumb` slots (or `Label` via SliderDefaults) to render value labels."
    verify_with: "Check androidx.compose.material3 RangeSlider signature in the resolved BOM (2026.08.00 -> material3 1.4.x)."
    if_false: "Render labels as Text positioned via BoxWithConstraints using state.activeRangeStart/End fractions."
  - id: A2
    statement: "Settings.Global.ANIMATOR_DURATION_SCALE == 0f indicates 'Remove animations' (a11y setting) and Compose does not honour it automatically."
    verify_with: "Read via Settings.Global.getFloat(contentResolver, ANIMATOR_DURATION_SCALE, 1f) in MainActivity; log."

