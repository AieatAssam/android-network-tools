  - "State transitions announced via live regions through one shared composable."
  - "Wi-Fi chart text via TextMeasurer; all charts expose a data summary contentDescription."
  - "RangeSlider thumb labels; binary grid readable at 320dp; hero title wraps to 2 lines at large font scales."
  - "Reduced-motion support (durations -> 0 when animator scale is 0)."
