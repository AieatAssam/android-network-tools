# =============================================================================
# P02.5 – Dependency security remediation
# =============================================================================
# This phase follows P02 because the dependency scan was performed after the
# P01/P02 implementation landed. It is deliberately separate from topology
# behavior so dependency upgrades can be reviewed and reverted independently.
expansion_tasks:
  index: plan/plan.yaml
  tasks: [E03-T10]
  rule: "Coordinate with these expansion tasks; do not duplicate existing scope or block independent regression fixes on optional enhancements. See comprehensive_expansion.regression_delivery for fresh follow-up ownership."

phase:
  id: P02.5
  title: "Dependency security remediation: close authenticated Dependabot alerts"
  priority: critical
  status: in_progress
  estimated_effort: "S-M (1-2 agent sessions)"
  depends_on: [P02]
  enables: [P09]
  findings: [F041]
  target_modules: [":settings", ":app", ":core-network", ":core-domain"]

context:
  problem: |
    GitHub Dependabot initially reported nine Maven alerts from settings.gradle.kts;
    the 2026-09-23 check shows six still open. The
    authenticated `gh api repos/AieatAssam/android-network-tools/dependabot/alerts`
    response identifies Kotlin Gradle Plugin as direct and the other packages as
    transitive. The manifest path is settings.gradle.kts, so identify the settings
    and plugins-DSL classpaths separately from project buildscript/runtime graphs.
    The root buildscript pins patched artifacts, but that does not itself prove the
    isolated plugins-DSL classpath is patched. Do not add runtime dependencies merely
    to make Dependabot stop reporting a build-only dependency.
  alerts:
    - { number: 8, severity: critical, package: "org.bouncycastle:bcprov-jdk18on", cve: "CVE-2026-8763", ghsa: "GHSA-9pwp-9qqc-pr26", vulnerable: "< 1.85", patched: "1.85", relationship: transitive }
    - { number: 9, severity: high, package: "org.bouncycastle:bcprov-jdk18on", cve: "CVE-2026-13506", ghsa: "GHSA-qp49-qgx5-5m26", vulnerable: "< 1.85", patched: "1.85", relationship: transitive }
    - { number: 4, severity: high, package: "org.bitbucket.b_c:jose4j", cve: "CVE-2024-29371", ghsa: "GHSA-3677-xxcr-wjqv", vulnerable: "< 0.9.6", patched: "0.9.6", relationship: transitive }
    - { number: 3, severity: high, package: "org.jdom:jdom2", cve: "CVE-2021-33813", ghsa: "GHSA-2363-cqg2-863c", vulnerable: "< 2.0.6.1", patched: "2.0.6.1", relationship: transitive }
    - { number: 7, severity: medium, package: "org.jetbrains.kotlin:kotlin-gradle-plugin", cve: "CVE-2026-53914", ghsa: "GHSA-r937-wjx7-w2jp", vulnerable: "< 2.4.20-Beta1", patched: "2.4.20-Beta1", relationship: direct }
    - { number: 6, severity: medium, package: "org.bouncycastle:bcprov-jdk18on", cve: "CVE-2026-0636", ghsa: "GHSA-c3fc-8qff-9hwx", vulnerable: ">= 1.74, < 1.84", patched: "1.84", relationship: transitive }
    - { number: 5, severity: medium, package: "org.bouncycastle:bcpkix-jdk18on", cve: "CVE-2026-5588", ghsa: "GHSA-wg6q-6289-32hp", vulnerable: ">= 1.49, < 1.84", patched: "1.84", relationship: transitive }
    - { number: 2, severity: medium, package: "org.apache.commons:commons-lang3", cve: "CVE-2025-48924", ghsa: "GHSA-j288-q9x7-2f5v", vulnerable: ">= 3.0, < 3.18.0", patched: "3.18.0", relationship: transitive }
    - { number: 1, severity: medium, package: "org.apache.httpcomponents:httpclient", cve: "CVE-2020-13956", ghsa: "GHSA-7r82-7xv7-xcpj", vulnerable: "< 4.5.13", patched: "4.5.13", relationship: transitive }

desired_behaviour: |
  All nine alerts are either remediated in the resolved dependency graph or have a
  documented, time-bounded exception backed by a concrete upstream issue. The
  critical/high alerts must be resolved first. The app's runtime graph must not gain
  unnecessary libraries solely for build-time alert suppression.

implementation_status: |
  The first remediation pass patched the root project's `classpath`, but that was
  not the whole Gradle build graph. A configuration-scoped report generated with
  `org.gradle.github-dependency-graph-gradle-plugin:1.5.0` on 2026-09-23 found the
  patched versions selected in root `:classpath`, while `:app:androidLintTool`
  independently selected the vulnerable Bouncy Castle 1.80.2, Commons Lang 3.16.0,
  and HttpClient 4.5.6 versions requested by AGP/Lint. These are build-time tools,
  not app runtime libraries. `:app/build.gradle.kts` now constrains only
  `androidLintTool` to Bouncy Castle 1.85, Commons Lang 3.18.0, and HttpClient
  4.5.14. Post-change `dependencies` and `dependencyInsight` reports confirm the
  patched selections and constraint reasons; the post-change `releaseRuntimeClasspath`
  contains none of the affected packages. The retained review artifact records the
  commands and hashes.

  The current API state checked 2026-09-24 still has six open alerts (#1/#2/#5/#6/#8/#9)
  and three fixed (#3/#4/#7). The latest repository SBOM response (generated
  2026-09-24T09:07:59Z) still lists vulnerable and patched versions together;
  the latest default-branch dependency-submission run remains 35601558226 at
  commit 5e18372, before this remediation. The latest topic-branch submission,
  run 35979037038 for commit 98d2fa9, scanned 410 resolved components and selects
  patched versions for every alerted coordinate. This establishes the selected
  graph for that branch snapshot, including AGP/Lint dependencies; it does not
  update main's graph or the alert API. Keep the phase open until main has a fresh
  submission and GitHub reports no actionable alerts, or approved, time-bounded
  dispositions are recorded.

  An initial debug-lint run crashed in `:app:lintAnalyzeDebug` while the Ping
  ViewModel change was in progress: AGP Lint's
  `androidx.annotation.experimental.lint.ExperimentalDetector` reported
  `Unexpected owner function: null` during Kotlin FIR analysis. The stack did
  not establish a cause. After the Ping edit stabilized, a clean
  `:app:lintDebug` rerun passed with zero lint errors; both debug and unsigned
  release assembly also passed, with release `lintVital` included. The earlier
  crash remains recorded as a transient tool failure, not the current gate
  result. P02.5 stays open because main still has stale dependency submission,
  the live alert API has six open alerts, and the repository SBOM contains both
  old and patched build coordinates.

assumptions:
  - id: A1
    statement: "The open alert list and dependency provenance can be read with the authenticated GitHub CLI."
    verify_with: "gh api repos/AieatAssam/android-network-tools/dependabot/alerts --paginate"
    if_false: "Record the unavailable scan and use the repository's Dependabot UI export before changing versions."
  - id: A2
    statement: "The `help --debug` run exposes plugin DSL resolution artifacts beyond what project buildEnvironment shows."
    verify_with: "Run `./gradlew help --debug --offline --no-daemon --no-parallel --no-configuration-cache`; confirm requested plugins resolve and inspect selected artifact versions in the log."
    if_false: "Do not infer selected plugin versions from buildEnvironment or POM metadata; obtain a direct Gradle resolution report before disposition."
  - id: A3
    statement: "A stable Kotlin release at or above the patched level is available before upgrading the direct Kotlin plugin."
    verify_with: "Maven Central/plugin portal metadata and a clean Gradle configuration."
    if_false: "Do not move production builds to a beta solely for Dependabot; use the narrowest supported mitigation and document the exception."

constraints:
  - "Keep the current Kotlin/AGP/Gradle compatibility matrix green; do not upgrade multiple build-tool families without a compatibility check."
  - "Prefer upgrading the parent settings/build plugin or applying scoped dependency constraints over adding duplicate direct runtime dependencies."
  - "Align bcprov and bcpkix to one supported Bouncy Castle line (target 1.85 if compatible), and verify SNMP4J/TLS behavior."
  - "No alert dismissal without a written reason, affected graph scope, owner, and review/expiry date."

design:
  dependency_resolution:
    - "Capture current dependencyInsight/buildEnvironment output for every alert before edits."
    - "Upgrade direct Kotlin/plugin versions to a stable patched release when available."
    - "For settings-only transitives, upgrade the owning plugin first; use a narrowly scoped resolution constraint only when the plugin cannot yet move."
    - "Use patched versions at minimum: bcprov 1.85, bcpkix 1.84 or the aligned 1.85 line, jose4j 0.9.6, jdom2 2.0.6.1, commons-lang3 3.18.0, and httpclient 4.5.13. Confirm compatibility before pinning."
  verification:
    - "Run dependencyInsight again and confirm no vulnerable version remains in the relevant configuration."
    - "Run JVM tests, Kover gates, lint, debug/release builds, and the existing SNMP4J APK class check."
    - "Re-query Dependabot after GitHub rescans; current API state is six open alerts (#1/#2/#5/#6/#8/#9) and three fixed (#3/#4/#7). Record any remaining alert as accepted risk only with an approved, time-bounded exception if it is not actionable upstream."

files_to_modify:
  - gradle/libs.versions.toml
  - settings.gradle.kts
  - build.gradle.kts
  - app/build.gradle.kts
  - core-network/build.gradle.kts
  - core-domain/build.gradle.kts
  - plan/plan.yaml

tasks:
  - id: P02.5-T1
    title: "Trace all nine alerts to resolved configurations and shipped artifacts"
    status: done
    steps:
      - "Record alert JSON/SBOM and project buildEnvironment plus app/runtime dependency graphs."
      - "Classify each package as settings/plugin/buildscript/test-only, or shipped runtime."
      - "Project buildEnvironment alone omits plugin DSL dependencies. The retained `help --debug` trace proves the invocation loaded patched artifacts, but it does not isolate the settings-plugin classpath or provide configuration-scoped selection reasons; capture a direct report or narrow the alert ownership classification with equivalent evidence."
      - "Standalone settings-plugin resolution contains none of the alerted coordinates. A SimpleDependencyGraphPlugin 1.5.0 resolution report on the current source maps vulnerable bcprov/bcpkix 1.80.2, commons-lang3 3.16.0, and httpclient 4.5.6 to `:app:androidLintTool`; the root `:classpath` selects 1.85, 3.18.0, and 4.5.14. JDOM 2.0.6.1, jose4j 0.9.6, and KGP 2.4.20 resolve on root `:classpath`. `:app:releaseRuntimeClasspath` has none of the affected packages."
      - "The API/SBOM and Gradle submission are build dependency graphs, not release APK SBOMs. The vulnerable `androidLintTool` selection is real build-time exposure, but it is not evidence that those packages ship in the app runtime."
      - "Check in a concise, reproducible review artifact with the exact commands, dates, hashes, configuration scope, and alert/SBOM state; do not rely on temporary `/tmp` logs as the retained graph record."
    acceptance_criteria: ["Every alert has an owning dependency path and a runtime/build scope classification, including plugins-DSL configurations."]

  - id: P02.5-T2
    title: "Upgrade direct build dependencies and owning plugins"
    status: done
    depends_on: [P02.5-T1]
    steps:
      - "Move Kotlin Gradle Plugin to a stable release that includes the fix, if available and compatible with AGP/KSP/Compose."
      - "Upgrade the settings/build plugin responsible for vulnerable transitives before adding constraints."
      - "Upgraded the stable Kotlin/Compose plugin line to 2.4.20, AGP to 9.4.1, and KSP to 2.3.12; the direct KGP alert is fixed."
    acceptance_criteria: ["Direct Kotlin alert is closed without introducing an unsupported beta-only build requirement."]

  - id: P02.5-T3
    title: "Constrain or replace remaining vulnerable transitives"
    status: done
    depends_on: [P02.5-T1, P02.5-T2]
    steps:
      - "Align Bouncy Castle modules to a patched compatible line."
      - "Remediate jose4j, JDOM, Commons Lang, and Apache HttpClient through their owning plugin/dependency path."
      - "Use explicit Gradle constraints only where the parent upgrade cannot resolve the alert cleanly; document why."
      - "The root buildscript pins did not constrain `:app:androidLintTool`; the pre-change configuration-scoped report proved old versions were selected there. Added narrowly scoped app constraints for bcprov/bcpkix 1.85, commons-lang3 3.18.0, and httpclient 4.5.14. Post-change `:app:dependencies --configuration androidLintTool` and `dependencyInsight` show all affected requests redirected to patched versions. ADS run 35979037038 for topic-branch HEAD 98d2fa9 confirms only patched versions for every alerted coordinate across 410 resolved components; see plan/reviews/2026-09-23-p025-dependency-state.yaml latest_recheck. Main-branch resubmission and refreshed alert status remain T4 gates."
    acceptance_criteria: ["No vulnerable package version remains in any shipped runtime graph; build-only exceptions are explicitly documented."]

  - id: P02.5-T4
    title: "Regression and security verification"
    status: in_progress
    depends_on: [P02.5-T3]
    run:
      - "./gradlew test --no-daemon"
      - "./gradlew :app:koverVerify :core-domain:koverVerify :core-network:koverVerify --no-daemon"
      - "./gradlew :app:lintDebug --no-daemon --no-parallel"
      - "./gradlew :app:assembleDebug :app:assembleRelease --no-daemon"
      - "2026-09-24 current-worktree rerun: ./gradlew :core-network:test :core-domain:test :app:testDebugUnitTest --no-daemon --no-parallel --console=plain; then ./gradlew :core-network:koverVerify :core-domain:koverVerify :app:koverVerify :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --no-parallel --console=plain. Both invocations passed. App JVM tests ran 448/448 with zero failures/errors; core-network and core-domain test tasks were UP-TO-DATE (latest reports: 1,023 with one skipped, and 188). All three Kover verifications passed, lintDebug passed, and debug plus unsigned release APK assembly passed. R8 emitted the existing dnsjava service-provider warnings. No emulator was used."
      - "gh api repos/AieatAssam/android-network-tools/dependabot/alerts --paginate"
      - "gh api repos/AieatAssam/android-network-tools/dependency-graph/sbom"
      - "On 2026-09-23, post-constraint `:app:dependencies --configuration androidLintTool`, targeted dependencyInsight, and `:app:dependencies --configuration releaseRuntimeClasspath` passed. The earlier full core-network/core-domain/app JVM suites, Kover verification, lintDebug, and debug/release assembly passed; see the dated verification records below. On 2026-09-24, ADS run 35979037038 for pushed branch HEAD 98d2fa9 selected patched versions for all alerted coordinates across 410 components; main still points to run 35601558226 at 5e18372. The alert API was refreshed at 09:08Z and still reports six open alerts [1, 2, 5, 6, 8, 9]; the 09:07Z repository SBOM still lists old and patched build coordinates. The combined attempt before fixes exposed topology test races and Wi-Fi test cleanup/permission issues, then stalled; those failures and recovery are documented in plan/reviews/2026-09-23-p025-dependency-state.yaml. Following the fixes, the serialized full JVM invocation passed on the source committed as 98d2fa9: app 448/448, with unchanged core module test tasks UP-TO-DATE and latest reports of 1,023 (one skipped) and 188. The Wi-Fi and topology test classes passed 38/38 and 19/19. All Kover verification tasks, `:app:lintDebug`, `:app:assembleDebug`, and `:app:assembleRelease` passed. Release R8 emitted dnsjava service-provider warnings. No emulator was used. Main still needs a fresh dependency submission and the six open alerts need closure or approved time-bounded dispositions. T4 and P02.5 remain open for those external gates. Device/lab release-QA checks are separate from this dependency gate. Detailed counts, hashes, and external state are retained in plan/reviews/2026-09-23-p025-dependency-state.yaml."
    acceptance_criteria: ["The reviewed source tree's JVM, Kover, lint, debug, and release gates pass; all nine alerts have a recorded disposition, and every remaining actionable alert is covered by an explicit, approved, time-bounded exception."]

qa_validation:
  - "Keep the pre-upgrade and post-upgrade dependency graphs as review artifacts."
  - "Confirm SNMP4J authPriv loopback, LAN discovery, TLS, HTTP probe, DNS, and mDNS tests remain green."
  - "Inspect release APK dependencies for accidental inclusion of settings/build-only libraries."

risks:
  - risk: "Kotlin's patched version is reported as a beta."
    mitigation: "Prefer the first stable release containing the fix; do not downgrade build stability for a scanner recommendation."
  - risk: "Forcing transitive versions can break a settings plugin or alter build behavior."
    mitigation: "Upgrade the owning plugin first and validate with a clean Gradle configuration and full build."
  - risk: "Bouncy Castle alignment may affect TLS or cryptographic consumers."
    mitigation: "Run the security-tool tests and release build; keep bcprov/bcpkix on one compatible line."

definition_of_done:
  - "Critical and high Dependabot alerts are closed or have a documented, approved exception."
  - "All nine alerts have a recorded disposition."
  - "Repository-wide tests, coverage gates, lint, debug build, and release build pass."
