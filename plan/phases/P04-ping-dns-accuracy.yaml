          - "first engine isAvailable=false -> second engine used"
          - "first engine flow throws before first emission -> second engine used and PingResult.engine reports it (repository exposes engineUsed via a callback or as first Flow element `PingSessionStarted(engine)` – choose: emit PingFlow events? Keep PingPacketResult flow; expose `lastEngineUsed: StateFlow<PingEngineKind?>` on repository – simplest for UI; test it)"
          - "first engine throws after emitting 1 packet -> propagate ERROR packet, no fallback (avoid duplicate sequences)"
        run: "./gradlew :core-network:test --tests '*ReachabilityPingEngineTest' --tests '*PingRepositoryEngineFallbackTest' --no-daemon"
        expect: "RED"
      green:
        steps:
          - "Add PingStatus.UNREACHABLE; PingEngineKind; PingRequest; PingEngine; HostResolver."
