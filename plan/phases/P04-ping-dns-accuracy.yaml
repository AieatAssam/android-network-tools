tasks:
  - id: P04-T1
    title: "HostValidator.normalize + IDN/FQDN acceptance"
    status: done
    tdd:
      red:
        test_file: core-network/src/test/kotlin/net/aieat/netswissknife/core/network/HostValidatorTest.kt
        tests:
          - "normalize('bücher.de') == 'xn--bcher-kva.de' and isValidHostname('bücher.de') true"
          - "normalize('example.com.') == 'example.com'; isValidHostname true"
          - "normalize('  Example.COM ') == 'example.com' (lowercased)"
          - "normalize('ex ample.com') == null; normalize('') == null; normalize('a..b') == null"
          - "IP literals pass through unchanged (IPv4, bracketed IPv6, zone id)"
        run: "./gradlew :core-network:test --tests '*HostValidatorTest' --no-daemon"
        expect: "RED"
      green: { steps: ["Implement normalize() with java.net.IDN (pure JVM, allowed)."], run: "./gradlew :core-network:test --no-daemon", expect: "PASS" }
      refactor: ["Use normalize() in PingValidation, TracerouteUseCase, PortScanUseCase, TlsInspectorUseCase and pass the normalised host downstream (tests in core-domain: 'passes punycode host to repository')."]
    acceptance_criteria: ["All validators accept IDN/FQDN; repositories receive ASCII hosts."]

