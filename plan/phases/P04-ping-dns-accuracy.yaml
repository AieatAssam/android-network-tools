  - ":core-network stays Android/JNI-free -> the icmpenguin adapter lives in :app behind a core interface."
  - "PingUseCase/ContinuousPingUseCase validation ranges: keep count 1..100, timeout 100..30_000; add payload 0..1472, ttl 1..255, interval 100..10_000."
  - "PingScreen has an RTT chart and CSV export (PingSessionLogger) – CSV columns must stay backward compatible (append columns only)."
  - "DnsScreen groups/copies records; adapt to nullable typed enum carefully (compile errors will guide)."
  - "Kover floors; README sync; strings.xml."

design:
  overview: |
    PING (core-network/ping)
      enum class PingStatus { SUCCESS, TIMEOUT, UNREACHABLE, ERROR }
      enum class PingEngineKind { ICMP, REACHABILITY }
      data class PingPacketResult(sequence, host, rtTimeMs, status, errorMessage = null,
                                  replyTtl: Int? = null, bytes: Int? = null, fromIp: String? = null)
      data class PingRequest(host, resolvedIp: String?, count: Int /* 0 = infinite */, timeoutMs, intervalMs = 1000, payloadBytes = 56, ttl = 64)
      interface PingEngine { val kind: PingEngineKind; val isAvailable: Boolean; fun ping(request: PingRequest): Flow<PingPacketResult> }
      class ReachabilityPingEngine(checker: (ip: String, timeoutMs: Int) -> ReachabilityResult, delay: Long) : PingEngine
          - timing wraps ONLY isReachable; status: exception -> ERROR; reachable -> SUCCESS;
            !reachable && elapsed >= timeoutMs*0.9 -> TIMEOUT else UNREACHABLE
      class PingRepositoryImpl(engines: List<PingEngine>, resolver: HostResolver = InetAddressHostResolver)
          - ping(host, …): resolve once (resolver.resolve(host) -> ip or throw UnknownHost -> single ERROR packet) then
            first engine with isAvailable; if the engine's flow throws before the first packet, fall through to the next engine.
          - PingRepository interface: ping(request: PingRequest): Flow<PingPacketResult>; continuousPing == count 0.
      data class PingResult(..., val engine: PingEngineKind, val resolvedIp: String?)
    :app
      class IcmpenguinPingEngine : PingEngine (kind ICMP): Pinger(host = request.resolvedIp ?: host, ttl, timeoutMs, count or Pinger.INFINITE, intervalMs, payloadBytes, ByteArray(0), null).ping()
          .map { toPacket(it) } ; isAvailable = true on Android (a failed socket creation propagates as flow error -> fallback).
      PingModule: PingRepositoryImpl(engines = listOf(IcmpenguinPingEngine(), ReachabilityPingEngine()))
    core-domain
      PingParams += payloadBytes (56), ttl (64), intervalMs (1000); ContinuousPingParams same; validatePingCommon extended.
      PingSessionLogger: header "seq,timestamp_ms,latency_ms,status,ttl,bytes" (append-only change).
    UI (PingScreen/ViewModel)
      Advanced options card (AnimatedVisibility): payload size slider (0-1472, default 56), TTL slider (1-255), interval slider (0.2-5 s).
      Stats/raw output shows engine: "ICMP echo" vs "Reachability (ICMP/TCP fallback)"; status colours: UNREACHABLE uses tertiary/error tokens; StatusColors.kt update.

    DNS (core-network/dns)
      DnsRecord(type: DnsRecordType?, rrTypeName: String, name, value, ttl, rawLine, section: DnsSection = ANSWER)
      enum DnsSection { ANSWER, AUTHORITY, ADDITIONAL }
      DnsRecordType.fromDnsTypeInt(int): DnsRecordType?
      DnsResult(domain, recordType, server, records /*answer*/, authority: List<DnsRecord>, additional: List<DnsRecord>,
                rcode: String /*"NOERROR"*/, flags: Set<String> /*"AA","AD","TC","RA","RD"*/, serverUsed: String /*ip[:port]*/,
                queryTimeMs, rawResponse)
      DnsServer.System(serverAddresses, privateDnsActive: Boolean = false, privateDnsHost: String? = null)
      buildSystemResolver: if serverAddresses empty -> return NetworkResult.Error(DnsError.NoSystemResolver) – no fallback.
        (P07 will type the error; here use message "No system DNS server reported by Android (Private DNS or no network). Choose a resolver." and let the UI offer a 'Use Cloudflare' action.)
      rawResponse header: ";; SERVER: <serverUsed>", ";; RCODE: …", ";; FLAGS: …".
    :app
      SystemDnsAddressProvider.getInfo(): SystemDnsInfo(addresses, privateDnsActive, privateDnsHost) (API 28+ fields).
      DnsScreen: RCODE badge (NOERROR green/ NXDOMAIN warning / SERVFAIL error via StatusColors), flags chips, collapsible Authority/Additional sections, "Server used: 192.168.1.1" line, Private DNS notice card when active, error state action "Use Cloudflare".

    HOST VALIDATION
      HostValidator.normalize(input): String? — trim, strip one trailing '.', IDN.toASCII(…, IDN.ALLOW_UNASSIGNED) inside try; returns null if invalid.
      isValidHostname(host) = normalize(host) != null && (ip checks || hostnameRegex.matches(normalized)).
      Use normalize() output as the value passed to repositories in Ping/Traceroute/PortScan/Tls use cases (they currently pass trimmed raw).

