context:
  problem: |
    PING
      - PingRepositoryImpl.DEFAULT_CHECKER starts its timer, then calls InetAddress.getByName(host)
        for EVERY probe inside the timed region. RTT of probe 1 includes a DNS round trip; every
        probe pays a resolver call; a hostname can resolve to different IPs during a session.
      - Payload size and TTL cannot be set. README says this is a platform limitation; the store
        listing claims "configurable … packet size". icmpenguin (already a dependency) exposes
        me.impa.icmpenguin.ping.Pinger(host, ttl, timeout, maxPingCount, interval, probeSize,
        pattern, sourceIp) with `fun ping(): Flow<ProbeResult>` (verified by javap on the AAR).
      - Status semantics: isReachable()==false without exception is reported as TIMEOUT even when
        the call returned immediately (ICMP unreachable / TCP-7 RST).
    DNS
      - DnsRepositoryImpl labels every ANSWER record with the requested type. Querying A for a
        CNAME name yields CNAME rows shown as "A".
      - DnsServer.System silently falls back to Cloudflare 1.1.1.1 when LinkProperties has no
        servers or ExtendedResolver throws; the result still says "System DNS"; the raw view
        prints ";; SERVER: (see selected server above)".
      - Response code (NXDOMAIN/SERVFAIL/REFUSED), header flags (AA/AD/TC/RA) and AUTHORITY /
        ADDITIONAL sections are not surfaced; an NXDOMAIN and an empty NOERROR look identical.
      - Android Private DNS (DoT) status is invisible; plain UDP/53 to the listed resolver may fail.
    HOST VALIDATION
      - HostValidator.hostnameRegex is ASCII-only; IDN hosts (bücher.de) and FQDNs with a
        trailing dot (example.com.) are rejected by Ping/Traceroute/Ports/TLS validators.
  evidence:
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/ping/PingRepositoryImpl.kt", lines: "31-49, 78-93", note: "DEFAULT_CHECKER timing incl. getByName; status mapping" }
    - { file: "core-domain/src/main/kotlin/net/aieat/netswissknife/core/domain/PingParams.kt", note: "host,count,timeoutMs only" }
    - { file: "README.md", section: "Ping", note: "'Payload size is intentionally not configurable…'" }
    - { file: "store/play-description.txt", note: "'Configurable count, timeout and packet size'" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/dns/DnsRepositoryImpl.kt", lines: "104-110", note: "type = recordType for every record" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/dns/DnsRepositoryImpl.kt", lines: "151-163, 199-206", note: "silent Cloudflare fallback; raw header" }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/util/SystemDnsAddressProvider.kt", note: "returns List<String> only; no privateDns info" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/HostValidator.kt", note: "ASCII regex; no IDN" }
  icmpenguin_api_verified: |
    $ unzip -o -q ~/.gradle/caches/modules-2/files-2.1/me.impa/icmpenguin/1.0.0-rc.4/*/icmpenguin-1.0.0-rc.4.aar classes.jar -d /tmp/icmp
    $ javap -cp /tmp/icmp/classes.jar -p me.impa.icmpenguin.ping.Pinger
      public Pinger(String host, int ttl, int timeout, int maxPingCount, int interval, int probeSize, byte[] pattern, String sourceIp)
      public static final int DEFAULT_TIMEOUT, DEFAULT_PROBE_SIZE, INFINITE, DEFAULT_INTERVAL, DEFAULT_PING_COUNT, DEFAULT_TTL
      public final Flow<ProbeResult> ping()
      public final Object ping(Function1<ProbeResult,Unit>, Continuation)
    $ javap -cp /tmp/icmp/classes.jar -p me.impa.icmpenguin.ProbeResult   -> interface { getSequence(), getRemote(), getProbeSize(), getOverhead() }
    Concrete subtypes (verified 2026-09-18 via unzip -l + javap):
      ProbeResult$Success(sequence: Int, remote: String, probeSize: Int, overhead: Int, elapsedUsec: Int, ttl: Int, data: ByteArray)
      ProbeResult$Timeout, ProbeResult$HostUnreachable, ProbeResult$NetUnreachable, ProbeResult$ConnectionRefused,
      ProbeResult$NetError, ProbeResult$Unknown   (each carries sequence/remote/probeSize/overhead; run javap -p on each before coding to capture extra fields such as an error message)
    Mapping used by IcmpenguinPingEngine:
      Success           -> PingStatus.SUCCESS, rtTimeMs = elapsedUsec / 1000 (keep sub-ms precision: add rtTimeMicros to PingPacketResult), replyTtl = ttl, bytes = probeSize, fromIp = remote
      Timeout           -> TIMEOUT
      HostUnreachable / NetUnreachable / ConnectionRefused -> UNREACHABLE (errorMessage = subtype name)
      NetError / Unknown -> ERROR
    Note: `remote` on non-Success results may be the router that generated the ICMP error, not the target – display it as `fromIp` when present.

goals:
  - "Ping uses a real ICMP echo engine with size/TTL/interval when available; falls back to the reachability engine transparently (and says so)."
  - "Hostname resolved once per session; RTT measures only the probe."
  - "Statuses: SUCCESS / TIMEOUT / UNREACHABLE / ERROR with correct mapping in both engines."
  - "DNS rows carry their real RR type; RCODE, flags, authority/additional exposed; server actually used is reported; no silent fallback."
  - "HostValidator accepts IDN and trailing-dot FQDN by normalising (IDN.toASCII, strip dot) and exposes `normalize()` used by all validators."

non_goals:
  - "DoH/DoT lookups (P14 tool)."
  - "DNSSEC validation (P14 candidate) – but the AD flag is surfaced here."
  - "IPv6 ping via ICMPv6: include only if icmpenguin supports it (check ProbeResult/Pinger for v6); otherwise document."

assumptions:
  - id: A1
    statement: "icmpenguin.Pinger works on API 26+ without root (uses IPPROTO_ICMP datagram sockets; Android allows via net.ipv4.ping_group_range) – the same mechanism the existing traceroute relies on."
    verify_with: "Spike in the debug app: Pinger('1.1.1.1', 64, 1000, 3, 1000, 56, ByteArray(0), null).ping().collect { log it } on a device."
    if_false: "Keep reachability engine as default; icmpenguin engine opt-in."
  - id: A2
    statement: "Pinger.ping() emits one ProbeResult per probe including timeouts (not only successes) so sequence numbers stay dense."
    verify_with: "Same spike against a blackholed IP (e.g. 10.255.255.1) – expect timeout-type results."
    if_false: "Synthesise TIMEOUT results for missing sequences in the engine adapter."
  - id: A3
    statement: "dnsjava Message exposes header.rcode, header.getFlag(Flags.AA/AD/TC/RA), getSection(Section.AUTHORITY/ADDITIONAL), and Type.string(int)."
    verify_with: "Compile."
  - id: A4
    statement: "LinkProperties.isPrivateDnsActive and privateDnsServerName exist on API 28+."
    verify_with: "Android docs; guard with SDK_INT >= 28."

