          - "checker returns reachable=true rt=12 -> SUCCESS 12 ms"
          - "checker returns reachable=false rt>=0.9*timeout -> TIMEOUT"
          - "checker returns reachable=false rt<0.9*timeout -> UNREACHABLE"
          - "checker throws -> ERROR with message"
          - "count=3 emits seq 1..3 with intervalMs delays (runTest + virtual time)"
          - "count=0 is infinite: take(5) yields seq 1..5"
        also_test_file: core-network/src/test/kotlin/net/aieat/netswissknife/core/network/ping/PingRepositoryEngineFallbackTest.kt
        also_tests:
