qa_validation:
  automated:
    - "./gradlew test --no-daemon"
    - "./gradlew :app:koverVerify :core-domain:koverVerify :core-network:koverVerify --no-daemon"
    - "./gradlew :app:lintDebug --no-daemon --no-parallel"
    - "grep -rn 'import android' core-network/src core-domain/src -> empty"
  manual_device:
    - "ping google.com 10 probes: first RTT not inflated (compare probe 1 vs 2..10); raw header shows resolved IP once."
    - "ping with payload 1400 / TTL 1 -> TTL exceeded/UNREACHABLE from the gateway (proves TTL works)."
    - "Airplane mode -> ERROR packets with clear message, no crash."
    - "DNS: nonexistent.example -> NXDOMAIN badge + authority SOA; www.github.com A -> CNAME row + A rows."
    - "Enable Private DNS (dns.google) -> notice card; lookup still works or shows the honest error with 'Use Cloudflare'."
    - "Ping 'bücher.de' accepted."
  regression:
    - "Continuous ping rolling window, CSV share, keep-screen-on unchanged."
    - "PingScreenTest/DnsScreenTest suites green."

docs_updates: [README.md, store/play-description.txt, strings.xml help_ping_*/help_dns_*]

risks:
  - risk: "icmpenguin Pinger blocks a thread or leaks the socket on cancellation."
    mitigation: "Wrap in flowOn(IO) + onCompletion; verify with a cancellation test on device (start continuous, stop, check no thread growth via `adb shell ps -T`)."
  - risk: "Removing the Cloudflare fallback makes System DNS fail on some devices."
    mitigation: "Explicit error with one-tap fallback; telemetry-free, so ask for a device report in the PR."

rollback: |
  PingModule can drop IcmpenguinPingEngine (reachability only); DnsRepositoryImpl fallback can be
  restored by a one-line change but must then set server = DnsServer.Cloudflare in the result.

definition_of_done:
  - "F008, F009, F010, F011, F025, F037 closed; global DoD."
