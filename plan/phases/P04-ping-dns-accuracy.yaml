          - "PingRepositoryImpl(engines, resolver); PingRepository.ping(request)/continuousPing(request); keep old methods as deprecated adapters for one release."
          - "PingStats.compute: received = SUCCESS only (already via rtTimeMs); loss counts TIMEOUT+UNREACHABLE+ERROR (unchanged semantics)."
        run: "./gradlew :core-network:test --no-daemon"
        expect: "PASS (update PingRepositoryImplTest for the new constructor)"
      refactor: ["Delete PingRepositoryImpl.DEFAULT_CHECKER after migrating tests."]
    acceptance_criteria: ["Timing region contains only the probe call (assert with a fake clock in the engine test: inject MonotonicClock)."]

