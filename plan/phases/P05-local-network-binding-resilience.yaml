qa_validation:
  automated:
    - "./gradlew test --no-daemon; koverVerify x3; lintDebug"
  manual_device:
    - "VPN OFF: LAN scan, mDNS, WOL, topology, LAN port scan behave as before."
    - "mDNS: API 33 emulator with no usable Wi-Fi interface shows graceful ENODEV failure; physical Wi-Fi confirms the active interface is selected and discovery remains usable."
    - "VPN ON (full tunnel): LAN scan finds hosts; mDNS lists services; WOL packet received by laptop tcpdump on the Wi-Fi segment; banner shows VPN info."
    - "Wi-Fi off, cellular on: LAN tools show 'no local network' banner; ping/DNS work."
    - "Airplane mode: internet tools show 'no internet' banner; no crashes."
    - "OEM device where 5353 bind fails (or simulate by forcing the fallback path with a debug flag): discovery still returns services."
    - "Android 16 emulator with `adb shell am compat enable RESTRICT_LOCAL_NETWORK net.aieat.netswissknife.debug`: denied permission -> typed error card with Grant action."
  regression:
    - "All existing instrumented suites green."

docs_updates: [README.md, PRIVACY_POLICY.md, strings.xml]

risks:
  - risk: "Binding to Wi-Fi bypasses a VPN the user relies on for a LAN they access remotely (site-local via VPN)."
    mitigation: "Subnet-contains rule + (P12) settings toggle 'Prefer local network for LAN tools'."
  - risk: "Some OEMs report VPN with NET_CAPABILITY_NOT_VPN set incorrectly."
    mitigation: "Prefer TRANSPORT_WIFI/ETHERNET presence over NOT_VPN capability."

rollback: |
  NetworkModule can provide NoOpNetworkBinder; all repos revert to default-network behaviour.

definition_of_done:
  - "F012 closed; F013 (bind fallback + interface) closed; IPv6 group tracked in P12."
