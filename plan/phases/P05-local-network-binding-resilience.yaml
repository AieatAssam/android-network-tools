context:
  problem: |
    Every socket the app opens uses the process default network. On Android the default network
    is the VPN when one is active (extremely common: corporate VPNs, ad-blockers, WireGuard),
    and can be cellular when the OS scores it higher. Consequences today:
      - LAN Scanner: probes leave through the VPN tunnel; nothing on the LAN answers.
      - mDNS Browser: MulticastSocket bound to 0.0.0.0:5353 with no NetworkInterface; joinGroup
        picks the default interface; queries never reach the Wi-Fi segment.
      - Wake-on-LAN: DatagramSocket() broadcast goes via the default route.
      - Network Topology: DefaultUdpTransportMapping() unbound.
      - Port Scanner / TLS / HTTP against LAN hosts: routed via VPN (fails unless split-tunnel).
    Nothing detects "no connectivity" or "VPN active" either, so the user sees generic timeouts.
    Android 16 (API 36) Local Network Protections will additionally gate LAN sockets behind
    NEARBY_WIFI_DEVICES; LocalNetworkPermission.kt already requests it on some screens, but a
    SecurityException from a socket is not mapped to a clear error anywhere.
    mDNS also binds port 5353 with reuseAddress and no fallback; on OEMs where the system mdnsd
    holds the port without SO_REUSEPORT, bind() throws and discovery fails outright.
  evidence:
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/mdns/MdnsRepositoryImpl.kt", lines: "1435-1443", note: "MulticastSocket(null); bind(InetSocketAddress(5353)); joinGroup(group) – no interface" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/wol/WakeOnLanRepositoryImpl.kt", lines: "789-793", note: "DatagramSocket() unbound" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/Snmp4jClientImpl.kt", lines: "18, 36", note: "DefaultUdpTransportMapping() unbound" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/LanScanRepositoryImpl.kt", lines: "48-55, 62-72", note: "isReachable / Socket() unbound" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/portscan/PortScanRepositoryImpl.kt", lines: "47-70", note: "Socket() unbound" }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/components/LocalNetworkPermission.kt", note: "requests NEARBY_WIFI_DEVICES on API 36+; no error mapping" }
    - { file: "AndroidManifest.xml", note: "ACCESS_NETWORK_STATE declared; unused for status" }
  desired_behaviour: |
    A `NetworkBinder` in core-network with a no-op JVM default; the :app implementation resolves the
    best local network (Wi-Fi > Ethernet, never VPN), binds sockets whose destination is a
    non-public address, exposes the interface/local address for multicast and SNMP transports,
    and a `ConnectivityObserver` publishes {hasInternet, hasLocalNetwork, vpnActive, transport}.
    LAN tool screens show a compact status banner when relevant. SecurityException from LAN
    sockets maps to a typed "local network permission" error with a rationale + retry.

goals:
  - "All LAN-destined sockets bound to the local (non-VPN) network when one exists."
  - "mDNS joins the group on the Wi-Fi interface and falls back to an ephemeral port with QU queries when 5353 is unavailable."
  - "Connectivity/VPN state visible to the user on LAN tools and Ping/Speed test (no-internet)."
  - "Deterministic unit tests via fake binder; on-device validation matrix (VPN on/off)."

non_goals:
  - "Split-tunnel configuration UI."
  - "IPv6 mDNS group (P12)."
  - "Retry/backoff policies for internet tools (P11 scope for speed test/geoip)."

assumptions:
  - id: A1
    statement: "Network.bindSocket(Socket) / bindSocket(DatagramSocket) (API 23+) works for sockets that are not yet connected/bound; for MulticastSocket the interface must be set via setNetworkInterface(NetworkInterface.getByName(linkProperties.interfaceName)) and joinGroup(SocketAddress, NetworkInterface)."
    verify_with: "Spike on device with a VPN app active (e.g. a WireGuard config or Android 'always-on' test VPN via `adb shell` is not possible – use a real VPN app): bound DatagramSocket to Wi-Fi network sends WOL that a laptop receives (tcpdump)."
    if_false: "Use ConnectivityManager.bindProcessToNetwork temporarily around LAN operations (process-wide; document the trade-off)."
  - id: A2
    statement: "ConnectivityManager.getAllNetworks() + getNetworkCapabilities: a network with TRANSPORT_WIFI and without TRANSPORT_VPN is the LAN network; NET_CAPABILITY_NOT_VPN true."
    verify_with: "Log capabilities on a device with VPN on."
  - id: A3
    statement: "SNMP4J 3.13.1 DefaultUdpTransportMapping has NO public getSocket() (verified via javap 2026-09-18). It does expose `protected DatagramSocket socket` and `protected synchronized DatagramSocket ensureSocket()`. Binding therefore requires a subclass in core-network: `class BoundUdpTransportMapping(address: UdpAddress, private val bind: (DatagramSocket) -> Unit) : DefaultUdpTransportMapping(address) { override fun ensureSocket(): DatagramSocket = super.ensureSocket().also(bind) }` – the binder lambda calls Network.bindSocket(socket) in :app. Binding a local address alone (UdpAddress(localAddr, 0)) is NOT sufficient under a VPN because Android routes per-UID, not per-source-address."
    verify_with: "javap -p -cp <snmp4j jar> org.snmp4j.transport.DefaultUdpTransportMapping | grep -E 'socket;|ensureSocket' ; device test with VPN on: SNMP GET to the router succeeds only with the bound subclass."
  - id: A4
    statement: "ContextCompat/ConnectivityManager NetworkCallback with NetworkRequest for INTERNET and VPN detection works from API 26."
    verify_with: "Compile + device log."

constraints:
  - ":core-network stays Android-free: NetworkBinder is an interface with java.net types only."
  - "Do not change public flows/events of repositories except to add typed error causes."
  - "Every repository must keep working with NoOpNetworkBinder (JVM tests)."
  - "Bind only for local destinations to avoid breaking VPN-only reachability of internal corporate hosts (site-local ranges routed through VPN): rule = destination isSiteLocal/isLinkLocal AND the local network's own subnet contains it; otherwise default network. Provide a user override 'Force local network for LAN tools' (Settings, default on) – implement the toggle in P12 if time is short; here implement the subnet-contains rule."

design:
  overview: |
    core-network/net (new package `net.aieat.netswissknife.core.network.net`):
      interface NetworkBinder {
        val isAvailable: Boolean
        fun localSubnet(): String?                 // CIDR of the bound local network or null
        fun shouldBind(destinationIp: String): Boolean
        fun bind(socket: java.net.Socket)
        fun bind(socket: java.net.DatagramSocket)  // also MulticastSocket
        fun localInterface(): java.net.NetworkInterface?
        fun localAddress(): java.net.InetAddress?
      }
      object NoOpNetworkBinder : NetworkBinder (isAvailable=false, shouldBind=false, binds no-op)
      class LocalDestinationPolicy(subnetCidr) { fun isLocal(ip): Boolean }  // pure, tested (uses SubnetUtils.contains from P01 or its own)

      Repositories gain a `binder: NetworkBinder = NoOpNetworkBinder` constructor param:
        LanScanRepositoryImpl (SocketTcpPresenceProbe/UdpExchange/port checker receive it),
        PortScanRepositoryImpl.defaultChecker(timeout, clock, binder, host),
        WakeOnLanRepositoryImpl, Snmp4jClientImpl (via TopologyParams? no – via factory ctor),
        MdnsRepositoryImpl (app) uses binder.localInterface().
      Typed error: `class LocalNetworkPermissionDeniedException(cause: SecurityException)` thrown/mapped by
        repositories when a SecurityException occurs on a LAN socket -> ViewModels map to a UiState error with
        a string resource + 'Grant' action calling rememberLocalNetworkPermissionRequester().

    :app/platform
      class AndroidNetworkBinder @Inject (ConnectivityManager) : NetworkBinder – picks the best local network
        (WIFI, then ETHERNET; must have NET_CAPABILITY_NOT_VPN); caches LinkProperties; shouldBind = policy.isLocal(ip).
      class ConnectivityObserver @Inject (ConnectivityManager): val status: StateFlow<NetworkStatus>
        data class NetworkStatus(hasInternet: Boolean, hasLocalNetwork: Boolean, vpnActive: Boolean, transport: Transport)
      NetworkStatusBanner(composable): shows "No internet connection" (Ping/DNS/HTTP/TLS/WHOIS/Speed), "No Wi-Fi/Ethernet – LAN tools need a local network" (LAN/mDNS/WOL/Topology), "VPN active – LAN traffic is sent over Wi-Fi directly" (info).
      DI: NetworkModule provides NetworkBinder + ConnectivityObserver; existing modules pass the binder.
      mDNS: MulticastSocket: try bind 5353 -> on BindException/SocketException bind ephemeral port and set the
        QU bit on all queries (unicast responses come back to our port); setNetworkInterface(binder.localInterface());
        joinGroup(InetSocketAddress(group, 5353), iface).

