    - core-network/src/main/kotlin/net/aieat/netswissknife/core/network/wifi/WifiConnectionInfo.kt
    - core-network/src/main/kotlin/net/aieat/netswissknife/core/network/wifi/WifiSecurity.kt
    - core-network/src/main/kotlin/net/aieat/netswissknife/core/network/wifi/WifiScanRepository.kt
    - core-domain/src/main/kotlin/net/aieat/netswissknife/core/domain/WifiScanUseCase.kt
    - core-domain/src/test/kotlin/net/aieat/netswissknife/core/domain/WifiScanUseCaseTest.kt
    - app/src/main/kotlin/net/aieat/netswissknife/app/wifi/WifiScanRepositoryImpl.kt
    - app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/wifi/WifiScanViewModel.kt
    - app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/WifiScanScreen.kt
    - app/src/main/kotlin/net/aieat/netswissknife/app/data/AppPreferencesDataStore.kt
