risks:
  - risk: "Some OEMs never deliver EXTRA_RESULTS_UPDATED=true; awaiting the broadcast could always time out."
    mitigation: "Treat any SCAN_RESULTS_AVAILABLE broadcast as completion; 8 s timeout then read cache; surface age."
  - risk: "Frequent scans drain battery."
    mitigation: "Default 30 s; a lifecycle observer stops the loop on ON_PAUSE and resumes it on ON_RESUME when the configured interval is enabled."

rollback: |
  scan(trigger=false) path is identical to today's behaviour; flip the default in WifiScanUseCase
  to restore cache-only reads.

definition_of_done:
  - "F007 closed; README updated; global DoD."
