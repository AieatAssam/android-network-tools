# =============================================================================
# P03 – Wi-Fi Scanner: trigger real scans, throttle awareness, configurable refresh,
#       location-services state, richer connection info, enterprise security detection
# =============================================================================
# Audience: AI coding agent. Self-contained. Read plan/plan.yaml `agent_execution_rules` first.
phase:
  id: P03
  title: "Wi-Fi Scanner: live scanning with WifiManager.startScan + receiver, throttle/age reporting, configurable interval, LocationDisabled state, LinkProperties-based connection info, EAP/WPA3-Enterprise"
  priority: high
  status: done
  estimated_effort: "M (2-3 agent sessions)"
  depends_on: []            # soft: P01-T6 LinkInfoProvider (create a minimal one here if P01 not done)
  enables: [P08]
  findings: [F007]
  target_modules: [":core-network", ":app"]

context:
  problem: |
    WifiScanRepositoryImpl.scan() only reads `wifiManager.scanResults` (the OS cache). It never
    calls `WifiManager.startScan()` and never listens for `SCAN_RESULTS_AVAILABLE_ACTION`. The
    ViewModel's 10-second auto-refresh therefore re-reads identical data until the OS happens to
    scan on its own (typically every 30-60 s while the screen is on, far less often otherwise).
    Users see stale RSSI/channel data and networks that have already disappeared, while the UI
    implies live measurement (spectrum chart, "auto-refresh every 10 seconds" in README).
    Secondary gaps:
      - On API 26+ scan results are empty when Location Services are OFF even with permission;
        the app shows an empty list with no explanation.
      - Connection info uses deprecated WifiInfo.ipAddress (IPv4 int) and ignores IPv6/gateway/DNS.
      - WifiSecurity.fromCapabilities ignores EAP (WPA2/WPA3-Enterprise) and SUITE_B_192.
      - AUTO_REFRESH_INTERVAL_MS is a private constant; Android throttles foreground apps to
        4 scans per 2 minutes (startScan returns false when throttled).
  evidence:
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/wifi/WifiScanRepositoryImpl.kt", lines: "1645-1660", note: "scan() reads cache only" }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/wifi/WifiScanViewModel.kt", lines: "1980-2006", note: "auto refresh 10 s" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/wifi/WifiSecurity.kt", note: "no EAP/enterprise mapping" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/wifi/WifiScanRepository.kt", note: "scan(): WifiScanResult, no freshness info" }
    - { file: "README.md", section: "Wi-Fi Scanner", note: "'Auto-refresh every 10 seconds'" }
  desired_behaviour: |
    scan(trigger = true): request a scan; await SCAN_RESULTS_AVAILABLE (<= 8 s) or timeout; read
    results; report freshness (age of newest ScanResult.timestamp vs SystemClock.elapsedRealtime)
    and whether the request was throttled. UI shows a subtle "Results from Ns ago · scan throttled"
    label, a LocationDisabled state with a button to system settings, and a refresh interval
    picker (15 s / 30 s / 60 s / off; default 30 s to fit the throttle budget).

goals:
  - "Every manual refresh and auto-refresh triggers a real scan when the platform allows it."
  - "Freshness/throttle state is explicit in the model and UI."
  - "Location-services-off is a first-class UI state."
  - "Connected-network card shows IPv4 + IPv6 addresses, gateway, DNS (from LinkProperties)."
  - "Enterprise security types detected and labelled."

non_goals:
  - "Channel-overlap visualisation for 5/6 GHz (P08 or later)."
  - "Replacing nativeCanvas text in charts (P08)."
  - "Background scanning / notifications."

assumptions:
  - id: A1
    statement: "WifiManager.startScan() (deprecated since API 28) still initiates a scan on API 26-37 for foreground apps within throttle limits and returns false when throttled; results arrive via SCAN_RESULTS_AVAILABLE_ACTION broadcast with EXTRA_RESULTS_UPDATED."
    verify_with: "Instrumented spike on a device: log startScan() return and time-to-broadcast for 5 consecutive calls 5 s apart (expect true,true,true,true,false pattern within 2 min)."
    if_false: "Fall back to cache reads but still surface age; document."
  - id: A2
    statement: "ScanResult.timestamp is microseconds since boot; age = SystemClock.elapsedRealtime()*1000 - timestamp."
    verify_with: "Android docs; assert age is < 5 min on a fresh scan in the spike."
  - id: A3
    statement: "With NEARBY_WIFI_DEVICES (neverForLocation) on API 33+, getScanResults returns results only when ACCESS_FINE_LOCATION is ALSO granted (Android still gates scan results on location). This determines how F039 is resolved (see P03-T7)."
    verify_with: "On API 33+ device: deny location, grant nearby devices -> check results size; also read the current WifiManager.getScanResults() javadoc for the exact permission rule."
    if_false: "Stop requesting ACCESS_FINE_LOCATION on 33+ (manifest assertion becomes truthful); keep it only for API 26-32."
    if_true: "Remove android:usesPermissionFlags=\"neverForLocation\" from the manifest (the app does need location to read scan results) and update PRIVACY_POLICY.md accordingly; keep requesting both permissions."
    verification_note: "Checked against the current Android Wi-Fi permissions and scan documentation on 2026-09-19. The available API 36 emulator was later used for the instrumented UI suite, but not for the controlled deny-location/grant-nearby scan-result experiment; implementation follows the documented startScan()/getScanResults() fine-location requirement and keeps both runtime permissions on API 33+."
  - id: A4
    statement: "LocationManager.isLocationEnabled (API 28+) / Settings.Secure.LOCATION_MODE (26-27) tells whether Location Services are on."
    verify_with: "LocationManagerCompat.isLocationEnabled(locationManager) from androidx.core."

constraints:
  - ":core-network models only; platform code in :app (WifiScanRepositoryImpl)."
  - "WifiScanUseCase signature: keep `invoke()`; add `invoke(trigger: Boolean)` overload."
  - "Existing WifiScanViewModelTest (378 lines) and WifiScanScreenTest (6 tests) must stay green or be adapted intentionally."
  - "Permission handling stays in the screen (existing pattern)."
  - "All new UI strings in strings.xml; colours via colorScheme."

design:
  overview: |
    core-network/wifi:
      data class WifiScanResult(..., val isFresh: Boolean = true, val scanAgeMs: Long? = null,
                                val throttled: Boolean = false, val locationEnabled: Boolean = true)
      data class WifiConnectionInfo(..., val ipv6Addresses: List<String> = emptyList(),
                                    val gateway: String? = null, val dnsServers: List<String> = emptyList())
      enum WifiSecurity += WPA2_ENTERPRISE("WPA2-Enterprise"), WPA3_ENTERPRISE("WPA3-Enterprise"),
                           WPA3_ENTERPRISE_192("WPA3-Enterprise 192-bit"); fromCapabilities order:
                           SUITE_B_192 -> WPA3_ENTERPRISE_192; "SAE" && "EAP" -> WPA3_ENTERPRISE (rare) ; "EAP" && "WPA2"/"RSN" -> WPA2_ENTERPRISE; existing rules after.
      interface WifiScanRepository { val isSupported; suspend fun scan(trigger: Boolean = true): WifiScanResult; val isLocationEnabled: Boolean }

    app/wifi/WifiScanRepositoryImpl:
      scan(trigger):
        if (!isLocationEnabled) return cached with locationEnabled=false
        val throttled = if (trigger) !requestScanAndAwait(timeoutMs = 8_000) else false
        read scanResults; compute age from max timestamp; isFresh = age <= 15_000
      requestScanAndAwait: suspendCancellableCoroutine { register BroadcastReceiver(IntentFilter(SCAN_RESULTS_AVAILABLE_ACTION)) via ContextCompat.registerReceiver(RECEIVER_NOT_EXPORTED); val ok = wifiManager.startScan(); if (!ok) { unregister; resume(false) } ; withTimeoutOrNull(timeout) }.
      connection info via ConnectivityManager.getLinkProperties(activeNetwork): linkAddresses (IPv4/IPv6), routes default gateway, dnsServers.
      Extract pure mapping to core-network `WifiScanMapper`-like helpers where possible (already WifiChannelHelper) – keep Android mapping thin.

    ViewModel:
      refreshIntervalMs: StateFlow<Long?> from DataStore key WIFI_REFRESH_INTERVAL_MS (default 30_000; null = off)
      startScan(silent) -> useCase(trigger = true); auto-refresh loop uses the interval; Success state carries result.isFresh/throttled/scanAgeMs
      new UiState.LocationDisabled
    Screen:
      - Freshness chip under the hero (labelSmall, onSurfaceVariant): "Updated 3 s ago" / "Scan throttled by Android · showing results from 42 s ago"
      - LocationDisabled card: title/body/Button -> Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS)
      - Interval picker in the sort/filter row (SegmentedButton or dropdown): Off/15s/30s/60s
      - Connected card: IPv6 list (monospace, copyable), gateway, DNS
    Settings: expose the same interval under Defaults (SettingsViewModel + SettingsScreen slider/dropdown) – optional (T6).

  files_to_create:
    - core-network/src/test/kotlin/net/aieat/netswissknife/core/network/wifi/WifiSecurityTest.kt
    - core-network/src/test/kotlin/net/aieat/netswissknife/core/network/wifi/WifiScanResultFreshnessTest.kt
    - app/src/main/kotlin/net/aieat/netswissknife/app/wifi/ScanRequestAwaiter.kt      # receiver + startScan + timeout (Android)
    - app/src/test/kotlin/net/aieat/netswissknife/app/wifi/ScanFreshnessTest.kt        # pure age/isFresh math extracted to a Kotlin object
  files_to_modify:
