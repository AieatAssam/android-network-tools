  - id: P07-T6
    title: "Docs: README Localization section, CLAUDE.md invariant, tool_instructions checklist item"
    status: todo
    depends_on: [P07-T5]
    steps:
      - "CLAUDE.md Architecture Invariants: add 'core layers return ErrorInfo codes; :app maps to strings; no user-facing text below :app'."
      - "claude/tool_instructions.md: add 'ErrorCode entries + err_* strings + values-de strings' to the new-tool checklist."
      - "README: 'Languages: English, German (community translations welcome – values-<lang>/strings.xml)'."

qa_validation:
  automated:
    - "./gradlew test --no-daemon"
    - "./gradlew :app:lintDebug --no-daemon --no-parallel  (0 errors; 0 PluralsCandidate; MissingTranslation only for keys intentionally untranslated)"
    - "./gradlew :app:koverVerify :core-domain:koverVerify :core-network:koverVerify --no-daemon"
  manual_device:
    - "Switch app language to German (API 33+) – all screens localized; error for invalid host localized."
    - "Pseudo-locale en-XA/ar-XB walkthrough of all 14 tools; capture issues."

docs_updates: [README.md, CLAUDE.md, claude/tool_instructions.md]

risks:
  - risk: "Wide mechanical change touches every ViewModel and test – merge conflicts with other phases."
    mitigation: "Land P07-T1/T2 (core) first in one PR; T3+ per tool group in small PRs; coordinate ordering: P07 before P10/P12/P13."
  - risk: "Translation quality."
    mitigation: "Flag values-de as machine-drafted in a comment header; owner review."

rollback: |
  Additive at core level (info nullable). UI migration is mechanical; revert per PR.

definition_of_done:
  - "F017 closed; guard test enforcing; one translation shipped; global DoD."
