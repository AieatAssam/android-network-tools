risks:
  - risk: "SecurityModels/SecurityProtocols are process-wide singletons in SNMP4J; concurrent discoveries with different users share one USM."
    mitigation: "Users are added per Snmp instance (snmp.getUSM()); ensure each client gets its own USM instance passed to SecurityModels only once (guard), and remove the user in close()."
  - risk: "Loopback responder test flakiness on CI (port allocation)."
    mitigation: "Bind to 127.0.0.1:0 and read the assigned port; 5 s timeout; retries 0."
  - risk: "Keep-all rule for org.snmp4j inflates APK (~1.5 MB dex)."
    mitigation: "Acceptable; refine later with -printusage-driven narrower rules."

rollback: |
  Revert TopologyModule to `TopologyDiscoveryRepositoryImpl(Snmp4jClientImpl())` equivalent via the
  secondary constructor; keep proguard rules (harmless).

definition_of_done:
  - "F001, F002, F003 closed; F014 closed for SNMP (CI automation tracked in P09)."
  - "Global DoD from plan.yaml."
