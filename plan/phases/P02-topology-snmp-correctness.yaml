  - "SnmpClient interface is mocked by TopologyDiscoveryRepositoryTest with MockK; changing it requires updating those tests in the same commit."
  - "TopologyParams is constructed by TopologyDiscoveryScreen – adding enum values must update the UI dropdowns (strings.xml) in the same change."
  - "Do not log community strings or passwords (AppLogger is debug-only but still)."
  - "Coverage floor :core-network 70%."

design:
  overview: |
    1. `SnmpClient` becomes session-oriented:
         interface SnmpClient : AutoCloseable { suspend fun get(...); suspend fun walk(...); override fun close() }
         fun interface SnmpClientFactory { fun create(params: TopologyParams): SnmpClient }
       TopologyDiscoveryRepositoryImpl(factory: SnmpClientFactory) opens one client per discover()
       in a `use {}` block inside the flow builder; every loop iteration calls
       currentCoroutineContext().ensureActive().
    2. Snmp4jClientImpl(params): builds ONE Snmp + DefaultUdpTransportMapping in init, listen();
       for V3 installs USM + UsmUser built by pure `UsmUserSpecFactory.from(params)` (testable).
       Companion `ensureSecurityProtocols()` (idempotent, synchronized) calls addDefaultProtocols().
    3. Parsing moved to a pure object `TopologyMibParser` (new file) with functions:
         parseLldpRemTable(walk: Map<String,String>): List<LldpRemEntry>   // sysName(col 9), portId(col 7), portDesc(col 8), chassisId(col 5)
         parseLldpManAddrTable(walk): Map<String /*localPort.remIndex*/, String /*ipv4*/>  // from OID index
         parseCdpCache(walk): List<CdpEntry>     // address (col 4, hex or dotted), deviceId(6), port(7), platform(8), caps(9)
         hexOctetsToIpv4("c0:a8:01:01") -> "192.168.1.1"; also accepts dotted; returns null otherwise
       Repository composes results as before.
    4. R8: app/proguard-rules.pro gains
         -keep class org.snmp4j.** { *; }
         -dontwarn org.snmp4j.**
         -dontwarn org.apache.logging.log4j.**          # optional SNMP4J log adapters referenced but not shipped
         -dontwarn org.slf4j.**
         -keep class me.impa.icmpenguin.** { *; }      # JNI-registered natives + callbacks
         -keepclasseswithmembernames class * { native <methods>; }
       plus a verification command in qa_validation. Before adding blanket -dontwarn lines, run
       `./gradlew :app:assembleRelease` once and copy the exact missing-class warnings R8 prints so
       the rules stay minimal and documented.
    5. Extra v3 protocols: V3AuthProtocol += SHA256, SHA512; V3PrivProtocol += AES192, AES256;
       mapping in UsmUserSpecFactory; UI dropdown strings.

  files_to_create:
    - core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/TopologyMibParser.kt
    - core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/UsmUserSpecFactory.kt
    - core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/SnmpClientFactory.kt
    - core-network/src/test/kotlin/net/aieat/netswissknife/core/network/topology/TopologyMibParserTest.kt
    - core-network/src/test/kotlin/net/aieat/netswissknife/core/network/topology/UsmUserSpecFactoryTest.kt
    - core-network/src/test/kotlin/net/aieat/netswissknife/core/network/topology/Snmp4jClientImplLoopbackTest.kt   # in-process responder (A2)
    - core-network/src/test/resources/snmp/lldp-rem-table.txt        # captured walk lines "oid = value"
    - core-network/src/test/resources/snmp/lldp-rem-man-addr.txt
    - core-network/src/test/resources/snmp/cdp-cache.txt
  files_to_modify:
    - core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/SnmpClient.kt
    - core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/Snmp4jClientImpl.kt
    - core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/TopologyDiscoveryRepositoryImpl.kt
    - core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/TopologyModels.kt
    - core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/TopologyNodeParser.kt   # reuse hex helpers
