tasks:
  - id: P02-T1
    title: "Pure MIB parser with realistic fixtures (LLDP rem table, LLDP mgmt-addr index, CDP hex addresses)"
    status: done
    depends_on: []
    tdd:
      red:
        test_file: core-network/src/test/kotlin/net/aieat/netswissknife/core/network/topology/TopologyMibParserTest.kt
        tests:
          - "hexOctetsToIpv4('c0:a8:01:01') == '192.168.1.1'"
          - "hexOctetsToIpv4('192.168.1.1') == '192.168.1.1' (pass-through)"
          - "hexOctetsToIpv4('aa:bb') == null; hexOctetsToIpv4('C0:A8:01:01') (uppercase) == '192.168.1.1'"
          - "parseLldpManAddrTable: OID '1.0.8802.1.1.2.1.4.2.1.4.0.1.1.1.4.192.168.1.2' value '1' -> key '1.1' -> '192.168.1.2'"
          - "parseLldpManAddrTable ignores IPv6 rows (subtype 2, len 16) but records them in a separate ipv6 map"
          - "parseLldpManAddrTable tolerates column 3 and 5 rows (same index) without duplicates"
          - "parseLldpRemTable groups columns by localPort.remIndex and exposes sysName/portId/chassisId"
          - "parseCdpCache maps col 4 hex 'c0:a8:01:03' to '192.168.1.3', col 6 deviceId, col 7 port, col 8 platform, col 9 caps"
          - "parseCdpCache skips entries with addressType (col 3) != 1 (non-IP)"
          - "fixture-driven: loads src/test/resources/snmp/*.txt (lines 'oid = value') and asserts neighbour sets"
        run: "./gradlew :core-network:test --tests '*TopologyMibParserTest' --no-daemon"
        expect: "RED"
      green:
        steps:
          - "Implement TopologyMibParser as described; parse index with `oid.removePrefix(prefix).split('.')`."
          - "Fixture loader helper in test: `object SnmpFixtures { fun load(name): Map<String,String> }`."
