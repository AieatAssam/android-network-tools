context:
  problem: |
    The Network Topology tool (route `topology`) advertises "SNMP v1/v2c/v3 discovery walking LLDP
    and CDP neighbours" (store/play-description.txt, README). Three defects make it non-functional
    against real equipment:
      1. SNMPv3: Snmp4jClientImpl.buildTarget() creates a UserTarget with securityName and
         securityLevel but never (a) registers default security protocols, (b) installs a USM
         security model, or (c) adds a UsmUser carrying v3AuthPassword / v3PrivPassword. SNMP4J
         therefore cannot authenticate or encrypt; every v3 request fails (typically "unknown
         user name" / "unsupported security level" reports or timeouts). TopologyParams'
         v3AuthPassword/v3PrivPassword fields are dead.
      2. LLDP: queryLldpNeighbours() reads the VALUE of lldpRemManAddrIfId
         (1.0.8802.1.1.2.1.4.2.1.4) expecting a dotted IP. Per IEEE 802.1AB LLDP-MIB the
         management address is encoded in the row INDEX of lldpRemManAddrTable:
           lldpRemManAddrEntry INDEX { lldpRemTimeMark, lldpRemLocalPortNum, lldpRemIndex,
                                       lldpRemManAddrSubtype, lldpRemManAddr }
         so a row OID looks like 1.0.8802.1.1.2.1.4.2.1.4.<timeMark>.<localPort>.<remIndex>.1.4.192.168.1.2
         with VALUE = an Integer32 interface id. The current unit-test fixture
         (TopologyDiscoveryRepositoryTest.kt:66-71) returns "192.168.1.2" as the VALUE, which no
         real agent does; the test passes while the feature is broken.
      3. CDP: cdpCacheAddress (…9.9.23.1.2.1.1.4) is a 4-byte OctetString; SNMP4J's
         OctetString.toString() renders non-printable bytes as "c0:a8:01:01". parseCdpAddress()
         only accepts dotted-quad and returns null, so CDP neighbours are dropped.
      4. Each get()/walk() opens a new UDP transport + Snmp instance (Snmp4jClientImpl) – slow and
         wasteful for the 8+ walks per node.
      5. No R8 keep rules exist for SNMP4J (which loads SecurityProtocols/transport classes by
         name from properties) – the minified Play build has never been exercised for SNMP.
  evidence:
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/Snmp4jClientImpl.kt", lines: "16-58", note: "new DefaultUdpTransportMapping + Snmp per call" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/Snmp4jClientImpl.kt", lines: "82-105", note: "V3 UserTarget without USM/UsmUser; passwords unused" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/TopologyDiscoveryRepositoryImpl.kt", lines: "282-342", note: "LLDP parsing; mgmt addr from value of column 4" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/TopologyDiscoveryRepositoryImpl.kt", lines: "343-392", note: "CDP parsing; parseCdpAddress dotted-only" }
    - { file: "core-network/src/test/kotlin/net/aieat/netswissknife/core/network/topology/TopologyDiscoveryRepositoryTest.kt", lines: "53-80", note: "unrealistic LLDP fixture" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/TopologyModels.kt", lines: "413-431", note: "V3AuthProtocol {MD5,SHA,NONE}, V3PrivProtocol {DES,AES128,NONE}" }
    - { file: "app/proguard-rules.pro", note: "no snmp4j / icmpenguin rules" }
  desired_behaviour: |
    - v3 authNoPriv and authPriv discovery succeeds against a device configured with MD5/SHA/SHA-256 auth and DES/AES-128/192/256 priv.
    - LLDP neighbours with an IPv4 management address are followed; CDP neighbours with hex or dotted addresses are followed.
    - One SNMP session (transport) per discover() run; closed on completion/cancellation.
    - Release (R8) build keeps SNMP4J working; verified by a scripted check.

goals:
  - "SNMPv3 auth/priv functional (unit-tested via an in-process SNMP4J responder on loopback)."
  - "LLDP/CDP neighbour extraction matches the MIB encodings, with fixtures captured from real snmpwalk output."
  - "Session reuse; cancellation-safe; progress events unchanged for the UI."
  - "R8 keep rules + a documented verification command."
  - "Extend v3 protocol choices to SHA-256/SHA-512 and AES-192/256 (cheap with SNMP4J 3.x)."

non_goals:
  - "Topology export (GraphML/DOT) – later."
  - "SNMP walks of bridge forwarding tables (BRIDGE-MIB) to attach non-SNMP hosts – candidate for P15."
  - "Binding the UDP transport to the Wi-Fi network – P05 adds a `NetworkBinder` hook; leave a TODO(P05) at the transport creation site."

assumptions:
  - id: A1
    statement: "SNMP4J 3.13.1 API: SecurityProtocols.getInstance().addDefaultProtocols() plus explicit AuthMD5/AuthSHA/AuthHMAC192SHA256/AuthHMAC384SHA512 and PrivDES/PrivAES128/PrivAES192/PrivAES256 registration; USM(SecurityProtocols, OctetString localEngineId, int engineBoots); SecurityModels.getInstance().addSecurityModel(usm); snmp.getUSM().addUser(UsmUser(securityName, authProtocolOID, authPassphrase, privProtocolOID, privPassphrase)); auth OIDs AuthMD5.ID, AuthSHA.ID, AuthHMAC192SHA256.ID, AuthHMAC384SHA512.ID; priv OIDs PrivDES.ID, PrivAES128.ID, PrivAES192.ID, PrivAES256.ID."
    verify_with: "javap -cp ~/.gradle/caches/modules-2/files-2.1/org.snmp4j/snmp4j/3.13.1/*/snmp4j-3.13.1.jar org.snmp4j.security.USM org.snmp4j.security.UsmUser org.snmp4j.security.AuthHMAC192SHA256"
    if_false: "Adjust class names; the pattern (addDefaultProtocols + USM + addUser) is stable across 2.x/3.x."
  - id: A2
    statement: "SNMP4J can act as a command responder in-process (Snmp.addCommandResponder) on a loopback UDP port, allowing a JVM unit test of v2c and v3 GET without external agents."
    verify_with: "Prototype test: Snmp(DefaultUdpTransportMapping(UdpAddress('127.0.0.1/0'))).addCommandResponder { event -> build RESPONSE PDU via event.pdu / event.messageProcessingModel }. For v3 the responder needs the same user localized to its authoritative engine ID and the requester must discover that engine ID before using auth/privacy keys (SNMP4J can also auto-discover)."
    if_false: "Keep unit tests at the UsmUserSpec level and add a manual device check against a real switch or `snmpsimd` (documented in qa_validation)."
  - id: A3
    statement: "OctetString.toString() in SNMP4J returns ASCII if all bytes are printable else colon-separated hex; ifPhysAddress and cdpCacheAddress arrive as 'aa:bb:cc:dd:ee:ff' / 'c0:a8:01:01'."
    verify_with: "Unit test: OctetString(byteArrayOf(0xc0.toByte(),0xa8.toByte(),1,1)).toString() == 'c0:a8:01:01'"
    if_false: "Add SnmpClient.walkBytes() returning raw bytes for those columns."
  - id: A4
    statement: "The LLDP-MIB index layout for lldpRemManAddrTable is timeMark.localPortNum.remIndex.addrSubtype.addrLen.addrOctets… (addrSubtype 1 = IPv4, 2 = IPv6)."
    verify_with: "Cross-check with a captured `snmpwalk -v2c -c public <switch> 1.0.8802.1.1.2.1.4.2` (record it as a test fixture file under core-network/src/test/resources/snmp/lldp-rem-man-addr.txt)."
    if_false: "Adjust the index parser; keep the fixture-driven test."

constraints:
