        - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/UdpExchange.kt", lines: "1-24", detail: "Existing injectable local transport patterns can guide a new socket seam, but MQTT requires a bounded TCP/TLS stream and must not reuse UDP framing." }
        - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/tls/TlsInspectorRepository.kt", lines: "1-7", detail: "Existing TLS repository and P10 HandshakeEngine are reusable for TLS summary; MQTT must keep TLS trust/hostname verdict separate from broker protocol response." }
        - { file: "plan/phases/P12-lan-utilities-and-settings-depth.yaml", lines: "71-89", detail: "P12's mDNS catalog includes MQTT service discovery; E02 should offer a hand-off from a discovered service without assuming credentials." }
      proposed_behavior: |
        Add an MQTT Inspector for MQTT 3.1.1 and MQTT 5 CONNECT/CONNACK only. The
        user enters host/port or hands off an mDNS service, chooses plain TCP or TLS,
        and optionally supplies username/password for one run. The inspector sends
        a minimal CONNECT with a cryptographically random non-reused client id,
        clean-start/session-expiry-zero, and no Will; it reads one bounded CONNACK, records
        DNS/connect/TLS/protocol timing, return code/reason, negotiated keep-alive,
        server properties, maximum packet size, and whether authentication is
        required, then sends DISCONNECT and closes. Username/password are transient
        and the UI warns that plain TCP transmits them without transport encryption.
        It never publishes, subscribes, reads retained messages, stores credentials,
        or logs packet payloads.
      depends_on: [P05-T1, P07-T1, P07-T2, P07-T3, P08-T1, P10-T2, P12-T1]
