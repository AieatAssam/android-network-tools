          - "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/httprobe/HttpProbeViewModel.kt"
          - "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/httprobe/HttpProbeScreen.kt"
      implementation_steps:
        - "Write RED tests for status/header/body/JSON assertions, variable allowlist and escaping, failed-step stop/continue policy, five-step cap, response/body caps, cancellation, and diff semantics."
        - "Define templates as typed data, validate URLs/headers/body limits before any network call, capture all steps before starting so edits cannot race execution, and require a visible review for mutating methods."
        - "Use P10 HttpEngine/RedirectPolicy per step; strip Authorization/Cookie at every origin change and never carry captured secrets to a new origin without explicit re-entry."
        - "Add a small stepper UI with per-step loading/result, retry-from-step only when previous captures are still valid, and a share report that redacts captured values."
      acceptance_criteria:
        - "A two-step login-free flow can assert a redirect/status then use a bounded response value in the next request, with deterministic pass/fail reasons."
        - "A failed assertion is distinct from network failure, HTTP error, truncation, or invalid JSON; scenario summary preserves all completed steps."
