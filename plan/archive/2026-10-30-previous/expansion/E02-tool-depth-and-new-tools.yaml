  feasibility_privacy_matrix:
    - id: E02-T15
      api_feasibility: "Feasible with a pure MQTT 3.1.1/5 codec and injectable blocking TCP/TLS stream; no MQTT dependency is required. Verify packet/property rules against the authoritative OASIS specifications during implementation."
      permissions: "Existing INTERNET permission; P05 NetworkBinder for local broker targets. No root, VPN, notification, or storage permission."
      destinations: "Local mDNS/LAN broker by default; public broker only after explicit host entry."
      data: "CONNECT/CONNACK metadata only; no publish/subscribe/retained payloads. Credentials transient, never history/export/logs."
    - id: E02-T16
      api_feasibility: "Feasible if the pinned P10 OkHttp line exposes the needed WebSocket listener/close APIs; run a compile/device spike for ping/pong/manual frame behavior before promising optional frame actions. Fall back to handshake-only if the adapter cannot observe it reliably."
      permissions: "Existing INTERNET permission; local targets use P05 binding. No root or capture permission."
      destinations: "User-entered ws/wss endpoint; no automatic public endpoint."
      data: "Handshake headers and bounded frame metadata; payload previews opt-in and redacted."
    - id: E02-T17
      api_feasibility: "Public Android LinkProperties/ProxyInfo/ConnectivityManager and java.net.ProxySelector are the only supported discovery seams. PAC execution is platform-dependent; report configured-but-unevaluated rather than implement hidden/guessed evaluation."
      permissions: "Existing INTERNET permission for explicit probes; no ability to change system proxy and no credential-storage permission."
      destinations: "Direct and selected proxy legs are separate, explicit user actions. A proxy failure never triggers an automatic direct retry; direct mode visibly warns it may expose the target/client route."
      data: "Proxy host/port/PAC URL may be sensitive; redact credentials and avoid persisting route details unless explicitly saved."
    - id: E02-T18
      api_feasibility: "NetworkCapabilities captive/validated/partial flags and LinkProperties are public platform APIs; active HTTP/DNS checks use existing P10 engine. Endpoint behavior must be fixture-tested and reverified before shipping."
      permissions: "Existing INTERNET plus current connectivity access; no location/storage permission beyond the platform fields already gated by the app."
      destinations: "User-selected or attributed 204/check endpoint; local organization endpoint supported."
      data: "Status/headers/classification only by default; login HTML/body is bounded and not persisted."
    - id: E02-T19
      api_feasibility: "Pure orchestration over existing use cases and E01 report/history contracts; no new provider or protocol dependency."
      permissions: "Inherits each explicitly selected step; no automatic network permission expansion."
      destinations: "Only the targets configured in each step; imported profiles never auto-run."
      data: "Opt-in local bundle, default metadata-only, E01-T12 redaction before share/file export."

  incremental_delivery:
    stages:
      - order: 0
        tasks: [E00-T01, E01-T06]
        gate: "The LAN confirmed/ambiguous contract and regression fixture pass; E02-T04 consumes this contract and does not reimplement it."
      - order: 1
        tasks: [E01-T11, E01-T12, E02-T01, E02-T02, E02-T03, E02-T04]
        gate: "Run history/export consent, redaction, stop/drain behavior, and core comparison models are verified before any durable E02 result payload is enabled."
      - order: 2
        tasks: [E02-T05, E02-T06, E02-T07, E02-T08, E02-T09, E02-T10, E02-T11, E02-T12, E02-T13, E02-T14]
        gate: "Existing owner phases provide their protocol/platform primitives; each tool ships independently with no global rewrite."
      - order: 3
        tasks: [E02-T15, E02-T16, E02-T17, E02-T18]
        gate: "New-tool feasibility spikes, dependency/API decisions, privacy copy, and offline fixtures pass before navigation entries are enabled."
      - order: 4
        tasks: [E02-T19]
        gate: "Compare workflow runs only after participating result schemas, history consent, redaction, and handoff contracts are stable."
    feature_flags:
      - "New screens and durable history integrations remain internal/debug-gated until their focused core/domain/app/instrumented checks pass."
      - "A disabled optional tool remains absent from navigation and cannot be auto-invoked by imported settings or bundles."
      - "Flags do not change the E00-T01 default LAN false-positive suppression."

  deferred_unrealistic_scope:
    - scope: "Raw/SYN/UDP port scanning, packet capture, ARP injection, root-only interfaces, or VPN interception"
      reason: "Android app permissions/device policy do not provide a stable, safe cross-device contract; current TCP scanner and evidence-aware LAN discovery remain bounded."
    - scope: "A universal PAC interpreter or silent direct fallback when a proxy fails"
      reason: "PAC execution and route semantics vary by platform; public APIs can expose configuration/selection but do not justify hidden bypass behavior."
    - scope: "Captive-portal login automation, credential submission, or universal proof of Internet access"
      reason: "Would handle user credentials and depends on provider/network-specific login flows; E02 reports evidence and leaves sign-in to the system/user."
    - scope: "MQTT topic browsing/publishing/subscribing or WebSocket browser/client collections"
      reason: "Diagnostic handshake scope is safer and testable; application data access belongs to a separate consented product decision."
    - scope: "Background mDNS/Wi-Fi/throughput monitors, scheduled WOL, or recurring cloud comparisons"
      reason: "Needs a foreground-service/notification, battery policy, scheduling semantics, and expanded privacy review; all E02 runs stay explicit and bounded."
    - scope: "Global route maps, RF spectrum measurements, automatic device identity, and universal root-cause diagnosis"
      reason: "Available observations cannot support those claims consistently across Android OEMs and networks; display provenance and uncertainty instead."
    - scope: "Cloud synchronization of run history, credentials, raw DNS/HTTP bodies, PEM chains, or packet payloads"
      reason: "Conflicts with local-first privacy and E01-T11/E01-T12 retention/redaction contracts."

  qa_validation:
    required_before_task_done:
      - "Focused pure tests cover normal, boundary, malformed, timeout, cancellation, partial, and incomparable-context cases; use fake clocks/transports and no live provider as a deterministic gate."
      - "ViewModel tests prove captured input/result generations, duplicate-submit guards, stop/drain semantics, typed errors, and no stale terminal update."
      - "Instrumented screen tests cover idle/loading/success/partial/error plus compact/large font/accessibility semantics for each new or materially changed flow."
      - "Run `./gradlew test`, `./gradlew :app:assembleDebug`, `./gradlew :app:lintDebug`, and all three Kover gates sequentially as prescribed by P09; record device/API and whether work was cached."
      - "Run release-smoke/R8 checks after adding OkHttp or serialization and verify no new secrets/credentials are retained in logs, backups, history, or exports."
    focused_commands:
      - "./gradlew :core-network:test --tests '*<task protocol/package>*' --no-daemon --no-parallel"
      - "./gradlew :core-domain:test --tests '*<task use case>*' --no-daemon --no-parallel"
      - "./gradlew :app:testDebugUnitTest --tests '*<task ViewModel>*' --no-daemon --no-parallel"
      - "./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=<fully.qualified.ScreenTest> --no-daemon --no-parallel (replace with an existing class; --tests is for JVM Test tasks, not this instrumented task)"
    live_validation_limits:
      - "Provider/device observations are exploratory evidence only; record endpoint, API level, transport, timestamp, and failure conditions."
      - "No acceptance criterion depends on a public broker, public resolver, Cloudflare throughput, portal endpoint, or carrier behavior being available at test time."
      - "Network-bound manual checks must state whether traffic is local or external and the exact data sent."

  docs_privacy_sync:
    - "Update README Features and Available Tools only when each task ships; keep the current 14-tool claim accurate until P13/P14/P15/E02 tools are actually implemented."
    - "Add per-tool privacy/attribution entries for MQTT/WebSocket/proxy/captive endpoints and the external data fields; local-only tools must say so."
    - "Update store/help/catalog/navigation strings and German/pseudo-locale resources through P07/E01; never place protocol claims or error text as UI literals."
    - "Document confirmed/ambiguous LAN semantics, comparison limitations, data budgets, stop behavior, and redaction defaults in help sheets and share reports."

  completion_definition:
    - "All 19 E02 tasks have status done or dropped with a reason; every done task has source evidence, focused tests, app validation, privacy/route notes, and incremental checkpoint evidence."
    - "E02 does not close E00/E01/E03 or P01–P15 tasks by implication; each owner records its own acceptance and dependency status."
    - "No task is considered complete if its provider/API feasibility is unverified, its comparison context is missing, its cancellation cleanup is untested, or its export/history behavior bypasses E01-T11/E01-T12 consent and redaction."
