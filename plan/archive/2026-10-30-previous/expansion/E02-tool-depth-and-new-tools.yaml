          - "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/compare/DiagnosticsCompareScreen.kt"
          - "app/src/main/kotlin/net/aieat/netswissknife/app/di/DiagnosticsCompareModule.kt"
        modify:
          - "app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/NavRoutes.kt"
