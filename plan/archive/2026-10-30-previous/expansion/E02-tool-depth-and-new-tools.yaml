    - id: E02-T04
      priority: high
      status: todo
      title: "LAN confidence model, false-positive suppression, and inventory diff"
      source_evidence:
        - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/DiscoveryProbes.kt", lines: "15-24, 76-118", detail: "TcpPresence.Refused is produced from any ConnectException and the default probe stops at the first refusal; origin is not verified." }
        - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/LanScanRepositoryImpl.kt", lines: "159-209", detail: "A lone TCP refusal is currently promoted to Presence and emitted as a host before name/MAC enrichment." }
        - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/LanHost.kt", lines: "3-24", detail: "LanHost records discovery methods but has no confidence, ambiguity, or corroboration fields." }
        - { file: "plan/reviews/2026-09-22-lan-scan-noise.yaml", lines: "8-43", detail: "RLAN001 confirms the reported noisy scan and requires ambiguous TCP evidence to be separated from confirmed hosts." }
        - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/lan/LanScanViewModel.kt", lines: "35-52, 162-222", detail: "ViewModel owns live host list, scan history input, and finished summary; it is the seam for confirmed/ambiguous filters and snapshots." }
      proposed_behavior: |
        Consume E00-T01's presence contract; do not implement a second classifier.
        Reuse its PresenceEvidence-equivalent model containing method,
        port(s), corroborating signals, confidence, and ambiguity reason. ICMP,
        NetBIOS/mDNS response, or verified local neighbour evidence can be confirmed;
        TCP_OPEN is confirmed responsive endpoint evidence (without claiming physical
        device identity); one or more TCP_REFUSED outcomes alone
        are AMBIGUOUS and are excluded from the default confirmed host list. If the
        user enables "include ambiguous", show them in a separate section with an
        explanation that a gateway/VPN/firewall reset may be the source. Allow a
        configurable display policy for ambiguous observations, but never promote a
        refusal-only policy; preserve a test mode for ICMP-blocked networks. Add
        bounded inventory snapshots using IP/MAC/hostname only as candidate keys and
        mark conflicting/reused/randomized identities ambiguous instead of merging
        physical devices automatically.
      depends_on: [E00-T01, P01-T4, P01-T5, P01-T7, P01-T9, P05-T1, P08-T1, P12-T4]
      files_seams:
        create:
          - "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/PresenceEvidence.kt"
          - "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/LanInventoryDiff.kt"
          - "core-network/src/test/kotlin/net/aieat/netswissknife/core/network/lan/PresenceConfidenceTest.kt"
          - "core-network/src/test/kotlin/net/aieat/netswissknife/core/network/lan/LanInventoryDiffTest.kt"
          - "app/src/main/kotlin/net/aieat/netswissknife/app/data/LanInventoryHistoryRepository.kt"
        modify:
          - "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/DiscoveryProbes.kt"
