        - "Define TcpStream/TlsStream interfaces with connect/read/write deadlines and a close hook; bind local targets through P05 and use platform TLS hostname verification from P10."
        - "Implement a minimal handshake state machine that rejects unexpected packet types, caps packet size, preserves cancellation, and maps CONNACK codes to typed localized errors."
        - "Add UI for host/port/TLS/version/optional transient credentials with a prominent 'CONNECT only' explanation, result evidence badges, and redacted share output."
      acceptance_criteria:
        - "A broker fixture returns parsed MQTT 3.1.1 and MQTT 5 CONNACK fields and closes cleanly; malformed/oversized responses fail typed and bounded."
        - "TLS hostname/trust failures are shown separately from broker authentication refusal; plain TCP does not claim TLS security."
