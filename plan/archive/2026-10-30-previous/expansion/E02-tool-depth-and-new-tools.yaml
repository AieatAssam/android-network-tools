# =============================================================================
# E02 – Tool depth, comparison workflows, and feasible new diagnostics
# =============================================================================
# Audience: AI coding agents. This file is an additive expansion to P01–P15;
# it is deliberately implementation-oriented and must be read with
# plan/plan.yaml agent_execution_rules plus the owning phase file.
# Scope: planning only. No production implementation is implied by this file.
# =============================================================================

expansion:
  id: E02
  title: "Evidence-grade workflows for every shipped tool and a small set of new diagnostics"
  priority: high
  status: in_progress
  owner_file: "plan/expansion/E02-tool-depth-and-new-tools.yaml"
  audience: "coding agents working in small RED -> GREEN -> REFACTOR PRs"
  baseline: "README.md and current source at the working tree on 2026-09-22"
  depends_on: []
  related_phases: [P01, P02, P03, P04, P10, P11, P12, P13, P14, P15]
  purpose: |
    Turn one-shot screens into trustworthy diagnostic workflows. Results must
    retain the exact input, network context, timing basis, evidence quality,
    and privacy scope needed to compare runs later. Additions here must reuse
    existing repositories and shared UI seams; a new screen is justified only
    when it answers a distinct diagnostic question.

  execution_rules:
    - "Do not mark an item done because a screen renders; prove the core model and the user-visible state with deterministic tests."
    - "Use monotonic clocks for durations, immutable captured input for every run, typed errors from P07, and CancellationException-preserving cleanup."
    - "Keep :core-network and :core-domain free of Android imports. Put NetworkBinder, ConnectivityManager, TrafficStats, ProxyInfo, WifiManager, and share/SAF work in :app."
    - "Every external provider is injectable, has a bounded timeout, cache/rate-limit behavior, attribution, and an offline/disabled state. Never make a third-party API silently mandatory for a local result."
    - "Local-only probes must bind through P05 NetworkBinder when a local interface is intended. Never require root, shell commands, packet capture, or VPN interception."
    - "Every streaming tool has a stop test proving sockets, jobs, multicast locks, and writers are released within the advertised budget."
    - "Extend existing result models with defaulted fields or versioned export schemas; preserve current public APIs while migrations are pending."
    - "For each item, first reconcile overlapping P01–P15 work and close the listed existing finding before adding optional polish."

  evidence_index:
    - "README.md (lines 3-171) — 14 implemented tools and their advertised behavior, limits, providers, and privacy claims."
    - "plan/plan.yaml (lines 1-130) — tool count, execution invariants, phase order, and unresolved review findings."
    - "plan/reviews/2026-09-21-network.yaml:15-221 — LAN, DNS, Wi-Fi, topology, traceroute, and port-scan correctness gaps."
    - "plan/reviews/2026-09-21-app.yaml:9-104 — Wi-Fi/mDNS/ICMP lifecycle and platform adapter gaps."
    - "plan/reviews/2026-09-21-ui-domain.yaml:9-198 — stop, recreation, input, export, and concurrency UX gaps."
    - "plan/reviews/2026-09-22-lan-scan-noise.yaml:1-44 — lone TCP reset false-positive mechanism and required confidence semantics."

  coverage_matrix:
    # The row's E02 task is the minimum meaningful depth item for that tool;
    # the owning phase remains responsible for its existing correctness scope.
    - { tool: Ping, current_seam: "PingRepository/PingResult + PingViewModel", e02_task: E02-T01, outcome: "captured runs, baseline/delta comparison, evidence-aware export" }
    - { tool: Traceroute, current_seam: "TracerouteRepository/TracerouteResult + TracerouteViewModel", e02_task: E02-T02, outcome: "route snapshot diff and hop-change explanation" }
    - { tool: Port Scanner, current_seam: "PortScanRepository/PortScanResult + PortScanViewModel", e02_task: E02-T03, outcome: "safe profiles, bounded scan evidence, result diff" }
    - { tool: LAN Scanner, current_seam: "LanScanRepository/DiscoveryProbes + LanScanViewModel", e02_task: E02-T04, outcome: "confidence-aware discovery and device inventory diff" }
    - { tool: DNS Lookup, current_seam: "DnsRepository/DnsResult + DnsViewModel", e02_task: E02-T05, outcome: "resolver comparison and answer drift explanation" }
    - { tool: Wi-Fi Scanner, current_seam: "WifiScanRepository/WifiNetwork + WifiScanViewModel", e02_task: E02-T06, outcome: "channel/roaming evidence and short history" }
    - { tool: TLS Inspector, current_seam: "TlsInspectorRepository/TlsInspectorResult + TlsInspectorViewModel", e02_task: E02-T07, outcome: "policy profile and repeatable security diff" }
    - { tool: Network Topology, current_seam: "TopologyDiscoveryRepository/TopologyModels + TopologyViewModel", e02_task: E02-T08, outcome: "snapshot identity, graph diff, safe export" }
    - { tool: WHOIS, current_seam: "WhoisRepository/WhoisModels + WhoisViewModel", e02_task: E02-T09, outcome: "registration snapshot diff and deadline clarity" }
    - { tool: HTTP Probe, current_seam: "HttpProbeRepository/HttpProbeResult + HttpProbeViewModel", e02_task: E02-T10, outcome: "repeatable assertions and response comparison" }
    - { tool: mDNS Browser, current_seam: "MdnsRepository/MdnsUpdate + MdnsDiscoveryViewModel", e02_task: E02-T11, outcome: "service watch and endpoint health evidence" }
    - { tool: Subnet Calculator, current_seam: "SubnetCalculatorRepository/SubnetInfo + SubnetViewModel", e02_task: E02-T12, outcome: "overlap/plan validation and RFC 3021 clarity" }
    - { tool: Speed Test, current_seam: "SpeedTestRepository/SpeedTestEvent + SpeedTestViewModel", e02_task: E02-T13, outcome: "comparable runs, confidence and data budget" }
    - { tool: Wake-on-LAN, current_seam: "WakeOnLanRepository/WolSendReport + WolViewModel", e02_task: E02-T14, outcome: "safe batch wake and per-target verification" }
    - { tool: MQTT Inspector, current_seam: "new core-network/mqtt protocol seam", e02_task: E02-T15, outcome: "local or public broker handshake diagnostics" }
    - { tool: WebSocket Probe, current_seam: "new core-network/websocket seam over P10 OkHttp", e02_task: E02-T16, outcome: "handshake, protocol, frames, and close diagnostics" }
    - { tool: Proxy/PAC Tester, current_seam: "new app platform proxy source + P10 HttpEngine", e02_task: E02-T17, outcome: "direct/proxy/PAC route comparison" }
    - { tool: Captive Portal Check, current_seam: "new core-network/captiveportal + P13 NetworkInfo", e02_task: E02-T18, outcome: "validation, redirect, DNS, and login-required evidence" }
    - { tool: Diagnostics Compare, current_seam: "new core-domain run bundle + shared app UI", e02_task: E02-T19, outcome: "cross-tool before/after experiment bundle" }

  shared_contract:
    run_metadata: "RunMetadata(id, startedAtEpochMs, durationMs, networkLabel?, transport?, interfaceName?, localOnly, target, capturedConfigHash, appVersion, schemaVersion)"
    evidence_quality: "EvidenceQuality { CONFIRMED, CORROBORATED, OBSERVED, AMBIGUOUS, UNAVAILABLE }; every adapter maps raw outcomes without overstating them."
    comparison: "Comparison<T>(baseline, candidate, comparableFields, changedFields, incomparableReasons); never compare values with different target/config/network context without labeling them."
    export: "Versioned JSON plus existing human-readable/CSV formats where already supported; redact credentials, SecureOn secrets, SNMP communities, HTTP Authorization/Cookie headers, and raw packet payloads by default."
    persistence: "Use E01-T11's opt-in run-history policy and E01-T12's report/redaction flow. Default to in-memory metadata only; durable result payloads require an explicit user save, a per-tool retention setting, bounded size, clear/delete controls, and no cloud sync."
    ui: "Reuse ToolHeroHeader, ToolHelpSheet, ToolStateAnnouncer, NetworkStatusBanner, ToolErrorCard, stop controls, status colors, and existing share utilities; add a consistent RunContextCard, EvidenceBadge, ComparePicker, and ExportOptionsSheet only after pure contracts exist."

  tasks:
    # -----------------------------------------------------------------------
    - id: E02-T01
      priority: medium
      status: todo
      title: "Ping run records, percentile evidence, and baseline comparison"
      source_evidence:
        - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/ping/PingResult.kt", lines: "3-17", detail: "Result retains packets/stats/raw text and resolved IP, but no captured configuration, monotonic duration, network context, percentiles, or evidence quality." }
        - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/ping/PingStats.kt", lines: "14-53", detail: "Stats expose min/max/average/jitter only; latency distribution and status counts are discarded." }
        - { file: "core-domain/src/main/kotlin/net/aieat/netswissknife/core/domain/PingSessionLogger.kt", lines: "7-23", detail: "Continuous CSV uses wall-clock timestamps and is written asynchronously; RUI005 requires drain-safe finalization before sharing." }
        - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/ping/PingViewModel.kt", lines: "36-60, 177-229", detail: "ViewModel owns run lifecycle and form values, making it the seam for immutable captured input and comparison state." }
        - { file: "plan/reviews/2026-09-21-ui-domain.yaml", lines: "89-109", detail: "RUI005 shows that exports need a completion boundary before they are made available." }
      proposed_behavior: |
        Add a pure PingRunRecord/PingRunComparator. Capture normalized host, resolved
        address, engine (ICMP/reachability), count/timeout/interval/payload/TTL,
        monotonic duration, network label/interface when available, status counts,
        p50/p95/p99, standard deviation, and whether any packet was corroborated by
        an actual ICMP reply. Compare only runs with matching target and material
        configuration; otherwise show the reason they are incomparable. Offer an
        explicit Save to History through E01-T11 after the logger has drained; keep
        default completion in-memory metadata and do not persist raw packets. Add a
        "Compare previous" card, a timeline delta view, and versioned JSON export;
        retain the existing CSV with a `metadata` header section. Continuous mode
        must publish a record only after the writer job has joined.
      depends_on: [E01-T11, E01-T12, P04-T1, P04-T2, P04-T5, P08-T1, P12-T4]
      files_seams:
        create:
          - "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/ping/PingDistribution.kt"
          - "core-domain/src/main/kotlin/net/aieat/netswissknife/core/domain/PingRunRecord.kt"
          - "core-domain/src/main/kotlin/net/aieat/netswissknife/core/domain/PingRunComparator.kt"
          - "app/src/main/kotlin/net/aieat/netswissknife/app/data/PingRunHistoryRepository.kt"
          - "core-domain/src/test/kotlin/net/aieat/netswissknife/core/domain/PingRunComparatorTest.kt"
        modify:
          - "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/ping/PingResult.kt"
          - "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/ping/PingStats.kt"
          - "core-domain/src/main/kotlin/net/aieat/netswissknife/core/domain/PingSessionLogger.kt"
          - "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/ping/PingViewModel.kt"
          - "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/PingScreen.kt"
      implementation_steps:
        - "Write RED tests for percentile interpolation, all-timeout distributions, config mismatch, engine/evidence badges, and writer drain ordering; preserve P04 typed validation and RUI003/RUI004 fixes in the same captured-config path."
        - "Use an injected MonotonicClock and a run-scoped immutable PingParams snapshot; do not derive comparison metadata from mutable form state after completion."
        - "Extract a suspendable logger close/drain contract, rethrow cancellation, and make JSON/CSV export redact no secrets while preserving packet sequence and reply IP when the user requests it."
        - "Integrate history through E01-T11 and report redaction/export through E01-T12, with user-controlled retention, delete-all, and schema-version handling."
        - "Add screen states for no comparable run, incomparable context, and changed percentile values; announce completion and loss/ambiguous evidence through P08."
      acceptance_criteria:
        - "A run with RTTs [10, 20, 30, timeout] reports loss, p50/p95, jitter, duration, engine, resolved IP, and captured parameters consistently in screen, JSON, and CSV metadata."
        - "Comparing different hosts, payload/TTL, or engine mode shows an explicit incomparable reason and never labels a delta as a regression."
        - "Stopping continuous mode with a blocked writer exposes the share action only after every queued packet is present; cancellation deletes incomplete temporary files."
        - "The UI distinguishes ICMP evidence from reachability fallback and never calls a refusal/timeout an ICMP success."
      validation:
        automated: ["./gradlew :core-network:test --tests '*Ping*' --no-daemon", "./gradlew :core-domain:test --tests '*Ping*' --no-daemon", "./gradlew :app:testDebugUnitTest --tests '*Ping*' --no-daemon", "instrumented PingScreenTest: idle/running/finished/compare/export"]
        manual: ["Run the same host on Wi-Fi then cellular and verify the context badge prevents a misleading comparison.", "Stop continuous ping while several rows are queued and open the exported CSV/JSON."]
      effort: "L (2-3 coding-agent sessions)"
      constraints_rollout: "Ship result/model and export compatibility first; gate history/compare UI behind a local feature flag until the drain and migration tests pass. No cloud history, notification, background ping, or root privileges."

    - id: E02-T02
      priority: medium
      status: todo
      title: "Traceroute route snapshots and path-change explanation"
      source_evidence:
        - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/traceroute/TracerouteResult.kt", lines: "3-24", detail: "Result has hops and total time but no probe configuration, capture network, or stable snapshot identity." }
        - { file: "core-domain/src/main/kotlin/net/aieat/netswissknife/core/domain/TracerouteUseCase.kt", lines: "21-60", detail: "Use case validates and streams hops/enrichment but does not retain a comparable run record." }
        - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/traceroute/TracerouteViewModel.kt", lines: "36-176", detail: "ViewModel merges streaming hops and owns stop/retry, the seam for snapshot completion and RUI007 elapsed-time repair." }
        - { file: "plan/phases/P11-diagnostics-tools-depth.yaml", lines: "52-59, 95-100", detail: "P11 adds per-probe stats and asynchronous enrichment; E02 must consume those fields instead of duplicating them." }
      proposed_behavior: |
        After P11 per-probe work, create a stable RouteSnapshot containing target,
        resolved IP, probe type, packet size, max hops, each hop's ordered address,
        hostname, probe outcomes, and network context. RouteDiff classifies added,
        removed, changed, and reordered hops and computes latency deltas only where
        the probe count and target match. The UI keeps the live route view, then
        offers "Compare previous" with a compact hop-by-hop diff, a plain-language
        note for private/unknown hops, and a redacted share/export option.
      depends_on: [E01-T11, E01-T12, P05-T1, P08-T1, P11-T2, P12-T4]
      files_seams:
        create:
          - "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/traceroute/RouteSnapshot.kt"
          - "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/traceroute/RouteDiff.kt"
          - "core-network/src/test/kotlin/net/aieat/netswissknife/core/network/traceroute/RouteDiffTest.kt"
          - "app/src/main/kotlin/net/aieat/netswissknife/app/data/RouteHistoryRepository.kt"
        modify:
          - "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/traceroute/TracerouteResult.kt"
          - "core-domain/src/main/kotlin/net/aieat/netswissknife/core/domain/TracerouteUseCase.kt"
          - "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/traceroute/TracerouteViewModel.kt"
          - "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/TracerouteScreen.kt"
      implementation_steps:
        - "Write RED tests for identical paths, a single changed gateway, timeouts becoming replies, target IP changes, and IPv4/IPv6 address normalization."
        - "Use hop number plus canonical address as identity; never match a missing hop only by list index. Preserve P11 enrichment arrival order in the snapshot."
        - "Capture stop duration and resolved IP before cancellation clears the running state; keep partial snapshots explicitly marked incomplete."
        - "Offer explicit Save Snapshot through E01-T11 with bounded retention and add a user-controlled redaction option for public IPs/hostnames; do not geolocate or map beyond P11."
      acceptance_criteria:
        - "A changed route shows exact hop additions/removals/address changes and latency deltas with an 'incomplete comparison' reason when settings differ."
        - "A stopped trace includes non-zero elapsed metadata when probes were emitted, satisfying RUI007 without inventing a successful destination."
        - "An explicitly saved snapshot survives process recreation and remains local; an unsaved completion does not become durable; share output includes target/config/time basis and no credentials."
      validation:
        automated: ["./gradlew :core-network:test --tests '*Traceroute*' --no-daemon", "./gradlew :core-domain:test --tests '*Traceroute*' --no-daemon", "./gradlew :app:testDebugUnitTest --tests '*Traceroute*' --no-daemon", "instrumented TracerouteScreenTest: live/partial/diff/redaction"]
        manual: ["Compare Wi-Fi and cellular paths to the same target; verify changed network context is visible.", "Stop during enrichment and confirm no late update mutates the saved snapshot."]
      effort: "M (1-2 coding-agent sessions)"
      constraints_rollout: "Depends on P11's hop schema. Keep map rendering, continuous background tracing, and automatic route alerts deferred."

    - id: E02-T03
