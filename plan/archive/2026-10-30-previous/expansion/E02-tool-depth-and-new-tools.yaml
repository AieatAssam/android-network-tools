        - { file: "core-domain/src/main/kotlin/net/aieat/netswissknife/core/domain/PingUseCase.kt", lines: "12-51", detail: "Use cases expose injectable orchestration seams suitable for a bounded bundle runner." }
        - { file: "core-domain/src/main/kotlin/net/aieat/netswissknife/core/domain/DnsLookupUseCase.kt", lines: "1-42", detail: "DNS use case provides a typed lookup seam for a captured target/config." }
        - { file: "plan/plan.yaml", lines: "1-130", detail: "Existing findings repeatedly show stale context, stop races, and misleading exports; a bundle must preserve captured metadata and partial outcomes." }
      proposed_behavior: |
        Add a Diagnostics Compare workflow that lets a user define a bounded plan of
        existing checks (for example DNS A lookup, Ping, HTTP GET, and TLS inspect),
        capture a Baseline and a Candidate run, and compare only matching targets,
        network context, and configuration. Each step has independent loading,
        cancellation, typed error, and evidence quality; one failure does not erase
        the others. The bundle stores immutable inputs, tool versions/schema, active
        network label, monotonic/epoch timing, and redacted outputs locally. A result
        screen shows changed fields and suggests a next hand-off (for example DNS
        mismatch -> DNS matrix, latency increase -> traceroute) without asserting a
        root cause. Export JSON plus a readable report; no cloud upload or automatic
        recurring monitor.
      depends_on: [E01-T11, E01-T12, E02-T01, E02-T02, E02-T05, E02-T07, P05-T1, P07-T2, P07-T3, P08-T1, P09-T2, P12-T4]
