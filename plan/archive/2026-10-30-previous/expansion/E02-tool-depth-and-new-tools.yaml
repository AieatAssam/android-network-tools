    - id: E02-T10
      priority: medium
      status: todo
      title: "HTTP request scenarios with bounded assertions and response diff"
      source_evidence:
        - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/httprobe/HttpProbeModels.kt", lines: "15-51", detail: "Current request/result support one request, bounded body, redirect chain, and security checks but no reusable scenario or assertions." }
        - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/httprobe/HttpProbeRepositoryImpl.kt", lines: "31-64, 67-186", detail: "Repository already has validation, bounded body reads, redirect handling, and injectable seams planned by P10; scenario orchestration should call it rather than fork transport code." }
        - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/httprobe/HttpProbeViewModel.kt", lines: "23-45, 95-132", detail: "ViewModel owns headers/body/method and one in-flight send; scenario editing and per-step results must capture immutable state." }
        - { file: "plan/phases/P10-security-tools-depth.yaml", lines: "55-61, 104-112, 158-203", detail: "P10 covers OkHttp timings, redirect policy, cURL, cookies, and JSON rendering; E02 adds deterministic multi-request workflow semantics." }
      proposed_behavior: |
        Add an optional HTTP Scenario mode with at most five sequential steps. Each
        step defaults to safe read-only GET/HEAD/OPTIONS methods; mutating methods
        require an explicit per-step review/confirmation and can be disabled by a
        profile. Each step references a request template and can assert status range/exact code,
        header presence/value, bounded body text, and a small JSON path equality;
        it may capture one redacted value (for example a header or JSON scalar) for
        the next URL/header/body template. No arbitrary scripts, file uploads,
        cookie persistence, or hidden credential storage. Return per-step timing,
        redirect/security result, assertion outcome, and a scenario summary. On an
        origin change or redirect, strip Authorization/Cookie and captured secrets
        unless the user explicitly re-enters them for the new origin. Add a
        pure ScenarioDiff to compare two runs by step and assertion.
      depends_on: [E01-T12, P07-T2, P07-T3, P08-T1, P10-T3, P10-T4, P12-T4]
      files_seams:
        create:
          - "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/httprobe/HttpScenario.kt"
          - "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/httprobe/HttpAssertion.kt"
          - "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/httprobe/ScenarioDiff.kt"
          - "core-network/src/test/kotlin/net/aieat/netswissknife/core/network/httprobe/HttpScenarioTest.kt"
