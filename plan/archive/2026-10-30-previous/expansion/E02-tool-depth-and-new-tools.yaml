      effort: "L (2-3 coding-agent sessions)"
      constraints_rollout: "Do not become a general API client, collection sync service, browser, or credential manager. Require explicit user action per run; no background requests."

    - id: E02-T11
      priority: medium
      status: todo
      title: "mDNS service watch and local endpoint health evidence"
      source_evidence:
        - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/mdns/MdnsRepository.kt", lines: "5-21", detail: "Service model has type/name/host/port/IP/TXT and a one-shot Flow; no expiry, update/removal, or health state exists." }
        - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/mdns/MdnsRepositoryImpl.kt", lines: "42-80, 177-213", detail: "Current implementation uses a fixed IPv4 group, swallows socket errors, and has cancellation/lock concerns captured by RAPP002/RAPP004." }
        - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/mdns/MdnsDiscoveryViewModel.kt", lines: "17-25, 38-104", detail: "ViewModel groups one scan's services and currently maps cancellation/errors through one catch; watch state must preserve partial results and clean stop semantics." }
        - { file: "plan/phases/P12-lan-utilities-and-settings-depth.yaml", lines: "45-56, 71-89, 101-174", detail: "P12 owns IPv6/catalog/TXT/actions and must land before E02 health/watch behavior." }
      proposed_behavior: |
        Add an explicit "Watch for changes" session consisting of bounded repeated
        mDNS queries (default three samples, user-controlled interval) that reports
        services added, not observed, or changed in port/IP/TXT. Treat absence as
        "not observed" unless the advertisement's TTL/expiry or an explicit goodbye
        record proves removal. Use the P12 dual-stack,
        catalog, and service identity work, and preserve a sample as stale/partial
        when the platform scan is throttled or socket setup fails. Add optional
        local-only endpoint checks: for HTTP/HTTPS service types perform one bounded
        HEAD/GET through the bound local network and show status/latency; for other
        types only show TCP connect evidence. Never follow a service into the public
        internet without an explicit user action.
      depends_on: [E01-T11, E01-T12, P05-T1, P05-T4, P08-T1, P12-T1, P12-T2]
      files_seams:
        create:
          - "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/mdns/MdnsServiceDiff.kt"
          - "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/mdns/MdnsHealthProbe.kt"
          - "core-network/src/test/kotlin/net/aieat/netswissknife/core/network/mdns/MdnsServiceDiffTest.kt"
          - "app/src/main/kotlin/net/aieat/netswissknife/app/mdns/MdnsWatchCoordinator.kt"
        modify:
          - "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/mdns/MdnsRepository.kt"
          - "app/src/main/kotlin/net/aieat/netswissknife/app/mdns/MdnsRepositoryImpl.kt"
          - "core-domain/src/main/kotlin/net/aieat/netswissknife/core/domain/MdnsDiscoveryUseCase.kt"
          - "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/mdns/MdnsDiscoveryViewModel.kt"
          - "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/mdns/MdnsDiscoveryScreen.kt"
      implementation_steps:
        - "Write RED tests for dual-stack service identity, repeated sample diffs, not-observed versus TTL-expired/goodbye removal, TXT changes, socket failure versus timeout, cancellation, multicast-lock release, and local endpoint probe limits."
        - "Make MdnsUpdate carry a sample/session id and typed health/error state; preserve partial services when stop is user initiated and rethrow cancellation."
        - "Use P05 NetworkBinder and a short receive timeout/close hook; never swallow non-timeout I/O/security errors into an empty successful scan."
        - "Restrict endpoint health to IPs confirmed in the current local subnet and cap requests/body reads; disclose each network action in the detail sheet."
      acceptance_criteria:
        - "A service appearing across samples is classified deterministically; absence alone is not called removal, while TTL expiry or goodbye is explicitly labeled when observed."
        - "Pressing Stop releases the multicast lock/socket promptly and leaves partial results without an error state; P12/P05 I/O failures remain actionable."
        - "Health check results clearly identify TCP versus HTTP evidence and never imply the advertised service is authenticated or safe."
      validation:
        automated: ["./gradlew :core-network:test --tests '*mdns*' --no-daemon", "./gradlew :core-domain:test --tests '*Mdns*' --no-daemon", "./gradlew :app:testDebugUnitTest --tests '*Mdns*' --no-daemon", "instrumented MdnsDiscoveryScreenTest: one-shot/watch/stop/error"]
        manual: ["Use an IPv6-only advertiser and a service that changes TXT/port; verify the watch diff.", "Stop a long session and confirm no late error snackbar appears and the lock is released."]
      effort: "L (2-3 coding-agent sessions)"
      constraints_rollout: "No passive always-on service monitor, internet crawling, arbitrary URL fetches, or background multicast. P12 service actions remain explicit user taps."

