    - id: E02-T19
      priority: medium
      status: todo
      title: "Diagnostics Compare: repeatable before/after experiment bundles"
      source_evidence:
        - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/NavRoutes.kt", lines: "1-84", detail: "All current tools are route-addressable, but there is no shared workflow that captures several tool results under one network context." }
