  - task: E00-T04
    scope: "P13-T1/P13-T2/P13-T3 acceptance and evidence contracts"
    precedence: "E00-T04 overrides conflicting older protocol, provider, XML-security and timing assumptions below. Apply within each owning tool, not as a separate duplicate implementation."

tools:
  # ---------------------------------------------------------------------------
  - id: P13-NETINFO
    name: "Network Info"
    route: "netinfo"
    package: "netinfo"
    icon: "Icons.Default.Info (or Icons.Outlined.Hub)"
    more_section: "Wi-Fi & LAN"
    why: "Table-stakes for the category and absent: users must type addresses the app could show. Also the natural home for gateway/DNS/public-IP facts other tools reuse (P01 LinkInfoProvider)."
    behaviour: |
      Live dashboard of the active network and all interfaces:
        Active network card: transport (Wi-Fi/Cellular/Ethernet/VPN), interface name, IPv4 addresses (with prefix), IPv6 addresses (GUA/ULA/link-local labelled), default gateway(s), DNS servers, Private DNS (on/off + hostname), MTU (use the documented LinkProperties API level; unknown when unavailable), metered/captive-portal/validated flags, estimated bandwidth (NetworkCapabilities link*BandwidthKbps), VPN active.
        Wi-Fi card (when Wi-Fi): SSID, BSSID, RSSI, link speed tx/rx, frequency/channel, standard (reuse WifiScanRepositoryImpl.buildConnectionInfo via WifiScanUseCase), DHCP server + lease only where actually available (deprecated source capability-checked; unknown/redacted otherwise).
        Interfaces card: every NetworkInterface (name, up, multicast, MTU, addresses, hardware address when exposed – shows 'hidden by Android' on API 30+).
        Public IP card: hidden by default; button 'Reveal public IP' performs ONE request to https://api.ipify.org?format=json (IPv4) and https://api64.ipify.org?format=json (dual stack; classify the returned literal, never presume IPv6) – privacy-explicit; results cached for the session; shows reverse DNS + reserved/CGNAT hint.
        Actions: copy any row; share summary; 'Use in Ping/DNS/LAN' hand-offs where meaningful; auto-refresh on ConnectivityObserver changes.
    core_network:
      models: "NetworkInfoSnapshot(active: ActiveNetworkInfo?, interfaces: List<InterfaceInfo>, publicIp: PublicIpInfo? = null, capturedAt) ; ActiveNetworkInfo(transport, interfaceName, ipv4: List<AddrWithPrefix>, ipv6: List<AddrWithPrefix>, gateways, dnsServers, privateDnsActive, privateDnsHost, mtu?, metered, captive, validated, downKbps?, upKbps?, vpnActive) ; InterfaceInfo(name, isUp, supportsMulticast, mtu, hardwareAddress?, addresses) ; PublicIpInfo(ipv4?, ipv6?, reverseName?)"
      pure_logic: "InterfaceEnumerator (java.net.NetworkInterface -> List<InterfaceInfo>, testable with an injected supplier) ; Ipv6Classifier(addr): GUA/ULA/LINK_LOCAL/LOOPBACK/UNSPECIFIED/MULTICAST/IPV4_MAPPED/TEREDO/6TO4/DOCUMENTATION ; PublicIpClient(HttpEngine or OkHttp) parsing {\"ip\":\"…\"}"
      repository: "interface NetworkInfoRepository { fun observe(): Flow<NetworkInfoSnapshot>; suspend fun fetchPublicIp(): PublicIpInfo }"
    app: "NetworkInfoRepositoryImpl(ConnectivityManager, WifiManager, ConnectivityObserver, InterfaceEnumerator, PublicIpClient) – maps LinkProperties/NetworkCapabilities; VM: NetworkInfoUiState(snapshot, isRefreshing, publicIpState: Idle/Loading/Result/Error); Screen: cards above; copy via ClipboardManager pattern used in DnsScreen."
    tests:
      unit: ["Ipv6ClassifierTest (one per class)", "InterfaceEnumeratorTest (fake supplier)", "PublicIpClientTest (MockWebServer or fake engine)", "NetworkInfoMapperTest (pure LinkProperties-like inputs -> ActiveNetworkInfo)", "NetworkInfoViewModelTest (refresh on observer emission; public IP explicit only)"]
      instrumented: ["NetworkInfoScreenTest: idle/snapshot/no-network/public-ip-hidden-until-tap"]
    privacy: "ipify.org contacted only on explicit tap; document in PRIVACY_POLICY + Settings attributions."
    readme: "Features subsection + table row."

  # ---------------------------------------------------------------------------
  - id: P13-SSDP
    name: "UPnP / SSDP Discovery"
    route: "ssdp"
    package: "ssdp"
    icon: "Icons.Default.Devices (distinct from LAN: use Icons.Default.Sensors)"
    more_section: "Wi-Fi & LAN"
    why: "Pairs with mDNS: routers, TVs, consoles, NAS, media servers announce over SSDP, many without mDNS. Also enables an offline public-IP discovery via the IGD WANIPConnection service."
    behaviour: |
      Sends M-SEARCH (ST: ssdp:all, MX: 2, MAN: \"ssdp:discover\") to 239.255.255.250:1900 (and ff02::c for IPv6) on the local interface (NetworkBinder), listens for unicast responses for a configurable window (default 5 s, re-sends at 0 s and 2 s), also listens to NOTIFY alive multicasts during the window.
      Groups responses by USN root (uuid) into devices; fetches each LOCATION URL (bounded 64 KB, 3 s timeout, same-LAN only – reject LOCATION hosts outside the local subnet) and parses the device description XML (friendlyName, manufacturer, modelName, modelNumber, deviceType, presentationURL, serviceList types).
      Device card: friendly name, manufacturer/model, IP, device type chips (MediaRenderer, InternetGatewayDevice, Basic…), services list (expand), actions: 'Open' presentationURL, 'Ping', 'Copy'.
      IGD extra: when a WANIPConnection/WANPPPConnection service exists, 'Query external IP' button sends the SOAP GetExternalIPAddress action to the control URL and shows the WAN IP (no internet service involved).
    core_network:
      models: "SsdpResponse(headers, fromIp, isNotify) ; UpnpDevice(usn, location, fromIp, st: Set<String>, server?, description: UpnpDescription?) ; UpnpDescription(friendlyName, manufacturer, modelName, modelNumber, deviceType, presentationUrl, services: List<UpnpService(type, controlUrl, scpdUrl)>) ; SsdpUpdate { DeviceFound, DeviceUpdated, Complete }"
      pure_logic: "SsdpMessageBuilder.msearch(st, mx) bytes ; SsdpResponseParser.parse(bytes) -> headers map (case-insensitive, CRLF) ; UpnpDescriptionParser (javax.xml DocumentBuilder, namespace-agnostic) ; IgdSoap.getExternalIpRequest(controlUrl, serviceType) + parseResponse ; SameSubnetGuard(locationHost, localCidr)"
      repository: "interface SsdpRepository { fun discover(params): Flow<SsdpUpdate> ; suspend fun queryExternalIp(device): NetworkResult<String> } ; impl uses UdpExchange-like multicast transport (injectable) + HttpEngine"
    app: "Module, VM (grouping, expansion, external IP state), Screen (LazyColumn of device cards; filter chip by deviceType; stop button; empty state)."
    tests:
      unit: ["SsdpMessageBuilderTest (golden string)", "SsdpResponseParserTest (HTTP/1.1 200 OK responses + NOTIFY, folded headers, missing CRLF tolerance)", "UpnpDescriptionParserTest (fixtures: Fritz!Box, Sonos, Samsung TV, minimal)", "IgdSoapTest (request golden + response parse)", "SameSubnetGuardTest", "SsdpRepositoryImplTest (fake transport: two responses same USN -> one device; description fetch failure keeps device; window timing virtual)", "SsdpViewModelTest"]
      instrumented: ["SsdpScreenTest ≥ 4 cases"]
    privacy: "Local-network-only traffic; LOCATION fetches restricted to the local subnet."
    security_note: "Apply E00-T04: reject DOCTYPE/external entities and fail closed if a securely configured parser is unavailable; retain SSDP header evidence without XML details. Bound bytes, block redirects, validate and pin resolved destinations to the selected local network, and apply identical safeguards to SOAP control URLs. Verify XXE/entity-expansion fixtures on JVM and Android; never catch unsupported hardening options and proceed insecurely."

  # ---------------------------------------------------------------------------
  - id: P13-NTP
    name: "NTP Clock Offset"
    route: "ntp"
    package: "ntp"
    icon: "Icons.Default.Schedule"
    more_section: "Utilities"
    why: "Cheap, pure-Kotlin, genuinely useful (TOTP failures, TLS 'not yet valid' errors, log correlation). No dependency."
    behaviour: |
      SNTP using the RFC 5905 on-wire contract query to a chosen server (pool.ntp.org, time.google.com, time.cloudflare.com, time.apple.com, time.windows.com, custom hostname/IP) with N samples (1-10, default 4, 250 ms apart): shows offset (NTP server clock − device clock; positive means server ahead) as ±ms/s, round-trip delay, stratum, reference id (interpret according to stratum/version/address family, not universally as an IP), root delay/dispersion, leap indicator, server time vs device time, per-sample list and median. Verdict card: 'Clock accurate (|offset| < 100 ms)', 'Clock drift' (warn), 'Clock wrong' (error > 5 s) with a hint to enable automatic time. Multi-server compare mode (all presets in parallel, table).
    core_network:
      models: "NtpSample(offsetMs: Double, delayMs: Double, stratum, referenceId: String, leap: Int, rootDelayMs, rootDispersionMs, serverTimeMs, t1..t4) ; NtpResult(server, samples, medianOffsetMs, minDelayMs, verdict)"
      pure_logic: "SntpPacket.build(transmitTimestampNs) 48 bytes (LI=0, VN=4, Mode=3) ; SntpPacket.parse(bytes, t4) -> sample using RFC 5905 formulas: offset = ((T2-T1)+(T3-T4))/2, delay = (T4-T1)-(T3-T2) ; NtpTimestamp <-> epoch ms (1900 epoch, fraction 2^32) ; ReferenceIdDecoder ; Verdict thresholds"
      repository: "interface NtpRepository { suspend fun query(server, samples, timeoutMs): NetworkResult<NtpResult> } ; impl over UdpExchange (P01) bound via NetworkBinder only if server IP is local (else default network)"
    app: "Module, VM (server preset chips + custom field, samples slider, compare mode), Screen (hero, input card, verdict card with big offset number, samples table, compare table)."
    tests:
      unit: ["SntpPacketTest (golden 48-byte request; parse a captured response fixture → known offset)", "NtpTimestampTest (round-trip; 2036 rollover edge)", "ReferenceIdDecoderTest ('GPS ', 'PPS ', ip form)", "NtpRepositoryImplTest (fake UDP: timeout -> NO_RESPONSE code; N samples -> median)", "NtpViewModelTest"]
      instrumented: ["NtpScreenTest ≥ 4 cases"]
    privacy: "Queries the selected NTP server (document presets)."

