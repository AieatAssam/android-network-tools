new_tool_checklist:   # applies to EVERY tool below (from CLAUDE.md + claude/tool_instructions.md, corrected by P06)
  - "core-network: package net.aieat.netswissknife.core.network.<pkg>: models, <Tool>Repository interface, <Tool>RepositoryImpl (JVM-only, injectable transports), tests FIRST (RED)."
  - "core-domain: <Tool>UseCase + <Tool>Params (+ FlowResult if streaming) with validation returning ErrorInfo codes (P07); tests."
  - "app: di/<Tool>Module.kt (@Provides @Singleton), ui/screens/<pkg>/<Tool>ViewModel.kt (@HiltViewModel, StateFlow<UiState>, RecentHostsRepository if it has a host input), ui/screens/<pkg>/<Tool>Screen.kt (ToolHeroHeader, ToolHelpSheet, ToolStateAnnouncer (P08), NetworkStatusBanner (P05), AnimatedContent states, ElevatedCard results, OutlinedTextField with icon+clear, error card + retry, all strings in strings.xml + values-de)."
  - "Navigation: NavRoutes object + ToolInfo entry (labelRes/shortLabelRes/descriptionRes/icon), AppNavHost composable with transitions, MoreToolsSheet.TOOL_SECTIONS membership, Home grid picks it up from NavRoutes.allTools automatically."
  - "Tests: ViewModel unit tests (app/src/test), instrumented <Tool>ScreenTest with ≥ 4 cases (idle, loading, success, error) using a mocked ViewModel like existing screen tests; Kover includes for pure app logic."
  - "Docs: README Features subsection + Available Tools row 'Implemented'; PRIVACY_POLICY entry if any traffic leaves the LAN; store/play-description.txt tool paragraph (update the '14 tools' count!); claude/tool_instructions.md 'Tools Added So Far' row; help sheet strings help_<tool>_*."
  - "Definition of done per tool: ./gradlew test && :app:assembleDebug && :app:lintDebug 0 errors && koverVerify x3."

