  title: "New tools wave 1 (no new third-party dependencies)"
  priority: low
  status: todo
  estimated_effort: "L (each tool ≈ 1-2 agent sessions)"
  depends_on: [P05, P07]      # NetworkBinder + typed errors; P01's LinkInfoProvider and UdpExchange are reused
