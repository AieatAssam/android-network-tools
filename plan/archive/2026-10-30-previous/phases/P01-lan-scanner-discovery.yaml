context:
  problem: |
    The LAN Scanner (route `lan`) is the most-used discovery tool and three of its advertised
    columns are wrong or empty on modern devices:
      1. MAC address + vendor: the ARP table is read ONCE before probing starts
         (LanScanRepositoryImpl.scan -> parseArpTable(arpTableReader()) at line 77), so any
         entry the probes themselves create is never observed. Worse, the default reader
         opens /proc/net/arp, which Android 10+ (API 29) forbids for apps: it returns an empty
         file. Result: MAC and vendor are null for every host on every device newer than
         Android 9.
      2. Presence detection: DEFAULT_HOST_CHECKER is InetAddress.isReachable() only. Android's
         libcore implementation attempts an ICMP echo (unprivileged IPPROTO_ICMP datagram socket,
         permitted by Android's ping_group_range) and falls back to a TCP connect to port 7
         (verify on-device: `strace`-free check is to compare isReachable() against the
         icmpenguin engine for a known ICMP-only host). Hosts that drop ICMP (Windows with
         default firewall profile, many IoT devices, some Android phones on battery saver) are
         reported absent even though they answer TCP.
      3. Gateway: `gatewayIp = ips.firstOrNull()` (lowest host IP). Any router at .254 or an
         arbitrary address is flagged wrong and the actual gateway is not flagged.
      4. OuiDatabase.kt has 91 prefixes; entry "3C:5A:B4" -> "Google" is filed under "// Apple".
  evidence:
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/LanScanRepositoryImpl.kt", lines: "48-66", note: "DEFAULT_HOST_CHECKER (isReachable), DEFAULT_ARP_READER (/proc/net/arp); quick-port checks are now created inside the operation ResourceScope" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/LanScanRepositoryImpl.kt", lines: "75-83", note: "ARP read before probing; gateway = ips.firstOrNull()" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/LanScanRepositoryImpl.kt", lines: "150-167", note: "buildHost: mac from stale arpMap, rDNS, QUICK_PORTS scan" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/OuiDatabase.kt", note: "91 entries; mislabelled 3C:5A:B4" }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/SubnetUtils.kt", lines: "getCurrentSubnet", note: "NetworkInterface-based subnet detection; no gateway" }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/lan/LanScanViewModel.kt", note: "refreshSubnet() uses SubnetUtils.getCurrentSubnet(); no gateway/DNS from ConnectivityManager" }
    - { file: "README.md", section: "LAN Scanner", note: "advertises MAC address, OUI vendor, gateway flag" }
  current_behaviour: |
    scan(subnet) -> parse CIDR -> read ARP once -> N workers: isReachable(ip) -> if alive:
    mac=arpMap[ip], vendor=OUI(mac), hostname=rDNS, openPorts=QUICK_PORTS TCP connect -> emit.
  desired_behaviour: |
    scan(subnet, gatewayIp?) -> parse CIDR -> N workers per IP:
      presence = ICMP echo (fast path) OR TCP probe on a small port set where a RST
      ("Connection refused") also proves presence, OR NetBIOS/mDNS name reply.
      if present: enrich = { hostname: rDNS -> mDNS reverse PTR -> NetBIOS name (first non-null) ,
                             openPorts: QUICK_PORTS , mac: MacResolver (post-probe, best effort) ,
                             vendor: OUI(mac) , discoveredVia: Set<DiscoveryMethod> ,
                             isGateway: ip == gatewayIp (from platform) }.
    After all workers finish, run one final MacResolver pass for hosts still lacking a MAC
    (the probes have populated the kernel neighbour cache by then), patch them, and emit
    ScanComplete with the enriched list. The UI explains when MAC is unavailable (API 29+).

goals:
  - "Hosts that answer TCP but drop ICMP are discovered."
  - "MAC/vendor populated wherever the platform allows (API < 29); UI states the limitation elsewhere instead of showing blanks."
  - "Gateway flag derived from the real default route."
  - "Every discovered host carries the method(s) that found it (transparency + testability)."
  - "OUI database extended (>= 1 000 prefixes) from the IEEE registry via a generated Kotlin/resource file with a documented refresh script."
  - "No regression in scan time for a /24 with default concurrency (target: <= 1.3x current wall time on the same network)."

non_goals:
  - "IPv6 LAN discovery (NDP) – separate future tool (see plan.yaml P15 candidates)."
  - "Binding sockets to the Wi-Fi network under VPN – P05 (this phase must expose seams P05 can use)."
  - "Port-scan quick action UI polish beyond navigation hand-off (P12)."

assumptions:
  - id: A1
    statement: "Android 10+ apps cannot read /proc/net/arp; no non-root alternative exists for arbitrary hosts."
    verify_with: "On an API 29+ device/emulator: `adb shell run-as net.aieat.netswissknife.debug cat /proc/net/arp` (or add a temporary log of DEFAULT_ARP_READER().length). Expect empty/permission denied."
    if_false: "Keep the ARP path as primary; still move it after probing."
  - id: A2
    statement: "A TCP connect that fails with java.net.ConnectException ('Connection refused', i.e. RST) proves the host is up; a SocketTimeoutException / NoRouteToHost does not."
    verify_with: "Unit test with a local ServerSocket closed port on 127.0.0.1 -> ConnectException; document behaviour."
    if_false: "n/a (TCP semantics)."
  - id: A3
    statement: "icmpenguin's Pinger (me.impa.icmpenguin.ping.Pinger) can be used from :app for ICMP echo with sub-second timeouts; core-network stays JNI-free by depending on an interface."
    verify_with: "javap -cp <aar classes.jar> me.impa.icmpenguin.ping.Pinger (see P04 for the extracted signature). Confirm ProbeResult subtypes with: unzip -l classes.jar | grep ProbeResult; javap -p each."
    if_false: "Fall back to InetAddress.isReachable for the ICMP path (keep as default in core)."
  - id: A4
    statement: "ConnectivityManager.getLinkProperties(activeNetwork).routes contains a RouteInfo with isDefaultRoute() whose gateway is the LAN gateway; LinkAddress with prefixLength gives the subnet."
    verify_with: "Log LinkProperties in LanScanViewModel.refreshSubnet on a device: routes, linkAddresses, dnsServers."
    if_false: "Fallback to SubnetUtils.getCurrentSubnet() and lowest-IP heuristic, but label the flag 'probable gateway'."
  - id: A5
    statement: "NetBIOS NBSTAT (UDP 137, name '*') and mDNS reverse PTR (multicast query for N.N.N.N.in-addr.arpa) are answered by a meaningful share of LAN hosts and are cheap (<= 300 ms)."
    verify_with: "Prototype in a unit-test-free spike against a home LAN; compare hostname coverage vs rDNS only."
    if_false: "Keep the probes behind a `nameProbes` flag defaulting to on; they never gate presence alone unless they answered."

constraints:
  - ":core-network must stay free of Android imports; every platform capability enters through an interface with a JVM default."
  - "Existing public API used by :app must keep compiling: LanScanRepository.scan(subnet, timeoutMs, concurrency) may gain an overload/params object but old call sites must be migrated in the same commit."
  - "LanScanUseCase validation rules unchanged (CIDR /16–/30, timeout 100–10 000, concurrency 1–500)."
  - "Bounded channels/backpressure pattern of the current implementation must be preserved (see comments in scan())."
  - "Coverage floor :core-network 70% – new code needs tests (fakes for every prober)."
  - "UI rules from CLAUDE.md apply to any new composable (cards, animations, strings.xml, colorScheme tokens)."
  - "Memory-constrained Gradle host: one Gradle invocation at a time."

design:
  overview: |
    Introduce a small strategy layer in core-network/lan:

      fun interface IcmpProbe          { suspend fun echo(ip: String, timeoutMs: Int): Long? }          // rtt or null
      fun interface TcpPresenceProbe   { suspend fun probe(ip: String, ports: List<Int>, timeoutMs: Int): TcpPresence } // OPEN(port)/REFUSED/NONE
      fun interface NameProbe          { suspend fun resolveName(ip: String, timeoutMs: Int): String? } // NetBIOS / mDNS / rDNS
      fun interface MacResolver        { suspend fun resolve(ip: String): String? }                     // ARP file default
      enum class DiscoveryMethod { ICMP, TCP_OPEN, TCP_REFUSED, NETBIOS, MDNS, RDNS }

    LanScanRepositoryImpl(
        icmpProbe: IcmpProbe = ReachabilityIcmpProbe(),          // isReachable-based JVM default
        tcpProbe: TcpPresenceProbe = SocketTcpPresenceProbe(),   // java.net.Socket default
        nameProbes: List<NameProbe> = listOf(ReverseDnsNameProbe(), NetBiosNameProbe(), MdnsReverseNameProbe()),
        macResolver: MacResolver = ArpFileMacResolver(),
        portChecker: PortChecker? = null,                         // null selects the operation-scoped repository default
        clock: MonotonicClock = SystemMonotonicClock,
    )

    scan(params: LanScanRequest) where
      data class LanScanRequest(subnet: String, timeoutMs: Int, concurrency: Int, gatewayIp: String? = null,
                                presencePorts: List<Int> = DEFAULT_PRESENCE_PORTS, enableNameProbes: Boolean = true)
    Keep the old 3-arg scan() as a default-forwarding overload for one release, marked @Deprecated.

    Presence algorithm per IP (inside a worker, all with the per-host timeout budget):
      1. rtt = icmpProbe.echo(ip, timeoutMs)            -> if non-null: alive, methods += ICMP
      2. if not alive: tcp = tcpProbe.probe(ip, presencePorts, min(timeoutMs, 400))
           OPEN -> alive, methods += TCP_OPEN ; REFUSED -> alive, methods += TCP_REFUSED
      3. if not alive and enableNameProbes: name = NetBiosNameProbe/MdnsReverseNameProbe (only these two,
           rDNS does not prove presence) -> non-null => alive, methods += NETBIOS/MDNS
      4. if alive: enrich (hostname via nameProbes in order until non-null; open ports; mac; vendor).
    DEFAULT_PRESENCE_PORTS = [80, 443, 22, 445, 139, 135, 8080, 62078, 7000, 5000]  (web, ssh, smb, rpc, alt-web, iOS lockdown, AirPlay, UPnP)

    LanHost gains: discoveredVia: Set<DiscoveryMethod> = emptySet(), macSource: MacSource? (ARP|NONE)
    LanScanSummary gains: macResolutionSupported: Boolean (false when MacResolver reports unsupported).

    :app additions
      - app/.../platform/LinkInfoProvider.kt (@Singleton, ConnectivityManager): data class LinkInfo(cidr, gatewayIp, dnsServers, interfaceName, isWifi, isVpnActive)
      - app/.../lan/IcmpenguinIcmpProbe.kt implementing IcmpProbe via me.impa.icmpenguin.ping.Pinger(count=1, timeout=timeoutMs)
      - LanModule provides LanScanRepositoryImpl(icmpProbe = IcmpenguinIcmpProbe(), macResolver = ArpFileMacResolver()) and LinkInfoProvider.
      - LanScanViewModel: refreshSubnet() uses LinkInfoProvider first, SubnetUtils fallback; passes gatewayIp into LanScanRequest; exposes macResolutionSupported for the UI hint.
      - LanScanScreen: host row shows discovery-method chips (assist chips, labelSmall), MAC row shows "Not available on Android 10+" when summary.macResolutionSupported == false (string resource), gateway badge unchanged.
      - Quick action "Scan ports" on expanded host -> navigate to NavRoutes.Ports with a `host` argument (route "ports?host={host}", optional arg) and PortScanViewModel reads SavedStateHandle["host"] to prefill.

  files_to_create:
    - core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/DiscoveryProbes.kt        # interfaces + enums + DEFAULT_PRESENCE_PORTS
    - core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/ReachabilityIcmpProbe.kt
