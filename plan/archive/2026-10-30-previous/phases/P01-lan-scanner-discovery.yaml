tasks:
  - id: P01-T1
    title: "Extract probe interfaces + ArpFileMacResolver (no behaviour change yet)"
    status: done
    depends_on: []
    tdd:
      red:
        test_file: core-network/src/test/kotlin/net/aieat/netswissknife/core/network/lan/ArpFileMacResolverTest.kt
        tests:
          - "parses /proc/net/arp sample with header and returns uppercase MAC for known ip"
          - "returns null for 00:00:00:00:00:00 (incomplete entry)"
          - "supported is false when reader returns empty string or throws"
          - "resolve returns null for ip not in table"
        run: "./gradlew :core-network:test --tests '*ArpFileMacResolverTest' --no-daemon"
        expect: "compilation failure (class missing) = RED"
      green:
        steps:
          - "Create DiscoveryProbes.kt with IcmpProbe, TcpPresenceProbe (+ sealed TcpPresence { Open(port), Refused, None }), NameProbe, MacResolver (with `val supported: Boolean`), DiscoveryMethod, DEFAULT_PRESENCE_PORTS."
          - "Create ArpFileMacResolver(reader: () -> String = { File(\"/proc/net/arp\").readText() }) moving parseArpTable from LanScanRepositoryImpl; `supported` = reader() non-blank at first call (lazy, cached)."
          - "Keep LanScanRepositoryImpl compiling by delegating arpTableReader -> ArpFileMacResolver internally."
        run: "./gradlew :core-network:test --no-daemon"
        expect: "PASS incl. existing LanScanRepositoryImplTest"
      refactor:
        - "Remove ArpTableReader typealias once no test references it (update LanScanRepositoryImplTest constructor usage)."
    acceptance_criteria:
      - "LanScanRepositoryImplTest still green."
      - "New resolver has >= 4 tests."

  - id: P01-T2
    title: "TCP presence probe with RST-as-alive semantics"
    status: done
    depends_on: [P01-T1]
    tdd:
      red:
        test_file: core-network/src/test/kotlin/net/aieat/netswissknife/core/network/lan/SocketTcpPresenceProbeTest.kt
        tests:
          - "open port on 127.0.0.1 (ServerSocket(0)) returns TcpPresence.Open(port)"
          - "closed port on 127.0.0.1 (bind ServerSocket then close, reuse its port) returns TcpPresence.Refused"
          - "probe stops at first Open (does not try remaining ports) – verify via injected connector lambda call count"
          - "all timeouts -> TcpPresence.None within timeoutMs * ports.size upper bound (use injected connector that throws SocketTimeoutException)"
        run: "./gradlew :core-network:test --tests '*SocketTcpPresenceProbeTest' --no-daemon"
        expect: "RED"
      green:
        steps:
          - "SocketTcpPresenceProbe(connector: (ip, port, timeoutMs) -> TcpConnectOutcome = real Socket connect). Map ConnectException -> Refused, success -> Open, SocketTimeoutException/NoRouteToHostException/other IOException -> None."
          - "Probe ports sequentially with per-port timeout = min(timeoutMs, 400); return early on Open or Refused."
        run: "./gradlew :core-network:test --no-daemon"
        expect: "PASS"
      refactor: ["Keep LAN quick-port checks operation-scoped through the repository's internal checker; do not expose a standalone unscoped socket helper."]
    acceptance_criteria: ["4 tests green; no Android imports."]

  - id: P01-T3
    second_pass_review:
      report: plan/reviews/2026-09-22-second-pass.yaml
      findings: [R2-003, R2-004]
      rule: "Treat each linked finding as a required independently verified acceptance case; urgent regression slices do not wait for optional task breadth."
    title: "NetBIOS NBSTAT and mDNS reverse-PTR name probes (pure Kotlin, injectable transport)"
    status: done
    depends_on: [P01-T1]
    tdd:
      red:
        test_file: core-network/src/test/kotlin/net/aieat/netswissknife/core/network/lan/NetBiosNameProbeTest.kt
        tests:
          - "buildNbstatQuery encodes name '*' as 32-byte first-level encoding 'CKAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' with QTYPE 0x0021, QCLASS 0x0001 (golden byte array)"
          - "parseNbstatResponse extracts first unique workstation name (suffix 0x00, flags group bit clear) trimmed of padding"
          - "parseNbstatResponse returns null on truncated packet"
          - "resolveName returns null when transport times out"
        also_test_file: core-network/src/test/kotlin/net/aieat/netswissknife/core/network/lan/MdnsReverseNameProbeTest.kt
        also_tests:
          - "builds PTR query for 4.3.2.1.in-addr.arpa. with QU (unicast-response) bit set"
          - "parses PTR answer 'myhost.local.' -> 'myhost.local'"
          - "ignores answers for other owner names"
        run: "./gradlew :core-network:test --tests '*NameProbeTest' --no-daemon"
        expect: "RED"
      green:
        steps:
          - "NetBiosNameProbe(transport: UdpExchange = DatagramSocket-based default): UdpExchange is `fun interface UdpExchange { fun exchange(ip: String, port: Int, payload: ByteArray, timeoutMs: Int): ByteArray? }` so tests inject bytes."
          - "MdnsReverseNameProbe(transport: UdpExchange): sends to 224.0.0.251:5353 the PTR question built with dnsjava (Message.newQuery + set QU bit by OR-ing 0x8000 into the class field: Record.newRecord(name, Type.PTR, DClass.IN or 0x8000) – verify dnsjava does not reject class values > 0xFFFF/validate DClass; if it does, patch the two class bytes in the wire output instead). Reads one datagram; parses with Message(bytes). P05-T4 later adds the same `unicastResponse` option to MdnsPacketParser.buildMdnsQuery – reuse it here once available instead of duplicating."
          - "ReverseDnsNameProbe: InetAddress.getByName(ip).canonicalHostName != ip."
        run: "./gradlew :core-network:test --no-daemon"
        expect: "PASS"
      refactor: ["UdpExchange default impl lives in one file (UdpExchange.kt) and is reused by P13 SSDP/NTP tools."]
    acceptance_criteria: ["Golden-byte tests for both encoders; parser tests for both decoders."]

