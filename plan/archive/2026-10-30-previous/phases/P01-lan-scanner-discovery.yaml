          - "summary.macResolutionSupported mirrors MacResolver.supported"
          - "hostname precedence: rDNS result wins over NetBIOS when both non-null (order of nameProbes list)"
          - "enableNameProbes=false skips NetBIOS/mDNS even when host not alive (probe call count == 0)"
          - "events remain ordered: N progress/host events then exactly one ScanComplete; scannedCount reaches totalCount"
        run: "./gradlew :core-network:test --tests '*LanScanRepositoryImplTest' --no-daemon"
        expect: "RED (constructor/API mismatch)"
      green:
