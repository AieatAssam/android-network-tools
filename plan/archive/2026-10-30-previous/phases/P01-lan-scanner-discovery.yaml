risks:
  - risk: "Name probes add up to ~600 ms per silent IP; /16 scans get slower."
    mitigation: "Only run name probes for IPs that failed ICMP+TCP; cap per-IP budget; keep concurrency default 50; add `enableNameProbes` toggle in advanced options (default on for /24 and smaller, off for larger than /22)."
  - risk: "IEEE TSV increases APK by ~1 MB."
    mitigation: "Ship gzip (resources are stored compressed in APK already); or prune to organisations with >= 2 assignments; document decision."
  - risk: "icmpenguin Pinger API differs from javap assumption."
    mitigation: "T6 starts by dumping the class signatures; fall back to ReachabilityIcmpProbe if needed."
  - risk: "Sending NetBIOS/mDNS packets may trigger Android 16 Local Network Protections prompt."
    mitigation: "rememberLocalNetworkPermissionRequester() already exists; call it on LAN screen entry (verify it is called)."

rollback: |
  All new behaviour sits behind constructor parameters with JVM defaults; reverting LanModule to
  `LanScanRepositoryImpl()` restores the old pipeline minus the ARP-ordering fix. The old 3-arg
  scan() stays as a deprecated overload for one release.

definition_of_done:
  - "All tasks done; findings F004, F005, F006, F040 marked resolved in plan/plan.yaml changelog."
  - "Global DoD from plan.yaml satisfied."
