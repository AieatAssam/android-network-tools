tasks:
  - id: E03-T01
    title: "Introduce one bounded operation, deadline, and resource-scope contract"
    priority: high
    status: in_progress
    source_evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/lan/LanScanViewModel.kt", lines: "162-231", why: "Per-tool Job and mutable collection have no common deadline or close hook." }
      - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/portscan/PortScanRepositoryImpl.kt", lines: "104-151", why: "Worker channels are bounded, but blocking checker calls are not governed by an operation budget." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/mdns/MdnsRepositoryImpl.kt", lines: "50-60,203-213", why: "A blocking multicast receive is only time-bounded by socket timeout and swallows non-timeout I/O." }
      - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/whois/WhoisRepositoryImpl.kt", lines: "171-207", why: "Closing the socket is finally-based but a coroutine cancellation cannot interrupt DNS resolution before the socket exists." }
    proposed_behavior: |
      Add pure `OperationBudget` and `ResourceScope` APIs. A budget carries an
      opaque run id, requirement, monotonic deadline, max concurrency, max
      response/export bytes, and cancellation reason. A scope registers every
      Closeable/AutoCloseable, socket, stream, multicast lock, and temp file;
      closing the scope is idempotent and closes resources in reverse order.
      Repository flows create the scope once, pass the same budget to child
      probes, call `ensureActive` before/after every blocking boundary, and emit
      one terminal outcome only after the scope has closed. Existing callers get
      a safe default budget while new code can inject a deterministic clock.
    depends_on: [P05-T1, P05-T2]
    implementation_steps:
      - "Write RED tests with FakeClock and ScriptedSocket: deadline expiry cancels all children, close is idempotent, resources close in reverse registration order, and a cancelled collector receives no later success event."
      - "Implement `OperationModels`, `OperationBudget`, and `ResourceScope` in core-network without Android imports; map `CancellationException`, deadline, user Stop, lifecycle pause, permission, and network loss to typed reasons."
      - "Add adapters to LanScan, port scan, ping, traceroute, DNS, HTTP, TLS, WHOIS, speed test, topology, mDNS, WOL, and Wi-Fi repository seams. Keep P05 NetworkBinder binding inside the scope so a route-bound socket is closed with the operation."
      - "Replace `Channel.UNLIMITED` in continuous ping and make child jobs siblings of the scope owner; use bounded channels/backpressure and `ensureActive` in all worker loops."
      - "Keep cancellation finalization outside the cancelled collector: record the reason, close/join the resource scope in `finally`, then publish the stopped/paused terminal state from the owning coordinator without catching and re-emitting `CancellationException` into the cancelled flow."
      - "Add a static CI check that fails when production network code introduces `GlobalScope`, `Channel.UNLIMITED`, or a new raw `Socket`/`HttpURLConnection` without a scope seam and test reference."
    files_or_seams:
      - "core-network/.../operation/{OperationModels,OperationBudget,ResourceScope}.kt"
      - "core-network/.../testkit/{FakeClock,ScriptedSocket,NetworkFault}.kt"
      - "core-network/.../{lan,portscan,ping,dns,httprobe,tls,whois,speedtest,topology}/**"
      - "app/.../mdns/MdnsRepositoryImpl.kt, app/.../ping/PingViewModel.kt, app/.../ui/screens/*/*ViewModel.kt"
      - "core-network/src/test/** and app/src/test/** operation cancellation fixtures"
    acceptance_criteria:
      - "Every networked tool listed in the coverage matrix accepts or receives an OperationBudget; no production coroutine launches an unowned child network job."
      - "A fake operation with three sockets, one blocking read, and two workers closes every resource and reaches a typed terminal cancellation outcome exactly once when cancelled; the cancelled collector receives no terminal success/error emission."
      - "A deadline of 100 ms is observed by all fake probes without advancing past the injected clock; no test waits on wall-clock sleep."
      - "The bounded queue and live progress path contain no `Channel.UNLIMITED`; queue capacities and max workers are asserted at the boundary."
      - "Cleanup target of <=500 ms is recorded as a future device/CI target; the implementation report records the measured distribution separately rather than claiming it is already met."
    validation:
      red: "./gradlew :core-network:test --tests '*Operation*Test' --no-daemon"
      green: "./gradlew :core-network:test :core-domain:test :app:testDebugUnitTest --no-daemon --no-parallel"
      static: "rg -n 'GlobalScope|Channel\\.UNLIMITED' app/src/main core-network/src/main core-domain/src/main must return zero production hits after migration"
      manual: "On a device, start and stop one LAN scan, mDNS scan, port scan, and continuous ping; inspect session metadata and confirm no socket/read continues after Stop."
    effort: "L (3-5 agent sessions)"
    risk_rollout: "Introduce compatibility adapters that register and close the actual existing resources immediately; a no-op scope is allowed only for a caller with no owned resource and cannot satisfy cancellation coverage by itself. Land one tool family per commit; a missing close hook must fail the test rather than silently fall back to an unbounded thread."
    current_progress:
      date: "2026-09-24"
      implemented: "Caller-owned sessions now propagate through LAN Scan, Port Scan, and WHOIS. LAN records lifecycle cancellation before viewModelScope teardown; Port Scan enforces the session worker cap and ignores stale emissions; WHOIS applies caller-owned response bytes and deadline across referrals. OperationRunner now has a USER_STOP regression combining three registered sockets, two blocked workers, first-reason preservation, exactly-once closes, and suppression of terminal success."
      validation: "OperationRunnerTest passed 14/14, including the new multi-socket/two-worker USER_STOP case. Focused Ping and Traceroute ViewModel suites passed 50/50 and 17/17; app Android-test Kotlin compilation passed. The raw-resource ledger reports 14 sites (14 scope-registered/reviewed, 0 legacy follow-ups, 0 open reviews). QA/adversarial review cleared the new operation regression; the full app suite, device behavior, adapter-wide queue/worker assertions, and cleanup-time measurement remain open."
      remaining: "Keep E03-T01 in_progress for phase-wide operation/resource coverage, adapter-boundary queue/worker assertions, device behavior, and the <=500 ms cleanup measurement. The full app suite is not claimed green."

  - id: E03-T02
    title: "Make availability target-aware and make lifecycle/background behavior explicit"
    priority: high
    status: todo
    source_evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/platform/LinkInfoProvider.kt", lines: "22-23,65-74", why: "The only reusable status predicate requires NET_CAPABILITY_VALIDATED, which describes Internet validation rather than LAN reachability." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/ping/PingViewModel.kt", lines: "183-191,249-258", why: "Both ping modes reject a local target when the active network has no validated Internet." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/traceroute/TracerouteViewModel.kt", lines: "135-145", why: "Traceroute performs the same global validation gate before it captures a target-specific operation." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/wifi/WifiScanViewModel.kt", lines: "270-328", why: "Auto-refresh is a loop owned by the ViewModel, not by screen visibility, and can continue consuming battery while the screen is hidden." }
    proposed_behavior: |
      Add `OperationRequirement.LOCAL_NETWORK`, `INTERNET`, and `ANY_NETWORK`
      plus target-aware `OperationAvailability`. Requirement is derived from the
      actual destination/route, not the tool name: HTTP/TLS can target a private
      LAN address, and DNS may use a local resolver even when the queried name is
      public. A missing route, denied local-network permission, or explicit policy
      is definitive; lack of NET_CAPABILITY_VALIDATED is advisory because captive
      portals and firewalls can make validation fail while the requested target
      works. Permit a bounded user-requested attempt in that advisory state and
      report its actual result. Attach a lifecycle coordinator: auto-refresh
      pauses outside RESUMED, interactive runs cancel/pause on STOPPED, and only
      an explicit user action may promote a continuous run to a foreground
      service with a persistent notification.
    depends_on: [P05-T3, P05-T5, E03-T01]
    implementation_steps:
      - "Write RED pure tests for local-only, Internet-only, VPN-only, captive-portal/unvalidated, cellular, Wi-Fi, and no-network snapshots; classify literal IP/private CIDR targets before DNS resolution and model DNS resolver destination separately from the queried name."
      - "Implement `OperationAvailability` over P05 ConnectivityObserver snapshots; preserve separate `hasInternet`, `hasLocalNetwork`, `routePresent`, and `permissionAllowed` signals. Missing route/permission is definitive; unvalidated is an advisory reason that permits one bounded user-requested attempt."
      - "Replace Ping/Traceroute and any equivalent global gates with requirement-aware checks; verify each operation supplies its actual destination requirement, including LAN HTTP/TLS and local DNS resolver cases."
      - "Use repeatOnLifecycle/ProcessLifecycleOwner through `OperationLifecycleCoordinator` to pause Wi-Fi refresh and cancel in-flight interactive work. Persist only an explicit foreground-session intent; do not silently start a service."
      - "Add a foreground service seam only if product behavior requires background continuous ping: notification text, stop action, network binder, typed lifecycle state, and Android 14+ service-start permission checks must be covered before enabling it."
    files_or_seams:
      - "app/.../platform/{OperationAvailability,OperationLifecycleCoordinator,LinkInfoProvider}.kt"
      - "app/.../ui/screens/{ping/PingViewModel,traceroute/TracerouteViewModel,wifi/WifiScanViewModel}.kt"
      - "app/.../ui/screens/{lan,mdns,wol,topology,portscan}/*ViewModel.kt"
      - "app/src/test/.../platform/OperationAvailabilityTest.kt and lifecycle tests"
      - "app/src/main/AndroidManifest.xml only if the explicit foreground service seam is enabled"
    acceptance_criteria:
      - "With `hasInternet=false` and an active Wi-Fi/Ethernet local route, a ping to 192.168.1.1, LAN scan, and HTTP/TLS probe to 192.168.1.1 are allowed; a public speed/WHOIS attempt is bounded and reports its actual result or advisory-unvalidated state."
      - "With a full-tunnel VPN and no route that can reach the requested private destination, local tools show the existing P05 route/permission guidance; a VPN route that can reach that destination remains eligible even without Internet validation."
      - "When lifecycle enters STOPPED, no new refresh/probe starts; an in-flight interactive operation reaches Paused/Cancelled and closes its scope. Resume requires an explicit, bounded restart or resumes only the documented session type."
      - "Wi-Fi auto-refresh cannot run faster than the shared 15,000 ms lower bound; tests prove the loop is cancelled on STOPPED and on ViewModel clear."
      - "Foreground continuation is opt-in and visible; no background service is started by navigation, process restart, or an ordinary scan button."
    validation:
      red: "./gradlew :app:testDebugUnitTest --tests '*OperationAvailability*' --tests '*PingViewModelTest' --tests '*WifiScanViewModelTest' --no-daemon"
      green: "./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --no-parallel"
      manual: "Use an emulator/device with Wi-Fi connected behind a captive portal or with Internet validation disabled; run local ping/LAN scan and public speed/WHOIS, then background and resume Wi-Fi auto-refresh."
    effort: "L (3-4 agent sessions)"
    risk_rollout: "Ship target classification and tests before changing gates. Keep a debug-only lifecycle event trace for rollout; fail closed only when route/permission/policy is definitively unavailable, while treating incomplete validation callbacks as advisory and recording the bounded probe result."

  - id: E03-T03
    second_pass_review:
      report: plan/reviews/2026-09-22-second-pass.yaml
      findings: [R2-009]
      rule: "Treat each linked finding as a required independently verified acceptance case; urgent regression slices do not wait for optional task breadth."
    title: "Attach session metadata and network-route provenance to every operation"
    priority: high
    status: todo
    source_evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/lan/LanScanViewModel.kt", lines: "164-172,239-246", why: "LAN has a start timestamp but only a partial summary; target, route, and stop reason are not retained as a shared session." }
