    proposed_behavior: |
      Make address/port work producers lazy and bounded, preserving counts and
      deterministic order without materializing every candidate. Introduce a
      capped ring buffer for live rows (2,000 default) and aggregate counts;
      retained terminal results may use a compact sorted store or streamed export
      rather than copying O(N) on each event. Convert large Compose result lists
      to keyed lazy containers. Build one reusable UTF-8 export writer that writes
      incrementally to a temp file, enforces a 5 MiB default cap, and
      flushes/closes before exposure. Unsuccessful staging output is removed.
      Format policy is explicit: CSV/text may stop at a
      record boundary and append a valid truncation footer; JSON/settings backup
      either writes a complete document or fails atomically without exposing a
      partial file. A user-requested Stop drains/finalizes an intended partial
      ping/session run with cancellation metadata; abrupt failure deletes its
      temporary artifact. Successfully shared files remain available through a
      bounded receiver-access window before expiry cleanup; a share intent is not
      proof that the receiving app finished reading. Debug-log sharing becomes bounded/paginated.
      This task owns the shared app-layer file/SAF transport adapter, including URI
      writes, cancellation and failure cleanup. E01-T12 owns report UX/schema;
      P12-T5 owns settings schema/import. Neither consumer creates another adapter.
    depends_on: [E03-T01]
    implementation_steps:
