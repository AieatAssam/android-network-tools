      - "Replace `SubnetUtils.parseSubnet`/port range materialization at worker boundaries with lazy range iterators or a value-type address cursor; preserve validation max and network/broadcast semantics."
      - "Add `CappedResultBuffer`/`ProgressCoalescer` with deterministic drop policy and an explicit `droppedCount`/`truncated` field; emit progress no faster than 100 ms unless terminal."
      - "Update LAN/port/mDNS/topology/ping/speed/traceroute ViewModels and screens to use stable keys and LazyColumn/LazyVerticalGrid; do not silently drop terminal export data."
      - "Route ping CSV, all share reports, debug logs, and settings export through the atomic capped writer; only expose a finished file after writer join/flush. Apply format policies so JSON/settings never receive a footer or arbitrary byte cut, while a user Stop finalizes a valid partial CSV/text report."
    files_or_seams:
