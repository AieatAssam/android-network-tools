  - id: E03-T10
    title: "Make release builds reproducible and dependency resolution auditable"
    priority: high
    status: todo
    source_evidence:
      - { file: "app/build.gradle.kts", lines: "9-19,41-47,72-101", why: "Version/signing values are injected at build time and release is minified/shrunk; the output identity and reproducibility inputs are not recorded in an attested manifest." }
      - { file: ".github/workflows/release.yml", lines: "40-115", why: "Daily version allocation, dependency/build steps, and release artifacts are assembled in CI without a same-commit reproducibility comparison." }
      - { file: "settings.gradle.kts", lines: "1-31", why: "Repositories are centralized, but dependency verification/lock state is not visible in the current settings contract." }
      - { file: "gradle/libs.versions.toml", lines: "1-80", why: "Versions are catalog-pinned, while resolved transitive checksums and toolchain provenance are not checked into the plan's quality path." }
    proposed_behavior: |
      Pin and record the complete build input set: Gradle wrapper, JDK 21,
      Android SDK/build tools, Kotlin/AGP/KSP/catalog versions, repository
      policy, dependency locks/checksums, locale/timezone, and source commit.
      Make unsigned release APK/AAB packaging deterministic where Android tooling
      permits it, emit a non-secret build provenance JSON, and compare two clean
      builds from the same commit after normalizing known signing/zip metadata.
      Any non-deterministic path must be named, measured, and excluded narrowly;
      a changed dependency checksum or unpinned repository must fail CI.
    depends_on: [P09-T4, P09-T5, E03-T08]
    implementation_steps:
      - "Run two clean unsigned release builds from the same checkout with fixed `SOURCE_DATE_EPOCH`, `TZ=UTC`, `LC_ALL=C`, JDK/SDK versions, and no parallel workers; record raw APK/AAB hashes first, then perform a documented canonical comparison that removes only known generated metadata."
      - "Enable Gradle dependency verification/locking for app, core-domain, core-network, plugins, and buildscript classpaths; review generated metadata for accidental local/file repositories and exercise strict verification during a real resolution/build."
      - "Add `build-provenance.json` to CI artifacts with commit, versions, variant, dependency graph hash, and toolchain paths; exclude secrets, keystore material, and absolute user paths."
      - "Add reproducibility CI on a scheduled/labelled job, with a PR smoke that verifies provenance and dependency verification. Keep P09 release smoke as the functional R8/signing check."
      - "Document intentional unstable entries (timestamps, signing, native pre-stripped metadata) and compare normalized outputs so the gate cannot hide a real dex/resource change."
    files_or_seams:
      - "gradle/verification-metadata.xml, gradle/dependency-locks/**, settings.gradle.kts"
      - "gradle/libs.versions.toml, build.gradle.kts, app/build.gradle.kts"
      - ".github/workflows/ci.yml and release.yml"
      - "tools/reproducibility/{build_provenance.sh,compare_artifacts.sh} (or equivalent Gradle task)"
      - "README.md and CLAUDE.md build/release sections"
    acceptance_criteria:
      - "A same-commit pair of clean unsigned release builds records raw hashes and yields identical canonical artifact hashes; any raw or canonical differing entry is listed with a documented reason and test, and canonicalization cannot hide a dex/resource/native binary difference."
      - "A changed dependency checksum, repository, wrapper/toolchain version, or unresolved dynamic version fails strict dependency verification before release artifacts are published; a tampered checksum fixture fails the job."
      - "Every release artifact has provenance containing commit and toolchain/dependency graph hashes but no signing secret, keystore bytes, absolute home path, or raw diagnostic payload."
      - "The reproducibility check is independent of P09's release smoke and does not claim functional R8/SNMP retention from byte equality alone."
    validation:
      red: "./gradlew :app:assembleRelease --offline --no-daemon --no-parallel (repeat in a clean output directory and compare before adding the gate)"
      green: "Run the reproducibility compare script plus `./gradlew --dependency-verification strict :app:assembleRelease --offline --no-daemon --no-parallel`; verify the tampered-checksum fixture fails before restoring the trusted metadata."
      manual: "Download two CI artifact pairs from the same commit, run the documented normalization/compare command, and inspect provenance for secrets/path leaks."
    effort: "L (2-4 agent sessions)"
    risk_rollout: "Start in report-only mode and enumerate tool-generated nondeterminism. Fail closed on new or unexplained differences; keep signing semantics unchanged and never commit generated secret material."

  - id: E03-T11
    title: "Harden DataStore/file migration and backup invariants"
    priority: high
    status: todo
    source_evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/data/AppPreferencesDataStore.kt", lines: "13-62", why: "One app_prefs file contains settings, pins, defaults, recent hosts, and subnet history with no schema version." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/di/DataStoreModule.kt", lines: "14-21", why: "A single unqualified DataStore is injected throughout the app, so future split/migration errors can affect every consumer." }
      - { file: "plan/phases/P12-lan-utilities-and-settings-depth.yaml", lines: "142-166", why: "P12 already plans split DataStore, settings export/import, and backup rules; E03 must add crash/upgrade verification without duplicating the feature design." }
      - { file: "app/src/main/res/xml/backup_rules.xml", lines: "3-13", why: "The whole DataStore is excluded, which protects recents but also drops non-sensitive settings on restore." }
      - { file: "app/src/main/res/xml/data_extraction_rules.xml", lines: "7-17", why: "API 31+ cloud/device-transfer rules mirror the broad exclusion and need selective retention tests after the P12 split." }
    proposed_behavior: |
      Extend P12's store split with explicit schema/version migration through
      DataStore's migration/serialization seams, a completion marker, idempotence,
      crash/partial-write recovery, downgrade and unknown-key tolerance, and
      backup/restore assertions. Settings (theme,
      pins, safe defaults) may be backed up; recent hosts, subnets, diagnostics,
      cached network responses, session files, and logs remain excluded. Export
      and import share a versioned schema with range validation and no implicit
      secrets. A migration failure preserves the old source and surfaces a typed
      recoverable error; it never silently resets user settings.
    depends_on: [P12-T4, P12-T5, E03-T05, E03-T06]
    implementation_steps:
      - "Add RED migration tests for first install, old single-store upgrade, already-migrated rerun, unknown keys, corrupt bytes, interrupted DataMigration, read-only destination, downgrade, and duplicate recents."
      - "Implement coordinated DataMigration/serialization for the P12 split with per-store durable writes and a completion marker; retain the old source until every new store is verified durable, then mark complete. Do not hand-edit/rename an active DataStore file or assume multiple files commit atomically on Android."
      - "Update legacy and API 31+ backup rules after the split; add an allowlist test that enumerates settings keys and an explicit denylist test for recents/logs/cache/session files. Run-history entries, saved reports, and the versioned consent record belong under noBackupFilesDir and must stay outside app_settings/app_recents; verify this with backup/restore smoke tests. If a future path moves into a backed-up domain, add explicit legacy and API 31+ exclusions before enabling writes."
      - "Add emulator backup/restore smoke using `bmgr` with a disposable debug package; verify theme/pins survive and recents/network artifacts do not. Do not use deprecated `adb backup`."
      - "Version settings export/import separately from backup; reject malformed JSON and out-of-range values with typed errors, preserve unknown future keys, and record migration/export version in provenance only."
    files_or_seams:
      - "app/.../data/{AppPreferencesDataStore,RecentHostsRepository,SettingsMigration,SettingsExporter}.kt"
      - "app/.../di/DataStoreModule.kt and all qualified store consumers"
      - "app/src/main/res/xml/{backup_rules,data_extraction_rules}.xml"
      - "app/src/test/.../data/{PreferencesMigrationTest,BackupRuleTest,SettingsExporterTest}.kt"
      - "app/src/androidTest/.../data/BackupRestoreSmokeTest.kt"
    acceptance_criteria:
      - "Migration is idempotent and crash-safe per store: every injected failure leaves valid old data and/or valid independently committed new stores with no completion marker; incomplete new stores are ignored and a rerun converges without duplicate recents. The implementation does not claim impossible all-files atomicity."
      - "Backup allowlist retains only documented non-sensitive settings; tests prove recent hosts/subnets, logs, cached responses, session exports, run-history records, saved reports, history consent, and credentials are absent from cloud/device-transfer results. Run history/consent remain in noBackupFilesDir and cannot restore an opt-in."
      - "An emulator `bmgr` upgrade/restore preserves theme/pins/defaults and drops recents/network artifacts; the command/output is recorded in the implementation report."
      - "Export/import round-trip preserves supported settings, rejects malformed/range-invalid data, ignores unknown fields, and reports schema version without embedding secrets or raw network history."
    validation:
      red: "./gradlew :app:testDebugUnitTest --tests '*Migration*Test' --tests '*Backup*Test' --tests '*SettingsExporterTest' --no-daemon"
      green: "./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --no-parallel"
      manual: "Run documented `bmgr enable/backupnow/restore` smoke on an API 31+ emulator with a baseline build and upgraded build; inspect restored settings and excluded files."
    effort: "L (3-5 agent sessions; after P12 implementation)"
    risk_rollout: "Do not alter P12's settings UX while adding migration safety. Keep old store until verified and retain a debug-only migration status/reset diagnostic; never delete user data as a migration shortcut."

