      - "Generate checked-in API dumps from the current public surface after excluding Android/generated/test classes; add a deliberately failing fixture change to prove the gate."
      - "Wire `apiCheck` into CI beside, but independently from, P09 Kover/style gates; require an API baseline update to include a rationale and migration note."
      - "Add schema-version tests for OperationMetadata/result/export JSON so source API compatibility does not mask persisted/share format breakage."
    files_or_seams:
