      - "core-network/.../operation/CappedResultBuffer.kt and tests"
      - "app/.../ui/screens/{lan,portscan,mdns,topology,ping,speedtest,traceroute}/*ViewModel.kt"
      - "app/.../ui/screens/{LanScanScreen,PortsScreen,MdnsDiscoveryScreen,TopologyDiscoveryScreen,PingScreen}.kt"
      - "app/.../util/{BoundedExportWriter,AppLogger,ShareUtils}.kt"
    acceptance_criteria:
      - "Generating a /16 or a 10,000-port custom plan retains O(1) candidate state per worker; a stress test asserts peak retained candidate collection is <= worker count + queue capacity rather than 65,534/10,000."
      - "Each live UI state retains at most 2,000 rows by default, reports dropped/truncated counts, and updates aggregate scanned/found/open counters exactly."
      - "A >5 MiB CSV/text export stops at a record boundary with a valid header and explicit truncation footer; JSON/settings exports fail atomically when the cap would make them invalid; no half-written file is exposed."
      - "Stopping a continuous ping drains/finalizes the intended partial CSV and marks it stopped; abrupt coroutine failure deletes its temporary file."
      - "Ping/Speed/Topology/mDNS progress updates are coalesced to at most 10 emissions per second in a stress fixture, while terminal completion remains immediate."
      - "The UI uses stable item keys and lazy containers for every large result list covered by the matrix; Compose tests render first/last visible rows without composing the entire list."
    validation:
      red: "./gradlew :core-network:test :core-domain:test :app:testDebugUnitTest --tests '*SubnetUtilsTest' --tests '*PortScanUseCaseTest' --tests '*Bounded*' --no-daemon"
      green: "./gradlew :core-network:test :core-domain:test :app:testDebugUnitTest --no-daemon --no-parallel"
      benchmark: "Run E03 benchmark module and record allocation/latency baseline for 1k, 10k, and 65k candidates before setting release thresholds."
      manual: "Run a /16 LAN scan and 10,000-port custom scan on a low-memory device; scroll results, stop, and share the export; verify UI responsiveness and truncation disclosure."
    effort: "XL (4-6 agent sessions)"
