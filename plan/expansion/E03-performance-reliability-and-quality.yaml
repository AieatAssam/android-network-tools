      manual: "Review one planned OperationMetadata API change from the dump diff through app compile, report schema test, and README migration note."
    effort: "M (1-2 agent sessions)"
    risk_rollout: "Start with core modules only and keep app-internal Compose code out of the dump. If the chosen validator cannot parse Kotlin 2.4/Java 21, stop at a documented pinned tool rather than weakening the gate."

