# =============================================================================
# E03 – Performance, reliability, lifecycle, and engineering quality expansion
# =============================================================================
# Audience: coding agents. This file is planning only; it deliberately does not
# change production code, build files, or the master index.
# Scope: cross-cutting work that remains after the feature phases. P05 owns the
# first NetworkBinder implementation, P09 owns baseline CI/Kover/format gates,
# P12 owns the first DataStore split/export flow, and this expansion supplies the
# contracts, failure tests, and release evidence those phases need to be safe at
# scale.

phase:
  id: E03
  title: "Performance, reliability, lifecycle safety, and reproducible quality"
  priority: high
  status: in_progress
  estimated_effort: "XL (8-12 agent sessions; execute as small PR-sized task series)"
  depends_on: []
  related_phases: [P05, P09, P12, P01, P03, P04, P07, P10, P11]
  enables: [P10, P11, P13, P14, P15]
  findings: [F012, F013, F020, F021, F023, F038]
  target_modules: [":core-network", ":core-domain", ":app", ":benchmarks", "CI/release"]

intent:
  problem: |
    The app has good pure-network coverage, but each tool still owns its own job,
    timeout, collection, and export decisions. Several collectors can retain an
    entire scan in mutable lists, a UI can publish a partial result while child
    writers are still draining, and blocking Java sockets/DNS calls are only
    indirectly cancellable. The Android availability check currently means
    "validated Internet" even for operations that only need the local LAN. The
    result models also omit a consistent operation id, selected route, target
    normalization, and cancellation reason, making timing and support reports
    difficult to compare. Logging is debug-only but still records raw hosts,
    addresses, subnets, and exception text. Existing P09 gates do not prove
    deterministic network failure behavior, ABI stability, benchmark budgets,
    or bit-for-bit release reproducibility.
  evidence:
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/lan/LanScanViewModel.kt", lines: "162-231", detail: "Every scan creates a mutable host list, copies it on every emission, and owns a per-screen Job; cancellation has no shared deadline/resource contract." }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/portscan/PortScanViewModel.kt", lines: "139-180", detail: "Port results are accumulated and copied for each progress event; stop constructs a summary with resolvedIp=null and scanDurationMs=0." }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/speedtest/SpeedTestViewModel.kt", lines: "46-108", detail: "Latency/download/upload samples remain in unbounded mutable lists for the whole operation and a cancelled run has no structured reason or route metadata." }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/ping/PingViewModel.kt", lines: "206-336", detail: "Continuous ping uses an UNLIMITED channel and exposes its temp file before an asynchronous writer is proven drained; rolling packets and export state are separate." }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/mdns/MdnsRepositoryImpl.kt", lines: "42-213", detail: "mDNS allocates a 64 KiB receive buffer per receive, blocks in MulticastSocket.receive, catches all I/O as empty results, and has no injected clock/socket close seam." }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/SubnetUtils.kt", lines: "81-100", detail: "Subnet expansion materializes every host address as a List; /16 therefore retains up to 65,534 strings before probing." }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/LanScanRepositoryImpl.kt", lines: "83-157", detail: "LAN scans materialize all addresses, retain all live hosts, and only expose completion after enrichment; cancellation/resource closure is implicit in coroutine scope." }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/portscan/PortScanRepositoryImpl.kt", lines: "82-165", detail: "Port scanning keeps a result list, uses a bounded channel but has no operation deadline, and performs blocking Socket.connect/read work without an injected socket close hook." }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/whois/WhoisRepositoryImpl.kt", lines: "25-35,193-216", detail: "RNET006 now bounds blocking DNS/socket work to two workers and a finite queue, closes active sockets on cancellation, and caps total duration/response bytes. A platform resolver that ignores interruption may occupy one bounded worker until OS DNS returns." }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/traceroute/GeoIpRepositoryImpl.kt", lines: "23-55", detail: "GeoIP has an unbounded ConcurrentHashMap and fixed 5-second connect/read timeouts with no TTL, negative cache, in-flight deduplication, or cancellation-aware close." }
    - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/dns/DnsRepositoryImpl.kt", lines: "82-121", detail: "DNS has a per-resolver timeout but no overall deadline, cache policy, query id, or route/session metadata." }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/platform/LinkInfoProvider.kt", lines: "22-74", detail: "hasValidatedNetwork only recognizes NET_CAPABILITY_VALIDATED, which rejects useful local-only scans when Internet validation is absent." }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/ping/PingViewModel.kt", lines: "183-191,249-258", detail: "Both normal and continuous ping refuse to start when Internet validation is false, even when the target is a local address." }
    - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/util/AppLogger.kt", lines: "44-53,61-70,87-113", detail: "Logger persists full messages and stack traces, reads both log files into one String, and callers pass raw IPs/subnets/hosts." }
    - { file: "app/src/main/res/xml/backup_rules.xml", lines: "3-13", detail: "The whole app_prefs DataStore is excluded from backup, so settings and recent activity cannot yet be separated by sensitivity." }
    - { file: "gradle.properties", lines: "1-13", detail: "Build is intentionally serialized and memory capped; quality work must preserve these constraints and record measured resource budgets." }
    - { file: ".github/workflows/ci.yml", lines: "1-150", detail: "CI runs tests, Kover, lint, debug build, Test Lab, and CodeQL, but has no deterministic network fixture job, API/ABI check, benchmark gate, or reproducible-artifact comparison." }

goals:
  - "Every network operation has an explicit target requirement, monotonic deadline, bounded concurrency/bytes, cancellation reason, and closeable resource scope; cancellation closes blocking sockets and does not publish stale terminal states."
  - "Local targets continue to work on a connected LAN without Internet validation; public targets use a bounded attempt when validation is merely advisory and explain a missing route/permission/policy; lifecycle transitions stop or explicitly foreground long-running work to avoid battery drain."
  - "Large subnet/port scans, live lists, charts, logs, and exports remain bounded and incremental with quantified caps; UI uses lazy/keyed rendering and does not copy O(N) state on every probe."
  - "Results carry stable run/session metadata and route provenance suitable for support reports while secrets and raw network identifiers stay redacted by default in logs."
  - "Deterministic fault-injection tests cover timeout, cancellation, route change, VPN/local-only, malformed input, partial response, and permission denial without relying on a real network."
  - "Core API/ABI changes, performance regressions, dependency/toolchain drift, and release reproducibility are visible in CI with measured baselines and explicit future targets."

non_goals:
  - "Replacing P05's Android NetworkBinder implementation or duplicating P09's Kover/ktlint/detekt/release-smoke tasks."
  - "Keeping arbitrary network scans alive in the background without a user-visible foreground-service contract and notification."
  - "Persisting raw scan results, DNS responses, packet captures, credentials, or full debug logs as an implicit offline database."

constraints:
  - "Preserve zero Android SDK imports in core-network/core-domain and the existing StateFlow/Hilt/ViewModel architecture."
  - "Run one Gradle invocation at a time on this host; benchmark and release comparisons must state device/JDK/SDK/tool versions."
  - "Use monotonic time for elapsed durations and wall-clock time only for display/export timestamps."
  - "Use typed error categories at the core/app seam; map them through the current UI error layer and let P07 replace remaining literals. E03 correctness and cancellation work must not wait for the localization phase."
  - "All caps are configurable constants with safe defaults, validated at the domain boundary, and covered by boundary tests."

reusable_defaults:
  note: "These are proposed shared defaults, not measured current performance. Agents must record the baseline before changing a default and may tune only with benchmark/device evidence."
  operation:
    max_concurrent_probes: 64
    interactive_max_operation_duration_ms: 120_000
    continuous_max_operation_duration_ms: null
    continuous_requires_explicit_budget_and_foreground_state: true
    cancellation_cleanup_target_ms: 500
    progress_emit_min_interval_ms: 100
  payloads:
    max_single_response_bytes: 1_048_576
    max_export_bytes: 5_242_880
    max_log_read_bytes: 1_048_576
    max_live_rows_per_tool: 2_000
  caches:
    max_entries: 256
    positive_ttl_ms: 300_000
    negative_ttl_ms: 30_000
    stale_while_offline_ms: 86_400_000
  battery:
    background_policy: "pause_interactive_operations; require_explicit_foreground_notification_for_continuous_runs"
    wifi_auto_refresh_min_interval_ms: 15_000

design:
  operation_contract: |
    Add pure core-network contracts (`OperationId`, `OperationTarget`,
    `OperationRequirement`, `OperationDeadline`, `CancellationReason`,
    `ResourceScope`, and `OperationBudget`) and an app adapter that supplies
    Android route/lifecycle state. Repositories receive a context/budget rather
    than inventing independent constants. `ResourceScope` registers sockets,
    streams, response bodies, multicast locks, and temporary files; cancellation
    closes them before the flow completes. Every flow emits at most one terminal
    event and checks `ensureActive` between blocking boundaries. The 120-second
    default applies only to interactive runs; an explicit foreground continuous
    session supplies its own budget/renewal policy and is never silently cut off
    by this default. Existing P05 binder calls are made through this scope so
    route selection and cleanup stay coupled.
  availability_and_lifecycle: |
    Model `LOCAL_NETWORK`, `INTERNET`, and `ANY_NETWORK` requirements. Evaluate
    target scope against ConnectivityObserver snapshots: local reachability does
    not require NET_CAPABILITY_VALIDATED, and HTTP/TLS/DNS may target local
    endpoints even when their tool also supports public endpoints. Missing route,
    denied permission, or explicit policy is definitive; lack of
    NET_CAPABILITY_VALIDATED is advisory and permits a bounded user-requested
    attempt. A lifecycle owner pauses auto-refresh and cancels
    interactive operations on STOPPED; a continuous session either finishes a
    bounded grace period or transitions to Paused. A foreground service is an
    explicit, user-visible opt-in for runs that must continue while backgrounded.
  metadata: |
    Add immutable `OperationMetadata` (opaque runId, tool, normalized target,
    requirement, start/finish monotonic and wall times, duration, selected
    transport/interface/vpn state, resolved address, cancellation reason,
    bytes sent/received, and result count). Keep credentials, raw packets, and
    full exception messages out of the common metadata. Repositories and
    ViewModels update metadata through a single session coordinator so Stop,
    cancellation, and natural completion report the same fields.
  memory_and_export: |
    Replace eager subnet/list expansion with bounded iterators or ranges and
    stream work into workers. Keep a capped ring buffer for live UI rows while
    retaining aggregate counters; final results may be streamed to a temporary
    export writer and atomically renamed only after close/flush. Compose lists
    use LazyColumn/LazyVerticalGrid with stable keys. Exports have a byte cap,
    cancellation cleanup, UTF-8/BOM policy, and format-specific truncation:
    CSV/text stop at record boundaries with a footer, while JSON/settings fail
    atomically. A user Stop may finalize an intended partial session after the
    writer drains; abrupt failures delete temporary output.
  observability: |
    Introduce structured events with redaction at the logger boundary. Default
    to hashed/truncated host/IP/subnet values, remove query credentials and
    sensitive headers, classify exception types, and attach runId/route without
    dumping full stack traces into shared exports. Debug builds may opt into a
    local diagnostics detail switch; release builds keep the redaction invariant.

