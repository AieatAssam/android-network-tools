definition_of_done:
  - "Every task is status done or dropped with a reason; measured baselines and future targets are explicitly labeled."
  - "Operation cancellation, target-aware availability, route/session metadata, cache/timeout, memory/export, redaction, deterministic fault, API/ABI, benchmark, reproducible build, and migration/backup acceptance criteria are all evidenced by tests or documented device/build output."
  - "P05/P09/P12 ownership boundaries remain intact; no duplicate implementation is left as an unowned alternative."
  - "Global plan gates still pass: tests, lint with zero errors, debug/release build, Kover floors, README/CLAUDE/privacy sync, and release smoke."

docs_updates: [README.md, PRIVACY_POLICY.md, CLAUDE.md]

risks:
  - risk: "A shared budget changes timing or cancellation semantics in one of the 14 tools."
    mitigation: "Migrate one family at a time behind injected seams, preserve typed terminal states, and require deterministic cancellation tests before changing defaults."
  - risk: "Capping live rows or exports hides useful diagnostics."
    mitigation: "Retain exact aggregate counts, show truncation, stream bounded files, and make the cap visible/configurable within safe limits."
  - risk: "OEM ConnectivityManager/lifecycle callbacks disagree with the model."
    mitigation: "Keep route snapshots conservative, expose capability state, allow explicit retry, and gather device evidence before enabling background continuation."
  - risk: "Hosted benchmark and artifact reproducibility checks are noisy."
    mitigation: "Record environment, use report-only baselines first, normalize only known generated metadata, and gate unexplained safety/build-input changes immediately."
  - risk: "DataStore migration or selective backup loses settings/history."
    mitigation: "Use atomic/idempotent migration, old-store retention, injected failure tests, emulator bmgr smoke, and explicit privacy allow/deny lists."
