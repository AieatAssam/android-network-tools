      - "core-domain/.../result and core-network/.../result schema tests"
    acceptance_criteria:
      - "A public method removal, parameter type/nullability change, or incompatible sealed/result change fails `apiCheck`; additive compatible changes pass after compilation."
      - "API baseline generation is reproducible on JDK 21 and does not include generated Hilt/Compose/Android classes."
      - "A source-compatibility fixture and app compile catch call-site/default-parameter breakage, while independent serialization/schema fixtures catch sealed-state, nullability-at-runtime, and persisted/share-format behavior that an API dump cannot prove."
