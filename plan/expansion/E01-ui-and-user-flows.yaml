# =============================================================================
# E01 – UI and user-flow expansion
# =============================================================================
# Audience: coding agents. This is a planning artifact only; it must not be
# treated as permission to edit production code during plan review.
# Scope: user-facing information architecture, responsive layouts, task flows,
# and reusable result/form behavior that is not already owned by P07/P08/P12.
#
# Distinction used below:
#   actual_defect: source evidence demonstrates the behavior already exists.
#   proposal: a new capability or UX refinement; implementation must first add
#             a failing contract test or a reviewed design fixture.
#
# Sequence follows exact task dependencies, not numeric order. Immediate fixes
# do not wait for broad navigation, preferences or localization migrations.
# Keep this file independently parseable and update each task as it lands.

phase:
  id: E01
  title: "UI and user flows: discoverability, trustworthy results, handoffs, and responsive tool workflows"
  priority: high
  status: todo
  type: expansion
  estimated_effort: "XL (8-12 coding-agent sessions; land as small PR-sized task groups)"
  audience: "AI coding agents; each task has a seam, a test contract, and a rollout gate"
  depends_on: []
  related_phases: [P01, P05, P06, P07]
  coordinates_with: [P08, P09, P10, P11, P12, P13, P14, P15]
  findings: [RLAN001]
  source_review_basis:
    - file: "app/src/main/kotlin/net/aieat/netswissknife/app/MainActivity.kt"
      lines: "74-130"
      detail: "The app shell already owns adaptive navigation, pinned routes, More sheet, onboarding, and the single nav host; E01 should extend these seams rather than create a second shell."
    - file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/NavRoutes.kt"
      lines: "24-83"
      detail: "Tool metadata and route arguments are centralized, but ToolInfo is string-valued and only Ports has a host handoff route. P07 owns resource mapping; E01 owns richer route intent and discovery behavior."
    - file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/AppNavigationViewModel.kt"
      lines: "22-58"
      detail: "Pinned routes are a pipe-delimited list capped at three, with no ordering, favorites metadata, or migration contract."
    - file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/components/AdaptiveContentBounds.kt"
      lines: "12-26"
      detail: "All screens receive an 840dp centered single-column cap; E01 must specify when a two-pane or wider tool layout is justified instead of merely increasing the cap."
    - file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/onboarding/OnboardingSheet.kt"
      lines: "65-127"
      detail: "Onboarding is a four-page modal pager with a dismiss action and no permission/result verification state."
    - file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/components/LocalNetworkPermission.kt"
      lines: "13-45"
      detail: "The API 36+ permission requester launches with a no-op callback and does not expose granted/denied/permanently-denied state to the initiating flow."
    - file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/lan/LanScanViewModel.kt"
      lines: "35-67,162-267"
      detail: "LAN state has Idle/Scanning/Finished/Error, search text, and Ports-only navigation; the result contract needs confidence-aware presentation after RLAN001 is fixed."
    - file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/lan/LanScanScreen.kt"
      lines: "447-520,602-808"
      detail: "The scanner presents a live host list and result cards, but does not distinguish verified hosts from ambiguous TCP resets or provide a confidence explanation/filter."
    - file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/components/RecentHostsRow.kt"
      lines: "30-99"
      detail: "Recents are a horizontal chip row with 32dp remove and 40dp clear controls; the component has no typed host metadata, favorites, history detail, or overflow strategy."
    - file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/components/ToolErrorCard.kt"
      lines: "27-88"
      detail: "The shared error card supports selectable text and injected actions, providing the seam for retry, edit-input, copy-diagnostics, and permission actions."
    - file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/settings/SettingsScreen.kt"
      lines: "79-184,242-317,318-417"
      detail: "Settings currently exposes theme, dynamic color, a few defaults, Wi-Fi refresh, recents clearing, and onboarding reset; there is no feature-level preferences, export/import, history, or privacy control surface."

principles:
  - "Preserve the existing NavigationSuiteScaffold, AdaptiveContentBounds, ViewModel StateFlow, Hilt, and shared tool components."
  - "Every new user-visible state has an explicit loading, empty, error, canceled, and retry contract where the operation can reach that state."
  - "A result must identify its input, timestamp, source/limitations, and confidence before offering copy/share/export or a cross-tool action."
  - "Do not hide uncertainty behind a green success card. LAN results in particular must not imply that every scanned address is a live host."
  - "P07 owns string resources and typed error mapping; P08 owns baseline accessibility primitives and reduced motion; E01 consumes those contracts and adds flow-specific semantics."
  - "Responsive behavior is specified by window width, height, font scale, orientation, and input method; agents must add deterministic Compose tests at compact, medium, and expanded sizes."

state_and_rollout:
  status_vocabulary: [todo, in_progress, blocked, done, dropped]
  task_status_rule: "Keep task status todo until its tests/contracts and acceptance criteria are implemented; do not mark done for a design-only sketch."
  rollout_sequence:
    - gate: E01-G0
      after: [E01-T01, E01-T02]
      condition: "Route metadata and user preference migrations are backward compatible; no existing destination loses a saved host or pinned route."
    - gate: E01-G1
      after: [E01-T03, E01-T04, E01-T05]
      condition: "Home/More search and onboarding/permission recovery are usable on compact and expanded windows with TalkBack and keyboard navigation."
    - gate: E01-G2
      after: [E01-T06, E01-T07, E01-T08, E01-T09]
      condition: "LAN confidence, empty/error/cancel state contracts, and cross-tool handoffs are verified against fake repositories and instrumented navigation."
    - gate: E01-G3
      after: [E01-T10, E01-T11, E01-T12, E01-T13]
      condition: "Forms, recents/favorites/history, and durable export/import are internally consistent and survive process recreation."
    - gate: E01-G4
      after: [E01-T14, E01-T15, E01-T16, E01-T17]
      condition: "Responsive, accessibility, localization, performance, and release validation gates pass; staged rollout uses local/debug validation signals and explicit rollback criteria."

tasks:
  - id: E01-T01
    priority: high
    status: in_progress
    kind: actual_defect_plus_refinement
    title: "Introduce typed destination intents and safe cross-tool handoff arguments"
    source_evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/NavRoutes.kt", lines: "32-60", detail: "Only Ports declares a host argument; other routes are bare strings."}
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/AppNavigation.kt", lines: "121-148", detail: "Most destinations construct screens without a route-scoped prefill contract."}
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/lan/LanScanViewModel.kt", lines: "54-55,264-266", detail: "LAN emits NavigateToPorts(host) only."}
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/PortsScreen.kt", lines: "140-170,384-404", detail: "Ports reads a route-provided host and has an established prefill seam."}
    proposed_behavior:
      - "Replace ad-hoc route string construction at flow boundaries with a sealed ToolIntent/ToolDestination model that encodes host, IP, port, subnet, and optional source context."
      - "Support validated handoffs at minimum LAN host -> Ping, Ports, HTTP Probe, TLS (when port is known), WOL (when MAC is known), and mDNS service -> HTTP/Ping; preserve URL/IPv6/bracket encoding."
      - "Prefill fields without auto-submitting; show a compact 'from <source>' context label and allow the user to edit before running."
      - "Reject unsupported or ambiguous values with an inline explanation and keep the destination usable as a blank form."
    depends_on: []
    files_and_seams:
      create: ["app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/ToolIntent.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/ToolIntentCodec.kt", "app/src/test/kotlin/net/aieat/netswissknife/app/ui/navigation/ToolIntentCodecTest.kt"]
      modify: ["app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/NavRoutes.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/AppNavigation.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/lan/LanScreen.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/lan/LanScanViewModel.kt", "all destination ViewModels that accept prefill"]
    implementation_steps:
      - "Define a versioned, URL-safe argument codec with a round-trip test matrix for hostname, IPv4, IPv6, zone ID, port, MAC, and Unicode IDN inputs."
      - "Add optional route arguments and one-time consume semantics so process recreation does not re-run a handoff or overwrite user edits."
      - "Add source context and clear-prefill actions to the shared form header; keep P07 resource mapping for all labels."
      - "Migrate LAN/mDNS result actions first, then add the remaining tools in small destination-specific commits."
    acceptance_criteria:
      - "Every supported handoff is represented by a typed intent and tested for encoded/decode round trip."
      - "Destination forms show the supplied value, never silently submit, and retain edits after rotation/process recreation."
      - "Invalid or unsupported handoff data produces a localized inline message and no malformed route."
    validation:
      automated: ["./gradlew :app:testDebugUnitTest --tests '*ToolIntentTest' --no-daemon", "instrumented navigation tests for each supported handoff", "source scan confirms route strings are declared only in NavRoutes.kt"]
      manual: ["On phone and tablet, open LAN host actions and verify back navigation returns to the originating result without duplicate scans."]
    risks_constraints:
      - "Do not break existing deep links or the current Ports?host={host} route; preserve a compatibility decoder."
      - "Do not put Android Uri or resource IDs in core-domain/core-network."
    effort: "M (2-3 agent sessions)"
    checkpoint:
      status: "typed intent and codec foundation plus the first LAN-to-Ports handoff are implemented; remaining tool handoffs and integrated navigation/device gates stay open"
      implementation_commit: afd05d15d7894b95a2f9bc58b36092acd5826f77
      implemented:
        - "Typed host, port, MAC, subnet, and source models with strict validation and normalization."
        - "Versioned URL-safe codec with strict UTF-8 decoding and a compatibility decoder for the existing Ports host query."
        - "Round-trip, malformed encoding, scoped IPv6, duplicate/unknown legacy query, and MAC normalization test coverage."
      remaining_acceptance:
        - "Extend typed handoffs beyond LAN host -> Ports/Ping to the remaining supported LAN and mDNS actions, including HTTP, TLS when a port is known, and WOL when a MAC is known."
        - "Add one-time route consumption and navigation process-restoration/edit-preservation coverage across the supported destinations."
        - "Exercise the real AppNavHost and system Back on phone and tablet; confirm return to the originating LAN result without duplicate scans."
      current_vertical_slice:
        status: "LAN host -> Ports and Ping are integrated; do not mark the task complete"
        implementation_commit: 664d6f8
        implemented:
          - "Ports and Ping accept versioned typed host intents while preserving the legacy Ports host query and bare Ping route."
          - "Both destinations prefill validated LAN hosts without auto-starting, show source context, and retain user edits in SavedStateHandle."
          - "Malformed, unsupported, or mismatched intents leave a usable recovery form with a localized inline message; entered edits survive recreation, and the warning stays cleared after a valid replacement."
          - "LAN handoffs push child routes so Back can return to retained LAN results; a synthetic NavHost regression covers push/pop, and instrumentation source coverage checks Ping query arguments."
        validation: "The focused Ping and Ports ViewModel suites passed 48/48 and 23/23; Android instrumentation Kotlin sources compile after the final Compose assertions. Tests reconstruct SavedStateHandle values to cover recovery edits and warning state, but do not exercise Android SavedStateRegistry restoration. QA/adversarial reviews cleared the current source slice; synthetic navigation tests were compiled but not executed, and AppNavHost/system-Back, phone/tablet, and process-restoration gates remain open. No emulator was used."

