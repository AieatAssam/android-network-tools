    risks_constraints:
      - "Android permission prompts are OS-owned; tests must assert our state after callback, never pixel-match system dialogs."
      - "P05 remains owner of actual network binding and connectivity policy; E01 only presents setup and recovery."
    effort: "M (2-3 agent sessions)"

  - id: E01-T05
    priority: high
    status: todo
    kind: proposal
    title: "Define responsive tool scaffolds and split-pane behavior by window class"
    source_evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/components/AdaptiveContentBounds.kt", lines: "12-26", detail: "Every tool is centered in one max-840dp column; the current abstraction does not express list/detail or form/result panes."}
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/MainActivity.kt", lines: "84-100,133-181", detail: "Adaptive navigation changes suite placement, while content sizing is shared at the nav-host boundary."}
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/components/ToolHeroHeader.kt", lines: "57-126", detail: "Hero content is a single horizontal row with a trailing help action and can become crowded at narrow width or large font scale."}
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/settings/SettingsScreen.kt", lines: "103-184", detail: "Settings is a long single-column scroll, a useful baseline but not a scalable tablet information architecture."}
    proposed_behavior:
      - "Introduce a shared ToolScaffold layout policy with compact (under 600dp), medium (600-839dp), and expanded (840dp+) classes plus height/font-scale overrides."
      - "On compact windows keep one vertical flow and make the primary action sticky above the navigation/IME inset when the form is long; on medium/expanded windows use an optional form/result two-pane layout for LAN, DNS, Ports, mDNS, and long diagnostic results."
      - "On expanded windows retain a readable content cap for prose while allowing result tables/charts to use a second pane; never stretch text paragraphs edge to edge."
      - "Make hero title/help/action rows wrap into an intentional stacked layout instead of clipping, and preserve state when switching portrait/landscape or folding posture."
