  - id: E01-T16
    priority: high
    status: todo
    kind: proposal
    title: "Protect UI performance and memory for large scans, histories, charts, and streaming output"
    source_evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/lan/LanScanScreen.kt", lines: "503-520,606-618", detail: "LAN receives live host lists, sorts/filters them in composition, and renders a height-limited LazyColumn; noisy scans can amplify work."}
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/PingScreen.kt", lines: "703-716,765-771", detail: "Ping holds packet lists and renders rows/charts while a continuous session may continue producing data."}
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/HomeScreen.kt", lines: "170-239,241-259", detail: "Home animates a staggered grid of every tool and delays per-item entrance, requiring a measured cost on low-end devices."}
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/util/AppLogger.kt", lines: "87-113", detail: "Debug logging writes synchronously to a file under a synchronized block; high-frequency flow logging must not run on the main thread."}
    proposed_behavior:
      - "Keep list identity stable and move sort/filter/ranking off composition where useful; render bounded windows for host/packet/history lists and expose counts for omitted rows."
      - "Throttle/coalesce streaming UI updates by frame or a documented interval while retaining every data point in the repository/export path when requested."
      - "Cache expensive chart summaries and text layouts by stable result/version; cancel work when a result is cleared or a screen leaves composition."
      - "Make Home entrance animation lazy and reduced-motion-aware; instrument frame/jank and memory budgets in debug/profile builds without remote telemetry."
    depends_on: [E03-T05]
    files_and_seams:
      create: ["app/src/main/kotlin/net/aieat/netswissknife/app/ui/performance/UiUpdatePolicy.kt", "app/src/test/kotlin/net/aieat/netswissknife/app/ui/performance/UiUpdatePolicyTest.kt", "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/performance/LargeResultPerformanceTest.kt"]
