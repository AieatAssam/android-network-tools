      modify: ["app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/AppNavigationViewModel.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/MoreToolsSheet.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/HomeScreen.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/ui/components/RecentHostsRow.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/data/AppPreferencesDataStore.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/settings/SettingsScreen.kt"]
