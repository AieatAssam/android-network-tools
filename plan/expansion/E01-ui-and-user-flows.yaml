  - id: E01-T03
    priority: high
    status: todo
    kind: proposal
    title: "Add fast tool discovery with search, task phrases, filters, and keyboard navigation"
    source_evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/HomeScreen.kt", lines: "170-239,241-302", detail: "Home renders every tool in a fixed adaptive grid with no search, category filter, recent/favorite section, or task-oriented entry point."}
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/MoreToolsSheet.kt", lines: "57-82,150-246", detail: "More groups tools by fixed sections but provides no query/filter state."}
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/NavRoutes.kt", lines: "64-79", detail: "Tool metadata already has labels, short labels, and descriptions that can seed a local search index."}
    proposed_behavior:
      - "Provide one shared ToolCatalog query model used by Home and More: search title/description/synonyms, filter by category, show favorites and recent tools first, and retain a clear empty state."
      - "Offer task prompts such as 'Is this host reachable?', 'What devices are on my Wi-Fi?', 'Why is this site slow?', and 'Is this certificate valid?' that map to one or more tools without pretending to diagnose before a run."
      - "Support IME Search, arrow/tab navigation on hardware keyboards, predictable focus, and a query-independent 'all tools' reset."
      - "Keep catalog data local and static; no network search or telemetry is required for the first rollout."
    depends_on: [E01-T02]
    files_and_seams:
      create: ["app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/ToolCatalog.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/ui/components/ToolSearchField.kt", "app/src/test/kotlin/net/aieat/netswissknife/app/ui/navigation/ToolCatalogTest.kt", "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/ToolDiscoveryTest.kt"]
      modify: ["app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/HomeScreen.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/MoreToolsSheet.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/NavRoutes.kt"]
    implementation_steps:
      - "Define normalized tokens, synonyms, category IDs, ranking tie-breakers, and stable test fixtures for every current tool."
      - "Add the shared search/filter state with debounce only for UI rendering; navigation remains immediate on selection."
      - "Build compact-width and expanded-width layouts: full-width search plus filter chips on phones; persistent search/sidebar filters on expanded windows."
      - "Add task prompt cards with explicit 'choose a tool' wording and analytics-free deterministic behavior."
    acceptance_criteria:
      - "All 14 implemented tools are discoverable by exact label, common synonym, and at least one task phrase."
      - "No query result leaves a blank grid; the empty state offers clear query and category reset actions."
      - "Search and filter state is not incorrectly carried into a tool destination or restored as a stale query after process death."
    validation:
      automated: ["ToolCatalog ranking and synonym unit tests", "Compose tests at 320dp, 600dp, and 840dp widths", "keyboard IME/focus test for Search"]
      manual: ["TalkBack and keyboard walkthrough; verify no tool is more than two interactions from Home with a known task phrase."]
    risks_constraints:
      - "P07 owns localized labels; search indexing must use localized display text plus stable nonlocalized synonym keys."
      - "Do not add remote recommendations or unbounded animations; respect P08 reduced-motion contract."
    effort: "M (2-3 agent sessions)"

  - id: E01-T04
    priority: high
    status: todo
    kind: actual_gap
    title: "Make onboarding an actionable setup and recovery flow"
    source_evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/onboarding/OnboardingSheet.kt", lines: "65-127,129-162,300-377", detail: "The welcome guide is a static four-page modal with dismiss/next controls and explanatory pages; it cannot request or verify a permission/network setup."}
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/onboarding/OnboardingViewModel.kt", lines: "18-29", detail: "Onboarding persists only a Boolean completed flag."}
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/components/LocalNetworkPermission.kt", lines: "27-45", detail: "The permission callback is no-op, so the initiating UI cannot show granted/denied/retry/open-settings state."}
      - { file: "app/src/main/AndroidManifest.xml", lines: "1-50", detail: "Permission declarations and feature constraints must remain the source of truth for setup copy."}
    proposed_behavior:
      - "Turn onboarding into skippable setup steps: choose a first task, understand local-network privacy, optionally grant the currently relevant permission, and run a lightweight self-check."
      - "Each step has explicit Not now, Try again, Open system settings, and Continue actions; completion is recorded per step with a schema version, not a single irreversible Boolean."
      - "Tool entry from an unconfigured state opens the same contextual setup step and returns to the original destination after success or a deliberate skip."
      - "Never request location/nearby/network permissions merely because the app launched; request only after the user chooses a task that needs it."
    depends_on: [P05-T5, E01-T01]
    files_and_seams:
      create: ["app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/onboarding/OnboardingStep.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/onboarding/SetupCheckViewModel.kt", "app/src/test/kotlin/net/aieat/netswissknife/app/ui/screens/onboarding/SetupCheckViewModelTest.kt", "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/screens/onboarding/OnboardingRecoveryTest.kt"]
      modify: ["app/src/main/kotlin/net/aieat/netswissknife/app/MainActivity.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/onboarding/OnboardingSheet.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/onboarding/OnboardingViewModel.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/ui/components/LocalNetworkPermission.kt", "app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/AppNavigation.kt"]
    implementation_steps:
      - "Define setup state machine and reason-coded permission result (granted, denied, denied-without-prompt, unavailable, canceled) with no UI literals in Kotlin."
      - "Add a fakeable permission/system-settings launcher and network self-check seam; make callback state survive recomposition and back navigation."
      - "Implement return-to-origin routing via E01-T01, including a no-op result when the user skips."
      - "Add reset/migrate behavior for existing ONBOARDING_COMPLETED so existing users are not unexpectedly blocked."
    acceptance_criteria:
      - "A fresh install can choose a task, see why a permission is needed, grant/deny/skip it, and reach Home or the selected tool."
      - "A denial shows actionable recovery and never loops a permission prompt without a user tap."
      - "Existing installs keep their current onboarding completion behavior until the user explicitly resets the guide."
    validation:
      automated: ["State-machine unit tests for every result and back/cancel path", "instrumented permission launcher test with granted/denied fakes", "process-death test restoring the current setup step"]
