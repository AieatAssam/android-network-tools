qa_validation:
  required_before_phase_done:
    - "All E01 tasks are done or dropped with a reason; no task is marked done from a design-only artifact."
    - "Every changed screen has compact/medium/expanded and font-scale test coverage appropriate to its layout policy."
    - "Every operation has a tested terminal-state matrix and every report/export path has redaction and cancel/failure coverage."
    - "RLAN001 fake reset fixture proves the default LAN list contains no lone-reset false positives."
    - "P07/P08/P09 global gates pass: unit tests, instrumented flow tests, lint, Kover, debug/release assembly, and README/privacy sync."
  commands:
    unit: "./gradlew :core-network:test :core-domain:test :app:testDebugUnitTest --no-daemon --no-parallel"
    instrumented: "Run E01 flow/responsive/accessibility suites on API 26, API 33, and API 36+ using the repository's Test Lab quota policy."
    lint: "./gradlew :app:lintDebug --no-daemon --no-parallel"
    coverage: "./gradlew :app:koverVerify :core-domain:koverVerify :core-network:koverVerify --no-daemon"
    release: "./gradlew :app:assembleDebug :app:assembleRelease --no-daemon"
  manual_matrix:
    - "320dp phone, 600dp medium, 840dp/1200dp expanded; portrait/landscape/fold posture."
    - "font scale 1.0/1.5/2.0; display size largest; en/de/en-XA/ar-XB."
    - "TalkBack and hardware keyboard; animator duration scale 0; touch-only fallback."
    - "fresh install, upgrade from current preferences, process death, back during run, cancel, retry, empty, filtered-empty, permission denial, VPN, offline, SAF cancel."
    - "LAN normal network, all addresses reset by gateway/firewall, ICMP-blocked host with corroborating evidence, uncertain filter enabled, and no-device subnet."

definition_of_done:
  - "E01-T01 through E01-T18 are done/dropped with reasons and stable tests/fixtures exist for every retained contract."
  - "The plan index references E01 as an expansion phase without changing P07/P08/P12 ownership or historical completion claims."
  - "All user-facing additions are localized, accessible, responsive, privacy-preserving, and validated by the required gates."
