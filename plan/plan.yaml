    note: "Completed P05-T1 with Android-free NetworkBinder/NoOpNetworkBinder interfaces, a fail-closed local CIDR policy for RFC1918/link-local, IPv6 ULA/site-local/link-local and mapped IPv4 literals, the typed local-network permission exception, and FakeNetworkBinder recording support. Full :core-network:test and :core-network:koverVerify passed (905 tests, 1 skipped, zero failures/errors); the LocalDestinationPolicy report shows 100% line coverage. P05 remains in progress: repository binding and Android network selection start at P05-T2/T3."
