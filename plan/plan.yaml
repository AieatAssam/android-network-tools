      mechanism: >
        Inputs use SavedStateHandle (survive rotation and process death). Results are not Parcelable and are never written to the Bundle or disk. For LAN Scanner and Port Scanner the last terminal result and form are also kept in ToolSessionMemory, an @ActivityRetainedScoped in-memory holder, so Back and return restore them (a scan still running when the tool is left, or stopped by a pause, is kept as a partial result, matching the WP06 pause convention; only a user Stop stays Canceled). The holder is written in onCleared and read in the ViewModel constructor, and the subnet or host must match for a result to be shown. No secrets are stored (SNMP community and v3 passwords stay in plain remember, as the Topology code documents).
      fixed:
        - "B:PD-01 and B:PORTS-08 (inputs): Port Scanner saves preset, start/end port, timeout, concurrency and aggressive probes in SavedStateHandle. LAN Scanner saves subnet, timeout and concurrency. The slider values are now saved, so the concurrency 40 that reset to 50 in PD-01 is kept. The DataStore defaults loaded at start no longer overwrite a restored value (LAN and Port settingsLoad guarded)."
