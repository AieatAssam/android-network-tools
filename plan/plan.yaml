    evidence: "Authenticated alert and submission audits on 2026-09-23 show six alerts open (#1/#2/#5/#6/#8/#9). The default-branch managed Gradle submission run 35601558226 (main commit 5e183721e64ce8a8946f1a0b50f52b83544e8898) contains 415 resolved components; artifact hashes and the reviewed-branch run are retained in plan/reviews/2026-09-23-p025-dependency-state.yaml. It reports AGP 9.4.1 -> sdk-common 32.4.1 with old and patched Bouncy Castle coordinates, commons-compress with old and patched Commons Lang, and httpmime with old and patched HttpClient. Google Maven POMs for sdk-common 32.4.1 and AGP 9.4.1 directly declare Bouncy Castle 1.80.2 and httpmime 4.5.6. The standalone ben-manes settings-plugin resolution is clear; the managed graph merges configurations and does not prove app-runtime inclusion. `releaseRuntimeClasspath` contains none of the affected packages."
    impact: "The current default-branch dependency submission includes vulnerable coordinates from the AGP build-plugin graph, with one critical and one high alert still open. No affected package appears in the Android runtime graph, and the merged submission artifact does not identify per-configuration selection. P02.5 remains open until a compatible stable plugin-stack remedy removes the old coordinates from a new default-branch submission, or unresolved alerts receive approved time-bounded dispositions."
    phase: P02.5

changelog:
  - date: "2026-09-18"
    note: "Plan created from full codebase analysis (all modules, CI, docs, lint report)."
  - date: "2026-09-18"
    note: "Adversarial self-review: verified SNMP4J 3.13.1 / dnsjava 3.6.5 / icmpenguin rc.4 APIs via javap. Corrected P05 A3 (no DefaultUdpTransportMapping.getSocket(); use protected socket/ensureSocket() subclass), P04 icmpenguin ProbeResult subtypes (Success has elapsedUsec/ttl; Timeout/HostUnreachable/NetUnreachable/ConnectionRefused/NetError/Unknown), P01 OUI CSV generation (naive awk breaks on quoted commas), P10 Java-9 SSLParameters API on Android < 29 (NoSuchMethodError, not UnsupportedOperationException) and TLSv1/1.1 being disabled on modern Conscrypt, P13 XXE feature portability, P12 adb backup deprecation. Added F039 (neverForLocation vs FINE_LOCATION request) to P03."
  - date: "2026-09-18"
    note: "P01 complete: LAN discovery now uses ICMP/TCP reset/open/NetBIOS/mDNS strategies, resolves MACs after probing, derives gateway/subnet from ConnectivityManager, ships the IEEE OUI registry, adds port-scan hand-off, and closes F004/F005/F006/F040. Full unit tests, Kover gates, lint, and debug/instrumented APK assembly pass."
  - date: "2026-09-18"
    note: "P02 complete: SNMPv3 USM credentials and extended protocols are registered per discovery session, LLDP management addresses are decoded from row indexes, CDP hex addresses are accepted, topology seeds are persisted, and R8/CI keep-class verification is documented. Core/app focused tests, unsigned release assembly, and apkanalyzer verification pass."
  - date: "2026-09-19"
    note: "P02 authPriv claim re-verified: restored the strict loopback GET, fixed the responder to localize its SHA/AES user, explicitly registered SNMP4J USM protocols (addDefaultProtocols is disabled by default), and added cached authoritative-engine discovery before v3 GET/WALK. Strict loopback, core-network, and repository-wide JVM tests pass."
  - date: "2026-09-19"
    note: "Added P02.5 after authenticated Dependabot review: nine open Maven alerts (one critical, three high, five medium), with exact CVE/GHSA IDs, dependency provenance, upgrade constraints, and verification gates recorded for remediation."
  - date: "2026-09-19"
    note: "P02.5 remediation started: upgraded Kotlin 2.4.20, AGP 9.4.1, and KSP 2.3.12; constrained AGP's build classpath to patched Bouncy Castle 1.85, jose4j 0.9.6, JDOM 2.0.6.1, Commons Lang 3.18.0, and HttpClient 4.5.14. JVM tests, release assembly, and releaseRuntimeClasspath inspection pass; Dependabot rescan is pending."
  - date: "2026-09-20"
    note: "P04 complete: ping now resolves once and supports ICMP/reachability engines, payload/TTL/interval controls, honest loss statuses, and richer CSV output; DNS now preserves record types and sections, reports RCODE/flags/server provenance, handles Private DNS and IDNs, and offers an explicit Cloudflare fallback. JVM tests, builds, lint, coverage gates, and focused API 36 Ping/DNS instrumentation pass; the full connected suite retains two unrelated pre-existing Traceroute failures."
