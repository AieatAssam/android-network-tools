    findings: [A:SHELL-01, A:SHELL-04, A:SHELL-06, A:SHELL-07, B:PD-01, D:MDNS-06, D:TLS-06]
    notes: "Persist last results/inputs via SavedStateHandle where cheap; sync README with reality (no configurable controls that do not exist)."
