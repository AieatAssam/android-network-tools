    note: "Completed the source-backed P11-T2 reserved-range slice: a pure strict numeric IPv4/IPv6 classifier now blocks non-global special-use literals before GeoIP transport, handles mapped IPv4 and validates the embedded IPv4 target in 64:ff9b::/96 NAT64, while allowing public IPv6 through. Added boundary, exception, malformed-input/no-DNS, and transport short-circuit regressions. Also verified the existing RUI007 elapsed-time fix with a fake monotonic clock: Stop preserves 2,350 ms and the partial hop through resource cleanup; synchronized an earlier cancellation test to wait for cleanup. Focused core-network tests passed 23/23 and TracerouteViewModel tests passed 23/23. Separate QA and adversarial reviews cleared the final diff; the adversarial NAT64 finding was fixed and re-reviewed. The supplied v2026.09.21.1 QA brief was re-audited against the branch; no source fix is newly missing. API 33, TalkBack, dead-route layout, live SNMP/canvas usability, mDNS ENODEV/physical Wi-Fi, and measured no-ANR checks remain device/lab gates. No emulator or lab endpoint was used. P11-T2 remains open for provider fallback/breaker, bounded cache policy, country flags, and manual trace acceptance."

