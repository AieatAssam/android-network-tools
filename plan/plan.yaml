  - id: WP06
    title: LAN Scanner + Topology
    status: done
    findings: [B:LAN-01, B:LAN-02, B:LAN-03, B:LAN-04, B:LAN-05, B:LAN-06, B:TOPO-01, B:TOPO-02, B:TOPO-04]
    notes: "TOPO-01 (button hidden in inner scroll card, Enter doesn't start) first. LAN host detail as proper destination/bottom sheet so Back keeps results. LAN-04 verify before acting."
    result:
      status: done
      commit: "the WP06 commit on plan/ux-remediation-2026-10-31 (fix(lan,topology): ...); sha not recorded here to keep a single commit"
      gates: "Final foreground run green: test, ktlintCheck, detekt, :app:assembleDebug, :app:compileDebugAndroidTestKotlin, core-network/core-domain/app koverVerify. app ktlint baseline regenerated twice for line shifts only; per-rule counts unchanged at 5339 total. LanScanViewModelTest 7/7 pass incl. 2 new tests. Instrumented tests compiled only, not run; Topology helper no longer calls performScrollTo on the Discover button and gained a keyboard-Done test. Device re-test deferred to WP18."
      fixed:
        - "TOPO-01: Discover Topology and Cancel moved out of the scrolling SNMP card into a fixed action area below it; keyboard Done on the seed field starts discovery (shared startDiscoveryIfReady guard). Not device-verified."
        - "TOPO-02: seed field has a leading router icon (ToolTextField)."
        - "TOPO-03 (and PORTS-02 wording on this screen): seed error now uses HostValidator.problemOf + messageRes instead of the generic string."
        - "LAN-01 (Back part): Back collapses an open host row first (LanScanViewModel.collapseExpandedHost, BackHandler) so results stay on screen."
