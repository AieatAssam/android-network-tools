        - "A:DNS-01 (root cause in source): the record icon fell back to TXT when the record type was null, so EDNS OPT drew a 'TXT' badge. Icon now shows the server's rrTypeName (dnsRecordIconLabel) with neutral colours for unknown types. Additional section starts collapsed. Tests: DnsRecordIconLabelTest, DnsMessageMapperTest OPT case. The mapper test passed on its first run because the mapper already labelled OPT correctly; it is a regression guard, the icon helper is the fix."
        - "A:DNS-02: new core-network DnsNameValidator.problemOf applies the resolver's own normalizeDomain rules and maps failures to HostProblem (HostValidator.problemOf as the reason). Input shows an inline supporting message, isError, and Look up is disabled while invalid. performLookup refuses invalid names. Messages: 'Domain names cannot contain spaces', a plain IDN message for non-ASCII input, 'IPv6 addresses can only be looked up with the PTR record type', and the generic invalid message. Underscore owner labels (SRV/TXT) remain valid. Tests: DnsNameValidatorTest (9), DnsViewModelTest 'invalid name is rejected before the use case runs'."
