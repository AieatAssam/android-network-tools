  - date: "2026-09-23"
    note: "Closed RAPP004, RNET002, and RNET003. mDNS now propagates typed send/receive failures while preserving quiet timeouts and cancellation; a PTR-driven test covers follow-up send failure. Both subnet detectors preserve valid /0–/32 prefixes, lazily choose the first valid interface address, and leave /16–/30 scan limits as explicit validation. Topology hops/timeout/retries now have shared finite bounds, and the use case rejects invalid values before repository calls. Focused core-network, core-domain, and app unit tests passed; independent QA/adversarial reviews found no blocker. Fresh P02.5 recheck still finds six open Dependabot alerts and the same vulnerable coordinates in the current-branch submission; no later stable AGP is available, so P02.5 remains open."
  - date: "2026-09-23"
    note: "Closed RAPP003, RNET006, and RNET007 after independent QA/adversarial review. Native ICMP linkage failures now fall back to Reachability for Ping, degrade LAN ICMP to an unavailable observation, and surface a typed Traceroute error while preserving downstream errors and cancellation. WHOIS closes active sockets, uses bounded workers and monotonic total deadlines, and accurately documents that an OS resolver may retain a worker if it ignores interruption. GeoIP bogon detection checks only a root-level boolean true and ignores nested/escaped text. Full :core-network:test passed 895 tests (1 skipped); full :app:testDebugUnitTest passed 314 tests; 0 failures/errors. P02.5 remains the highest-severity open gate; RBUILD001/RBUILD002 are the next medium follow-ups."
  - date: "2026-09-23"
    note: "Closed RBUILD001/RBUILD002 after changing the APK gate to require all three defined SNMP4J class rows and replacing release-count versioning with checked max-suffix allocation over paginated Git tags and Release names. Auto builds atomically create the version tag before building, share a queued non-cancelling concurrency group, and check the remote tag SHA before artifact upload and again before publication; the final publication step also rejects an existing Release identity. Artifact-only runs intentionally leave a tag reservation. Updated push tags and pushed overrides that reuse an existing GitHub Release identity are rejected. Ten versioning tests and four APK-class parser tests passed; no live GitHub Actions run was performed. The v2026.09.21.1 QA brief was rechecked against current source: ISS-05/06/20 are covered, while ISS-17/21/22 retain the documented API 33 or physical-device checks. See plan/reviews/2026-09-23-release-qa-brief.yaml. P02.5 remains the highest-severity gate; RUI002-RUI004 are the next ready medium code follow-ups."
  - date: "2026-09-23"
    note: "Closed RUI001-RUI004, RUI006, and RUI009 after unit, API 36 Compose, QA, and adversarial verification. Port-scan Stop now measures through cancellation and retains resolved-IP metadata even if stopped before the first probe; Ping count supports 1..100 and advanced controls render ViewModel state; TLS validates ports 1..65535 and clears stale results; Settings and Ports share integer concurrency 1..500 with stale preferences clamped. Combined :core-network:test/:core-domain:test/:app:testDebugUnitTest passed (895/1 skipped, 172, and 328 tests; zero failures/errors). Targeted API 36 instrumentation passed for Ping, Ports, Settings, navigation/accessibility/onboarding, traceroute, topology, mDNS, and TLS screens. The supplied v2026.09.21.1 QA brief is recorded in plan/reviews/2026-09-23-release-qa-brief.yaml: listed source/UI issues are fixed or covered, while API 33, TalkBack manual navigation, live 10.0.2.2 SNMP, and physical WLAN checks remain open. P02.5 remains the highest-severity gate; R2-006 is the next ready medium code follow-up."
