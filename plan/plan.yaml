    status: done
    result:
      status: done
      commit: "recorded by git log: fix(wol) commit on plan/ux-remediation-2026-10-31"
      gates: "./gradlew test (2509 test cases, 0 failures; 120 WoL), ktlintCheck, detekt, :app:assembleDebug, :app:compileDebugAndroidTestKotlin, :core-network:koverVerify :core-domain:koverVerify :app:koverVerify all green. Device not run (WP18)."
