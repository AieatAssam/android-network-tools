    title: "Documentation & consistency sync (README, CLAUDE.md, privacy policy, store listing, tool_instructions), dead code, default mismatches"
    priority: high
    status: in_progress
    depends_on: []
    findings: [F016, F018, F019, F023]
    summary: "P06-T1 through T7 are implemented and passed current-tree JVM, Kover, lint, Android-test compilation, and debug/release assembly gates. README, privacy policy, Play copy, and agent docs now match source; defaults/recents and dead code are fixed. Only the plan's manual README-to-device observability pass remains."

  - id: P07
    file: plan/phases/P07-localization-architecture.yaml
    title: "Localization architecture: typed errors instead of English strings from core layers; zero literals in UI; first translation"
    priority: medium
    status: in_progress
    depends_on: [P06]
    findings: [F017]
    summary: "P07-T1 and T2 are complete: core-network repository errors and core-domain validation results now carry typed ErrorInfo, with legacy developer messages preserved. The current source passed core-network (1,306 tests, 1 skipped) and core-domain (216 tests). App UiText/resource mapping, literal sweep/plurals, locale support, and translation remain open."

  - id: P08
