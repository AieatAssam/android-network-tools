        - "A:SHELL-02 (two-pane / tall portrait config card) and B:GAP-01 (master/detail): two-pane layout not built; width cap only. Traceroute height is WP03."
        - "A:DNS-05 / C:SUB-09 keyboard opening on entry: no requestFocus or autofocus found in source; cause not identified. Re-test on device."
        - "Remaining plain OutlinedTextField inputs without clear (HTTP headers, Ports numeric, WOL others, Topology others) not converted to ToolTextField."
