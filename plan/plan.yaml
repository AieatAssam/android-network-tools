  - date: "2026-09-25"
    note: "Added the official Mozilla PSL snapshot (2026-09-24_13-26-36_UTC, commit a179a48c465e818cfd8d626691cb317985da87fb, SHA-256 257b298daca42f6d8ec964e238c2a55518e14f09d3117917ec8acee6f188503e; MPL-2.0 header retained) and integrated it into WHOIS domain selection. General eTLD+1 resolution includes ICANN/private rules, while WHOIS uses ICANN-only rules so hosted tenant names such as a.foo.github.io do not replace their registry domain github.io. Seven deterministic parser tests cover plan examples, section behavior, wildcard/exception precedence, malformed labels, Unicode NFC, and resource provenance; the focused WHOIS/PublicSuffix suite passed 63/63 after adding an API-26-compatible bounded resource read and fail-closed malformed-record checks. A five-process fresh-JVM harness measured lazy resource read+parse at 41.3–53.0 ms (median 46.3 ms); one sample remains above the <50 ms target. This replaces an earlier 418 ms JUnit testcase-duration figure, which included test-runner startup and was not a valid parser measurement. `:app:assembleDebug` passed and the APK contains the final `psl/public_suffix_list.index` resource (165,002 bytes). No emulator was used. Performance stabilization and device measurement remain open. Independent QA/adversarial reviews found no behavior blocker and the private-tenant query concern is addressed. RDAP/bootstrap and protocol-toggle work remain open."
  - date: "2026-09-25"
    note: "Added the fixture-backed pure RDAP mapping slice to P10-T5. `RdapMapper` maps domain, IP-network, and ASN JSON into `WhoisResult`, preserves the raw response in an RDAP hop, respects RFC 9083 entity role scope, validates object class/IP family, parses registration events, nameservers, DNSSEC delegation, allocation ranges, and handles, and only exposes hostful HTTP(S) registrar links without user info. Malformed optional field shapes and scalar types are ignored; ASN ranges are limited to unsigned 32-bit ordered values. Pinned kotlinx-serialization-json 1.11.0 and used JsonElement trees without a compiler plugin or generated serializer rules. The serialized WHOIS package suite passed 70/70; `:app:assembleDebug` passed. QA/adversarial reviews found no blocker. No emulator or live RDAP endpoint was used. Network client, IANA bootstrap, WHOIS fallback, protocol selection, and live registry checks remain open."
