# -----------------------------------------------------------------------------
# FINDINGS LEDGER (verified against source on 2026-09-18; file:line refer to baseline commit)
# -----------------------------------------------------------------------------
findings:
  - id: F001
    severity: critical
    area: topology
    title: "SNMPv3 credentials are never applied"
    evidence: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/Snmp4jClientImpl.kt:82-93 builds UserTarget(securityName, securityLevel) but never calls SecurityProtocols.getInstance().addDefaultProtocols(), never registers a USM (SecurityModels.addSecurityModel) and never snmp.usm.addUser(UsmUser(...)) with v3AuthPassword/v3PrivPassword. TopologyParams.v3AuthPassword/v3PrivPassword are unused anywhere in :core-network."
    impact: "Every SNMPv3 discovery fails (no such user / unsupported security level) while the UI collects credentials and the store listing advertises 'SNMP v1/v2c/v3'."
    phase: P02
  - id: F002
    severity: critical
    area: topology
    title: "LLDP neighbour management address parsed from the wrong place"
    evidence: "TopologyDiscoveryRepositoryImpl.kt:306-322 treats the VALUE of column 4 of lldpRemManAddrTable (1.0.8802.1.1.2.1.4.2.1.4 = lldpRemManAddrIfId, an Integer32) as the neighbour IP. Per IEEE 802.1AB-2005 MIB the address is part of the row INDEX (…timeMark.localPort.remIndex.addrSubtype.addrLen.addrOctets…). Test fixture TopologyDiscoveryRepositoryTest.kt:66-71 returns a dotted IP as the value, which no real agent does."
    impact: "Neighbour IPs are never extracted on real devices -> BFS never expands beyond the seed; topology tool shows one node."
    phase: P02
  - id: F003
    severity: high
    area: topology
    title: "CDP neighbour address in hex-octet form is discarded"
    evidence: "TopologyDiscoveryRepositoryImpl.kt:388-392 parseCdpAddress only accepts dotted-quad; SNMP4J renders a 4-byte OctetString cdpCacheAddress as 'c0:a8:01:01' (non-printable bytes -> hex with ':' separators)."
    impact: "CDP neighbours are never followed on Cisco gear."
    phase: P02
  - id: F004
    severity: critical
    area: lan
    title: "MAC/vendor enrichment effectively dead"
    evidence: "LanScanRepositoryImpl.kt:77 reads the ARP table ONCE before any probe is sent, so entries created by the probes themselves are never seen; DEFAULT_ARP_READER (line 56-61) reads /proc/net/arp which Android 10+ (API 29) blocks for apps (returns empty/EACCES). OuiDatabase has 91 entries."
    impact: "On every supported device newer than Android 9 the MAC and vendor columns are always empty; README/store advertise both."
    phase: P01
  - id: F005
    severity: high
    area: lan
    title: "Host discovery is ICMP-only"
    evidence: "LanScanRepositoryImpl.kt:48-55 DEFAULT_HOST_CHECKER = InetAddress.isReachable (ICMP echo, then TCP/7 fallback). No TCP-connect presence probes, no NetBIOS/mDNS name queries."
    impact: "Hosts that drop ICMP (Windows default firewall profile, many IoT devices, some phones) are reported absent."
    phase: P01
  - id: F006
    severity: medium
    area: lan
    title: "Gateway = lowest host IP heuristic"
    evidence: "LanScanRepositoryImpl.kt:83 gatewayIp = ips.firstOrNull(). The actual default route is available via ConnectivityManager.getLinkProperties(activeNetwork).routes in :app."
    impact: "Wrong gateway flag on any network whose router is not .1."
    phase: P01
  - id: F007
    severity: high
    area: wifi
    title: "Wi-Fi scan never triggered"
    evidence: "app/src/main/kotlin/net/aieat/netswissknife/app/wifi/WifiScanRepositoryImpl.kt: scan() only reads wifiManager.scanResults; there is no call to startScan() and no SCAN_RESULTS_AVAILABLE_ACTION receiver. WifiScanViewModel AUTO_REFRESH_INTERVAL_MS = 10_000 re-reads the same cache."
    impact: "Results are as old as the last OS-initiated scan (often 30-60 s or more, minutes when screen-off); 'auto-refresh every 10 s' is cosmetic."
    phase: P03
  - id: F008
    severity: high
    area: ping
    title: "Ping RTT includes DNS resolution, resolves on every probe"
    evidence: "core-network/.../ping/PingRepositoryImpl.kt:32-36 DEFAULT_CHECKER starts the timer, then calls InetAddress.getByName(host) inside the timed region for every probe."
    impact: "First-probe RTT inflated by the DNS round trip; every probe pays a resolver call; hostname->IP can change mid-session."
    phase: P04
  - id: F009
    severity: high
    area: ping
    title: "Ping lacks packet size / TTL although the dependency supports it"
    evidence: "icmpenguin 1.0.0-rc.4 (already a dependency for traceroute) ships me.impa.icmpenguin.ping.Pinger(host, ttl, timeout, maxPingCount, interval, probeSize, pattern, sourceIp) returning Flow<ProbeResult> (verified via javap on the AAR in ~/.gradle/caches). README says 'Payload size is intentionally not configurable because Android's supported reachability API does not expose an ICMP payload-size control'; store/play-description.txt claims 'Configurable count, timeout and packet size'."
    impact: "Feature gap + contradictory public docs."
    phase: P04
  - id: F010
    severity: medium
    area: dns
    title: "All answer records labelled with the requested type"
    evidence: "DnsRepositoryImpl.kt:104-110 maps every ANSWER record to DnsRecord(type = recordType, …) regardless of rec.getType(); an A query for a CNAME name returns CNAME rows displayed as 'A'."
    impact: "Misleading result rows; CNAME chains invisible."
    phase: P04
  - id: F011
    severity: medium
    area: dns
    title: "'System DNS' silently becomes Cloudflare"
    evidence: "DnsRepositoryImpl.kt:151-163 buildSystemResolver falls back to 1.1.1.1 when serverAddresses is empty or ExtendedResolver throws; DnsResult.server stays DnsServer.System; raw view prints ';; SERVER: (see selected server above)'."
    impact: "User believes they tested their own resolver; diagnosis of local DNS problems is wrong."
    phase: P04
  - id: F012
    severity: high
    area: platform
    title: "LAN sockets never bound to the Wi-Fi Network"
    evidence: "MdnsRepositoryImpl.kt (MulticastSocket bound to 0.0.0.0:5353, no setNetworkInterface / Network.bindSocket), WakeOnLanRepositoryImpl.kt:789 DatagramSocket(), Snmp4jClientImpl DefaultUdpTransportMapping(), LanScanRepositoryImpl/PortScanRepositoryImpl plain Socket(). No use of ConnectivityManager.bindProcessToNetwork or Network.bindSocket anywhere."
    impact: "With a VPN active (very common), or on dual-connectivity devices, LAN scan, mDNS, WOL, SNMP and LAN port scans go through the wrong interface and silently fail/timeout."
    phase: P05
  - id: F013
    severity: medium
    area: mdns
    title: "mDNS IPv4-only, fixed port bind"
    evidence: "MdnsRepositoryImpl.kt:1422-1443 joins only 224.0.0.251; never ff02::fb; binds 5353 with reuseAddress and no fallback if the bind fails (OEM mdnsd conflicts)."
    impact: "IPv6-only advertisers missed; discovery fails outright on devices where 5353 cannot be shared."
    phase: P05
  - id: F014
    severity: high
    area: build
    title: "No R8 keep rules for SNMP4J / icmpenguin, and no release build in CI"
    evidence: "app/proguard-rules.pro contains only dnsjava -dontwarn lines; SNMP4J resolves security protocols and transports reflectively (SecurityProtocols.properties / SNMP4JSettings). ci.yml builds assembleDebug only; the first minified build happens in release.yml after tagging."
    impact: "Risk that SNMPv3 (after P02) or other reflective paths break only in the Play build."
    phase: P02
  - id: F015
    severity: medium
    area: tls
    title: "Hostname verification never performed; TrustAll manager unsuppressed"
    evidence: "TlsInspectorRepositoryImpl.kt:146-158 handshakes with TrustAllManager (intentional, to capture bad chains) and separately checks chain trust (checkTrust), but never runs a HostnameVerifier / SAN match; lint reports TrustAllX509TrustManager on core-network.jar."
    impact: "A valid chain for the wrong host reports 'trusted'; lint noise."
    phase: P10
  - id: F016
    severity: medium
    area: docs
    title: "Public docs contradict the code in 8 places"
    evidence: "(a) README DNS section lists system/Google/Cloudflare/custom; DnsServer.kt also has OpenDns and Quad9. (b) README 'koverVerify … enforce 100%' vs build.gradle.kts minBound(90) and CLAUDE.md '90%'. (c) CLAUDE.md module layout lists .github/workflows/claude_add_tool.yml which does not exist. (d) CLAUDE.md/README say tag 'v*.*.*' but release.yml matches 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'. (e) README Ping: 'Recent hosts saved per-session' but RecentHostsRepository persists to DataStore. (f) PRIVACY_POLICY.md lists 6 tools, no Cloudflare speed test, WHOIS/RDAP servers, SNMP or ipinfo naming; says 'Debug Logs screen' exists but it is DEBUG-only. (g) store/play-description.txt claims Ping 'packet size' is configurable. (h) claude/tool_instructions.md uses com/example/netswissknife paths, marks Ping/Traceroute/Ports/LAN/DNS as 'Placeholder', omits 7 tools."
    phase: P06
  - id: F017
    severity: medium
    area: i18n
    title: "App is untranslatable"
    evidence: "Only res/values/ exists. Literals in composables: TopologyDiscoveryScreen.kt:195,584,620,844,949; ToolHelpSheet.kt:77 'How to use'; DnsScreen.kt:812,1024. Literals in ViewModels: WifiScanViewModel 'This network is no longer in range', TopologyDiscoveryViewModel 'Starting...', ApSortOrder(label). NavRoutes.ToolInfo labels/descriptions are Kotlin strings. Every NetworkResult.Error / ValidationError message in core-domain and core-network is an English literal rendered verbatim by the UI (e.g. 'Timeout must be between 100 ms and 30 000 ms'). Core enums carry English displayName/description (DnsRecordType, DnsServer, WifiSecurity, WifiStandard, WifiChannelInfo.congestionLabel, PortScanPreset.label, SecurityHeaderCheck.description)."
