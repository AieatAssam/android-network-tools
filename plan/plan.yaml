    note: "Completed P05-T4 with selected-network/interface mDNS binding, 5353-to-ephemeral fallback and QU queries, and a pure MdnsDiscoverySession for record bookkeeping and final partial-service emission. Tests verify QCLASS wire bits, fallback query flags, bind/interface ordering, ENODEV cleanup, PTR follow-up queries, one consolidated SRV+A service snapshot, and the hostname-bearing final sweep. Full :core-network:test passed 921 tests (1 skipped), :core-domain:test 172, and :app:testDebugUnitTest 340; all had zero failures/errors. :core-network:koverVerify, :app:assembleDebug, and :app:lintDebug passed; lint reported 0 errors and 32 warnings, with no mDNS repository findings. The v2026.09.21.1 brief remains in plan/reviews/2026-09-23-release-qa-brief.yaml; API 33 ENODEV reproduction, TalkBack manual navigation, live 10.0.2.2 SNMP cancellation/usability, and physical-Wi-Fi mDNS remain device checks. P05-T5 is the next recommended implementation task; P02.5 remains the highest-severity open gate."
  - date: "2026-09-23"
    note: "Implemented P05-T5 connectivity banners for the four local-network and six internet tools, typed local-permission error guidance, and cause preservation through topology GET/walk failures; completed P05-T6 README/privacy updates. The v2026.09.21.1 QA brief is source-audited in plan/reviews/2026-09-23-release-qa-brief.yaml: ISS-05 semantics, ISS-06 callback, ISS-20 shared normalization, and ISS-17/21/22 source/test behavior are checked; TalkBack, integrated Skip dismissal, initial-viewport Traceroute, live SNMP, API 33 ENODEV, and physical-Wi-Fi checks remain open. The latest API 36 connected test batch compiled but ADB install stalled in PackageManager before instrumentation; dev36 was shut down. P05-T5 remains in progress for runtime/device validation. P02.5 remains the highest-severity external gate."
  - date: "2026-09-23"
    note: "Started E03-T01 with Android-free operation models, monotonic budgets, a LIFO resource scope, a single-use runner, and deterministic clock/socket fixtures. The runner closes blocked resources, waits for workers, preserves the first cancellation reason, suppresses cleanup failures, and exposes an operation-aware post-blocking check. Focused OperationBudget/ResourceScope/OperationRunner/FakeClock/ScriptedSocket tests pass. This is the core-contract slice only: tool adapters, bounded queue migration, production static checks, and device cleanup measurements remain open. The v2026.09.21.1 release QA brief remains recorded and source-audited in plan/reviews/2026-09-23-release-qa-brief.yaml; API 33, live SNMP, TalkBack, and physical WLAN checks remain device follow-ups."
  - date: "2026-09-23"
    note: "E03-T01 now replaces continuous Ping's unlimited log queue with a 64-packet bounded channel and suspending backpressure. Focused PingViewModel tests prove queue-capacity blocking, FIFO drain, cancellation of a blocked send without losing accepted rows, and initialization-failure cleanup; the PingViewModelTest suite passes. A current source scan finds no GlobalScope or Channel.UNLIMITED hits across app/core-network/core-domain production sources. CI enforcement, operation adapters for the other tool families, raw-socket scope checks, and device cleanup measurements remain open."
  - date: "2026-09-23"
    note: "Extended E03-T01 to Port Scan: each cold-flow collection now gets a 120-second-default OperationSession capped to the selected worker count, and each worker registers one active TCP-socket lease so cancellation closes blocking connect/banner-read work. Existing bounded queues and the supported 1..500 concurrency range are preserved; post-check cancellation prevents close-induced probe failures from becoming late PortResult events, and Complete is sent only after OperationRunner closes the scope. Independent QA and adversarial reviews found no remaining blocker after catching and fixing real-network leakage in the scripted socket test and an orphaned-worker edge for checker-local CancellationException. Full :core-network:test, :core-domain:test, and :app:testDebugUnitTest pass. The default synchronous host resolver cannot be interrupted while inside the platform call, and socket close may be invoked twice during cleanup (Java Socket.close is idempotent); these remain documented limitations. Other tool adapters, static CI enforcement, and device cleanup measurements remain open."
  - date: "2026-09-23"
    note: "Extended E03-T01 to WHOIS: each lookup now has an INTERNET OperationSession with a shared monotonic three-hop deadline, one-probe concurrency, a response limit, and a ResourceScope-owned socket lease. The bounded transport fixes cancellation racing executor enqueue; progress is checked before emission and deadline errors preserve the established total-deadline mapping. Focused WHOIS tests and full :core-network:test (970 tests, 1 skipped), :core-domain:test (172), and :app:testDebugUnitTest (352) passed with zero failures/errors. QA and adversarial review cleared the slice after catching and fixing split-clock deadline handling and propagation through hop fallbacks. Native DNS may still occupy one of the two bounded workers if the platform resolver ignores interruption; the queue is capped at 16. The supplied release QA brief remains source-audited at plan/reviews/2026-09-23-release-qa-brief.yaml; API 33, TalkBack, live SNMP at 10.0.2.2, and physical-WLAN checks remain device follow-ups. E03-T01 remains in progress for other adapters and phase-wide gates."
  - date: "2026-09-23"
    note: "Extended E03-T01 to mDNS with per-collection LOCAL_NETWORK sessions, clamped monotonic scan windows covering setup/query, LIFO lock/socket/membership cleanup, cancellation of blocked receive and join, lifecycle/user-stop reasons, and no terminal success after cleanup failure. Independent QA and adversarial review cleared the adapter after a regression caught deadline cleanup failure being hidden; the regression now proves the close error propagates and DiscoveryComplete is withheld. Full :core-network:test/:core-domain:test/:app:testDebugUnitTest passed (973 tests/1 skipped, 173, and 358; zero failures/errors); the earlier OperationRunner virtual-time timeout passed on rerun and in isolation. Added a CI raw-resource site ledger/checker: its four unit tests pass, and the current inventory has 15 sites (6 reviewed, 9 explicit migration follow-ups); the gate rejects new unlisted sites and GlobalScope/Channel.UNLIMITED. The release brief audit is updated in plan/reviews/2026-09-23-release-qa-brief.yaml. API 33 ENODEV, physical Wi-Fi/multicast, live SNMP usability, TalkBack, and the <=500 ms cleanup target remain unmeasured device gates; other adapters and E03-T01 remain in progress."
  - date: "2026-09-23"
    note: "Extended E03-T01 to TLS Inspector: caller-owned ANY_NETWORK sessions now flow through repository/use-case/ViewModel, enforcing 500–30,000 ms bounds, monotonic handshake timing, socket-scope cancellation, and lifecycle pause cleanup. Deadline cancellation keeps the stable `TLS inspection timed out` error wording; USER_STOP/lifecycle cancellation stays typed cancellation. A shared OperationRunner fix preserves eager socket-close failures on one canonical cause through coroutine exception recovery, with ordinary-failure/cancel/deadline regressions. Independent QA and adversarial reviews cleared the slice. Full :core-network:test/:core-domain:test/:app:testDebugUnitTest passed (982 tests/1 skipped, 174, and 359; zero failures/errors); the TLS repository/use-case/ViewModel tests passed (18, 16, 15 tests), checker tests passed (4), and the 15-site ledger now has 7 reviewed registrations, 8 migration follow-ups, and no open reviews. A focused combined TLS/OperationRunner invocation intermittently exposed existing virtual-time join timeouts; the isolated OperationRunner class and full module run passed. API 33, TalkBack, live SNMP, physical WLAN, and the <=500 ms cleanup target remain device checks; E03-T01 remains in progress for other adapters and phase-wide gates."
  - date: "2026-09-23"
    note: "Extended E03-T01 to HTTP Probe and Speed Test: caller-owned ANY_NETWORK sessions now flow through repository/use-case/ViewModel, with bounded request concurrency, shared deadlines, and ResourceScope-owned close-once connection leases. HTTP redirect connections are released before advancing; Speed Test disconnects before closing active streams so Stop releases blocked reads, and deadlines cannot emit late progress/success. Independent QA and adversarial reviews cleared both adapters after fixes for stream-close order, duplicate disconnect, late deadline events, cold-flow session timing, and JVM constructor compatibility. The full :core-network:test/:core-domain:test/:app:testDebugUnitTest run passed (987 tests/1 skipped, 176, and 360; zero failures/errors). Its initial run surfaced an mDNS receive/deadline race where a socket exception could precede observable job cancellation after the session reason was recorded; receivePacket now checks the shared OperationContext, and the mDNS cancellation class plus full suites pass. The raw-resource checker tests pass (4); the 15-site ledger now has 9 reviewed registrations, 6 follow-ups, and no open reviews. API 33 ENODEV/SNMP, TalkBack, physical WLAN, and <=500 ms cleanup measurements remain device checks. E03-T01 remains in progress for remaining adapters, phase-wide gates, and device measurements."
  - date: "2026-09-23"
    note: "Extended E03-T01 with caller-owned Ping sessions, request-derived finite deadlines, explicit unbounded continuous sessions, bounded DNS/reachability workers, and a session lease for native ICMP collection cleanup. The shared runner now performs eager resource cleanup off the canceling/UI thread and maps the winning deadline to its typed error; mDNS suppresses expected duplicate deadline cancellation but preserves cleanup failures. Traceroute now shows offline status immediately, reports no-network with Retry/Clear, and accepts local-only or VPN-only connectivity. Independent QA/adversarial reviews cleared Ping cancellation/ownership and the local/VPN Traceroute path. Full JVM suites passed (core-network 1005 tests/1 skipped, core-domain 182, app 373; zero failures/errors); the resource checker and its four tests passed. :app:lintDebug and debug/release assembly passed; the initial ExperimentalDetector lint crash did not recur on a clean rerun. A current API 36 connected instrumentation batch compiled but hung installing the test APK in PackageManager, before any tests started; dev36 was cleanly shut down. The QA brief, latest test outcomes, and remaining API 33/TalkBack/SNMP/WLAN/device-cleanup gaps are recorded in plan/reviews/2026-09-23-release-qa-brief.yaml and plan/reviews/2026-09-23-e03-t01-socket-adapters.yaml. E03-T01 remains in progress for DNS, Wi-Fi, phase gates, reverse-DNS cancellation, and cleanup measurements; P02.5 remains open because six Dependabot alerts and the default-branch dependency-submission gate remain unresolved."
  - date: "2026-09-24"
    note: "Extended E03-T01 to DNS with an 8-second caller-owned ANY_NETWORK session from ViewModel through use case/repository, a loading-state Stop control, lifecycle cancellation, and scoped UDP/TCP sockets over a bounded executor. Independent QA cleared session forwarding, Stop/lifecycle cleanup, deadline mapping, and failover; adversarial review prompted connected UDP/source filtering, canceled queue removal, and interruption of dnsjava's blocking send wait. Regressions now exercise wrong-source UDP, retry slot reuse, active UDP/TCP closure, deadline cleanup, and blocked-send cancellation. The resource ledger now inventories 17 sites (14 scope-registered/reviewed, 3 legacy follow-ups). DNS adapter validation is JVM-only; Android resolver behavior and integrated screen Stop are still device/UI checks. E03-T01 remains in progress for Wi-Fi, phase-wide gates, traceroute reverse-DNS cancellation, and cleanup measurements; P02.5 remains open for the default-branch dependency gate."
  - date: "2026-09-24"
    note: "An initial audit of the supplied v2026.09.21.1 brief compared its release commit on origin/main (5e183721) with the current branch. The subsequent adversarial baseline check corrected the ISS-20 classification: release TracerouteScreen's `host.contains(' ')` rejects trailing whitespace before normalization, while the current branch uses HostValidator.normalize(). ISS-05/06/22 behaviors were already present in release source; ISS-21 already had Cancel, node labels, and a details sheet, while the current branch improves persistent cancellation and progress text. ISS-17's missing connectivity banner/local/VPN handling is addressed on the current branch, with target-device layout and live-network behavior still unverified. The corrected baseline-versus-current distinctions are recorded in plan/reviews/2026-09-23-release-qa-brief.yaml. No emulator was used because a shared dev36 AVD was occupied by another task; API 33, TalkBack, live SNMP, and physical-WLAN checks remain open."
