        - "D:WOL-01 root cause: three validators disagreed. The screen and the handoff gate used ToolMacAddress.parse (colon/hyphen only, no trim), so AABB.CCDD.EEFF, bare and padded MACs showed the error and disabled Send. WolMagicPacket.isValidMac accepted them, but had no unicast check, so the domain would send to 01:/FF: targets. Now one validator in core-network (WolMagicPacket.macProblem) returns a specific WolMacProblem (BLANK, LENGTH, CHARACTERS, SEPARATORS, MULTICAST, BROADCAST, ZERO). ToolMacAddress.parse, the use case, the ViewModel and the screen all delegate to it. Dotted, bare and padded MACs are accepted in the UI."
        - "Mixed separators (AA:BB-CC:DD:EE:FF) were accepted by the repository regex. A back-reference now requires one separator style."
        - "Broadcast address: a bad value (host name, IPv6, out of range, leading zero) was reported as MAC_INVALID ('The MAC address is invalid'). New ErrorCode BROADCAST_INVALID, validated in the use case and inline in the screen. Any dotted-decimal IPv4 is accepted (limited, subnet-directed or unicast)."
        - "Inline, specific MAC messages replace the single generic message. Broadcast and port fields are ToolTextField (leading icon, clear button). The Advanced panel opens automatically when a hidden field is invalid, so Send never disables silently."
        - "No network: LocalNetworkBindingUnavailableException, NoRouteToHostException and 'Network is unreachable' now map to WOL_NO_NETWORK (was WOL_SEND_FAILED with a raw developer message). Send is not hard-blocked offline; the real failure is reported. The error card renders the typed ErrorInfo through ErrorTextMapper."
        - "Success note states the send is fire-and-forget with no delivery confirmation."
        - "48dp minimum height on Send, Retry, Send again, Cancel, Use, Advanced options and the clear-prefill action."
        - "Saved devices (were absent; D-local GAP 10). Added: save the current MAC with an optional name, use, edit (name and MAC), delete. Stored in DataStore under WOL_SAVED_DEVICES, separate from recents clearing. Canonical-MAC dedupe, an edit that would create a duplicate is refused inline, names single-line and capped at 40. Pure logic in WolSavedDevices; store behind WolSavedDeviceStore."
        - "Tests: WolMagicPacketTest (notations, mixed separators, multicast/broadcast/zero, whitespace, macProblem reasons, parseIpv4), WakeOnLanRepositoryImplTest (fake CapturingSocket: 102-byte payload, repeatCount sends to address and port, BROADCAST_INVALID, WOL_NO_NETWORK; no real packets), WakeOnLanUseCaseTest, WakeOnLanViewModelTest (validation state, offline send, error info, saved-device add/dedupe/edit/conflict/delete/use/restore), WolSavedDevicesTest (encode/decode, dedupe, rename, remove)."
