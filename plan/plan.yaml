how_to_use:
  - "Triage incremental_review.prioritized_findings alongside open phases by severity; existing unresolved critical/high work stays ahead of new medium/low work. New follow-ups do not invalidate the recorded completion of earlier phase tasks."
  - "Open plan/phases/<id>-*.yaml for the phase you are executing. It is self-contained."
  - "Update `status` fields here AND in the phase file as tasks progress. Keep `changelog` below appended."
  - "Every phase uses RED -> GREEN -> REFACTOR. Never write production code before a failing test exists for it (pure-Kotlin modules). Compose-only work is validated by instrumented tests + manual device checks."
  - "Run only ONE Gradle invocation at a time on this host (gradle.properties pins 1 worker / 1 GB heap). If a run dies silently: ./gradlew --stop, then retry."
  - "Before starting a phase, re-verify each `assumptions[].verify_with` line; the codebase may have moved since 2026-09-18."
  - "Each phase ends with README.md sync (CLAUDE.md 'README Sync Policy – MANDATORY') and a PR-sized commit series using conventional-commit prefixes."

agent_execution_rules:
  branch_naming: "plan/<phase-id>-<slug>  (e.g. plan/P01-lan-discovery)"
  commit_prefixes: { feat: "new capability", fix: "bug fix", test: "tests only", refactor: "no behaviour change", docs: "docs only", chore: "build/CI" }
  commit_footer: "Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>"
  gradle_commands:
    all_tests: "./gradlew test --no-daemon"
    core_network_tests: "./gradlew :core-network:test --no-daemon"
    core_domain_tests: "./gradlew :core-domain:test --no-daemon"
    app_unit_tests: "./gradlew :app:testDebugUnitTest --no-daemon"
    single_test_class: "./gradlew :core-network:test --tests 'net.aieat.netswissknife.core.network.lan.LanScanRepositoryImplTest' --no-daemon"
    lint: "./gradlew :app:lintDebug --no-daemon --no-parallel"
    coverage_gates: "./gradlew :app:koverVerify :core-domain:koverVerify :core-network:koverVerify --no-daemon"
    debug_apk: "./gradlew :app:assembleDebug --no-daemon"
    release_apk_unsigned: "./gradlew :app:assembleRelease --no-daemon   # unsigned when no -PstoreFile"
    instrumented_apks: "./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon"
  invariants_that_must_never_break:
    - ":core-network and :core-domain contain zero Android SDK imports (grep -rn 'import android' core-network core-domain must be empty)."
    - "ViewModels: @HiltViewModel + @Inject constructor; state exposed as StateFlow<UiState>."
    - "Routes only in NavRoutes.kt; every composable{} in AppNavHost has enter/exit/popEnter/popExit transitions."
    - "All user-visible strings in res/values/strings.xml (no literals in composables)."
    - "Colours via MaterialTheme.colorScheme.* only."
    - "Kover floors: :app 90 (scoped includes), :core-network 70, :core-domain 70. Lowering a floor is its own commit with a stated reason."
    - "Lint: 0 errors (abortOnError=true)."
  definition_of_done_global:
    - "./gradlew test passes; ./gradlew :app:assembleDebug passes; ./gradlew :app:lintDebug has 0 errors."
    - "All three koverVerify tasks pass."
    - "README.md Features + Available Tools updated to actual behaviour."
    - "Phase file `status: done`, every task `status: done` or `dropped` with reason."

# -----------------------------------------------------------------------------
# PHASES (priority order = execution order)
# -----------------------------------------------------------------------------
phases:
  - id: P01
    file: plan/phases/P01-lan-scanner-discovery.yaml
    title: "LAN Scanner: correct host discovery, MAC/vendor enrichment, real gateway detection"
    priority: critical
    status: done
    depends_on: []
    findings: [F004, F005, F006, F040]
    summary: "ARP table is read before probing (and is unreadable on API 29+), discovery is ICMP-only, gateway is 'lowest IP'. Rewrite discovery as multi-probe (ICMP + TCP + NetBIOS/mDNS name) with post-probe enrichment and a platform-provided gateway/subnet source."

  - id: P02
    file: plan/phases/P02-topology-snmp-correctness.yaml
    title: "Network Topology: SNMPv3 actually works, LLDP/CDP neighbour parsing fixed, R8 keep rules"
    priority: critical
    status: done
    depends_on: []
    findings: [F001, F002, F003, F014]
    summary: "SNMPv3 credentials are never registered with SNMP4J's USM; LLDP reads the wrong column for neighbour IPs; CDP rejects hex-encoded addresses. Feature is advertised in the store listing and does not work on real hardware."

  - id: P02.5
    file: plan/phases/P02.5-dependency-security-remediation.yaml
    title: "Dependency security remediation: close authenticated Dependabot alerts"
    priority: critical
    status: in_progress
    depends_on: [P02]
    findings: [F041]
    summary: "Initial remediation upgrades Kotlin 2.4.20, AGP 9.4.1, and KSP 2.3.12 and pins affected build-only transitives. Exact-head ADS run 36080957304 for pushed topic HEAD b9f3d23 resolves every alerted coordinate to a patched version across 417 components, including OkHttp/MockWebServer 5.5.0; comparison with the preceding exact-head artifact found no dependency graph changes. T3 is confirmed for this snapshot. Current GitHub state has 10 alerts total (7 open, 3 fixed); main remains at pre-remediation SHA 5e18372 with the 2026-09-21 submission and its SBOM retains vulnerable build selections. The remaining P02.5/T4 gate is protected-main propagation, a fresh main ADS/SBOM and alert scan, and closure or approved time-bounded dispositions for all remaining actionable alerts."

  - id: P03
    file: plan/phases/P03-wifi-live-scanning.yaml
    title: "Wi-Fi Scanner: trigger real scans, honour throttling, configurable refresh, richer connection info"
    priority: high
    status: done
    depends_on: []
    findings: [F007, F039]
    summary: "Implemented live WifiManager.startScan() requests with receiver/timeout handling, freshness and throttle reporting, configurable 15/30/60-second or off refresh, Location Services state, LinkProperties IPv4/IPv6/gateway/DNS details, enterprise security mapping, and aligned API 33+ permission/privacy documentation."

  - id: P04
    file: plan/phases/P04-ping-dns-accuracy.yaml
    title: "Ping & DNS: accurate RTT (ICMP via icmpenguin, resolve-once), packet size/TTL, honest resolver labelling, correct record typing, IDN"
    priority: high
    status: done
    depends_on: []
    findings: [F008, F009, F010, F011, F025, F037]
    summary: "Implemented resolve-once ping sessions with icmpenguin ICMP and reachability fallback, configurable payload/TTL/interval, honest packet statuses and CSV output, plus typed DNS sections/RCODE/flags, resolver provenance, Private DNS awareness, IDN normalization, and matching UI/docs."

  - id: P05
    file: plan/phases/P05-local-network-binding-resilience.yaml
    title: "Local-network socket binding (VPN-safe), connectivity awareness, Android 16 LNP readiness"
    priority: high
    status: in_progress
    depends_on: []
    findings: [F012, F013]
    summary: "P05-T1 through T4 and T6 implement the Android-free binder and repository socket integration, Wi-Fi/Ethernet selection, mDNS interface binding with ephemeral QU fallback, and matching README/privacy documentation. P05-T5 now distinguishes definitive offline states from unvalidated-Internet, VPN-only, and unknown-transport advisories; banners report status without gating probes. On source commit 74e2c50, app tests (574), Android-test Kotlin compilation, lintDebug (0 errors), and assembleDebug passed. P05 remains in progress for connected API 33/API 36 banner execution, ENODEV, live SNMP, TalkBack, VPN, and physical-Wi-Fi checks. The release-brief source audit is recorded in plan/reviews/2026-09-23-release-qa-brief.yaml."

  - id: P06
