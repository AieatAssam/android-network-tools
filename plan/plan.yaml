      status: done
      commit: "recorded by git log: fix(net) WP20 commit on plan/ux-remediation-2026-10-31 (this block is part of it)"
      gates: "./gradlew test ktlintCheck detekt :app:assembleDebug :app:compileDebugAndroidTestKotlin :core-network:koverVerify :core-domain:koverVerify :app:koverVerify, one foreground-style run, BUILD SUCCESSFUL. ktlint: per-rule counts after ktlintGenerateBaseline (core-domain 864 to 863, core-network 6051 to 6040, app 5246 to 5246; no rule increased). New code was fixed, not baselined. Detekt baseline unchanged. Device checks deferred to WP21."
