        - "Process-death and Settings checks for Ping, TLS, HTTP Probe, Wi-Fi, mDNS, Topology and Speed Test: Ping host (SavedStateHandle key editedHost, written on each edit), TLS host and port (editedTlsHost and editedTlsPort, written on each edit, plus probe-protocol and expected-pin flags), HTTP Probe URL (editedHttpUrl), and the Wi-Fi and mDNS search fields (rememberSaveable) were already saved (no change). Ping's probe count and advanced sliders are not saved (see deferred). HTTP Probe deliberately keeps headers and body out of saved state (they can hold Authorization values). Topology keeps non-secret fields in rememberSaveable and the community string and v3 passwords in plain remember. Speed Test has no form inputs."
