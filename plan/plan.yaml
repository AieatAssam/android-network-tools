        - "TOPO-01: Discover Topology and Cancel moved out of the scrolling SNMP card into a fixed action area below it; keyboard Done on the seed field starts discovery (shared startDiscoveryIfReady guard). Not device-verified."
        - "TOPO-02: seed field has a leading router icon (ToolTextField)."
