# =============================================================================
# Net Swiss Knife – Remediation Plan 2026-10-31 (MASTER INDEX)
# Supersedes plan/archive/2026-10-30-previous/ (archived, read-only history).
# Source: on-device tablet QA by Haiku 5.5 agents (1200x1920, Android 8.0).
# Raw findings: plan/findings/{A-core,B-discovery,C-inspect,D-local}.md
# Goal: usability, quality, "AA commercial app" look/feel/behaviour.
# =============================================================================
meta:
  created: "2026-10-31"
  status_vocabulary: [todo, in_progress, blocked, done, dropped]
  executor: "Haiku 5.5 subagents, ONE work package at a time (single device, single Gradle invocation)"

rules_for_every_work_package:
  - "Finding IDs are namespaced by report file (TLS-05 and HTTP-05..07 collide between C-inspect and D-local): cite as C:TLS-05 / D:TLS-05."
  - "Findings were written by an AI tester. VERIFY each against the source before changing code; if false or already fixed, mark it no_change_needed in the WP result. Do not 'fix' unverified claims blindly."
  - "TDD per CLAUDE.md: failing test first for logic bugs (core-network/core-domain/ViewModel). UI-only fixes need a Compose/instrumented or unit test where practical."
  - "Follow CLAUDE.md UI requirements and Architecture Invariants. All strings in strings.xml. Update README Features/Available Tools when behaviour changes."
  - "Before finishing: ./gradlew test ktlintCheck detekt --no-daemon --no-parallel, then :app:assembleDebug. Run koverVerify if logic changed. Never lower a coverage floor."
  - "One Gradle invocation at a time. Do not run adb/device tests; the orchestrator re-tests on the tablet."
  - "Commit on branch plan/ux-remediation-2026-10-31, one commit per WP, message 'fix(<area>): ...'. Do not push."
  - "Fill in the WP's result block in this file (status, findings fixed / not reproduced / deferred, commit sha)."

work_packages:
  - id: WP01
    title: Shared UI foundations (tablet layout, touch targets, keyboard, clear/icon patterns)
    status: done
    findings: [A:SHELL-02, A:SHELL-03, A:SHELL-05, A:PING-04, A:DNS-05, B:GAP-01, C:HTTP-03, C:HTTP-04, C:SUB-04, C:SUB-09, D:MDNS-02, D:HTTP-07, C:APP-01, C:APP-02]
    scope: >
      Create/reuse shared composables: max-content-width + centered layout for >=600dp (and two-pane where
      natural, e.g. form left / results right in landscape), 48dp minimum touch targets for clear/help/remove
      icons, IME handling (imePadding, dismiss keyboard on submit, keep primary action visible), input
      trimming helper, a standard ToolTextField (leading icon + clear button). Apply across all tool screens.
    done_when: "no tool screen stretches full-width on tablet; clear/help/remove icons >=48dp; keyboard never covers primary action or results; trimmed inputs"
    result:
      status: done
      commit: "7912dbc"
      gates: "test, ktlintCheck, detekt, :app:assembleDebug, :app:compileDebugAndroidTestKotlin all green. koverVerify not run (no production logic changed). Device re-test deferred to WP18."
      fixed:
        - "A:SHELL-03, A:PING-03 (IME/primary action): content padded by IME inset (and nav bar on rail) in MainActivity. Not device-verified."
        - "A:SHELL-05: explicit 48dp touch targets on recent-host remove/clear and hero help; ToolClearButton 48dp."
        - "A:SHELL-02 (width part), C:SUB-04, B:GAP-01 (width part): AdaptiveContentMaxWidth 840dp -> 640dp."
        - "C:APP-01: Home grid bottom padding clears the scroll hint. A:SHELL-01 (WP15) also addressed incidentally by the nav-bar inset."
        - "C:APP-02: RecentHostsRow re-anchors to first chip on change; contentPadding added. A:PING-07 and D:TLS-05 may be improved incidentally (not verified)."
        - "D:MDNS-02: search field leading icon and clear."
        - "D:HTTP-07: request body leading icon and clear."
        - "C:SUB-09 (partial): URI keyboard for Subnet IP fields and keyboard dismissed on submit."
        - "A:DNS-05 (partial): keyboard dismissed on Look up (search) action."
        - "C:HTTP-04: already handled in source (onDone clears focus); no further change. Verify on device at WP18."
      not_reproduced:
        - "C:HTTP-03 (trailing space): HttpProbe and HostValidator already trim. Added regression tests (HttpProbeUrlWhitespaceTest, HostValidatorTest). no_change_needed in code."
      deferred:
        - "A:PING-04 (advanced slider reset/defaults): owned by WP02 per its notes."
        - "A:SHELL-02 (two-pane / tall portrait config card) and B:GAP-01 (master/detail): two-pane layout not built; width cap only. Traceroute height is WP03."
