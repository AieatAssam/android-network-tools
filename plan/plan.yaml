      fixed:
        - "VERIFY-2:V-07 (RDAP 403): every RDAP request (bootstrap and lookup) sends a NetSwissKnife/<version> User-Agent. The version comes from BuildConfig through rdapUserAgent(), so core-network has no Android import. Auto mode keeps the RDAP error (WhoisResult.rdapFallbackReason) and the WHOIS result shows it as a note. Tests: RdapUserAgentTest (MockWebServer asserts the header on IP and domain bootstrap requests), WhoisRdapIntegrationTest fallback-note tests. Not device-verified."
        - "VERIFY-2:TLS-05 (port 80 generic Handshake failed): root cause is in the message patterns. The plaintext check matched 'wrong version number' with spaces, but OpenSSL/Conscrypt print WRONG_VERSION_NUMBER with underscores. JSSE ('Unrecognized SSL message, plaintext connection?') and Conscrypt ('Unable to parse TLS packet header') were not matched either. Android reports the top-level 'Handshake failed', so the cause chain is walked. Tests: TlsInspectorRepositoryFakeEngineTest variants and wrapper case. NOT done: byte-level detection of an HTTP/1. reply. The socket layer does not expose the reply bytes, and the exact device string was not captured from logcat, so the variant list is inferred from provider sources, not device-confirmed."
        - "VERIFY-2:TLS-04 (SSL.com root): when the only chain finding is UNTRUSTED, TlsInspectorResult.untrustedRootName names the issuing root (issuer CN of the last chain certificate). The finding reads 'This device's trust store does not include the issuing root (<name>)'. The verdict stays untrusted. Tests: ChainAnalyzerTest, repository tests (named when sole finding; not named when expired too)."
        - "VERIFY-2:V-04 (HTTP Probe Cancel ignored, intermittent): the root cause could not be reproduced from source. The fix makes Cancel authoritative in HttpProbeViewModel: once Cancel is pressed, the request ends as canceled whatever the call returns (a result, or a timeout error reported after cancellation). cancel() no longer depends on operationSession being non-null. Test: a call that ignores cancellation and reports NETWORK_TIMEOUT ends as Request canceled with no error. The existing Stopping-until-cleanup test is unchanged. Not device-verified."
        - "VERIFY-2:V-03 (WoL re-save renames): WolSavedDevices.upsert keeps the stored name when the typed name is blank; a typed new name renames. WolSavedDevices.saveNotice and WolSaveNotice produce a note ('Already saved as X. The saved name was kept.' or 'Already saved as X. Renamed to Y.') shown under the form. Edit mode is unchanged (a cleared name there is intentional). Tests: WolSavedDevicesTest, WakeOnLanViewModelTest."
        - "VERIFY-1:V-04 (trace past the destination): IcmpEnginTracerouteRepositoryImpl stops collecting native hops once TracerouteStopPolicy reports the destination (destinationReached), so later in-flight TTLs are dropped and native probing stops. Tests: IcmpEnginTracerouteRepositoryImplTest (hops 1 to 11 only), TracerouteStopPolicyTest."
        - "VERIFY-1:V-05 (30 hops from own IP, Reached No): TracerouteStopPolicy treats two or more consecutive hop replies from this device's own addresses (NetworkInterface, passed in) as unreachable and stops early. TracerouteFlowResult.UnreachableFromThisDevice is emitted after the hops, TracerouteResult.unreachableFromThisDevice drives the message 'Host unreachable from this network (no route / destination host unreachable)'. Tests: TracerouteStopPolicyTest, IcmpEnginTracerouteRepositoryImplTest, TracerouteUseCaseTest. Not device-verified."
      not_reproduced:
        - "VERIFY-2:V-03 name-field sub-claim ('name field still shows dup'): saveDevice already clears the name field after saving. The test asserts the field is empty after a re-save. Not reproduced from source."
