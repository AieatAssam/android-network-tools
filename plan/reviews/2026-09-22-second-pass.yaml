  - id: R2-009
    severity: medium
    kind: isolation_gap
    status: done
    title: "WHOIS shared progress needed overlap and consumer-isolation coverage"
    related_phase: P10
    implementation_task: E03-T03
    evidence:
      - { file: core-network/src/main/kotlin/net/aieat/netswissknife/core/network/whois/WhoisRepositoryImpl.kt, line: 58, detail: "Each lookup passes its caller-owned operation ID into progress construction before emitting on the repository SharedFlow." }
      - { file: app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/whois/WhoisViewModel.kt, line: 110, detail: "The collector accepts a hop only while its session is current and the hop operation ID matches that session." }
    impact: "Without overlap and consumer-isolation coverage, future changes could mix delayed hop events between lookups even while terminal results remain guarded."
    recommended_action: "Keep operation IDs on every progress event and filter by current session at each consumer; retain regression coverage for overlap, replacement, cancellation, and independent consumers."
    validation: "WhoisCancellationTest passed 14/14, including two concurrent real repository lookups released in reverse order; each hop's operation ID and raw socket-response marker matched its own result. WhoisViewModelTest and its nested lookup-state suite passed 12/12, covering delayed events after replacement and two independent ViewModels consuming the shared stream. Separate QA and adversarial reviews found no blocker."
    completion_evidence:
      - { file: core-network/src/test/kotlin/net/aieat/netswissknife/core/network/whois/WhoisCancellationTest.kt, detail: "Gated sockets force two concurrent repository lookups to overlap and complete in reverse order; assertions bind each event to its operation ID and unique raw response." }
      - { file: app/src/test/kotlin/net/aieat/netswissknife/app/ui/screens/whois/WhoisViewModelTest.kt, detail: "Replacement lookup drops delayed old-session progress, and independent ViewModels display only their own operation's hops." }

  - id: R2-010
    severity: high
    kind: resource_gap
    status: done
    title: "Topology fan-out and SNMP walks can grow before UI caps take effect"
    related_phase: P02
    implementation_task: E03-T05
    evidence:
      - { file: core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/TopologyDiscoveryRepositoryImpl.kt, line: 32, detail: "Visited, queue, allNodes and allLinks grow across traversal; maxHops limits depth, not fan-out or retained entries." }
      - { file: core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/Snmp4jClientImpl.kt, line: 109, detail: "getSubtree materializes walk events before collectWalkResults builds another map; a UI row cap cannot bound this stage." }
    impact: "A dense or adversarial SNMP graph can consume substantial memory/network work with a small hop depth. Bounded rendering does not make repository collection bounded."
    recommended_action: "Add node/link/pending-queue/per-device-interface/VLAN/walk-entry and byte budgets at producers. Replace full-subtree materialization with a bounded streaming walk seam where needed; stop scheduling and report partial/truncated reasons when caps are reached."
    validation: "Passed `./gradlew :core-network:test --no-daemon --no-parallel` (844 tests, 0 failures/errors, 1 skipped) and `./gradlew :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin --no-daemon --no-parallel`. Focused loopback, repository, and walk-budget suites pass. Synthetic fan-out and exact/over-cap tests verify bounded traversal, retained walk rows/bytes, node/link/queue/interface/VLAN/graph budgets, error metadata, and cancellation including removal of a real pending SNMP4J GET. UI partial-results tests compile; instrumentation was not run on an emulator. QA and adversarial reviews cleared the final diff."
    fixed_in: "cb121505cab96bd1de4d37f2de30f714e39f665d"
    completion_evidence:
      - { file: core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/Snmp4jClientImpl.kt, line: 150, detail: "TreeListener streaming retains only values admitted by per-walk/device entry and byte budgets; GET requests are asynchronous and cancellation removes the pending SNMP4J request." }
      - { file: core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/TopologyDiscoveryRepositoryImpl.kt, line: 53, detail: "Node/link/pending target, per-node interface/VLAN, scalar and graph byte limits are enforced before admitting retained results or scheduling more work." }
      - { file: core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/TopologyModels.kt, line: 26, detail: "TopologyResourceLimits validates finite defaults and hard upper bounds; completed graphs carry truncation and SNMP-error metadata." }
      - { file: app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/topology/TopologyDiscoveryScreen.kt, line: 485, detail: "The completed topology view shows an accessible partial-results notice when limits truncate results or SNMP requests fail." }
      - { file: core-network/src/test/kotlin/net/aieat/netswissknife/core/network/topology/Snmp4jClientImplLoopbackTest.kt, line: 179, detail: "Loopback tests verify listener walk caps, final-page retention, and cancellation removing a pending request from SNMP4J's request registry." }

  - id: R2-011
    severity: medium
    kind: privacy_gap
    status: done
    title: "Crash diagnostics bypass the planned redaction and payload-size limits"
    related_phase: P09
    implementation_task: E03-T06
    evidence:
      - { file: app/src/main/kotlin/net/aieat/netswissknife/app/crash/CrashHandler.kt, line: 19, detail: "Full stack trace and exception message are rendered into an Intent with no explicit size/redaction policy." }
      - { file: app/src/main/kotlin/net/aieat/netswissknife/app/crash/CrashActivity.kt, line: 84, detail: "Copy/share builds a report from raw crash extras, outside AppLogger and the planned report exporter." }
    impact: "Secret-bearing exception text or paths can reach default crash reports, while very large payloads can prevent delivery of the crash UI. The logger-only redaction scope misses this separate pipeline."
    recommended_action: "Use a small bounded sanitized crash-report builder before Intent creation; avoid unbounded StringWriter expansion. Preserve default-handler invocation even if pre-handle hooks/report construction fail. Route crash copy/share through the report privacy policy."
    validation: "Synthetic multi-megabyte messages, nested causes and secret/path fixtures produce bounded sanitized extras; failing hooks/builders still call the default handler once. Copy/share uses sanitized content and does not crash recursively."
    completion_evidence:
      - { file: app/src/main/kotlin/net/aieat/netswissknife/app/crash/CrashReportBuilder.kt, detail: "Crash extras use per-field UTF-8 caps, bounded cause/frame traversal, conservative secret/header/URI/path/IP redaction, and a 48 KiB copy/share report budget." }
      - { file: app/src/main/kotlin/net/aieat/netswissknife/app/crash/CrashHandler.kt, detail: "Hook, report building, and Activity launch are best-effort; the default uncaught handler is delegated exactly once from finally." }
      - { file: app/src/test/kotlin/net/aieat/netswissknife/app/crash/CrashReportBuilderTest.kt, detail: "Regressions cover multi-megabyte nested messages/frames, quoted and escaped JSON secrets, generic URI schemes, auth/cookie headers, spaced Unix/Windows/UNC paths, IP/CIDR redaction across all Intent fields, malformed Unicode, metadata bounds, and bounded copy/share formatting." }
      - { file: app/src/test/kotlin/net/aieat/netswissknife/app/crash/CrashHandlerTest.kt, detail: "Hook, builder, and launch failure cases all verify exactly-once default-handler delegation; the successful path verifies sanitized report fields." }
      - { command: "./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon --no-parallel --max-workers=1", detail: "2026-09-24 verification: 519 app unit tests passed, Android-test Kotlin compilation passed, and app debug lint passed. Instrumentation tests were compiled but not run on a device." }
    scope_note: "R2-011 is closed. E03-T06 remains todo for the separate app-wide structured logging, debug-log export, and observability work; this slice does not complete that broader phase."

  - id: R2-012
    severity: medium
    kind: plan_gap
    status: done
    title: "Response limits cover bodies but do not define header-count or metadata budgets"
    related_phase: P10
    implementation_task: E03-T04
    evidence:
      - { file: core-network/src/main/kotlin/net/aieat/netswissknife/core/network/httprobe/HttpProbeRepositoryImpl.kt, line: 151, detail: "Every header list is copied into responseHeaders; the configurable maxResponseBodyBytes applies only to the body reader." }
      - { file: plan/expansion/E03-performance-reliability-and-quality.yaml, line: 329, detail: "Shared byte budgets focus on response bodies; transport header parsing/retention limits are not specified." }
    impact: "Application-level response-size guarantees do not cover headers or their subsequent UI/export copies. Transport implementations may impose their own limits, but the app neither defines nor verifies a portable contract."
    recommended_action: "Define aggregate decoded-metadata bytes, raw field-occurrence count, and per-value limits at the engine boundary; document parser enforcement and test before materialization. Preserve repeated field values and reject over-limit responses with a typed outcome. Do not claim bounded parser memory from post-materialization truncation."
    validation: "E03-T04 now sets 100 response field occurrences, 65,536 decoded metadata bytes, and 16,384 UTF-8 bytes per field value. Limits are checked before collection allocation; duplicate names are case-insensitive, each occurrence counts separately, and values retain per-name arrival order without comma-folding Set-Cookie. Any exceeded limit rejects the response with ResponseMetadataLimitExceeded so security grading cannot mistake omitted headers for absent headers. Boundary, duplicate, scripted-engine, and selected-transport parser tests are required. This closes the plan gap only; E03-T04 implementation remains todo behind E03-T01/P05-T1/P05-T2."
    completion_evidence:
      - { file: plan/expansion/E03-performance-reliability-and-quality.yaml, detail: "E03-T04 defines exact header occurrence, decoded metadata byte, and per-value limits plus duplicate-field and typed rejection semantics." }
      - { file: plan/expansion/E03-performance-reliability-and-quality.yaml, detail: "E03-T04 acceptance criteria require cap boundary tests at the engine parser before materialization and the selected transport's integration path." }

  - id: R2-013
    severity: high
    kind: correctness_gap
    status: done
    title: "Port scan reports one resolved address but sends probes using the hostname again"
