    impact: "Changing DNS answers or different address selection can make ports attributed to one IP actually belong to another. It also undermines explicit target/network selection and trustworthy scan comparisons."
    recommended_action: "Resolve and select an immutable literal endpoint before scheduling; use it for every connection and report. Fail clearly if resolution fails; represent multiple selected addresses as separate per-address scans. Preserve the hostname separately for display and TLS SNI where applicable."
    validation: "Passed `./gradlew :core-network:test --tests '*PortScanRepositoryImplTest' :core-domain:test --tests '*PortScanUseCaseTest' --no-daemon --no-parallel` and `./gradlew :app:testDebugUnitTest --no-daemon --no-parallel`. Tests inject an alternating DNS resolver and verify one resolution, the same IPv4 address for every probe and summary, selected IPv6 identity, and resolution failure before any probe. The app suite passes after the separate LAN diagnostic punctuation correction. QA and adversarial reviews cleared the endpoint-pinning diff."
    fixed_in: "fcd69926d6b8025c3bd579bcdd5a82758d1af8dc"
    completion_evidence:
