review:
  area: E03-T01 operation resource-scope adapters
  status: implementation_slice_verified
  date: 2026-09-23
  branch: plan/comprehensive-review-2026-09-22
  prior_portscan_commits: [6b705a3, ece00a1]

scope:
  - "Port Scan closes active sockets on cancellation and emits Started only after worker socket slots are registered, so a first()-only collector cannot cancel midway through setup."
  - "LAN Scan owns default TCP presence, TCP enrichment, and correlated UDP sockets through one per-collection OperationSession; resources are released after each probe or closed on cancellation."
  - "Probe-local CancellationException cancels the operation owner so the resource-close callback runs before sibling workers are joined."
  - "Reverse-DNS enrichment uses a per-call timeout and a finite two-worker/four-queue executor; timeout and cancellation remove queued tasks and request worker interruption."
  - "Progress/completion remains guarded by operation cancellation; no ScanComplete is emitted after cancellation."
  - "WHOIS now creates an INTERNET OperationSession with a shared monotonic three-hop deadline, one-probe concurrency, and a response-byte limit. Each active socket is registered in the operation ResourceScope and released by a single idempotent lease after completion or cancellation."
  - "WHOIS progress checks the shared deadline before each hop emission; deadline exceptions pass through hop fallback handling to the stable total-deadline error mapping."
  - "The bounded WHOIS executor closes the cancel-before-enqueue race with a post-submit cancellation check; cancelled queued work is removed, while active sockets close through the operation scope."

validation:
  command: "./gradlew :core-network:test :core-domain:test :app:testDebugUnitTest --no-daemon --no-parallel"
  status: passed
  result: "core-network, core-domain, and app unit suites completed with zero failures after the WHOIS shared-budget deadline fix. Focused WHOIS tests also passed before the full run."
  additional: "git diff --check passed."

reviewers:
  qa: "Cleared the LAN sibling-cancellation path, reverse-DNS worker cancellation/enqueue race, Port Scan Started ordering, and WHOIS budget/deadline/socket ownership changes."
  adversarial: "Cleared the LAN and Port Scan paths after fixes; for WHOIS, caught a split-clock deadline path that could become a partial hop result. The adapter now uses the shared budget and rethrows deadline exceptions; follow-up review cleared the fix."

limits:
  - "InetAddress.isReachable and platform address resolution do not expose closeable handles. The ICMP call receives its per-host timeout and checks cancellation after return; a platform implementation may still overrun that timeout."
  - "A native reverse-DNS resolver may ignore thread interruption. Caller cancellation returns promptly, while the fixed executor bounds residual resolver work to two workers and four queued requests; excess lookups return no name."
  - "Platform WHOIS DNS resolution may ignore thread interruption. The caller still returns promptly, while the shared fixed executor bounds residual work to two workers and sixteen queued requests; excess submissions fail with a bounded-worker rejection."
  - "API 33 SNMP lab, TalkBack, and physical-Wi-Fi checks from the supplied release QA brief remain device-only; see 2026-09-23-release-qa-brief.yaml."

phase_disposition:
  E03-T01: "in_progress; Port Scan, LAN Scan, and WHOIS adapters are validated. Other tool adapters, static CI enforcement, and phase-wide/device gates remain open."
