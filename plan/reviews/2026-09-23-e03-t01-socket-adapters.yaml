review:
  area: E03-T01 operation resource-scope adapters
  status: implementation_slice_verified
  date: 2026-09-23
  branch: plan/comprehensive-review-2026-09-22
  prior_portscan_commits: [6b705a3, ece00a1]

scope:
  - "Port Scan closes active sockets on cancellation and emits Started only after worker socket slots are registered, so a first()-only collector cannot cancel midway through setup."
  - "LAN Scan owns default TCP presence, TCP enrichment, and correlated UDP sockets through one per-collection OperationSession; resources are released after each probe or closed on cancellation."
  - "Probe-local CancellationException cancels the operation owner so the resource-close callback runs before sibling workers are joined."
  - "Reverse-DNS enrichment uses a per-call timeout and a finite two-worker/four-queue executor; timeout and cancellation remove queued tasks and request worker interruption."
  - "Progress/completion remains guarded by operation cancellation; no ScanComplete is emitted after cancellation."
  - "WHOIS now creates an INTERNET OperationSession with a shared monotonic three-hop deadline, one-probe concurrency, and a response-byte limit. Each active socket is registered in the operation ResourceScope and released by a single idempotent lease after completion or cancellation."
  - "WHOIS progress checks the shared deadline before each hop emission; deadline exceptions pass through hop fallback handling to the stable total-deadline error mapping."
  - "The bounded WHOIS executor closes the cancel-before-enqueue race with a post-submit cancellation check; cancelled queued work is removed, while active sockets close through the operation scope."
  - "mDNS now uses a per-collection LOCAL_NETWORK OperationSession with a clamped monotonic scan window that includes setup and the initial query; multicast lock, socket, and group membership are registered in LIFO cleanup order."
  - "mDNS cancellation closes blocked receive/join work, preserves USER_STOP and LIFECYCLE_PAUSE, emits no late update, and emits DiscoveryComplete only after successful cleanup. Expected deadline completion is withheld when cleanup failures appear anywhere in the deadline/cancellation cause chain."
  - "TLS Inspector now accepts a caller-owned ANY_NETWORK OperationSession through repository and use-case overloads, enforces the shared 500–30,000 ms timeout bounds, measures handshake time monotonically, and registers its SSLSocket before connect/handshake. User/lifecycle cancellation remains cancellation; deadline expiry maps to the established TLS error UI wording."
  - "OperationRunner preserves eager ResourceScope close failures on one canonical cause even when coroutine exception recovery copies the surfaced failure; regressions cover ordinary failure, user stop, and deadline cleanup without duplicate suppression. TLS-specific tests cover blocked connect/handshake deadlines and a throwing close during deadline mapping."

validation:
  command: "./gradlew :core-network:test :core-domain:test :app:testDebugUnitTest --no-daemon --no-parallel"
  status: passed
  result: "Full core-network/core-domain/app unit suites passed: 982 core-network tests (1 skipped), 174 core-domain tests, and 359 app tests; zero failures/errors. OperationRunnerTest also passed in isolation; a focused combined TLS/OperationRunner invocation intermittently hit virtual-time join timeouts in two existing OperationRunner tests, but the complete module run passed."
  additional: "The full suite includes 18 TLS repository tests, 16 use-case tests, and 15 ViewModel tests, all passing. Coverage includes blocked connect/handshake cancellation, deadline message and cleanup mapping, lifecycle stop, ordinary connect failure with close failure, success mapping, and single-close ownership. CI resource-site checker tests passed (4); its ledger check inventories 15 sites (7 reviewed, 8 follow-ups, 0 open reviews), and git diff --check passed."

reviewers:
  qa: "Cleared LAN sibling-cancellation, reverse-DNS worker cancellation/enqueue, Port Scan Started ordering, WHOIS ownership, mDNS receive/join cancellation/lifecycle/deadline cleanup, and TLS session forwarding, lifecycle ordering, timeout wording, and cleanup-failure reporting."
  adversarial: "Cleared LAN and Port Scan after fixes; for WHOIS, caught split-clock deadline handling. For mDNS, caught the deadline-success/cleanup-failure case. For TLS/OperationRunner, caught deadline wording and duplicate suppression placement; both were corrected and the final review found no actionable blocker."

limits:
  - "InetAddress.isReachable and platform address resolution do not expose closeable handles. The ICMP call receives its per-host timeout and checks cancellation after return; a platform implementation may still overrun that timeout."
  - "A native reverse-DNS resolver may ignore thread interruption. Caller cancellation returns promptly, while the fixed executor bounds residual resolver work to two workers and four queued requests; excess lookups return no name."
  - "Platform WHOIS DNS resolution may ignore thread interruption. The caller still returns promptly, while the shared fixed executor bounds residual work to two workers and sixteen queued requests; excess submissions fail with a bounded-worker rejection."
  - "API 33 SNMP lab, TalkBack, and physical-Wi-Fi checks from the supplied release QA brief remain device-only; see 2026-09-23-release-qa-brief.yaml."
  - "The E03 target of <=500 ms cleanup is not measured by these JVM tests; real MulticastSocket interruption, API 33 ENODEV, physical-interface selection, multicast discovery, and port-5353 conflict behavior remain device checks."

phase_disposition:
  E03-T01: "in_progress; Port Scan, LAN Scan, WHOIS, mDNS, and TLS Inspector adapters are validated. CI inventories raw resource sites and rejects unlisted/banned patterns; 7 of 15 sites are scope-registered/reviewed and 8 explicit legacy follow-ups remain. Other tool adapters, phase-wide gates, and device cleanup measurements remain open."
