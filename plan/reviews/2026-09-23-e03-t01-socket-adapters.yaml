review:
  area: E03-T01 operation resource-scope adapters
  status: implementation_updated_validation_pending
  date: 2026-09-24
  checked_commit: 2cded156460dbf2e56f09a42d71016590a50758e
  checked_worktree_commit: 5efafea
  branch: plan/comprehensive-review-2026-09-22
  prior_portscan_commits: [6b705a3, ece00a1]

scope:
  - "Port Scan closes active sockets on cancellation and emits Started only after worker socket slots are registered, so a first()-only collector cannot cancel midway through setup."
  - "LAN Scan owns default TCP presence, TCP enrichment, and correlated UDP sockets through one per-collection OperationSession; resources are released after each probe or closed on cancellation."
  - "Probe-local CancellationException cancels the operation owner so the resource-close callback runs before sibling workers are joined."
  - "Reverse-DNS enrichment uses a per-call timeout and a finite two-worker/four-queue executor; timeout and cancellation remove queued tasks and request worker interruption."
  - "Progress/completion remains guarded by operation cancellation; no ScanComplete is emitted after cancellation."
  - "WHOIS now creates an INTERNET OperationSession with a shared monotonic three-hop deadline, one-probe concurrency, and a response-byte limit. Each active socket is registered in the operation ResourceScope and released by a single idempotent lease after completion or cancellation."
  - "WHOIS progress checks the shared deadline before each hop emission; deadline exceptions pass through hop fallback handling to the stable total-deadline error mapping."
  - "The bounded WHOIS executor closes the cancel-before-enqueue race with a post-submit cancellation check; cancelled queued work is removed, while active sockets close through the operation scope."
  - "mDNS now uses a per-collection LOCAL_NETWORK OperationSession with a clamped monotonic scan window that includes setup and the initial query; multicast lock, socket, and group membership are registered in LIFO cleanup order."
  - "mDNS cancellation closes blocked receive/join work, preserves USER_STOP and LIFECYCLE_PAUSE, emits no late update, and emits DiscoveryComplete only after successful cleanup. Expected deadline completion is withheld when cleanup failures appear anywhere in the deadline/cancellation cause chain."
  - "TLS Inspector now accepts a caller-owned ANY_NETWORK OperationSession through repository and use-case overloads, enforces the shared 500–30,000 ms timeout bounds, measures handshake time monotonically, and registers its SSLSocket before connect/handshake. User/lifecycle cancellation remains cancellation; deadline expiry maps to the established TLS error UI wording."
  - "OperationRunner preserves eager ResourceScope close failures on one canonical cause even when coroutine exception recovery copies the surfaced failure; regressions cover ordinary failure, user stop, and deadline cleanup without duplicate suppression. TLS-specific tests cover blocked connect/handshake deadlines and a throwing close during deadline mapping."
  - "HTTP Probe now accepts a caller-owned ANY_NETWORK OperationSession through repository/use-case/ViewModel, applies a one-request concurrency bound and request deadline, and registers each redirect connection in the ResourceScope before I/O. Close-once leases disconnect abandoned connections, remaining-budget timeouts bound blocking reads, and cancellation is rechecked before results are emitted."
  - "Speed Test now accepts a caller-owned ANY_NETWORK OperationSession through repository/use-case/ViewModel with a 120-second operation deadline. Close-once connection leases disconnect before closing active streams so cancellation releases blocked reads; operation checks guard latency, progress, and terminal events, while deadline expiry maps to the existing failed-result UI state."
  - "mDNS receive failures now check the shared operation session as well as coroutine-job state. This preserves typed deadline/cancellation when the first-wins reason is recorded just before job cancellation becomes observable; cleanup failures remain attached and successful completion remains withheld."
  - "Topology/SNMP now accepts a caller-owned LOCAL_NETWORK OperationSession; each collection has a 120-second bounded session, and the SNMP client is registered with close-once ownership before queries. Cancel/reset/lifecycle cleanup is dispatched on a process-lifetime IO scope so SNMP teardown cannot block the UI."
  - "Wake-on-LAN now accepts a caller-owned LOCAL_NETWORK session, registers its close-once UDP socket before binding/sending, and rejects nonnumeric broadcast hostnames before socket creation so cancellation cannot wait on DNS."
  - "Traceroute and per-hop GeoIP enrichment share one caller-owned ANY_NETWORK session. `OperationRunner.runOrJoin` lets the traceroute and GeoIP repository adapters reuse that single resource scope across multiple hops; GeoIP connections are registered before I/O, reads are bounded, and connections are released after each lookup."
  - "Ping now carries a caller-owned OperationSession through the UI, domain use cases, repository, and engines. Finite requests derive a saturating request-based budget; continuous requests explicitly use an unbounded session with concurrency one. DNS/reachability blocking calls use a bounded executor registered to the session, and native ICMP flow collection owns the job lease that closes the library Pinger on cancellation. ViewModel Stop/lifecycle paths retain typed cancellation reasons."
  - "Traceroute offline handling now publishes an immediate NetworkStatusBanner and a Ping-style no-network error with Retry/Clear. Preflight accepts local-only and VPN-only networks as well as validated internet, avoiding rejection of viable private/VPN routes."
  - "DNS now forwards one caller-owned ANY_NETWORK OperationSession from ViewModel through use case and repository, with an 8-second deadline, explicit Stop/lifecycle cancellation, and scoped per-query UDP/TCP sockets. DNS transport filters UDP replies to the configured resolver, removes cancelled queued work from its bounded executor, and interrupts dnsjava's blocking send wait during the UDP-to-TCP continuation gap."
  - "Wi-Fi scan now forwards a caller-owned LOCAL_NETWORK OperationSession through ViewModel, use case, and repository with a 12-second bound and concurrency one. The Android scan receiver is a close-once scoped lease; Stop and lifecycle pause close the wait/receiver, suppress stale results, retain prior successful results, and keep user-disabled auto-refresh off across resume. Android startScan() itself cannot be cancelled."
  - "Traceroute reverse-DNS enrichment no longer blocks hop collection: lookups run in a process-wide daemon executor bounded to two workers and eight queued tasks, with a 1-second maximum wait capped by remaining operation time. Cancellation removes queued work and prevents late results; timeout, saturation, and ordinary lookup failure retain the numeric hop."
  - "LAN Scan now forwards one caller-owned LOCAL_NETWORK session through the use case and repository. User Stop, foreground pause, and ViewModel clearing record typed reasons; lifecycle cleanup is registered before viewModelScope so AndroidX cannot cancel the collector first. Current-operation identity guards prevent stale completions from replacing newer results."
  - "Port Scan now forwards one caller-owned LOCAL_NETWORK session through ViewModel, use case, and repository. The repository caps actual workers by both requested concurrency and session budget, owns active sockets in the scope, and stale flow emissions/errors cannot overwrite a replacement scan."
  - "WHOIS now forwards one caller-owned INTERNET session through ViewModel, use case, and repository. The caller's shared deadline and response-byte budget apply across the referral chain; operation-tagged progress is filtered to the active lookup, and cancellation closes active/queued transport work."
  - "LAN, Port Scan, and WHOIS repository compatibility overloads delegate to the old API by default; production resource-owning implementations override them to enforce the caller session."

validation:
  command: "./gradlew :core-network:test --tests '*PortScanRepositoryImplTest' --tests '*WhoisBlockingTransportTest' --tests '*WhoisCancellationTest' --tests '*TlsInspectorRepositoryImplTest' --no-daemon --no-parallel --console=plain; ./gradlew :core-domain:test --no-daemon --no-parallel --console=plain; ./gradlew :app:testDebugUnitTest --tests '*LanScanViewModelTest' --tests '*LanScanGatewayViewModelTest' --tests '*PortScanViewModelTest' --tests '*WhoisViewModelTest' --tests '*BoundedTracerouteReverseDnsLookupTest' --no-daemon --no-parallel --console=plain"
  status: focused_validation_passed_full_suite_pending
  result: "The focused core-network repository/transport/TLS suite passed; the complete core-domain suite passed (184 tests); the focused app tests passed for LAN, Ports, WHOIS, gateway handoff, and bounded Traceroute reverse DNS (52 tests). The app instrumented-test Kotlin source also compiled in the earlier validation attempt. A broader unfiltered app test run was not completed: it reported unrelated Wi-Fi ViewModel test failures and then stalled in a Wi-Fi order-freeze test, so no full-suite pass is claimed."
  additional: "After removing the unused LAN and Port Scan helpers, `:core-network:test --tests '*LanScanRepositoryImplTest' --tests '*LanScanDiscoveryPipelineTest' --tests '*PortScanRepositoryImplTest' --no-daemon --no-parallel --console=plain` passed 25 tests (5 LAN repository, 11 discovery pipeline, 9 Port Scan), including the repository-path shouldBind=false/default-route regression. The raw-resource checker passes (14 raw sites, 14 reviewed registrations, 0 legacy follow-ups, 0 open reviews), its four Python tests pass, strings.xml parses, and `git diff --check` passes. No emulator or connected test was used."

reviewers:
  qa: "Earlier reviews cleared LAN sibling-cancellation, reverse-DNS worker cancellation/enqueue, Port Scan Started ordering, WHOIS ownership, mDNS receive/join cancellation/lifecycle/deadline cleanup and the receive cancellation race, TLS session forwarding/lifecycle/cleanup, and HTTP Probe plus Speed Test operation ownership, lifecycle cleanup, deadline mapping, and blocked-read cancellation. Follow-up reviews cleared Topology/SNMP, WOL, Traceroute/GeoIP, Ping's native collection lease and request-derived session budgets, Traceroute local/VPN offline handling, DNS session wiring, Stop/lifecycle cleanup, deadline mapping, and resolver failover. Fresh Wi-Fi review confirms the manual-Off lifecycle fix and distinct Paused state; a positive enabled-refresh resume assertion has now been added. Wi-Fi runtime behavior and cleanup latency remain device-only."
  adversarial: "Earlier reviews cleared LAN and Port Scan after fixes; WHOIS split-clock handling; mDNS cleanup failures and the receive cancellation race; TLS/OperationRunner deadline wording and duplicate suppression; and HTTP Probe/Speed Test close ordering and cancellation races. Reviews found and prompted fixes for Topology cleanup on the caller thread, WOL hostname resolution, GeoIP session reuse across hops, a stale Traceroute emission after an offline restart, and VPN-only false-offline behavior. Ping queue/cancellation behavior and native ICMP resource ownership were also reviewed without a remaining blocker. DNS review prompted connected UDP/source filtering, removal of cancelled queued tasks, and cancellation interruption for the blocking resolver wait. Fresh LAN/Port Scan review found and prompted fixes for lifecycle cancellation ordering, stale Port Scan emissions, and the session worker cap; WHOIS review found and prompted fixes for applying the response-byte budget across referrals. Traceroute reverse-DNS tests now cover session cancellation, saturation fallback, queued-work removal, and late-result suppression. Actual dnsjava truncation-to-TCP fallback and Android IPv6/link-local socket behavior remain unverified."

limits:
  - "InetAddress.isReachable and platform address resolution do not expose closeable handles. The ICMP call receives its per-host timeout and checks cancellation after return; a platform implementation may still overrun that timeout."
  - "A platform reverse-DNS call may ignore interruption permanently. The bounded two-worker/eight-queue executor caps retained work; if both workers remain stuck, future hostname enrichment is unavailable, while trace collection and numeric-hop reporting continue. JVM tests cover owner-session cancellation, queue removal, saturation fallback, and late-result suppression; platform resolver behavior remains device-dependent."
  - "GeoIP now bounds response bytes and cancellation cleanup, but its successful-result cache is still process-wide and unbounded; cache TTL/size policy remains E03-T04 follow-up work."
  - "Platform WHOIS DNS resolution may ignore thread interruption. The caller still returns promptly, while the shared fixed executor bounds residual work to two workers and sixteen queued requests; excess submissions fail with a bounded-worker rejection."
  - "API 33 SNMP lab, TalkBack, and physical-Wi-Fi checks from the supplied release QA brief remain device-only; see 2026-09-23-release-qa-brief.yaml."
  - "The E03 target of <=500 ms cleanup is not measured by these JVM tests; real MulticastSocket interruption, API 33 ENODEV, physical-interface selection, multicast discovery, and port-5353 conflict behavior remain device checks."

phase_disposition:
  E03-T01: "in_progress; caller-owned sessions now reach Wi-Fi, LAN, Port Scan, and WHOIS alongside earlier adapters. Focused core-network and app tests pass for modified cancellation, budget, and cleanup paths. The two unused unscoped socket helpers have been removed, and tests exercise the real repository-scoped Port Scan socket factory, including both selected-network binding and default-route bypass. The raw-resource ledger has 14 sites (14 reviewed registrations, 0 legacy follow-ups, 0 open reviews). Phase-wide gates, integrated device behavior, the <=500 ms cleanup measurement, real Wi-Fi receiver behavior, and platform resolver residue remain open."
