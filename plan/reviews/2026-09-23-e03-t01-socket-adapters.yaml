review:
  area: E03-T01 operation resource-scope adapters
  status: implementation_slice_verified
  date: 2026-09-23
  branch: plan/comprehensive-review-2026-09-22
  prior_portscan_commits: [6b705a3, ece00a1]

scope:
  - "Port Scan closes active sockets on cancellation and emits Started only after worker socket slots are registered, so a first()-only collector cannot cancel midway through setup."
  - "LAN Scan owns default TCP presence, TCP enrichment, and correlated UDP sockets through one per-collection OperationSession; resources are released after each probe or closed on cancellation."
  - "Probe-local CancellationException cancels the operation owner so the resource-close callback runs before sibling workers are joined."
  - "Reverse-DNS enrichment uses a per-call timeout and a finite two-worker/four-queue executor; timeout and cancellation remove queued tasks and request worker interruption."
  - "Progress/completion remains guarded by operation cancellation; no ScanComplete is emitted after cancellation."
  - "WHOIS now creates an INTERNET OperationSession with a shared monotonic three-hop deadline, one-probe concurrency, and a response-byte limit. Each active socket is registered in the operation ResourceScope and released by a single idempotent lease after completion or cancellation."
  - "WHOIS progress checks the shared deadline before each hop emission; deadline exceptions pass through hop fallback handling to the stable total-deadline error mapping."
  - "The bounded WHOIS executor closes the cancel-before-enqueue race with a post-submit cancellation check; cancelled queued work is removed, while active sockets close through the operation scope."
  - "mDNS now uses a per-collection LOCAL_NETWORK OperationSession with a clamped monotonic scan window that includes setup and the initial query; multicast lock, socket, and group membership are registered in LIFO cleanup order."
  - "mDNS cancellation closes blocked receive/join work, preserves USER_STOP and LIFECYCLE_PAUSE, emits no late update, and emits DiscoveryComplete only after successful cleanup. Expected deadline completion is withheld when cleanup failures appear anywhere in the deadline/cancellation cause chain."
  - "TLS Inspector now accepts a caller-owned ANY_NETWORK OperationSession through repository and use-case overloads, enforces the shared 500–30,000 ms timeout bounds, measures handshake time monotonically, and registers its SSLSocket before connect/handshake. User/lifecycle cancellation remains cancellation; deadline expiry maps to the established TLS error UI wording."
  - "OperationRunner preserves eager ResourceScope close failures on one canonical cause even when coroutine exception recovery copies the surfaced failure; regressions cover ordinary failure, user stop, and deadline cleanup without duplicate suppression. TLS-specific tests cover blocked connect/handshake deadlines and a throwing close during deadline mapping."
  - "HTTP Probe now accepts a caller-owned ANY_NETWORK OperationSession through repository/use-case/ViewModel, applies a one-request concurrency bound and request deadline, and registers each redirect connection in the ResourceScope before I/O. Close-once leases disconnect abandoned connections, remaining-budget timeouts bound blocking reads, and cancellation is rechecked before results are emitted."
  - "Speed Test now accepts a caller-owned ANY_NETWORK OperationSession through repository/use-case/ViewModel with a 120-second operation deadline. Close-once connection leases disconnect before closing active streams so cancellation releases blocked reads; operation checks guard latency, progress, and terminal events, while deadline expiry maps to the existing failed-result UI state."
  - "mDNS receive failures now check the shared operation session as well as coroutine-job state. This preserves typed deadline/cancellation when the first-wins reason is recorded just before job cancellation becomes observable; cleanup failures remain attached and successful completion remains withheld."
  - "Topology/SNMP now accepts a caller-owned LOCAL_NETWORK OperationSession; each collection has a 120-second bounded session, and the SNMP client is registered with close-once ownership before queries. Cancel/reset/lifecycle cleanup is dispatched on a process-lifetime IO scope so SNMP teardown cannot block the UI."
  - "Wake-on-LAN now accepts a caller-owned LOCAL_NETWORK session, registers its close-once UDP socket before binding/sending, and rejects nonnumeric broadcast hostnames before socket creation so cancellation cannot wait on DNS."
  - "Traceroute and per-hop GeoIP enrichment share one caller-owned ANY_NETWORK session. `OperationRunner.runOrJoin` lets the traceroute and GeoIP repository adapters reuse that single resource scope across multiple hops; GeoIP connections are registered before I/O, reads are bounded, and connections are released after each lookup."

validation:
  command: "./gradlew :core-network:test :core-domain:test :app:testDebugUnitTest --no-daemon --no-parallel"
  status: passed
  result: "Latest full core-network/core-domain/app JVM suites passed: 998 core-network tests (1 skipped), 180 core-domain tests, and 366 app tests; zero failures/errors."
  additional: "Focused operation-adapter tests passed before the full run. The four CI resource-site checker tests pass; the updated ledger inventories 15 sites (12 scope-registered/reviewed, 3 explicit legacy follow-ups, 0 open reviews), and git diff --check passes. No emulator or device was started for this JVM work."

reviewers:
  qa: "Earlier reviews cleared LAN sibling-cancellation, reverse-DNS worker cancellation/enqueue, Port Scan Started ordering, WHOIS ownership, mDNS receive/join cancellation/lifecycle/deadline cleanup and the receive cancellation race, TLS session forwarding/lifecycle/cleanup, and HTTP Probe plus Speed Test operation ownership, lifecycle cleanup, deadline mapping, and blocked-read cancellation. The current follow-up review covers Topology/SNMP, WOL, and Traceroute/GeoIP integration."
  adversarial: "Earlier reviews cleared LAN and Port Scan after fixes; WHOIS split-clock handling; mDNS cleanup failures and the receive cancellation race; TLS/OperationRunner deadline wording and duplicate suppression; and HTTP Probe/Speed Test close ordering and cancellation races. Current reviews found and prompted fixes for Topology cleanup on the caller thread, WOL hostname resolution, GeoIP session reuse across hops, and a stale Traceroute emission after an offline restart."

limits:
  - "InetAddress.isReachable and platform address resolution do not expose closeable handles. The ICMP call receives its per-host timeout and checks cancellation after return; a platform implementation may still overrun that timeout."
  - "A native reverse-DNS resolver may ignore thread interruption. Caller cancellation returns promptly, while the fixed executor bounds residual resolver work to two workers and four queued requests; excess lookups return no name."
  - "Traceroute's native hop mapper still calls `InetAddress.getByName` synchronously for reverse DNS on Dispatchers.IO. The operation scope bounds the logical trace deadline and prevents late UI events, but a platform resolver ignoring interruption can outlive Stop/deadline; add a bounded asynchronous resolver or keep this limitation explicit before claiming prompt cancellation at that boundary."
  - "GeoIP now bounds response bytes and cancellation cleanup, but its successful-result cache is still process-wide and unbounded; cache TTL/size policy remains E03-T04 follow-up work."
  - "Platform WHOIS DNS resolution may ignore thread interruption. The caller still returns promptly, while the shared fixed executor bounds residual work to two workers and sixteen queued requests; excess submissions fail with a bounded-worker rejection."
  - "API 33 SNMP lab, TalkBack, and physical-Wi-Fi checks from the supplied release QA brief remain device-only; see 2026-09-23-release-qa-brief.yaml."
  - "The E03 target of <=500 ms cleanup is not measured by these JVM tests; real MulticastSocket interruption, API 33 ENODEV, physical-interface selection, multicast discovery, and port-5353 conflict behavior remain device checks."

phase_disposition:
  E03-T01: "in_progress; Port Scan, LAN Scan, WHOIS, mDNS, TLS Inspector, HTTP Probe, Speed Test, Topology/SNMP, WOL, and Traceroute/GeoIP adapters are validated by JVM suites. CI inventories raw resource sites and rejects unlisted/banned patterns; 12 of 15 sites are scope-registered/reviewed and 3 explicit legacy follow-ups remain. Ping, DNS, Wi-Fi, phase-wide gates, the blocking traceroute reverse-DNS boundary, and device cleanup measurements remain open."
