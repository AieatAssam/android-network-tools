review:
  area: lan-scan-discovery
  status: done
  baseline_commit: "5e183721e64ce8a8946f1a0b50f52b83544e8898"
  reviewer: primary-agent
  reviewed_on: "2026-09-22"
  method: "User-reported behavior confirmed against the TCP presence probe, discovery pipeline, UI label, and existing regression test."

findings:
  - id: RLAN001
    severity: high
    kind: bug
    title: "A failed TCP connect is promoted to a live host and floods LAN results with false positives"
    evidence:
      - file: core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/DiscoveryProbes.kt
        line: 89
        detail: "SocketTcpPresenceProbe returns TcpPresence.Refused immediately on the first ConnectException from any configured presence port, without independent positive evidence that the target exists."
      - file: core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/DiscoveryProbes.kt
        line: 105
        detail: "Every ConnectException is classified as REFUSED without retaining its cause/errno. The exception class alone does not prove that a TCP RST was observed or identify its source; infrastructure-generated rejection is one possible explanation for the user-reported false positives."
      - file: core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/LanScanRepositoryImpl.kt
        line: 187
        detail: "LanScanRepositoryImpl treats TcpPresence.Refused as definitive presence, adds DiscoveryMethod.TCP_REFUSED, and enriches/emits the host without corroboration."
      - file: app/src/main/res/values/strings.xml
        line: 244
        detail: "The UI presents the method as 'TCP refused', which users can reasonably read as a property of the alleged device even when the response was generated by network infrastructure."
      - file: core-network/src/test/kotlin/net/aieat/netswissknife/core/network/lan/LanScanDiscoveryPipelineTest.kt
        line: 28
        detail: "The regression test intentionally returns TcpPresence.Refused for every address and asserts every address is alive, locking in the false-positive behavior for the reported scenario."
    impact: "An ordinary subnet scan can list nearly every unused address as a device. A TCP connection failure is not proof that a host occupies that IP, and the current label hides uncertainty about its cause. False hosts also trigger hostname, MAC, and 16-port enrichment work."
    recommended_action: "Implement E00-T01: typed connection outcomes, independent positive target evidence, and a confirmed-host default list. Repeated refusals across ports alone are not corroboration. Keep ambiguous attempts in an optional diagnostics view; do not require unavailable Android ARP access or imply packet-source inspection from Socket APIs."
    validation: "All-refused/no-positive-evidence yields zero confirmed hosts; one successful TCP or ICMP endpoint yields exactly one; repeated refusals remain uncertain; confirmed-count/topology/export exclude uncertain entries. ICMP's early return must not fabricate TCP metadata for unexecuted probes. Validate the reported physical-LAN condition separately using captured errors and controlled endpoints."
    implementation_task: E00-T01
    related_phase: P01
    related_findings: [F005]
    status: in_progress

coverage:
  inspected:
    - core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/DiscoveryProbes.kt
    - core-network/src/main/kotlin/net/aieat/netswissknife/core/network/lan/LanScanRepositoryImpl.kt
    - core-network/src/test/kotlin/net/aieat/netswissknife/core/network/lan/LanScanDiscoveryPipelineTest.kt
    - app/src/main/res/values/strings.xml
  limitations:
    - "No physical LAN capture was available; source and the existing test establish promotion of failures to hosts, but the exact exception cause and network behavior in the user's environment remain unverified. A reset or reset injector has not been established."
