review:
  area: build-release-plan
  status: done
  baseline_commit: "5e183721e64ce8a8946f1a0b50f52b83544e8898"
  reviewer: primary-agent
  method: "Source review and local non-mutating reproductions; no release was published."

findings:
  - id: RBUILD001
    severity: medium
    kind: bug
    title: "Release SNMP retention gate succeeds when only one required class survives"
    evidence:
      - file: .github/workflows/release.yml
        line: 173
        detail: "One grep alternation checks AuthSHA|PrivAES128|USM; grep succeeds on any one match, although the step claims to check the required implementations."
    impact: "A release missing an authentication or privacy implementation can pass this guard and break SNMPv3 on installed builds. This is a defective regression guard, not evidence that the current APK is missing a class."
    recommended_action: "Capture apkanalyzer output and require each exact class separately, with a failure naming each missing class; use the same assertion in the planned PR release smoke gate."
    validation: "Feed complete, USM-only, and each single-class-missing fixture into the assertion. Only the complete fixture must pass."
    related_phase: P09
    related_findings: [F014]
    status: done
    resolution: "The release check captures apkanalyzer output with --defined-only and validates actual `C d` class rows, not references or method/field signatures. It checks AuthSHA, PrivAES128, and USM independently and reports each missing class. Complete, missing-class, referenced-only, member-signature, and longer-name fixtures are covered by committed tests."

  - id: RBUILD002
    severity: medium
    kind: bug
    title: "Daily release version allocation can reuse an existing version"
    evidence:
      - file: .github/workflows/release.yml
        line: 66
        detail: "The next suffix is release count + 1, not maximum existing suffix + 1; lookup errors become zero and only 100 releases are queried. The workflow has no concurrency lock."
      - file: .github/workflows/release.yml
        line: 319
        detail: "The generated version is used as the release tag, so duplicate allocation targets the same release/versionCode."
    impact: "For existing same-day suffixes 1 and 3, the next dispatch allocates 3 again. Concurrent dispatches can also allocate the same version; a failed lookup can reuse suffix 1. Publication and install/upgrade identity become unreliable."
    recommended_action: "Serialize publishing, fail closed on lookup errors, inspect all relevant tags/releases, and allocate a checked monotonic unused suffix from the maximum. Explicitly handle artifact-only dispatches and validate versionCode bounds."
    validation: "Check sparse suffixes [1,3], concurrent allocations, API failure, artifact-only builds, and more than one page of releases. No already-published tag or versionCode may be allocated."
    related_phase: P09
    status: done
    resolution: "Auto-generated dispatches query all pages of exact-date Git tags and all GitHub Release tag names, fail closed on API/parse errors, allocate max suffix + 1, and atomically create the actual version tag before building. The tag reserves the versionCode and pins the release to the workflow SHA, including create_github_release=false runs; failures leave a gap while that reservation remains. Push overrides are strictly validated, reject names already used by a GitHub Release, and updated tags are rejected. Manual and tag-triggered publishing share a queued, non-cancelling concurrency group; the tag SHA is checked before artifact upload and again before publication, and the final publication check rejects an existing Release identity."

  - id: RBUILD003
    severity: low
    kind: gap
    title: "OUI refresh can replace a complete registry with a partial download"
    evidence:
      - file: tools/oui/update_oui.py
        line: 50
        detail: "After one source yields rows, a later source failure only emits a warning; OUTPUT.write_text then overwrites the complete resource with the partial result. A valid CSV with an unexpected header can also produce zero rows without failing."
    impact: "A transient failure fetching MA-M or MA-S silently removes those vendor prefixes from the next generated resource, weakening LAN vendor enrichment."
    recommended_action: "Validate each source's expected headers and non-empty result, require all required registries to succeed before replacement, and expose an explicit partial-update mode only if needed. Replace the resource atomically after validation."
    validation: "Mock successful MA-L data followed by failed, malformed, empty, truncated, wrong-class, or wrong-width MA-M/MA-S responses and assert the previous resource remains intact. Check a complete source-bound three-registry refresh and runtime longest-prefix lookup."
    related_phase: P01
    status: done
    resolution: "The updater now binds oui.csv, mam.csv, and oui36.csv to MA-L, MA-M, and MA-S; strict UTF-8/CSV, unique required headers, complete rows, supported registry widths, and restricted hex separators are validated before publication. A same-directory temporary file is atomically replaced only after all sources succeed, preserving the existing mode and cleaning up on replacement failure. OuiDatabase now loads 6/7/9-digit prefixes and selects the longest match; MAC inputs must be complete and use plain, colon, hyphen, or Cisco dotted notation. Thirteen Python tests cover partial/malformed/wrong-source failures, replacement cleanup, and successful three-registry output; the full core-network test suite passed. Independent QA and adversarial reviews found no remaining blocker."

coverage:
  inspected: [".github/workflows/ci.yml", ".github/workflows/release.yml", "app/build.gradle.kts", "build.gradle.kts", "settings.gradle.kts", "tools/oui/update_oui.py", "plan/plan.yaml"]
  limitations:
    - "GitHub workflows were not executed; findings concern locally verifiable workflow logic."
    - "Remote tag SHA checks catch moved/deleted tags before artifact upload and again before release publication, but external force-updates after a check still require immutable v* tag rules to eliminate fully. A Release created externally after the final existence lookup can still race the publication action."
    - "Deleting an artifact-only reservation tag, or deleting both a published version's tag and Release, erases the history the allocator queries; preventing reuse would require a durable version ledger or immutable tag rules."

validation_performed:
  - "Reproduced the original retention-gate defect: its USM-only fixture exited 0 despite missing AuthSHA and PrivAES128."
  - "Reproduced the release-count allocation: existing suffixes 1 and 3 have count 2, so the current expression allocates 3 again."
  - "Fresh core-network, core-domain, and app JVM test tasks passed: 1218 reported cases, 1 skipped, 0 failures/errors."
  - "Revalidated existing F014, F020, and F021 and corrected the P09 context; no duplicate findings added for those existing work items."
  - "Release versioning tests passed: sparse suffixes [1,3] allocate 4; artifact-only tags and releases whose Git tags were deleted still advance the next allocation; pushed overrides cannot reuse an existing Release identity; malformed/out-of-range suffixes, invalid calendar dates, suffixes above 99, and versionCodes above 2,100,000,000 fail."
  - "APK class-gate tests cover complete, single-class-missing, referenced-only, method/field-signature, nested-class, and longer-name fixtures. Only exact defined class rows pass."
  - "Release workflow uses gh api --paginate for matching refs and release names, creates the version tag atomically, checks its remote SHA before artifact upload and again before publication, and rejects a Release identity found immediately before the release action. GitHub Actions was not executed live; external force-updates after a check, external Release creation after the final lookup, and deletion of reservation history still require immutable tag protection or a durable external ledger to eliminate fully."
