review:
  area: branch-pr-review
  status: done
  source: "PR-style review of plan/comprehensive-review-2026-09-22 against origin/main before opening the merge PR"
  environment: "JVM unit tests, ktlint/detekt, Kover, lintDebug, and assembleDebug run locally; emulator and device not used"
  scope_note: "The review prioritised release/CI workflows, the operation runner, the 2026-10-03 fix commit, and the Ping, Traceroute, Topology, and mDNS lifecycle paths. Vendored OkHttp was excluded apart from its documented parser-budget fork. This review does not establish that the whole branch is free of defects."

findings:
  - id: R5-001
    severity: medium
    kind: bug
    title: "Ping lifecycle cleanup mutates UI state from an IO thread"
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/ping/PingViewModel.kt", detail: "onLifecycleStop's detached cleanup ran its identity check and the _uiState write on Dispatchers.IO. A run started on the main thread between the check and the write could be replaced by the stale Finished/Idle state. lifecyclePingCleanupState was also a plain var written from both threads." }
    resolution:
      status: done
      summary: "Blocking cancelAndJoin stays on IO. The check and the state write now run under withContext(NonCancellable + Dispatchers.Main.immediate). MutableStateFlow.compareAndSet was rejected because it compares with equals, and a fresh empty Running state can equal the stale one."
    validation:
      - "Coverage is indirect. The existing lifecycle cleanup tests pass, but PingViewModelTest uses UnconfinedTestDispatcher as Main, so the Main.immediate hop runs inline and the interleaving is not reproduced."
    owner: E03-T02

  - id: R5-002
    severity: medium
    kind: bug
    title: "Continuous Ping crashes when its session log file cannot be created"
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/ping/PingViewModel.kt", detail: "startContinuousPing called sessionLogFileFactory() synchronously from the Start click. check(mkdirs) and File.createTempFile can throw, for example when the cache is full, and the exception was uncaught on the main thread." }
    resolution:
      status: done
      summary: "Factory failures now produce a PingUiState.Error backed by the new ping_continuous_log_unavailable string resource, and the probe is never invoked."
    validation:
      - "PingViewModelTest: 22/22 passed, including the new session-log-failure regression."
      - "Full local gates on the final tree: app 624, core-network 1,371 (1 skipped), core-domain 222 JVM tests with no failures; ktlint, detekt, all three koverVerify tasks, lintDebug (0 errors), assembleDebug, and check_resource_sites.py passed."
      - "The app ktlint baseline block for PingViewModel.kt was regenerated only to follow the line shift. It has the same rule counts as before, with no new findings baselined."
    owner: E01-T07

  - id: R5-003
    severity: medium
    kind: test
    title: "LanScanViewModelTest depends on the host's real subnet and fails on GitHub runners"
    evidence:
      - { file: "app/src/test/kotlin/net/aieat/netswissknife/app/ui/screens/lan/LanScanViewModelTest.kt", detail: "The fixture builds the ViewModel without a LinkInfoProvider, so refreshSubnet() falls back to SubnetUtils.getCurrentSubnet() on the host. PR #109's first CI runs failed the same 6 tests every time. These tests start a scan without setting a subnet, and the runner's detected subnet exceeded the 10-minute scan ceiling (immediate Error state, then timeouts). A /24 developer host passes." }
    resolution:
      status: done
      summary: "setUp pins 192.168.1.0/24. Detection only fills a blank subnet, so it cannot overwrite the pinned value. Pinning 10.1.0.0/16 locally reproduces exactly the 6 CI failures, and the /24 fixture passes 25/25."
    owner: E01-T07

  - id: R5-004
    severity: low
    kind: test
    title: "Ping lifecycle cleanup could hop to Main after a test's resetMain()"
    evidence:
      - { file: "app/src/test/kotlin/net/aieat/netswissknife/app/ui/screens/ping/PingViewModelTest.kt", detail: "After R5-001, the detached cleanup ends on Main. A test that releases blocked cleanup at teardown could let that hop land in a later test class." }
    resolution:
      status: done
      summary: "PingViewModel exposes the latest cleanup job internally, and tearDown joins it before resetMain(). CI now uploads unit test reports so failures that only happen in CI can be diagnosed."
    owner: E03-T02

observations:
  - "ci.yml re-runs the full build-and-test job on every PR label change because of the labeled/unlabeled triggers needed for run-instrumented. Left unchanged; it costs CI minutes but is not a correctness issue."
  - "release.yml concurrency `queue: max` is valid GitHub Actions syntax, added in the 2026-05-07 changelog."
