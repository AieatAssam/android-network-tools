items:
  - id: ISS-05
    classification: merged_card_semantics_implemented_device_validation_open
    release_baseline_status: "Already implemented on origin/main: the clickable card merges descendants and exposes Role.Button semantics. The issue description is stale against that release source."
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/HomeScreen.kt", lines: "262-269", detail: "Clickable ElevatedCard merges descendants and sets Role.Button, so the title is part of the card's merged action semantics." }
      - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/NavigationAccessibilityTest.kt", lines: "43-67,84-112", detail: "Home and More tests assert each tool label is displayed, clickable, and has button role." }
    needed_validation: "Compose tests assert that merged card labels expose button/click semantics, but the fresh API 36 instrumentation attempt stopped before test execution. Verify TalkBack traversal/activation on the API 33 release target; both runtime checks remain open."

  - id: ISS-17
    classification: implementation_present_fresh_instrumentation_blocked_device_validation_open
    release_baseline_status: "Partially reproduced in source: the release baseline rejects networks without validated Internet and has no Traceroute connectivity banner. The current branch adds a banner, local/VPN eligibility, prompt Running state, and Retry/Clear; device layout and offline/dead-ICMP behavior remain unverified."
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/traceroute/TracerouteViewModel.kt", lines: "151-169,183-229", detail: "Offline state becomes Error('No network connection'); preflight permits Internet, local-network, or VPN status; trace enters Running immediately, owns an operation session, rejects stale emissions, and reports empty completion or ordinary errors." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/TracerouteScreen.kt", lines: "171-204,1346-1368", detail: "The NetworkStatusBanner is placed immediately below the hero, and the Error panel exposes Retry and Clear." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/components/NetworkStatusBanner.kt", lines: "45-53", detail: "ANY_NETWORK shows offline status only when Internet, local-network, and VPN states are all false." }
      - { file: "app/src/test/kotlin/net/aieat/netswissknife/app/ui/screens/traceroute/TracerouteViewModelTest.kt", lines: "118-152,202-218", detail: "Unit coverage asserts offline rejection, local-only and VPN-only eligibility, and stale-emission invalidation after an offline restart." }
      - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/screens/TracerouteScreenTest.kt", lines: "196-244", detail: "Compose coverage asserts offline error copy, Retry/Clear callbacks, and the connectivity banner." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/traceroute/TracerouteReverseDnsLookup.kt", lines: "22-44,83-111", detail: "Current worktree moves optional reverse-DNS work to a cancellable helper with two daemon workers and an eight-entry queue; callers retain numeric hop results after timeout or lookup failure." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/traceroute/IcmpEnginTracerouteRepositoryImpl.kt", lines: "90-116,154-159", detail: "Each hop's reverse-DNS wait is capped at one second and by remaining operation time; cancellation and deadline are preserved, and the native mapper no longer resolves names synchronously." }
    needed_validation: "The fresh API 36 connected instrumentation batch compiled but stopped during APK install before tests started. Run TracerouteScreenTest on API 36 and the reported airplane-mode/dead-or-ICMP-blocked target scenario on API 33; confirm progress/Stop is visible promptly without scrolling. Initial-viewport target-device behavior remains open."

  - id: ISS-06
    classification: skip_callback_covered_integrated_dismissal_verification_open
    release_baseline_status: "The Welcome sheet Skip callback already invokes dismissal on origin/main. The report is an integration-verification request, not a confirmed missing callback."
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/onboarding/OnboardingSheet.kt", lines: "93-96", detail: "The top-right Skip action invokes onDismiss directly from the Welcome sheet (the resource key retains its older 'don't show again' name)." }
      - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/NavigationAccessibilityTest.kt", lines: "114-130", detail: "Onboarding test clicks the action and asserts the dismiss callback fired." }
    needed_validation: "The Compose test asserts that Skip invokes the dismissal callback, but the fresh API 36 instrumentation attempt stopped before test execution. Verify the integrated Welcome sheet disappears on the release target; no API 33 run was available."

  - id: ISS-20
    classification: already_fixed_in_source
    release_baseline_status: "Already fixed on origin/main: shared host normalization trims surrounding whitespace and rejects embedded whitespace. The request to reject a trailing space conflicts with existing normalization behavior."
    evidence:
      - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/HostValidator.kt", lines: "92-118", detail: "Shared normalize() trims surrounding whitespace before host validation; internal whitespace remains invalid under hostname/IP validation." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/TracerouteScreen.kt", lines: "321-324,350-353", detail: "Traceroute derives validity and Start enablement from HostValidator.normalize(host), and reports the invalid-host message only when normalization fails." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/traceroute/TracerouteViewModel.kt", lines: "148-174", detail: "The ViewModel normalizes accepted hosts and forwards the normalized host to the use case." }
      - { file: "core-network/src/test/kotlin/net/aieat/netswissknife/core/network/HostValidatorTest.kt", lines: "35-41", detail: "Tests surrounding whitespace normalization and rejection of internal spaces." }
    needed_validation: "HostValidatorTest covers outer-whitespace trimming and malformed embedded spaces; TracerouteScreenTest asserts an internal-space host is invalid/disabled and a separately defined outer-whitespace case remains startable. Ping, Port Scan, TLS, Topology, Traceroute, and HTTP recent-host paths use the shared normalizer. The fresh API 36 instrumentation attempt stopped before the screen tests ran. Trailing whitespace is normalized and Start remains usable, rather than rejected as the stale brief wording suggests."

  - id: ISS-21
    classification: ui_features_present_live_snmp_and_canvas_usability_unverified
    release_baseline_status: "The release source already has a Cancel button, sysName/IP labels, and a node-details sheet. The current branch keeps Cancel visible after configuration collapses and adds explicit progress text/count reporting; the claimed missing features overstate what was absent."
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/topology/TopologyDiscoveryScreen.kt", lines: "435-445", detail: "Cancel stays visible while discovery runs, outside collapsed configuration fields." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/topology/TopologyDiscoveryViewModel.kt", lines: "76-103,128-160,195-235", detail: "Discovery owns a bounded LOCAL_NETWORK session; state carries progress and node count; reset/lifecycle cancellation closes the session asynchronously off the UI thread." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/topology/TopologyDiscoveryScreen.kt", lines: "457-468,484-503,755-790,935-945,991-1015", detail: "Cancel stays available, progress and node counts render, and canvas labels use sysName or IP; selected nodes open a details sheet." }
      - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/screens/topology/TopologyDiscoveryScreenTest.kt", lines: "85-156", detail: "Compose tests cover progress text/count accumulation and Cancel invoking reset; test uses a fake ViewModel." }
    needed_validation: "Compose coverage exists for progress, Cancel/reset, labels, and node details, but the fresh API 36 instrumentation attempt stopped before test execution. Run live SNMP discovery against 10.0.2.2/community public/v2c and cancel during an actual query; assess sparse graph layout, labels/hit areas, and details-sheet usability on API 33. The host snmpd/lab endpoint was unavailable here."

  - id: ISS-22
    classification: graceful_error_source_and_unit_covered_instrumentation_and_device_check_open
    release_baseline_status: "Graceful error rendering with a Dismiss action already exists on origin/main. Emulator ENODEV reproduction and real wlan0 behavior remain environment-specific checks."
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/mdns/MdnsDiscoveryViewModel.kt", lines: "108-119", detail: "Non-cancellation discovery exceptions are surfaced as an error and stop the scan; cancellation is kept separate." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/mdns/MdnsDiscoveryScreen.kt", lines: "412-433", detail: "Error state renders the error, message, and Dismiss/reset action." }
      - { file: "app/src/test/kotlin/net/aieat/netswissknife/app/mdns/MdnsRepositoryImplCancellationTest.kt", lines: "44-69", detail: "Injected socket setup ENODEV propagates with socket/multicast-lock cleanup." }
      - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/screens/mdns/MdnsDiscoveryScreenTest.kt", lines: "140-160", detail: "Compose coverage displays ENODEV text and the Dismiss action." }
    needed_validation: "Compose coverage exists for injected ENODEV text and Dismiss behavior, but the fresh API 36 instrumentation attempt stopped before test execution. Verify ENODEV on API 33 without a usable Wi-Fi interface, then verify discovery over physical wlan0/local Wi-Fi. No API 33 emulator or physical Wi-Fi device was available."

