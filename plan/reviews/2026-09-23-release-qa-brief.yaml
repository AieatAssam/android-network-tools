unit_validation:
  command: "./gradlew :core-network:test :core-domain:test :app:testDebugUnitTest --no-daemon --no-parallel"
  status: passed
  results: { core_network: 982, core_network_skipped: 1, core_domain: 174, app: 359, failures: 0, errors: 0 }

brief_accuracy:
  - "ISS-21's listed features (Cancel, progress, sysName/IP labels, and node-details sheet) exist in current source. The remaining concrete question is live SNMP cancellation and usability of sparse graph layouts, not missing feature implementation as stated."
  - "The report's API 33 observations cannot be reproduced with the connected API 36 emulator. Emulator public ICMP/DNS instability is appropriately treated as a non-goal; test error and recovery UX instead."
  - "The supplied release version identifies a release under test; it is not evidence that every reported issue still exists at checked commit 51a78264cc5d6e813970e8b81c83eecbb2814942 or the current reviewed worktree."
  - "The brief's do-not-reopen list was checked against current source/tests and has no observed regression. SNMP background dispatch is source-confirmed, while responsiveness/no-ANR remains a live runtime claim that this environment could not measure."
