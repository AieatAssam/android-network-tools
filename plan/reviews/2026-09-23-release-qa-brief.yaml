review:
  area: release-qa-brief
  status: audited
  source: "User-provided Net Swiss Knife QA brief v2026.09.21.1 (API 33, host snmpd at 10.0.2.2)."
  checked_commit: "51a78264cc5d6e813970e8b81c83eecbb2814942"
  branch: "plan/comprehensive-review-2026-09-22"
  release_metadata:
    app: "Net Swiss Knife"
    package: "net.aieat.netswissknife"
    version_name: "2026.09.21.1"
    version_code: 2026092101
    repository: "https://github.com/AieatAssam/android-network-tools"
    release_under_test: "Keep SNMP and network probes off the main thread."
    requested_lab: "API 33 emulator plus host snmpd at 10.0.2.2, community public."
    suggested_order: [ISS-20, ISS-21, ISS-17, ISS-05, ISS-06]
    environment_non_goals: "Emulator public ICMP/DNS flakiness is an error-UX check; live Cloudflare success is not required on the target AVD."
  environment:
    connected_emulator: "API 36 / Android 16; not the requested API 33 emulator"
    host_snmpd: "Not available; no local snmpd process or SNMP lab endpoint verified"
    physical_wifi: "Not available"
  fixed_items_rechecked: [ISS-01, ISS-02, ISS-03, ISS-04, ISS-08, ISS-09, ISS-15, SNMP-threading]
  fixed_items_result: "No regression found in current source/tests. Navigation, Ping, Settings, TLS, and topology changes preserve the listed behaviors. TLS inspection now uses a bounded operation session while retaining the Inspection failed/Retry UI and maps deadline expiry to its stable error wording. SNMP work remains on IO/background dispatchers; no live SNMP query or ANR measurement was possible."
  fixed_item_evidence:
    - id: ISS-01
      classification: source_confirmed_specific_label_ui_test_not_found
      evidence:
        - { file: "app/src/main/res/values/strings.xml", lines: "85-90", detail: "Ping timeout label is `Timeout (s)`, consistent with seconds-based timeout chips in the input row." }
        - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/PingScreen.kt", lines: "573-585", detail: "Timeout chips are labeled 1s, 2s, 3s, and 5s." }
      limitation: "The current PingScreenTest has no specific assertion for the timeout label/chips; source was rechecked. No separate API 33 run."
    - id: ISS-02
      classification: source_and_ui_test_present
      evidence:
        - { file: "app/src/main/res/values/strings.xml", lines: "6-10", detail: "Home scroll hint text is `Scroll for more tools`." }
        - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/NavigationAccessibilityTest.kt", lines: "69-82", detail: "Home test asserts the scroll cue is displayed." }
      limitation: "API 36 instrumentation passed; no separate API 33 run."
    - id: ISS-03
      classification: source_and_ui_test_present
      evidence:
        - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/navigation/NavRoutes.kt", lines: "64-79", detail: "The shared tool list includes WHOIS, HTTP Probe, Subnet Calc, Speed Test, and Wake-on-LAN." }
        - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/NavigationAccessibilityTest.kt", lines: "84-112", detail: "More sheet test iterates every shared tool, scrolls to it, and asserts display, click action, and button role." }
      limitation: "API 36 instrumentation passed; no separate API 33 run."
    - id: ISS-04
      classification: source_and_unit_test_present_ui_error_rendering_test_present
      evidence:
        - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/ping/PingViewModel.kt", lines: "126-128,276-303", detail: "Offline guard emits `PingUiState.Error(\"No network connection\")` before starting the probe." }
        - { file: "app/src/test/kotlin/net/aieat/netswissknife/app/ui/screens/ping/PingViewModelTest.kt", lines: "235-244", detail: "Unit test checks offline error state and verifies the Ping use case is not invoked." }
        - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/PingScreen.kt", lines: "236-260", detail: "Error state is rendered in the results panel; the input header also renders the internet NetworkStatusBanner." }
        - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/screens/PingScreenTest.kt", lines: "79-108", detail: "Compose tests cover rendering error title/message and empty-detail fallback using a fake ViewModel." }
      limitation: "The ViewModel offline unit test and generic Compose error rendering are covered; airplane-mode UI behavior was not separately exercised on API 33."
    - id: ISS-08
      classification: source_and_ui_test_present
      evidence:
        - { file: "app/src/main/AndroidManifest.xml", lines: "18-25", detail: "Application launcher label references `@string/app_name`." }
        - { file: "app/src/main/res/values/strings.xml", lines: "2-4", detail: "`app_name` is `NetSwiss`; full in-app brand text remains `Net Swiss Knife`." }
        - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/NavigationAccessibilityTest.kt", lines: "132-137", detail: "Instrumentation test reads the package launcher label and compares it with `app_name`, including a length bound." }
      limitation: "API 36 instrumentation passed; no separate API 33 run."
    - id: ISS-09
      classification: source_and_ui_test_present
      evidence:
        - { file: "app/src/main/res/values/strings.xml", lines: "735-738", detail: "Settings attribution body contains the Cloudflare service disclosure and is a readable multi-sentence text resource." }
        - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/settings/SettingsScreen.kt", lines: "482-512", detail: "Attributions section displays the body in a full-width card with normal body-small styling and a service link." }
        - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/screens/settings/SettingsScreenTest.kt", lines: "53-74", detail: "UI test scrolls to the bottom attribution text and asserts it is displayed." }
      limitation: "API 36 instrumentation passed; no separate API 33 run or physical font-size/accessibility check."
    - id: ISS-15
      classification: source_and_ui_test_present
      evidence:
        - { file: "app/src/main/res/values/strings.xml", lines: "484-488", detail: "TLS error title is `Inspection failed` and retry action is `Retry`." }
        - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/tls/TlsInspectorScreen.kt", lines: "389-398", detail: "TLS error card displays the title/message and wires Retry to the inspect callback." }
        - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/screens/tls/TlsInspectorScreenTest.kt", lines: "150-169", detail: "UI test checks error title/message and verifies Retry calls inspect." }
        - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/tls/TlsInspectorRepositoryImpl.kt", lines: "112-126", detail: "Deadline cancellation maps to `TLS inspection timed out`; other typed cancellations remain cancellations and ordinary failures remain Error." }
        - { file: "core-network/src/test/kotlin/net/aieat/netswissknife/core/network/tls/TlsInspectorRepositoryImplTest.kt", lines: "132-186,188-210", detail: "Blocked-connect and blocked-handshake deadline tests assert timeout wording and one close; another blocked-connect test verifies a throwing close remains visible in the returned error cause graph." }
      limitation: "API 36 instrumentation passed with a fake ViewModel; no live Cloudflare request is required or asserted."
    - id: SNMP-threading
      classification: source_and_unit_test_present_runtime_responsiveness_unverified
      evidence:
        - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/TopologyDiscoveryRepositoryImpl.kt", lines: "38-50,198-200", detail: "SNMP client construction, discovery, and teardown are in the upstream flow dispatched with `flowOn(Dispatchers.IO)`; cancellation closes the client and is rethrown." }
        - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/Snmp4jClientImpl.kt", lines: "88-103,121-130", detail: "GET setup and request work run off-main, with cancellable request handling." }
        - { file: "core-network/src/test/kotlin/net/aieat/netswissknife/core/network/topology/TopologyDiscoveryRepositoryTest.kt", lines: "367-420", detail: "Repository tests cover closing the client during an active walk and blocking GET cancellation." }
        - { file: "core-network/src/test/kotlin/net/aieat/netswissknife/core/network/topology/Snmp4jClientImplLoopbackTest.kt", lines: "187-248", detail: "Loopback tests cover prompt cancellation of SNMP walk and GET requests." }
      limitation: "Source and tests support background dispatch/cancellation, but the host snmpd lab was unavailable; UI responsiveness and absence of ANR/NetworkOnMainThreadException were not measured live."
  interpretation: "The brief's v2026.09.21.1 release metadata describes its test baseline, not the checked source revision. Classifications below reflect current worktree source/tests; live claims remain unverified unless explicitly noted."

items:
  - id: ISS-05
    classification: already_fixed_in_source
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/HomeScreen.kt", lines: "262-269", detail: "Clickable ElevatedCard merges descendants and sets Role.Button, so the title is part of the card's merged action semantics." }
      - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/NavigationAccessibilityTest.kt", lines: "43-67,84-112", detail: "Home and More tests assert each tool label is displayed, clickable, and has button role." }
    needed_validation: "NavigationAccessibilityTest passed on API 36, asserting merged card labels expose button/click semantics. Verify TalkBack traversal/activation on the API 33 release target; that manual accessibility check remains open."

  - id: ISS-17
    classification: implementation_present_device_validation_open
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/traceroute/TracerouteViewModel.kt", lines: "136-167,169-208", detail: "Offline state becomes Error('No network connection'); trace enters Running immediately; empty completion becomes a specific no-route error; exceptions become Error." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/TracerouteScreen.kt", lines: "168-225,1337-1355", detail: "The screen renders Running/Error states; Error panel exposes Retry and Clear." }
      - { file: "app/src/test/kotlin/net/aieat/netswissknife/app/ui/screens/traceroute/TracerouteViewModelTest.kt", lines: "98-119", detail: "Unit coverage asserts offline and empty-route states." }
    needed_validation: "TracerouteScreenTest passed on API 36 for offline/error and Retry/Clear UI paths. On API 33, test airplane mode and a dead/ICMP-blocked target; confirm progress/Stop is visible promptly without scrolling. Initial-viewport target-device behavior remains unproven."

  - id: ISS-06
    classification: already_fixed_in_source_device_verification_open
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/onboarding/OnboardingSheet.kt", lines: "93-96", detail: "The top-right Skip action invokes onDismiss directly from the Welcome sheet (the resource key retains its older 'don't show again' name)." }
      - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/NavigationAccessibilityTest.kt", lines: "114-130", detail: "Onboarding test clicks the action and asserts the dismiss callback fired." }
    needed_validation: "NavigationAccessibilityTest passed on API 36 and confirms Skip invokes dismissal. No API 33 release-target run was available."

  - id: ISS-20
    classification: already_fixed_in_source
    evidence:
      - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/HostValidator.kt", lines: "92-118", detail: "Shared normalize() trims surrounding whitespace before host validation; internal whitespace remains invalid under hostname/IP validation." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/TracerouteScreen.kt", lines: "321-324,350-353", detail: "Traceroute derives validity and Start enablement from HostValidator.normalize(host), and reports the invalid-host message only when normalization fails." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/traceroute/TracerouteViewModel.kt", lines: "144-160", detail: "The ViewModel normalizes accepted hosts and forwards the normalized host to the use case." }
      - { file: "core-network/src/test/kotlin/net/aieat/netswissknife/core/network/HostValidatorTest.kt", lines: "35-41", detail: "Tests surrounding whitespace normalization and rejection of internal spaces." }
    needed_validation: "HostValidatorTest and PingScreenTest on API 36 cover trimming outer whitespace and rejecting embedded spaces; TracerouteScreenTest also passed on API 36. Trailing whitespace is normalized and Start remains usable, rather than rejected as the stale brief wording suggests."

  - id: ISS-21
    classification: partially_fixed_live_snmp_and_canvas_usability_unverified
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/topology/TopologyDiscoveryScreen.kt", lines: "435-445", detail: "Cancel stays visible while discovery runs, outside collapsed configuration fields." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/topology/TopologyDiscoveryViewModel.kt", lines: "51-68,94-108,144-148", detail: "Starting a new discovery cancels its prior job; state carries progress and node count; reset cancels discovery." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/topology/TopologyDiscoveryScreen.kt", lines: "475-482,904-925,541-553,966-1015", detail: "Progress badge is rendered; canvas labels nodes with sysName or IP; selected nodes open a details sheet." }
      - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/screens/topology/TopologyDiscoveryScreenTest.kt", lines: "85-156", detail: "Compose tests cover progress text/count accumulation and Cancel invoking reset; test uses a fake ViewModel." }
    needed_validation: "TopologyDiscoveryScreenTest passed on API 36 for progress, Cancel/reset, labels, and node details. Run live SNMP discovery against 10.0.2.2/community public/v2c and cancel during an actual query; assess sparse graph layout, labels/hit areas, and details-sheet usability on API 33. The host snmpd/lab endpoint was unavailable here."

  - id: ISS-22
    classification: graceful_error_covered_device_interface_check_open
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/mdns/MdnsDiscoveryViewModel.kt", lines: "79-93", detail: "Non-cancellation discovery exceptions are surfaced as an error and stop the scan; cancellation is kept separate." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/mdns/MdnsDiscoveryScreen.kt", lines: "138-157,401-422", detail: "Error state renders an error card with Dismiss/reset." }
      - { file: "app/src/test/kotlin/net/aieat/netswissknife/app/mdns/MdnsRepositoryImplCancellationTest.kt", lines: "36-57,153-165", detail: "Injected joinGroup ENODEV propagates with resource cleanup." }
      - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/screens/mdns/MdnsDiscoveryScreenTest.kt", lines: "140-160", detail: "Compose coverage displays ENODEV text and the Dismiss action." }
    needed_validation: "MdnsDiscoveryScreenTest passed on API 36 with injected ENODEV text and Dismiss behavior. Verify ENODEV on API 33 without a usable Wi-Fi interface, then verify discovery over physical wlan0/local Wi-Fi. No API 33 emulator or physical Wi-Fi device was available."

