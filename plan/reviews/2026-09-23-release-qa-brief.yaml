  checked_scope: "The supplied release corresponds to origin/main at 5e18372. The item-by-item audit distinguishes that baseline from current-branch fixes; the 93522c7 source was rechecked for regressions to the brief. Traceroute progress/offline/retry/cancel behavior, strict GeoIP literal filtering, and bounded port-banner disclosure remain present. The current branch also adds Speed Test pooled multi-stream measurements and bounded metadata, optional HTTP/SMTP/TLS port probes with sanitized subjects, target-aware availability primitives, and a bounded NetworkCache. Serialized core-network/core-domain/app suites passed 1,270 (one skipped)/216/549 with zero failures or errors. Android-test Kotlin compilation, lintDebug, assembleDebug, assembleRelease, all three Kover gates, raw-resource inventory, and release-APK smoke passed. ISS-20's trailing-whitespace error expectation applies to the release baseline; the current branch trims outer whitespace while rejecting embedded whitespace. API 33/TalkBack, integrated Skip dismissal, dead-route Traceroute, live SNMP cancellation/sparse-canvas usability, mDNS ENODEV and physical wlan0, Speed Test link accuracy, live HTTP/SMTP/TLS servers, and measured no-ANR responsiveness remain device/lab gates. No emulator, host snmpd, or physical Wi-Fi device was used for this validation. Earlier dependency and route evidence remains scoped to cited commits."
  current_branch_recheck:
    commit: "93522c7"
    release_baseline: "origin/main at 5e183721e64ce8a8946f1a0b50f52b83544e8898"
    result: "The full source audit at 766519b was against origin/main at 5e18372. The 93522c7 source was rechecked: ISS-01/02/03/04/08/09/15 and off-main-thread SNMP remain present; ISS-05/06/17/20/21/22 remain source-covered with item-specific device follow-ups below. The GeoIP classifier adds non-global and malformed-address filtering without changing Traceroute progress/offline/retry/cancel behavior. Outer whitespace remains normalized and embedded whitespace remains invalid. The scanner keeps passive mode write-free and bounds HTTP/SMTP/TLS exchanges and displayed certificate subjects. Full JVM suites and quality gates pass on current source. Independent QA/adversarial review found no listed release-brief source regression. API 33/TalkBack, integrated Skip dismissal, dead-route layout/behavior, live SNMP cancellation/canvas usability, API 33 ENODEV, physical wlan0, Speed Test link accuracy, live protocol servers, and measured no-ANR responsiveness remain device/lab checks. No emulator or live lab endpoint was used for current validation."
