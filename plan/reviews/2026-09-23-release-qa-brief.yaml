items:
  - id: ISS-05
    classification: merged_card_semantics_implemented_device_validation_open
    release_baseline_status: "Already implemented on origin/main: the clickable card merges descendants and exposes Role.Button semantics. The issue description is stale against that release source."
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/HomeScreen.kt", lines: "262-269", detail: "Clickable ElevatedCard merges descendants and sets Role.Button, so the title is part of the card's merged action semantics." }
      - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/NavigationAccessibilityTest.kt", lines: "43-67,84-112", detail: "Home and More tests assert each tool label is displayed, clickable, and has button role." }
    needed_validation: "Compose tests assert that merged card labels expose button/click semantics, but the fresh API 36 instrumentation attempt stopped before test execution. Verify TalkBack traversal/activation on the API 33 release target; both runtime checks remain open."

  - id: ISS-17
    classification: implementation_and_cancel_recovery_source_tested_device_validation_open
    release_baseline_status: "Partially reproduced in source: the release baseline rejects networks without validated Internet and has no Traceroute connectivity banner. The current branch adds a banner, local/VPN eligibility, prompt Running state, Retry/Clear, and Canceling/Canceled states that retain partial hops until cleanup completes; device layout and offline/dead-ICMP behavior remain unverified."
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/traceroute/TracerouteViewModel.kt", lines: "178-221,223-280", detail: "Offline state becomes Error('No network connection'); preflight permits Internet, local-network, or VPN status; trace enters Running immediately, owns an operation session, rejects stale emissions, and Stop holds Canceling until collector cleanup before producing retained partial hops. A deadline that won before Stop remains a timeout Error." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/TracerouteScreen.kt", lines: "171-247,345-504,591-737", detail: "The NetworkStatusBanner is immediately below the hero. Canceling disables host/config/recent-host/start actions and shows cleanup progress; Canceled renders a partial-result label with retained hops. The Error panel still exposes Retry and Clear." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/components/NetworkStatusBanner.kt", lines: "45-53", detail: "ANY_NETWORK shows offline status only when Internet, local-network, and VPN states are all false." }
      - { file: "app/src/test/kotlin/net/aieat/netswissknife/app/ui/screens/traceroute/TracerouteViewModelTest.kt", lines: "118-168,182-273", detail: "TracerouteViewModelTest passed 17/17, covering offline rejection, local/VPN eligibility, no-route error, blocked cleanup with retained partial hops, duplicate-start gating, and deadline-over-Stop precedence." }
      - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/screens/TracerouteScreenTest.kt", lines: "150-252", detail: "Compose source coverage asserts progress/Stop, canceling cleanup copy and disabled host-clear/Stop actions, retained partial hops after Canceled, offline error copy, Retry/Clear callbacks, and the connectivity banner. Android-test Kotlin compilation passed; the test was not executed on a device." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/traceroute/TracerouteReverseDnsLookup.kt", lines: "22-44,83-111", detail: "Current worktree moves optional reverse-DNS work to a cancellable helper with two daemon workers and an eight-entry queue; callers retain numeric hop results after timeout or lookup failure." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/traceroute/IcmpEnginTracerouteRepositoryImpl.kt", lines: "90-116,154-159", detail: "Each hop's reverse-DNS wait is capped at one second and by remaining operation time; cancellation and deadline are preserved, and the native mapper no longer resolves names synchronously." }
    needed_validation: "The prior API 36 connected instrumentation attempt stopped during APK install before tests started; the Compose source compiles but has not been executed. Run TracerouteScreenTest and the reported airplane-mode/dead-or-ICMP-blocked target scenario on API 33; confirm progress/Stop is visible promptly without scrolling. The shared-deadline case during reverse-DNS/GeoIP enrichment is now covered by deterministic source tests; initial-viewport, offline/dead-route, and live-network behavior still need device validation."

  - id: ISS-06
    classification: skip_callback_covered_integrated_dismissal_verification_open
    release_baseline_status: "The Welcome sheet Skip callback already invokes dismissal on origin/main. The report is an integration-verification request, not a confirmed missing callback."
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/onboarding/OnboardingSheet.kt", lines: "93-96", detail: "The top-right Skip action invokes onDismiss directly from the Welcome sheet (the resource key retains its older 'don't show again' name)." }
      - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/NavigationAccessibilityTest.kt", lines: "114-130", detail: "Onboarding test clicks the action and asserts the dismiss callback fired." }
    needed_validation: "The Compose test asserts that Skip invokes the dismissal callback, but the fresh API 36 instrumentation attempt stopped before test execution. Verify the integrated Welcome sheet disappears on the release target; no API 33 run was available."

  - id: ISS-20
    classification: reproduced_on_release_baseline_fixed_in_current_branch
    release_baseline_status: "The supplied origin/main baseline rejects trailing whitespace in TracerouteScreen before shared normalization: `host.contains(' ')` marks any space invalid. The current branch fixes that screen-level gate by using HostValidator.normalize(host), which trims outer whitespace and continues to reject embedded whitespace."
    release_baseline_evidence:
      commit: "5e183721e64ce8a8946f1a0b50f52b83544e8898"
      file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/TracerouteScreen.kt"
      lines: "319-322"
      detail: "The release baseline sets `isHostInvalid = host.isNotBlank() && host.contains(' ')`, so a trailing space disables Start before the shared validator can trim it."
    evidence:
      - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/HostValidator.kt", lines: "92-118", detail: "Shared normalize() trims surrounding whitespace before host validation; internal whitespace remains invalid under hostname/IP validation." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/TracerouteScreen.kt", lines: "344-350", detail: "Current branch derives invalid state and Start enablement from HostValidator.normalize(host), allowing surrounding whitespace to be trimmed before validation." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/traceroute/TracerouteViewModel.kt", lines: "148-174", detail: "The ViewModel normalizes accepted hosts and forwards the normalized host to the use case." }
      - { file: "core-network/src/test/kotlin/net/aieat/netswissknife/core/network/HostValidatorTest.kt", lines: "35-41", detail: "Tests surrounding whitespace normalization and rejection of internal spaces." }
      - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/screens/TracerouteScreenTest.kt", lines: "115", detail: "The outer-whitespace screen case asserts Start remains enabled after surrounding whitespace is normalized." }
    needed_validation: "HostValidatorTest covers outer-whitespace trimming and malformed embedded spaces; TracerouteScreenTest asserts an internal-space host is invalid/disabled and an outer-whitespace case remains startable. Current Ping, Port Scan, TLS, Topology, and Traceroute host forms use the shared normalizer; HTTP stores normalized recent origins through its URL-specific parser, and WHOIS/other host-like inputs are outside this verified set. Android-test Kotlin sources compile, but connected instrumentation did not execute. The reported trailing-space regression is fixed in the checked branch; API 33 UI confirmation remains open."

  - id: ISS-21
    classification: ui_features_present_live_snmp_and_canvas_usability_unverified
    release_baseline_status: "The release source already has a Cancel button, sysName/IP labels, and a node-details sheet. The current branch keeps Cancel visible after configuration collapses, adds explicit progress text/count reporting, and caps SNMP GET and walk requests per caller session plus a maximum of four requests per repository instance; the brief overstates which features were absent."
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/topology/TopologyDiscoveryScreen.kt", lines: "435-445", detail: "Cancel stays visible while discovery runs, outside collapsed configuration fields." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/topology/TopologyDiscoveryViewModel.kt", lines: "76-103,128-160,195-235", detail: "Discovery owns a bounded LOCAL_NETWORK session; state carries progress and node count; reset/lifecycle cancellation closes the session asynchronously off the UI thread." }
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/topology/TopologyDiscoveryScreen.kt", lines: "457-468,484-503,755-790,935-945,991-1015", detail: "Cancel stays available, progress and node counts render, and canvas labels use sysName or IP; selected nodes open a details sheet." }
      - { file: "app/src/androidTest/kotlin/net/aieat/netswissknife/app/ui/screens/topology/TopologyDiscoveryScreenTest.kt", lines: "85-156", detail: "Compose tests cover progress text/count accumulation and Cancel invoking reset; test uses a fake ViewModel." }
      - { file: "core-network/src/main/kotlin/net/aieat/netswissknife/core/network/topology/TopologyDiscoveryRepositoryImpl.kt", lines: "35,58-65,230-253,289-313", detail: "SNMP GET and walk requests are each limited to min(session maxConcurrentProbes, 4) per discovery session and at most four combined requests across one repository instance." }
      - { file: "core-network/src/test/kotlin/net/aieat/netswissknife/core/network/topology/TopologyDiscoveryRepositoryTest.kt", lines: "268-307,309-534", detail: "Repository tests assert default request concurrency stays within four, caller maxConcurrentProbes=1 constrains one session to one, and six synchronized concurrent sessions exercise GET and walk ceilings with queued recovery and exactly-once client closes after cancellation." }
    needed_validation: "Compose coverage exists for progress, Cancel/reset, and node details. Canvas labels are source-confirmed but are not asserted by the screen test, which explicitly avoids absolute-offset label assertions. The fresh API 36 instrumentation attempt stopped before test execution. Run live SNMP discovery against 10.0.2.2/community public/v2c and cancel during an actual query; assess sparse graph layout, labels/hit areas, and details-sheet usability on API 33. The host snmpd/lab endpoint was unavailable here."

  - id: ISS-22
    classification: graceful_error_source_and_unit_covered_instrumentation_and_device_check_open
    release_baseline_status: "Graceful error rendering with a Dismiss action already exists on origin/main. Emulator ENODEV reproduction and real wlan0 behavior remain environment-specific checks."
    evidence:
      - { file: "app/src/main/kotlin/net/aieat/netswissknife/app/ui/screens/mdns/MdnsDiscoveryViewModel.kt", lines: "108-119", detail: "Non-cancellation discovery exceptions are surfaced as an error and stop the scan; cancellation is kept separate." }
